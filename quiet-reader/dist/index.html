<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><title>靜讀 — 留一點時間給故事</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header id="chrome"><button id="libraryBtn" class="brand" aria-label="開啟書庫">◒ <b>靜讀</b><small>QUIET READER</small></button><div class="bookLabel">遠方的燈塔 <span>／ 林間</span></div><nav><button id="searchBtn" aria-label="搜尋">⌕</button><button id="markBtn" aria-label="加入書籤">♧</button><button id="settingsBtn" aria-label="閱讀設定">Aa</button><button id="focusBtn" aria-label="沉浸閱讀">⛶</button></nav></header><aside class="rail"><button id="tocBtn" aria-label="章節目錄">☷</button><span></span><button id="autoBtn" aria-label="自動捲動">▷</button><button id="notesBtn" aria-label="書籤與筆記">♧</button></aside><main id="reader" tabindex="0" aria-label="小說正文"></main><footer id="bottom"><button id="prevBtn">← <span>上一章</span></button><button id="progressBtn"></button><button id="nextBtn"><span>下一章</span> →</button></footer><div id="meter"></div><button id="reveal" aria-label="顯示閱讀工具">◒</button><div id="autoBar" hidden><button id="pauseBtn" aria-label="暫停自動捲動">Ⅱ</button><button id="slower">−</button><span id="speedLabel"></span><button id="faster">＋</button><button id="stopBtn" aria-label="停止自動捲動">×</button></div><dialog id="panel"><div class="panelHead"><span id="panelTitle"></span><button id="closePanel" aria-label="關閉">×</button></div><div id="panelBody"></div></dialog><div id="toast" role="status"></div><input id="fileInput" type="file" accept=".txt,.epub" hidden><input id="prefInput" type="file" accept=".json" hidden><script type="module" src="app.js"></script></body></html>
