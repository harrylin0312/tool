<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><title>神經漫遊者｜靜讀</title><link rel="icon" type="image/svg+xml" sizes="any" href="icon.svg?v=1"><link rel="manifest" href="manifest.json?v=2"><link rel="stylesheet" href="style.css"></head><body><header id="chrome"><button id="libraryBtn" class="brand" aria-label="開啟書庫"><img src="icon.svg?v=1" width="32" height="32" alt="" style="display:block;border-radius:8px"> <b>靜讀</b><small>QUIET READER</small></button><div class="bookLabel">神經漫遊者 <span>／ 威廉・吉布森</span></div><nav><button id="searchBtn" aria-label="搜尋">⌕</button><button id="markBtn" aria-label="加入書籤">♧</button><button id="settingsBtn" aria-label="閱讀設定">Aa</button><button id="focusBtn" aria-label="沉浸閱讀">⛶</button></nav></header><aside class="rail"><button id="tocBtn" aria-label="章節目錄">☷</button><span></span><button id="autoBtn" aria-label="自動捲動">▷</button><button id="notesBtn" aria-label="書籤與筆記">♧</button></aside><main id="reader" tabindex="0" aria-label="小說正文"></main><footer id="bottom"><button id="prevBtn">← <span>上一章</span></button><button id="progressBtn"></button><button id="nextBtn"><span>下一章</span> →</button></footer><div id="meter"></div><button id="reveal" aria-label="顯示閱讀工具">◒</button><div id="autoBar" hidden><button id="pauseBtn" aria-label="暫停自動捲動">Ⅱ</button><button id="slower">−</button><span id="speedLabel"></span><button id="faster">＋</button><button id="stopBtn" aria-label="停止自動捲動">×</button></div><dialog id="panel"><div class="panelHead"><span id="panelTitle"></span><button id="closePanel" aria-label="關閉">×</button></div><div id="panelBody"></div></dialog><div id="toast" role="status"></div><input id="fileInput" type="file" accept=".txt,.epub" hidden><input id="prefInput" type="file" accept=".json" hidden><script id="published-book" type="application/json">{"id":"local-neuromancer-10259","title":"神經漫遊者","author":"威廉・吉布森","chapters":[{"title":"第一部 傷心千葉城 01","paragraphs":["港口上空的天色猶如空白電視屏幕。","凱斯從「茶壺」門口的人群中擠進去，聽見有人在說：「不是我想嗑藥，我身體自己就產生了這麼厲害的藥物缺失症。」這聲音來自斯普羅爾，這笑話也來自斯普羅爾。「茶壺」酒吧里聚集著外國職員，你在這裏喝上一星期的酒，也聽不到兩個日語詞。","拉孜站在吧台後面，假肢不斷抖動，往一托盤的酒杯里斟上麒麟生啤。他看見凱斯，笑了起來，露出一口東歐鋼鐵填補過的棕色爛牙。凱斯在吧台上找到一個位置，一邊是羅尼・鄒手下的一個妓|女，一身人造的麥色肌膚；另一邊是個穿著筆挺海軍制服的高個子非洲人，顴骨上布滿精心排列的部落印記。「魏之剛才帶著倆小弟來過，」拉孜一邊說，一邊用他那隻真手推過來一杯扎啤，「是不是找你的，凱斯？」","凱斯聳聳肩，右邊的姑娘咯咯笑起來，捅了捅他。","酒保笑得咧開了嘴。他的醜陋也是種傳奇，這年頭人人都有餘錢美容，他的「天然」簡直猶如一枚徽章。他伸手去拿另一個酒杯，那隻老舊的手臂咔咔作響，這是俄國軍隊製造的假肢，裏面裝著有七種功能的力反饋操縱器，外麵包上髒兮兮的粉色塑料。「您可真是位大師，凱斯『先生』。」拉孜發出含混不清的聲音，表示在笑，用他的粉紅爪子隔著白襯衫撓了撓腆起的肚皮，接著說：「您是位有點兒搞笑的大師。」","「沒錯，」凱斯喝了口啤酒說，「總得有個人搞笑，他媽的肯定不是你。」","那妓|女的笑聲提高了八度。","「也不是你，姑娘。你一邊兒去，成不？鄒跟我是兄弟。」","她看著凱斯的眼睛，嘴唇都不帶動地輕輕呸了一聲，但還是走開了。","「天哪，」凱斯說，「你這開的是什麼窯子啊，讓人想好好喝杯酒都不成。」","「哈，」拉孜一邊拿抹布擦拭著斑痕累累的木頭檯子，一邊說，「鄒給提成。你，我讓你呆在這兒是為了逗樂子。」","凱斯端起酒杯那一瞬間，酒吧里突然詭異地安靜下來，這樣的場景偶有發生，似乎上百出無關閑聊都在那一刻停頓。那妓|女的笑聲隨後響起，透著歇斯底里的勁兒。","拉孜咕噥說：「有天使飛過。」","「中國人，」一個醉醺醺的澳大利亞人吼道，「中國人他媽的發明了神經拼接術。哪天讓我去大陸做個神經手術吧。能治好你，老兄……」","「這，」凱斯對著酒杯說，那種膽汁般的苦澀突然洶湧起來，「這他媽全是胡扯。」","日本人早把中國人研究出來的神經手術全忘光了。千葉城的地下診所有最先進的技術，日新月異，可他們都治不好他在孟菲斯那間旅館里受的傷。","到這裏已經一年了，他仍然會夢見數字空間，希望卻一夜一夜渺茫下去。無論他在這「夜之城」里磕多少葯，轉多少彎，抄多少近道，他仍會在睡夢裡看見那張數據網，看見明亮的邏輯框格在無色的虛空中展開……如今斯普羅爾已是太平洋另一面遙遠陌生的家鄉，他已不再能夠使用電腦控制台，不再是那個網路牛仔，只是個疲於謀生的普通小混混。然而那些夢如同魔咒，在這日本的夜晚里來臨，令他哭泣，在睡夢中哭泣，然後在黑暗裡獨自醒來，蜷縮在某間棺材旅館的小艙房裡，雙手緊緊抓住床墊，將記憶泡沫在指間擠成一團，想要抓住那並不存在的控制台。","「昨晚我看到你的妞了。」拉孜一邊說一邊給凱斯遞上第二杯麒麟。","「我沒妞。」他喝了口酒。","「琳達・李小姐。」","凱斯搖搖頭。","「不是你的妞？什麼都不是？只是生意來往嗎，我的大師朋友？你只是專心搞貿易？」酒保那雙棕色小眼睛深陷在皺紋之中。「你跟她在一起那會，我看比現在強。你那時更愛笑。現在，說不定哪天晚上技藝太高，你就進了診所保存箱，變備用零件了。」","「你讓我心都碎了，拉孜。」他喝完酒，付賬離開，卡其色尼龍風衣上有斑駁的雨點痕迹，高窄的雙肩在風衣下微微駝起。他穿過仁清街上的人群，聞到自己的汗臭味。","那年凱斯二十四歲。二十二歲的他已經是斯普羅爾最優秀的牛仔，最出色的盜賊之一。他師出名門，師父麥可伊・泡利和鮑比・奇尼都是業內傳奇。他幾乎永遠處於青春與能力帶來的腎上腺素高峰中，隨時接入特別定製、能夠聯通網路空間的操控台上，讓意識脫離身體，投射入同感幻覺，也就是那張巨網之中。他是一名盜賊，為其他更富有的盜賊工作，僱主們提供外源軟體給他，侵入某些公司系統的明亮圍牆，打開數據的豐饒天地。","他犯下了那個典型錯誤，那個他曾發誓永遠不要犯的錯誤。偷僱主的東西。他偷偷留下了一筆錢，想通過阿姆斯特丹的一個黑市商人轉出去。他直到現在也不明白自己怎麼會被抓住，當然這已經不重要了。當時他以為自己快沒命了，但他們只是笑了笑說，他可以，完全可以留著那筆錢，而且他也剛好用得上。因為——他們仍然笑著說——他們會保證他永遠不能再工作。","他們用戰爭時期的一種俄羅斯真菌毒素破壞了他的神經系統。","他被綁在孟菲斯一家酒店的床上，足足經歷了三十個小時的幻覺，他的天賦寸寸消失。","他受的傷很輕，很微妙，卻異常有效。","對於曾享受過超越肉體的網路空間極樂的凱斯來說，這如同從天堂跌落人間。在他從前常常光顧的牛仔酒吧里，精英們對於身體多少有些鄙視，稱之為「肉體」。現在，凱斯已墜入了自身肉體的囚籠之中。","他很快將全部財產換成了大把新日元，這種老式紙幣在全世界的隱秘黑市上不斷流通，就像特洛比安德島民們用於交易的貝殼。用現金在斯普羅爾做合法生意很難，日本法律則已徹底禁止現金交易。","他曾經堅定而確鑿地相信，自己能在日本被治愈。就在千葉城。也許是合法診所，也許是在隱蔽的地下醫院。在斯普羅爾的技術犯罪圈裡，千葉城就是植入系統、神經拼接和微仿生的同義詞，令人無比嚮往。","在千葉城，他眼看著自己的新日元兩個月內便在無窮的檢查問診中耗盡。地下診所是他最後的希望，可醫生們都只是嘖嘖讚歎那讓他致殘的技術，然後緩緩搖頭，束手無策。","如今他住在最廉價的棺材旅店中。旅店就在港口附近，頭頂有徹夜不滅的石英鹵素燈，強光下的碼頭雪亮如同舞台，電視屏幕般的天空也亮得讓人看不見東京的燈光，甚至看不見富士電子公司那高聳的全息標誌。黑色的東京灣向遠處伸展開去，海鷗從白色泡沫塑料組成的浮島上飛過。港口後面是千葉城，生態建築群落像一堆巨大的立方體，鋪滿了工廠的圓頂。港口與城市之間的一些古老街道組成了一片狹窄的無名地帶，這就是「夜之城」，而仁清街正在夜之城的中心。白日里，仁清街上的酒吧門窗緊閉，無姿無色，霓虹與全息招牌們也偃旗息鼓，在鉛灰色的天空下等待夜色來臨。","在「茶壺」西邊兩個街區之外，有一間以法文「茶罐」為名的茶館，凱斯在這裏用雙倍特濃咖啡灌下了今晚的第一片葯。他從鄒手下一個妓|女那裡買到這枚扁平的粉紅色八角藥片，是一種強效右旋安非他命，產自巴西。","「茶罐」的牆上貼滿了鏡子，鏡片四周都裝著紅色的霓虹燈。","當初他獨自淪落在千葉城，錢財耗盡，治療無望，陷入了最後的瘋狂，開始以一種前所未有的冷酷去撈錢。那一個月他就殺死了兩男一女，而掙到的數目在一年前只會讓他覺得可笑。仁清街將他逼到崩潰邊緣，直到他發覺這條街就像是一種自毀衝動，像某種一直潛藏於他體內的秘密毒素。","「夜之城」好像一個社會達爾文主義實驗，無聊的實驗設計者不斷按著快進鍵，讓它變得混亂而瘋狂。要是不忙活著點，你便會波紋不驚地沉下去，可要是稍微用力過猛，你又會打破黑市那微妙的表面張力。這兩種情況下，你都會不留痕迹地消失，也許只有拉孜，這個永恆的存在，還留著一點關於你的模糊記憶。不過你的心臟、肺或者腎臟也許還會活下來，活在某個能負擔得起地下診所診費的陌生人身體里。","這裏的一切都在暗地裡不斷進行，若有懶惰、粗心、笨拙，或是失於應付某種複雜規程，死亡便是公認的懲罰。","凱斯獨自坐在「茶罐」的桌邊，藥效初起，掌心開始冒汗，忽然覺得胳膊和胸膛上每一根汗毛都在發麻。他知道，總有一天他要和自己玩一種遊戲，那古老的、無名的、最終的單人遊戲。他不再隨身攜帶武器，也不再遵守基本的安全規則。他承接最火爆最危險的生意，眾所周知，你想要什麼他都能搞到。他心底最深處知道，自己身上帶著那種自我毀滅的光芒，人人見之退避，所以客戶日漸稀疏；但他也知道，毀滅不過是遲早的事。同樣在他心底最深處，為死亡臨近而喜悅歡欣的同時，至不願記起的，是琳達・李。","那是一個雨夜，他在一間遊戲廳發現了她。","香煙的藍色煙霧籠罩著那些明亮的全息影像：巫師城堡、歐羅巴坦克戰、紐約的天際線……她就站在那下面，閃動的激光布滿她的臉，將五官變成了簡單的編碼：燃燒的巫師城堡將她的顴骨染得緋紅，坦克戰中淪陷的慕尼黑在她額頭蕩漾著天藍色，一隻游標飛過摩天大樓聳立成的峽谷，在外牆上擦出的火花讓她嘴唇沾染上了亮金色。直到如今，她仍然以那個模樣活在他的記憶中。那晚他正春風得意，已經替魏之把一塊克他命送往橫濱，酬金已到手。溫暖的雨水落在仁清街面上，升起裊裊煙霧，他從雨中走進遊戲廳，在那數十人中不知為何一眼便看見了她，正全神貫注玩著遊戲的她。幾個小時后，她在港口邊的旅館房間里沉睡，臉上還是同樣的神情，上唇的輪廓如同孩子畫筆下的飛鳥。","他穿過遊戲廳，剛辦好了事，得意洋洋站在她身旁，看見她抬頭望過來，煙熏妝下一雙灰色的眼睛，好像一隻驚恐的小動物，定格在迎面而來的車燈光束中。","他們共度了一個夜晚，隨後又是一個早晨。他們買了氣墊船票，他平生第一次穿過了東京灣。原宿的雨仍在下，落在她的塑料外套上，東京的孩子們穿著白色鞋子，戴著薄膜披肩，從那些著名的商店旁走過。最後的午夜裡，她與他一起站在一間嘈雜的彈子房裡，像個孩子一樣拉緊他的手。","只不過一個月，在他充斥著毒品與高壓的生活里，她那雙曾經驚懼的眼睛便已變作了本能慾望的深潭。他眼看著她的人格裂變，猶如冰川崩潰，碎冰隨水而逝，終於袒露出最原始的癮君子的饑渴。他看著她全神貫注地追求新的刺|激，讓他想起了志賀的小攤上，擺在藍色變異鯉魚和竹籠中的蟋蟀旁邊的那些螳螂。","他注視著自己的空杯子，藥力令他覺得裏面一圈圈的咖啡印都在震動。右旋安非他命在他脊髓中奔流，他似乎能看到暗沉的棕色油漆桌面上無數細小划痕產生的經過。茶館的裝潢風格來自上個世紀，糅合了傳統日式風格和蒼白的米蘭塑料風格，只是每樣東西似乎都覆蓋著一層細微的薄膜，似乎所有曾經光亮過的鏡面和塑料表面都遭受過百萬顧客蹂躪，籠罩上一種永遠擦不去的東西。","「嘿，凱斯，好兄弟……」","他抬起頭，看見煙熏妝下一雙灰色的眼睛。她穿著一身褪色的法國太空工作服和一雙嶄新的白色運動鞋。","「我一直在找你，老兄。」她坐到他的對面，用手肘支著桌子。那件藍色的拉鏈衣服肩膀處已經裂開，他不由自主地在她胳膊上搜尋毒品貼或針頭留下的記號。「要抽煙嗎？」","她從手腕上的口袋裡掏出一包皺巴巴的頤和園過濾嘴香煙，遞給他一支。他接了過來，她用一隻紅色塑料管替他點燃。「你睡得還好嗎，凱斯？看起來挺累的。」她的口音來自斯普羅爾南部，靠近亞特蘭大方向，眼睛下面的肌膚帶著一種病態的蒼白，但仍光滑而飽滿。她才不過二十歲，但疼痛所造就的細紋已刻入她的嘴角，不再消失。她的黑髮梳到後面，用一條花絲帶紮起來，絲帶上的圖案好像一幅微電路圖，又像是張城市地圖。","「記得吃藥時就睡不好。」說這話的時候，一股清晰的渴望向他襲來，慾望與孤獨全在安非他命的波長上奔襲。他想起她肌膚的味道，想起港口邊那黑暗酷熱的房間里，她的手指是如何扣住他的后腰。","都是肉體，他想，都是肉|欲。","「魏之，」她眯起眼睛說，「他想要打穿你的臉。」她點著了自己的煙。","「誰說的？拉孜？你跟拉孜聊過？」","「不是。莫娜說的。她的新男人是魏之的人。」","「我欠他的錢還不夠多。再說做掉了我，他也拿不到錢。」他聳聳肩。","「欠他錢的人太多了，凱斯，你也許就被樹個典型。說真的，你最好小心點。」","「成。你怎樣，琳達？你有地方睡覺嗎？」","「睡覺？」她搖搖頭。「當然了，凱斯。」她向他靠過來，身體開始顫抖，臉上布滿汗珠。","「給。」他一邊說一邊在風衣口袋裡掏摸，找到一張皺巴巴的五十塊紙幣，下意識地在桌下抹平了折成四折，然後才遞給她。","「你用得著這錢，親愛的。你最好把它交給魏之。」她的灰色眼睛里有種他從未見過，也看不明白的東西。","「我欠魏之的比這多太多了。拿走吧，我還能來錢。」他一邊張嘴說瞎話，一邊看著他的新日元落進一個拉鏈口袋裡。","「凱斯，你掙到錢就趕緊去找魏之。」","「再見了，琳達。」他站起身來。","「好。」她的兩邊眼仁下面都露出一毫米的眼白。三白眼。「你小心點，老兄。」","他點點頭，匆匆離去。","塑料門在身後關上那一剎那，他回過頭，看見她的眼睛，映在紅色霓虹的籠中。","仁清街的周五夜。","他路過燒烤店，按摩房，一家叫作「美麗女孩」的連鎖咖啡店，一家電子音樂震天響的遊戲廳。他給一個穿著深色套裝的上班族讓路，看見那人右手背上紋著三菱基因技術公司的標誌。","那標誌是真的嗎？他想，如果是真的，這人有麻煩了；如果不是，就算他活該。三菱基因公司的高層人員體內植有高級微處理器，能夠監控血流中誘變劑的水平。在「夜之城」里，這樣的裝備能讓你招搖一把，直接招搖到地下診所里去。","那上班族是個日本人，但仁清街上的大潮還是老外。群群水手從港口那邊湧來，緊張的單身遊客在這裏尋獵旅行書沒有寫的快樂，斯普羅爾的惡徒們在這裏招搖展示他們身上的植入體，還有十幾種各有差別的混混，全都在這街道上摩肩接踵，慾望與交易在暗地裡涌動。","有很多種理論解釋千葉城為何會容忍仁清街這樣一塊「飛地」，凱斯傾向於相信這是日本黑道保留下來的歷史園區，用以緬懷他們的卑微起源。不過他覺得另一種說法也有些道理：飛速發展的技術必須要有無法無天的地方才能發揮功用，「夜之城」的存在與它的居民無關，只是為了技術本身所特地留出的一片無人監管區。","他仰望燈火，想起琳達的話。魏之真的會拿他殺雞儆猴嗎？好像沒什麼道理，不過他們都說，魏之這種主營違禁生物製品的人一定很瘋狂。","但是琳達說魏之要他死。凱斯對於仁清街交易動力學的主要看法，就是買家和賣家其實都用不著他，但又需要一個惡人，中間人便承擔了這個任務。凱斯在「夜之城」的罪惡生態系統里，靠著謊言與背叛給自己圈出了一小塊不大牢靠的生態位，混得一夜是一夜。如今他隱約知道自己岌岌可危，反而感覺到一種奇怪的幸福。","上一周，他拖延了一單合成腺體提取劑的轉運，從而將它賣出了更多的利潤。他知道魏之不樂意。魏之是他的主要供貨人，已經在千葉城待了九年。能夠與「夜之城」外那層次分明的犯罪組織建立聯繫的外國毒販寥寥無幾，魏之就是其中之一。遺傳物質和激素順著一條極其隱蔽的精密路線流入仁清街，魏之一度神奇地追索到了某些來路，從而在十幾個城市建立了穩定的關係。","凱斯發現自己正注視著一面櫥窗。這家店顧客主要是海員，賣些小玩意兒，比如手錶、伸縮刀、打火機、口袋錄影機、感官同步機、加重萬力鎖鏈，還有飛鏢。他一直很迷戀飛鏢，那些帶有鋒利刺尖的鋼星，有亮銀色，有黑色，也有的表面經過處理，呈現出水面油膜的彩色。他目不轉睛地注視著那些銀色的星星，被透明的尼龍魚線掛在猩紅色的麂皮上，中心印著龍紋或陰陽符號，霓虹燈照在上面，折射出扭曲的光芒。凱斯意識到，他的旅程就在這些星星照耀之下啟航，而這些廉價鉻合金組成的星座，也已預示了他的命運。","「朱利，」他對著他的星星們說，「該去找老朱利了。他會知道的。」","朱利斯・迪安現年一百三十五歲，每周兢兢業業用昂貴的血清和激素調節新陳代謝。不過他抗衰老的主要方式還是每年一度的東京朝聖，讓遺傳外科醫生重設他的DNA密碼，這技術千葉還沒有。手術完成後他就飛去香港購買一整年穿用的西裝和襯衫。他男女莫辨，耐性駭人，對生活的滿足感似乎主要來自對裁縫技藝的神秘崇拜。凱斯從沒見過他重複穿過一套西裝，雖然他所有的衣服都只不過是略加更改的上世紀風格。他喜歡戴金絲邊眼鏡，配上粉紅人造石英磨成的薄薄近視鏡片，邊角圓滑，如同維多利亞玩偶屋裡的鏡子。","他的辦公室在仁清街背後的一間貨倉里，多年前似乎曾稍作裝修，裏面還擺著些亂糟糟的歐式傢具，好像曾打算在這兒安家。凱斯在一個房間里等候，牆邊一排新阿茲特克風格的書櫃積滿灰塵，一張低矮的坎丁斯基風格茶几刷著紅漆，上面詭異地支著一對用燈泡的迪斯尼風格檯燈。書架之間掛著一隻達利鍾，扭曲的鍾面似乎要朝著裸|露的混凝土地面墜落下去，修改過的全息影像指針轉動時會根據鍾面曲線改變長度，指示的時間卻永遠不對。房間里堆著白色玻璃纖維運輸模塊，散發著一股腌生薑的味道。「你好像挺乾淨的，老小子，」迪安的聲音響起來，人卻沒有出現，「進來吧。」","書櫃左邊是一扇巨大的仿紅木門，周圍的磁螺栓都支了出來，塑料門上貼著「朱利斯・迪安進出口」的字樣，黏膠紙已經開始剝落。若說那間門廳里散落的傢具帶著上世紀末的味道，那這間辦公室則好像還在上世紀初。深綠色的方形玻璃燈罩里，一盞古老的銅燈放出光芒，籠罩著迪安那張光潔的粉臉。這位出口商安坐在一張巨大的鋼桌後面打量凱斯，桌子兩邊高大的淺色木頭柜子里大約曾裝過手工記錄冊。桌上散落著磁帶、泛黃的列印紙卷和一堆零件，似乎都是一台老式手動打字機的部件，但迪安一直沒空把它重新組裝起來。","「孩子，什麼風把你給吹來了？」迪安一邊問，一邊遞給凱斯一支包著藍白格紙的細長糖果。「嘗嘗看……最最好的。」凱斯謝絕了生薑糖，在一張吱呀作響的木頭轉椅上坐下，大拇指滑過黑色牛仔褲泛白的褲縫。「朱利，我聽說魏之要殺我。」","「啊，好吧。我能不能問下是誰告訴你的？」","「某人。」","「某人，」迪安含著生薑糖，「什麼某人？你朋友？」","凱斯點點頭。","「搞清楚誰是朋友不太容易，對吧？」","「朱利，我的確欠他一點錢。他跟你說過什麼嗎？」","「……最近我們沒聯繫。」他嘆了口氣，又說，「當然，我就算知道也不能告訴你。形勢所迫，你懂的。」","「形勢？」","「魏之這邊的關係對我很重要，凱斯。」","「沒錯。他要殺我嗎，朱利？」","「我沒聽說。」迪安聳聳肩，輕鬆得好像在討論生薑的價錢，「如果這是空穴來風，老小子，你過一周再來，我給你弄點新加坡的貨。」","「明古連街上南海旅館的貨？」","「你嘴巴太大了，老小子！」迪安笑笑，鋼桌上堆滿了反竊聽裝置。","「再見，朱利，我會代你向魏之問好。」","迪安抬起手，摸摸他一絲不苟的淺色絲質領帶結。","離開迪安辦公室還不到一個街區，他的全身細胞便猛然驚覺，有人跟在屁股後面，跟得很緊。","凱斯微覺驚懼。他知道這很正常，對付的辦法就是不要驚慌失措，但這並不容易，尤其是在藥力之下。他在激增的腎上腺素中強自鎮定，瘦削的臉上掛出一副無聊空虛的神情，在人群中假意隨波逐流。他在一扇沒有亮燈的展示窗前設法停下了腳步。這是一家休業裝修的時尚手術店，他抄著手注視著櫥窗裏面，仿玉雕的底座上放著一片體外培育的人體組織。那肌膚的顏色好像鄒手下的妓|女；皮膚上文著亮閃閃的數字屏幕，與皮下晶元相連通。冷汗沿著肋骨涔涔而下，他卻發現自己在琢磨另一件事：這玩意揣在兜里就成，為什麼非得手術植入？","他沒有抬頭，只是抬高眼睛，看了看玻璃窗上過往人群的倒影。","就在那裡。","在那些穿短袖卡其衫的海員後面。深色頭髮，反光眼鏡，深色衣服，瘦長身材……","隨即消失。","凱斯拔腿便跑，弓著腰，在人群中不斷騰挪。","「新，租把槍給我吧？」","那男孩微笑道：「兩小時。」他們站在一個志賀生魚片攤後面，周圍是生猛海鮮的腥臭味。「兩小時后，你回來。」","「我馬上就要，兄弟。現在有什麼傢伙？」","新在一堆兩升的山葵粉罐子後面翻了翻，拿出一條細長的灰色塑料包裹。「泰瑟槍。一小時二十新日元。押金三十。」","「靠，我用不著這個。我要一把槍。可能要朝人開火的，明白？」","侍者聳聳肩，把泰瑟槍又放回山葵罐子後面。「兩小時。」","他走進店裡，並沒看那些飛鏢。他一輩子都沒用過這玩意兒。","他買了兩包頤和園香煙，三菱銀行卡顯示的名字是查爾斯・德里克・梅。他用過的護照上最好的一個名字是楚門・斯塔爾，還不如這個呢。","刷卡機後面的日本女人好像比老迪安還要老幾歲，也未曾經受科學雨露的滋潤。他從口袋裡掏出那捲薄薄的新日元給她看。「我想買件武器。」","她指指一個裝滿刀的盒子。","「不，」他說，「我不喜歡刀。」","她從櫃檯底下拿出一個長方形的盒子。黃色硬紙板盒蓋上印著粗糙的眼鏡蛇圖案，蛇身盤繞，頸部張大。盒子里是八個用紙巾包裹的圓柱體，全部一模一樣。她用斑駁的棕色手指剝開一個圓柱體上的紙巾，舉起讓他細看。這是一支暗色鋼筒，一端有條皮帶，另一端則是個小小的青銅尖角。她一隻手抓住鋼筒，另一隻手的拇指和食指夾住尖角，往外一拉，三段伸縮彈簧滑出來鎖住，上滿了油，壓得很緊。「眼鏡蛇。」她說。","仁清街閃爍的霓虹之上是陰沉沉的灰色天空。空氣質量越來越差，今晚簡直咬得人生疼，街上半數的人戴著過濾面具。凱斯在小便間里花了十分鐘想藏好眼鏡蛇，最後還是只能把槍柄塞進牛仔褲的褲腰裡，槍管斜支在上腹部，青銅尖角卡在肋骨和風衣之間，感覺一走動就要掉到路面上，但有了它心裏還是踏實了許多。","茶壺酒吧雖然算不上毒品交易點，但工作日晚上來的都是業界人士。周末的夜晚不同，常客們淹沒在大量湧入的海員和做海員生意的專業人士之中。凱斯擠進大門，不斷搜尋酒保拉孜，卻沒見到。酒吧駐場皮條客羅尼・鄒看著手下姑娘去勾搭一個年輕海員，眼神獃滯而慈祥——他磕的是種催眠葯，日本人管它叫「雲中舞者」。凱斯迎上他的目光，招呼他到吧台來。鄒那張鬆弛平靜的馬臉從人群中緩緩漂了過來。","「羅尼，你今晚有沒有見到魏之？」","鄒帶著如常平靜的神情看看他，搖了搖頭。","「兄弟，你確定？」","「可能在『南蠻』見過，可能兩小時之前。」","「有沒有帶小弟？其中一個瘦瘦的，黑頭髮，可能穿著黑夾克？」","鄒皺起眉頭，好像在辛苦地回憶這些莫名其妙的細節，最後說：「沒有。都是大個子，移植人。」他的眼皮耷拉著，只露出少許眼白與虹膜，瞳孔放得極大。他注視著凱斯的臉，半晌才低下頭，看見突起的鋼柄，揚了揚眉毛：「眼鏡蛇。你想搞掉誰？」","「再見，羅尼。」凱斯離開了。","尾巴又跟上來了，他很清楚。毒品、腎上腺素，還有什麼別的東西糾纏在一起，帶來一股快意。「你居然覺得很爽，」他想，「你是個瘋子。」","從某種詭異的角度看，這似乎變成了網路里的一次任務。當年他可以將網路看成蛋白質環環相扣而成的各種細胞機能，如今身處莫名其妙的絕望困境，又可以藉著藥力將仁清街看作一片數據的田野，全心投入高速的漂移滑動之中，既入世又疏離，身邊是飛舞的交易、交匯的信息，還有黑市迷宮裡的數據組成的肉體……","上，凱斯，他對自己說，引蛇出洞。他們絕對料想不到。這個時候，他離初次遇見琳達・李的遊戲廳不過半個街區。","他猛然衝過仁清街，一群閑逛的海員被他撞散，其中一個在他身後用西班牙語尖叫。他衝進遊戲廳大門，洶湧的聲波沒頂而來，感覺撕心裂肺。有人在歐羅巴坦克戰遊戲里命中一枚千萬噸當量的炸彈，整個遊戲廳淹沒在模擬爆炸波的白噪音之中，耀眼的全息火球在頭頂炸開。","他衝上右邊的樓梯，腳下是沒刷過漆的再生板。他跟著魏之來過這裏，和一個叫松賀的人談一單荷爾蒙觸發劑生意；他還記得這條走廊，記得這斑駁的地板，記得走廊兩旁那些一模一樣的門，還有門裡逼仄的辦公隔間。其中一扇門開著，一個穿黑色無袖T恤的日本女孩抬起頭，她面前是一台白色終端，背後貼著一張希臘旅行海報，藍色愛琴海和流線型的日文文字撲面而來。","「叫保安上來。」凱斯對她說。","他離開她的視野，奔向走廊盡頭。最後兩扇門都緊閉著，應該上了鎖。他猛然轉身，用鞋底踹向最裡面那扇合成材料的藍漆門。門轟然打開，門框碎裂，廉價五金紛紛墜落，裏面一片漆黑，只有一台弧形的白色終端殼子。他雙手握住右邊一扇門的透明塑料把手，用盡全身力氣往裡一頂，在斷裂聲中閃身進入房間。這正是他和魏之與松賀會面的地方，但松賀的皮包公司早已消失不見，屋裡連台終端都沒有。遊戲廳後面的巷子里亮著燈，燈光從沾滿煤灰的塑料窗透進來，他看見房間牆上伸出盤蛇般的光纖，除了一堆廢棄的食品盒和一架已經沒有葉片的電扇之外別無他物。","窗戶是廉價的塑料材質。他抖下外套，包住右拳，一拳便將窗戶擊裂，再加上兩拳，窗戶便徹底脫落。外面隱約的遊戲音響中響起了警報聲，或許是因為窗戶破碎，也或許是先前那女孩拉響。","凱斯轉過身，穿上外套，拉開眼鏡蛇的槍栓。","在緊閉的房門之後，他默默期望跟蹤者會以為自己已從另外那扇搖搖欲墜的門裡逃走。脈搏的震動透過彈簧槍膛放大，眼鏡蛇的青銅尖角微微震動。","什麼也沒有發生。他只聽見起伏的警報，遊戲里的巨響，和自己沉重的心跳。恐懼在這刻襲來，如同被遺忘的老友。不再是藥力下冰冷敏捷的疑懼，只是簡單的、原始的恐懼。他長久生活于焦慮之中，已經忘記了這種真正的恐懼。","有人曾經死在這樣的隔間里。他可能會死在這裏。他們可能有槍……","走廊另一頭傳來一聲巨響。一個男人用日語呼喊。一聲驚恐的尖叫。又是一聲巨響。","腳步聲不疾不徐地走近。","走過他面前緊閉的門。停住。三次悸動的心跳。又回到門口。一，二，三。靴跟在粗糙的地毯上摩擦。","藥力所帶來的勇氣終於徹底崩潰。恐懼讓他完全失去理智，所有神經都在尖叫，他把眼鏡蛇塞進套筒，奔向窗口，未及思考便已騰空而起，躍出窗外，開始墜落。他跌落在路面上，雙腿傳來陣陣鈍痛。","一間半開放的網路亭中傳出一絲光線，照亮一堆廢棄的光纖和控制台殘骸。他落下時撲在了一塊潮濕的電路板上；他翻過身，躲進控制台的陰影里。樓上那窗框里透出微弱的燈光，遊戲廳里的咆哮聲被后牆隔斷，那起伏的警報聽起來便更加響亮。","一隻腦袋在窗戶里出現又消失，背後映照著走廊中的熒光燈。那人又出現了，但他還是看不清長相，只看見眼睛上閃過的銀光。「靠。」那是個女人的聲音，一口斯普羅爾北部口音。","那人再次消失。凱斯躺在控制台底下，慢慢數到二十，然後站起身來。精鋼的眼鏡蛇還在手中，他過了幾秒鐘才想起來是什麼東西。他護著左踝，一瘸一拐地朝巷子深處走去。","新給他的是南美版瓦爾特PPK槍的越南仿版，首擊雙動模式，扳機沉重，已經有五十年槍齡。這把槍適用點22長槍子彈，凱斯真希望能有疊氮化鉛彈藥，而不是新賣給他的中國造簡易空尖彈。但它怎麼說也是把手槍，還有九發子彈。他離開生魚片攤子，沿著志賀街而行，手在衣兜中不斷把玩，拇指在黑暗中一次次滑過那飛龍形狀的鮮紅色塑料槍柄。他已經把眼鏡蛇託付給了仁清街上的一隻垃圾桶，又空口服了一枚八角藥片。","在藥力的照耀下，他沿著志賀街走到仁清街，再轉上梅逸街。尾巴已經不見了，他想，很好。他得打電話，得做生意，刻不容緩。沿著梅逸街朝港口方向走一個街區，有一座以醜陋黃磚蓋成，毫無裝飾的十層辦公樓，此刻窗戶都已經暗了，但伸長脖子還能看見樓頂微弱的亮光。大門外的霓虹招牌已經熄滅，上面有一堆日本文字，下面寫著「廉價旅館」。凱斯不知道這地方還有沒有別的名字，反正人人都管它叫「廉價旅館」。他從梅逸街上的一條小巷走進樓里，透明電梯井的底端已經有電梯在等候。這棟樓本來不是旅館，電梯也是後來才用竹子和環氧樹脂綁上去。凱斯爬進這個塑料籠子，用一片毫無標誌的硬磁條鑰匙打開電梯。","凱斯自從來到千葉城后，就按周租用了「廉價旅館」的一個棺材屋，但他從來不在這裏睡覺。他睡覺的地方更廉價。","電梯里有香水和煙草的味道，牆上滿是刮花和指印。電梯經過五樓，他看見仁清街上的燈光。他的手指不斷敲擊著槍柄，籠子噝噝作響地慢下來，徹底停下時照舊猛然一晃，他淡然處之。","他走出電梯，步入一個庭院，算是大堂兼草坪。地上鋪著草地模樣的方形綠塑料地毯，正中有台C形電腦控制台，一個日本少年坐在後面看課本。白色的玻璃纖維棺材屋裝在工業框架裏面，一共六層，每側十隻。凱斯朝少年點頭致意，一瘸一拐地穿過塑料草坪，朝最近的梯子走去。這棟樓頂上的廉價覆膜席子吹風時會響動，下雨時會漏水，但是這些棺材不用鑰匙很難打開。","他爬上第三層，來到92號，鐵網鋪成的懸空走廊在他身下震動。這些棺材屋長三米，卵圓形的門有一米寬，近一米五高。他把鑰匙放進鎖孔，等待管家電腦確認。磁性門閂令人安心地滑開，屋門隨著彈簧吱呀聲升起來。他爬進棺材屋，熒光燈亮了起來，他拉上身後的門，拍了拍控制板，激活了手動門閂。","92號房裡只有一台標準的日立牌口袋電腦和一隻小小的白色泡沫塑料保溫箱。保溫箱里裝著三塊十公斤的乾冰板，經過仔細包裹以延緩揮發，還有一隻實驗室用的鋁製燒瓶。凱斯跪在棕色記憶棉地板兼床板上，從口袋裡掏出新給他的點22手槍，放在保溫箱的最上層，然後脫下外套。棺材屋的電話內置在一面牆裡，對面的公告板上用七種語言寫著酒店規則。他拿起粉色話筒，憑記憶按下一個香港的號碼，聽那邊響了五聲便掛斷。他那隻日立牌電腦里有三兆位元組炙手可熱的隨機存取存儲器，但買主不接電話。","他又按下一個東京新宿的電話號碼。","接電話的是一個女人，說的是日語。","「蛇人在嗎？」","「有你消息很好，」蛇人從分機接了進來，「我在等你電話。」","「我弄到了你要的音樂。」他掃了一眼保溫箱。","「很高興聽到這個消息。我們現金流有問題。你能先發貨嗎？」","「夥計，我真的很缺錢……」","蛇人掛斷了電話。","「去他媽的。」凱斯對著嗡嗡響的電話說。他盯著那把廉價小手槍。","「詭異，」他說，「今晚看起來很詭異。」","天亮前一個小時，凱斯走進「茶壺」，雙手揣在外套兜里，一隻握住租來的手槍，另一隻握著那個鋁瓶。","拉孜坐在靠里的桌旁，用啤酒壺喝著水，他那一百二十公斤重的身子軟軟地靠在牆上，壓得椅子吱呀作響。一個叫庫爾特的巴西小孩在吧台里，給一小撮不太吵鬧的酒鬼斟酒。拉孜舉起啤酒壺，塑料胳膊嗡嗡作響，光頭上薄薄鋪著一層汗水。「大師朋友，你看起來不太好。」他露出一口濕乎乎的爛牙。","「我挺好，」凱斯笑得像具骷髏，「非常好。」他窩進拉孜對面的椅子里，雙手仍在口袋中。","「沒錯，你就這麼晃來晃去，靠酒和毒品擺出副刀槍不入的樣子。能證明自己沒有很不爽，是吧？」","「你能不能別揪著我不放，拉孜？見到魏之了沒？」","「能證明自己又不恐懼，又不孤單。」酒保自顧自接下去，「聽從恐懼的召喚吧。它可能是你的朋友。」","「拉孜，你聽說今晚遊戲廳里有打鬥嗎？有人受傷嗎？」","「有瘋子砍了個保安。」他聳聳肩，「他們說是個女的。」","「拉孜，我得跟魏之談談，我……」","「啊。」拉孜的嘴抿成了一條線，眼睛看向凱斯身後的門口，「我覺得你馬上就能跟他談了。」","飛鏢的寒光在凱斯眼前疾閃而過，安非他命在他腦中蕩漾，手中的槍已經汗濕溜滑。","「魏之先生，」拉孜慢慢舉起粉紅色的假臂，好像要和對方握手，「太榮幸了。您甚少光臨。」","凱斯轉過頭，看見魏之的臉。那張臉如同古銅色的面具，全無特徵，海水綠色的眼睛是體外培育的尼康牌移植體。魏之穿著一身槍灰色的真絲西裝，兩隻手腕上各戴著一條簡潔的鉑金手鏈。小弟們跟在他兩旁，模樣幾乎沒有差別，肩臂上都是暴起的植入肌肉。","「你還好嗎，凱斯？」","「先生們，」拉孜舉起桌上滿噹噹的煙灰缸說，「我不希望這裡有麻煩。」這隻綠色煙灰缸上印著青島啤酒的廣告，材質是厚實的抗震塑料，卻被他一把捏碎，煙頭與碎片潑灑而下，落在桌面上。「你們明白？」","「嘿，甜心，」一個小弟說，「來我這試試？」","「庫爾特，別費那勁瞄著腿。」拉孜閑閑地說。凱斯朝房間另一頭望去，那巴西人站在吧台上，端著一把史密斯維森防暴槍，瞄準魏之一行三人。薄如蟬翼的合金槍管外面包裹著長長的玻璃纖維，粗大的槍膛塞得進一隻拳頭，彈夾內露出五枚粗壯的橙色亞音速沙包彈。","「從技術上說，這不算致命武器。」拉孜說。","「嘿，拉孜，」凱斯說，「我欠你個情。」","酒保聳聳肩。「你不欠我什麼。這些人，」他瞪著魏之和他的小弟，「犯糊塗。誰也不能在茶壺裡抓人。」","魏之咳嗽一聲。「誰說要抓人？我們來談生意。凱斯跟我合作的。」","凱斯掏出他的點22槍，對準魏之胯部。「聽說你要幹掉我。」拉孜用粉色爪子握住了凱斯的手槍，凱斯鬆開手。","「嘿，凱斯，你說你他媽的怎麼回事？你瘋了嗎？我要殺你，這是什麼亂七八糟的？」魏之轉向左邊的小弟說：「你倆回『南蠻』去等我。」","凱斯看著兩人經過吧台，那裡只留下了庫爾特和一個醉倒的海員，穿著卡其布衣服，蜷縮在吧椅腳下。史密斯維森的槍口跟隨兩人走出門口，隨即轉回，指向魏之。凱斯的彈夾落在桌上。拉孜用爪子握住手槍，退出那顆上了膛的子彈。","「誰說我要殺你，凱斯？」魏之問。","是琳達。","「誰說的，兄弟？有人要給你下套？」","那個海員咕噥幾聲，開始劇烈嘔吐。","「把他弄出去。」拉孜對庫爾特喊道。此時庫爾特已坐在吧台邊，史密斯維森橫在腿上，正在點煙。","凱斯只覺得夜色沉重，像一堆濕透的沙子，壓到他的腦中。他從口袋裡掏出那隻燒瓶，遞給魏之。「我只有這些了。腦垂體。運輸快點，你能賺五百。我還有些值錢東西在一個隨機存取存儲器里，但它現在不見了。」","「你還好吧，凱斯？」燒瓶消失在槍灰色的西裝里，「我是說，成，有這咱倆就扯平了，但你看起來糟透了，像一坨被扁過的屎。你最好找個地方睡一覺。」","「是啊，」他站起身來，茶壺在身周搖晃，「嗯，我本來有五十塊錢，但是給別人了。」他笑起來，揀起點22手槍的彈夾和那顆子彈扔進一邊口袋，把槍扔進另一邊口袋。「我得去找新，拿回我的押金。」","「回家吧，」拉孜好像有點尷尬地扭了扭，椅子在他身下吱呀作響，「大師，回家吧。」","他穿過房間，用肩膀頂開塑料大門，感覺他們一直在注視著他。","「婊子。」他對著志賀街上微露粉色的天空說。仁清街上的霓虹燈早已冷冷熄滅，全息影像也都鬼魅般淡去。他從街頭小攤上的泡沫管里啜了一口濃濃的黑咖啡，看著太陽升起。「飛吧，甜心。這樣的城市只適合想下地獄的人。」但其實並非如此；那種被背叛的感覺在不斷消退。她不過想要一張回家的機票，只要能將那塊日立隨機存取存儲器出手便能買得起。至於那五十塊錢，她當時幾乎拒絕接受，因為她深知這已是他最後的一切。","他爬出電梯，櫃檯里仍是同一個男孩，在看一本不同的課本。「好兄弟，」凱斯朝著塑料草皮那邊喊，「你不用告訴我，我都知道了。有個漂亮女生來了，說她有我鑰匙。給了你不少小費，大概五十新日元吧？」男孩放下書。「女人，」凱斯用大拇指劃過額頭，「真棒。」他露齒大笑，那男孩也報以微笑點頭。「謝謝你，混蛋。」凱斯說。","他在走廊上費了半天勁才打開鎖。一定是她瞎搞弄壞的，他想。新手嘛。他知道某處有黑盒子出租，能打開廉價旅館里所有的鎖。他爬進棺材屋，熒光燈亮起來。","「朋友，千萬要慢慢上鎖。那侍者租給你的周六特價貨你還帶著呢？」","她在棺材屋最裡面，靠牆屈腿而坐，手腕放在膝蓋上，手中露出一把箭槍的轉管槍口。","「遊戲廳里是你嗎？」他拉上門閂，「琳達呢？」","「按一下門閂開關。」","他照辦了。","「那是你的妞？琳達？」","他點點頭。","「她走了。拿走了你的日立。那孩子挺緊張的。槍呢，老兄？」她戴著反光眼鏡，全身黑衣，黑靴的靴跟深深扎進記憶棉墊之中。","「還給新了，取回了押金。子彈也半價賣回給他了。你要錢嗎？」","「不要。」","「要不要乾冰？現在我只剩這個了。」","「你今晚腦子進水了？為什麼在遊戲廳搞那麼一出？讓保安拿著雙截棍追我，我只好搞掉他。」","「琳達說你是來殺我的。」","「琳達說的？我來了這裏才第一次見到她。」","「你不是魏之的人？」","她搖搖頭。他發現她的眼鏡是手術植入的，完全封住了眼眶。粗糙雜亂的黑髮之下，銀色的鏡片似乎生長在她顴骨處光潔而蒼白的肌膚上。她握槍的手指細長白凈，酒紅色的指甲似乎也是人工的。「凱斯，我看你一團亂。我才出現，你就以為我跟你身邊發生的破事有關係。」","「那你想要什麼呢，女士？」他靠在門閂上。","「你。活著的，腦子還沒全壞掉的你。莫利，凱斯，我叫莫利。我是替老闆來找你的。只想跟你談談，如此而已。沒想傷害你。」","「很好。」","「不過我也會傷人的，凱斯，我就是這種人。」她穿著黑色緊身軟皮褲，肥大的啞光黑色夾克好像會吸收光線。「凱斯，我放下槍的話，你不會怎樣吧？你好像很愛干傻事。」","「嘿，我根本不會怎樣的。我弱不禁風，沒問題的。」","「那就好。」箭槍消失在黑色夾克中。「要是在我面前胡來，那就是你這輩子干過最傻的事。」","她伸出雙手，攤開手掌，白凈的手指微微伸展，一聲微不可聞的輕響之後，酒紅色的指甲下面滑出十隻四厘米長的雙刃刀片。","她微微一笑，刀片又慢慢縮回。"]},{"title":"第一部 傷心千葉城 02","paragraphs":["在棺材旅館住過一年之後，千葉希爾頓飯店二十一樓的房間看起來碩大無朋。這是半間套房，有十米長，八米寬。在小陽台的玻璃推拉門邊，矮几上的白色博朗牌咖啡機霧氣升騰。","「喝點咖啡。你很需要咖啡的樣子。」她脫下黑色夾克，箭槍用黑色尼龍肩帶套著，掛到胳膊下面。她穿著一件灰色無袖套頭衫，兩肩都是鋼拉鏈。是防彈衣，凱斯一邊想著，一邊把咖啡倒進鮮紅的杯子里。他的四肢都僵硬無力。","「凱斯。」他抬起頭，初次見到了那個男人。「我叫阿米塔奇。」他的深色浴袍前襟一直敞到腰間，露出寬闊無毛肌肉賁起的胸膛和平坦堅實的腹部。他眼睛的藍色淡到同漂白粉一般。「太陽已升起，凱斯。今天是你的幸運日，孩子。」","凱斯一揚胳膊，那人輕鬆閃避，滾燙的咖啡灑在仿米紙的牆上，棕色的漬印順著牆面流下。他看見那人左耳垂上的猙獰金環。特種部隊。那人微笑起來。","「凱斯，喝你的咖啡。」莫利說。「沒什麼事，但在阿米塔奇說話之前，你哪兒也不能去。」她盤腿坐在真絲沙發上，開始拆卸箭槍，卻連看都不用看一眼。她的兩隻鏡片看著他走到桌邊，又盛了一杯咖啡。","「凱斯，你太年輕了，不記得那次戰爭了吧？」阿米塔奇用大手摸摸自己的棕色短髮，手腕上有一條粗大的金色手鏈在閃爍。「列寧格勒，基輔，西伯利亞。你們是我們在西伯利亞發明的，凱斯。」","「什麼意思？」","「『哭拳行動』，凱斯。你聽過這個名字。」","「挺爽的，對吧？想用病毒程序燒掉那個俄國節點。沒錯，我聽說過這事。無人生還。」","他感覺到空氣突然變得緊張。阿米塔奇走到窗邊，望向東京灣對岸。「不對。凱斯，有一個小組最後回到了赫爾辛基。」","凱斯聳聳肩，啜了口咖啡。","「你是個網路牛仔。你用來侵入工業銀行的那些軟體原型都是為『哭拳行動』開發的。是為了攻擊位於基倫斯克的那個電腦節點。每個編組一架『夜翼』微型飛機，一位駕駛員，一個網路操控台，一個牛仔。我們用的病毒叫『鼴鼠』。鼴鼠系列是第一代真正的侵入程序。」","「破冰程序。」凱斯端著紅杯子說。","「『冰』是個簡稱，它的全稱是『反侵入電子器件』。」","「問題是，先生，我現在根本不是牛仔，我覺得我該走了……」","「我在場，凱斯。我親身經歷了你們這種人的發明過程。」","「你跟我和我這種人屁關係都沒有，夥計。你只不過有錢雇得起昂貴女殺手，把我弄到這裏來。我再也不可能用網路操控台，不管是為你還是為別人。」他走到窗邊，看看下面。「我現在住在那裡。」","「我們的資料顯示，你在街上胡搞亂來，好讓一條街的人趁你不備殺了你。」","「資料？」","「我們建立了一個詳細的模型。我們花錢查過你所有的假名記錄，用軍用軟體進行總結。你有自殺傾向，凱斯。我們的模型標明你在外邊只能活一個月。而我們的醫學預測是你在一年內需要換胰臟。」","「『我們』。」他注視著那雙淡藍色的眼睛。「誰是『我們』？」","「如果我告訴你，我們可以複原你損毀的神經，你覺得怎樣，凱斯？」在凱斯的眼中，阿米塔奇突然變成一尊沉重的金屬雕像，紋絲不動。他知道了，這是一場夢，他很快便會醒來。阿米塔奇再也不會說話。凱斯的夢永遠是以這樣凝固的畫面收尾，現在，這一場夢也該醒了。","「你覺得怎樣，凱斯？」","凱斯看向東京灣對岸，渾身顫抖。","「我覺得你純屬胡扯。」","阿米塔奇點點頭。","「那麼我要問問你的條件。」","「和你過去見過的那些差不多，凱斯。」","莫利坐在沙發上說：「阿米塔奇，讓他睡一會兒。」箭槍的零件攤在絲綢沙發上，像一張昂貴的拼圖。「他快崩潰了。」","「講條件，」凱斯說，「現在。就是現在。」","他仍在顫抖。無法自制地顫抖。","那家無名診所陳設豪華，幾座簡潔的亭台之間以小小的方形花園隔開。他還記得這裏，他在千葉城遍尋診所的第一個月就曾經來過。","「凱斯，你在害怕。你真的很怕。」那是一個周日的下午，他和莫利站在庭院里，旁邊是幾塊白色巨石，一叢翠竹，以及黑色礫石鋪成的波浪。一個金屬大螃蟹模樣的園丁正在照料竹子。","「會成功的，凱斯。你不知道阿米塔奇都有什麼東西。他要給這些搞神經的一個程序，讓他們知道怎麼修復你，還要付錢給他們。他會讓他們領先競爭對手三年。你知不知道這值多少錢？」她拿大拇指勾住皮褲的皮帶扣，蹬著棗紅牛仔靴搖搖晃晃，那尖尖的靴頭上包著墨西哥亮銀。她的鏡片是空洞的水銀色，看他時如同昆蟲眼睛一般平靜。","「你是街頭武士，」他說，「你給他打工多久了？」","「兩個月吧。」","「之前呢？」","「跟別人干。打工女郎，你知道吧？」他點點頭。","「真有意思，凱斯。」","「什麼有意思？」","「我好像認得你一樣。他給我看過你的資料。我知道你是什麼人。」","「你不了解我，妹妹。」","「你沒事的，凱斯。絆倒你的不過是霉運而已。」","「他呢？他怎麼樣，莫利？」機器螃蟹在礫石波浪上蜿蜒而行朝他們爬來，那青銅外殼彷彿來自千年以前。到了離她靴子一米開外的地方，它發射出一道光線，然後停下來分析數據。","「凱斯，我最先考慮的，永遠是自保。」那隻螃蟹轉向避開，但她還是一腳踢中它，銀色靴頭敲在蟹殼上，那玩意兒仰面朝天落在地上，但很快又靠著青銅肢翻了身。","凱斯坐在一塊大石頭上，腳尖在礫石曲徑上拖來拖去，滿身找煙。「在你襯衫里。」她說。","「你想回答我的問題嗎？」他從煙盒裡抽出一支皺巴巴的頤和園，她替他點著，那薄薄的德國鋼質打火機彷彿手術台上的器具。","「嗯，我可以告訴你，這人肯定是要做什麼。他從不曾有過現在這麼多錢，而且越來越多。」凱斯發現她嘴角有些緊張。「或許，或許是有什麼東西要做他……」她聳聳肩。","「這是什麼意思？」","「其實我也不知道。我知道的是，我們不知道自己是為誰，還是為什麼東西在工作。」","他注視著那對鏡子。周六的早晨，他離開希爾頓，回到廉價旅館睡了十個小時，然後沿著港口警戒圈漫無目的地走了很久，看圍欄外的海鷗盤旋。她沒有跟蹤他，至少他沒有發現。他避開了「夜之城」。他在棺材旅館里等阿米塔奇的電話。現在，周日的下午，在這個寧靜的庭院里，這個女孩在他面前，有一副體操運動員的身體和一雙魔法師的手。","冷冷的鋼鐵氣息。寒意撫過他的脊柱。","他迷失在那片黑暗之中，顯得如此渺小，雙手漸漸冰冷，在電視屏幕般的天空那頭，身體的影響漸漸淡去。","有人在說話。","黑色火焰隨後卷上他神經的枝杈，一種無以名狀的痛苦……","挺住。不要動。","拉孜出現了，還有琳達・李，魏之，羅尼・鄒，有那片霓虹森林中的上百張面孔，海員，騙子，妓|女。那片有毒的銀色天空在圍欄之外，在腦殼的禁錮之外。","媽的，你不能動。","那天空中刺啦的靜電慢慢消失，變得像網路一般毫無色彩。那一刻他瞥見了那飛鏢，瞥見了他的星星。","「停下，凱斯，我要找到你的靜脈！」","她跨坐在他胸脯上，一隻手裡拿著支藍色的塑料注射器。「你要是不躺平了，我他媽就割破你喉嚨。你身體裏面還全是內啡肽抑製劑。」","他醒過來，黑暗中的她伸展四肢躺在他身旁。","他的脖子如同細小樹枝一般脆弱。脊柱中段源源不斷地發出疼痛訊號。各種影像依次浮現，好像閃動的蒙太奇，有斯普羅爾的高樓，破爛的富勒穹頂，在橋下陰影中朝他走來的朦朧人影……","「凱斯？今天周三了，凱斯。」她翻過身，手伸到他身體另一邊，一隻乳|房掃過他的上臂。他聽見她撕開水瓶的封口箔喝水。「這裏。」她把水瓶放在他的手中。「凱斯，我在黑暗裡能看見東西。我的眼鏡里有微管道影像強化器。」","「我的背好痛。」","「他們從背上更換了你的體液。還換了血。換血是因為他們免費贈送你一個新胰臟。你的肝臟上也貼了新組織。神經的東西我就不懂了。打了很多針。最後沒用得著開刀就辦完了大事。」她又在他身旁躺下。「凱斯，現在是凌晨2點43分12秒。我的視神經上種了一塊時間顯示晶元。」","他坐起身，試圖拿瓶子喝水，卻嗆到了，咳嗽起來，溫水灑在他胸前和大腿上。","「我要用網路操控台。」他聽見自己說。他伸手去抓衣服。「我想知道……」","她笑起來，一雙有力的小手抓住他的上臂。「不好意思，高手，你得等八天。如果現在接入網路，你的神經系統會碎裂一地。這是醫生交代的。另外，他們認為手術成功了。大概一天後會再來複查。」他又躺下來。","「我們在哪裡？」","「在家。廉價旅館。」","「阿米塔奇在哪？」","「在希爾頓，大概是賣珠子給土著。老兄，我們很快會離開這裏。阿姆斯特丹，巴黎，然後回斯普羅爾。」她拍拍他的肩膀。「翻個身。我按摩手藝不錯。」","他趴在床上，胳膊伸過頭頂，指尖抵住牆壁。她跨在他的腰間，跪在床墊上，皮褲涼涼地貼在他的肌膚上。她的手指拂過他的脖頸。","「你為什麼不去希爾頓？」","她沒有答話，只是將手伸到他的雙腿之間，用拇指和食指溫柔地握住他的陰囊。她就那樣坐在他身上，另一隻手放在他脖頸上，在黑暗中晃動了一分鐘，皮褲隨著她的動作輕輕作響。凱斯動了動，感覺到自己在勃起，抵住了床墊。","他的頭在痛，脖子的不適卻消退了。他用手肘撐起身體，翻過身，躺倒在床墊上，將她拉下來，舔舐著她的乳|房，她堅硬的小乳|頭濕淋淋地掃過他的臉頰。他摸索著她皮褲的拉鏈，使勁拉下。","「別急，」她說，「我看得見。」他聽見她脫皮褲，感覺到她在身旁扭動，最後踢開褲子。她的腿搭到他身上，他伸手撫摩她的臉頰，卻碰到堅硬的眼鏡，「別摸，」她說，「會有指紋。」","她再次騎坐在他身上，將他的手放到背後，他的拇指滑過她的股縫，手指覆住她的陰|唇。她慢慢坐下來，那些影像又紛紛湧起，他看到那些面容，那些霓虹閃耀的片段，來來去去。她包圍住他慢慢滑下，他不由自主地拱起脊背。她就這樣騎坐著，好像釘在他身上，不斷上上下下，直到兩人都已高潮。他的高潮藍瑩瑩的，閃爍在一片如同網路般永恆的虛空之中，那些面孔紛紛被撕碎捲走，她強健的大腿濕淋淋地貼在他的屁股上。","工作日的仁清街上，舞動的人群相對稀疏。遊戲廳和彈子球店裡傳出一波一波的聲音。凱斯朝茶壺裡掃了一眼，裏面有泛著啤酒味的溫暖微光，鄒在看著手下的姑娘們。拉孜在吧台工作。","「你看到魏之了嗎，拉孜？」","「今晚沒看見。」拉孜故意沖莫利揚了揚眉毛。","「看到他的話，就告訴他我可以還錢了。」","「轉運了嗎，大師？」","「現在還說不準。」","「反正，我一定要見這個人，」凱斯看著自己在她眼鏡上的倒影，「我還有生意要了結。」","「讓你離開我的視線，阿米塔奇會不高興。」她雙手叉在臀部，站在迪安的達利鍾下面。","「有你在他不會跟我談的。我不擔心迪安，他能照顧自己。但是我若是這樣不聲不響離開千葉城，會有人掛掉的。我的人，你懂嗎？」","她抿起嘴，搖搖頭。","「我的人在新加坡，東京的新宿和淺草也有關係，他們會『掛』掉，明白嗎？」他把手搭在她穿著黑夾克的肩膀上，睜眼說瞎話。「五分鐘。就五分鐘。你看著時間，行嗎？」","「我拿錢不是干這個的。」","「你拿錢幹嗎是一回事。你非得執行死命令，我就得聽任鐵哥們掛掉，那是另一回事。」","「胡扯。鐵哥們個屁。你是要找那走私犯查我們的底細。」她抬起一隻穿靴子的腳，踩在落滿塵灰的坎丁斯基咖啡桌上。","「啊，凱斯，你的同伴肯定是帶著武器，腦子裡還挺多電路。這到底是要幹嗎？」迪安鬼魅般的咳嗽聲好像停在他們倆之間。","「等等，朱利。不管怎樣，我會單獨進來。」","「老小子，這是絕對的。否則不用進來。」","「好吧。」她說。「去吧。但只有五分鐘。超出時間我就進去，讓你的鐵哥們徹底掛掉。順便想想一件事。」","「什麼事？」","「我為什麼會賣你這個面子。」她轉過身，經過那堆白色的腌生薑箱子，走出房間。","「凱斯，你這次的同伴比較怪，是吧？」朱利問。","「朱利，她走了。你讓我進去行嗎？求你了，朱利。」","門閂打開了。「慢慢來，凱斯。」那個聲音說。","「把你桌子里那些儀器打開，朱利，全部打開。」凱斯一邊說，一邊在轉椅上坐下。","「一直都開著。」迪安一邊溫和地回答，一邊從他那台還沒裝好的舊打字機背後拿出一把槍，仔細瞄準凱斯。那是一把麥格儂短管左輪槍，槍管被鋸得很短，扳機護弓的前端已經切掉，槍柄上纏著陳舊的膠帶。迪安精心打理的粉色雙手握著這把槍，顯得很詭異。「我只是小心行事，你懂的，不是對你有意見。現在告訴我，你想要什麼？」","「我需要一堂歷史課，朱利。還需要查一個人。」","「有什麼動靜，老小子？」迪安穿著件彩條棉襯衫，衣領潔白硬挺，跟陶瓷一樣。","「是我，朱利，我要走。要離開。幫我個忙，好嗎？」","「要查誰，老小子？」","「一個老外，叫阿米塔奇，住在希爾頓套房。」","迪安放下手槍。「坐著別動，凱斯。」他往一台手提終端上敲字。「好像我的網路也只知道這麼多，凱斯。這位先生似乎和黑幫臨時有約，所以『金菊之子』找我們查他的底細，否則我根本不會知道。回來說歷史。你說要聽歷史。」他又拿起槍，但並未指向凱斯。「什麼樣的歷史？」","「戰爭。你參加過那場戰爭吧，朱利？」","「那場戰爭？有什麼要知道的？只有三個星期罷了。」","「哭拳。」","「很有名。現在你們都不學歷史啦？那可是戰後的超級政治皮球，讓很多人死去活來的水門事件。你們的軍隊頭目，凱斯，你們斯普羅爾的頭目們，是在哪兒來著？麥克利安？在那些地下掩體里，那些事兒……全是超級醜聞。為了測試新技術讓不少愛國年輕人送了命。後來才傳出來說，他們早知道俄國有防禦。他們知道俄國有EMP，就是磁脈衝武器，但還是派這些夥計去試水。」迪安聳聳肩。「伊萬打他們就跟打火雞似的。」","「有沒有人活著回來？」","「老天，」迪安說，「多少年前的事兒了……但確實有幾個人逃出來了。是一個小隊，控制了蘇聯的一架武裝直升機，飛回了芬蘭。當然，他們沒有入關口令，就把芬蘭防禦部隊打得屁滾尿流。特種部隊么。」迪安哼了一聲，「操。」","凱斯點點頭。腌生薑的氣味重得讓人受不了。","「戰爭期間我在里斯本，你知道，」迪安放下槍說，「里斯本是個可愛的地方。」","「是服役嗎，朱利？」","「算不上。不過目擊了現場。」迪安露出一個粉色微笑。「戰爭可以帶來巨大的市場。」","「謝謝你，朱利。我欠你個情。」","「不算什麼，凱斯。再見。」","後來他告訴自己，在「薩米家」那個晚上從一開始就不對勁，踏著滿地票根和泡沫杯子，跟著莫利穿過那條走廊的時候，他已經能感覺到。琳達的死，即將到來……","他見過迪安后，他們去了「南蠻」，用阿米塔奇給他的新日元付清了欠魏之的債。魏之很高興，但他的小弟們就不那麼高興了。莫利站在凱斯身旁，露出瘋狂而野性的笑容，顯然在盼著他們動手。隨後他帶她回茶壺去喝酒。","凱斯從夾克口袋裡掏出一粒八角藥片，莫利說：「牛仔，你這是浪費時間。」","「為什麼？來一粒？」他把藥片遞給她。","「因為你的新胰臟和肝臟上那些填補組織，凱斯。根據阿米塔奇的要求，它們對那玩意兒沒反應。」她用一隻酒紅色指甲敲敲藥片。「從生物化學來說，你無法再從安非他命或者可卡因里獲得快|感。」","「扯。」他看看藥片，又看看她。","「吃吧。吃上一打也沒效果。」","他吃了。真的沒效果。","三輪啤酒喝完，她問拉孜哪裡有搏擊場。","拉孜說：「薩米家。」","「我不去，」凱斯說，「聽說他們會鬥毆至死。」","一個小時后，她從一個穿白T恤和松垮垮球褲的泰國人手裡買到了票。","「薩米家」位於港口旁一個貨倉背後，是一座穹頂充氣屋，外牆灰色布料緊繃在細細的鋼索之上。門廊兩端各有一扇門，勉強算是道氣密門，保持屋內氣壓高於外界，不致塌倒。天花板是三合板材質，間次裝著熒光燈環，多數都已壞掉。潮濕的空氣里充滿汗水與混凝土的氣味。","他全未料到這屋裡會有怎樣的舞台，怎樣擁擠的觀眾，怎樣緊張的寂靜，怎樣高大的光影。混凝土台階層層往下，中央大略圍成一個舞台，舞台上方一圈密密麻麻的投影設備。沒有燈，只有全息影像在上方閃耀變換，重現舞台上兩個人的所有動作。香煙的煙霧從台階上層層升起，漂浮在空中，最後被加壓機吹出的風攪散。沒有聲音，只有經過消音的加壓機風聲，還有被擴音器放大的搏擊手的呼吸聲。","兩個搏擊手相對轉圈，色彩在莫利的反射鏡片上流動。這裏的全息影像放大率是十倍；放大十倍之後，他們手中的刀也還不足一米。凱斯還記得他們握刀的姿勢同擊劍一樣，手指蜷曲，拇指與刀鋒平行。莫利仰頭觀看，神色平靜。","「我去找點吃的。」凱斯說。她點點頭，卻已全心沉浸於搏擊手的舞動之中。","他不喜歡這個地方。","他轉過身，走進陰影之中。這裏太黑，太安靜。","觀眾大都是日本人。和夜之城不一樣。這大概說明這家搏擊場得到了某大公司休閑委員會的批准。他想象一輩子都替一家大公司打工的生活。公司宿舍，公司讚美詩，公司葬禮。","他繞著場子轉了一圈才找到小吃攤，買了串燒和兩大罐啤酒。他仰頭掃了一眼全息影像，看見鮮血從一個人胸前淌下。濃濃的棕色調味汁順著簽子流到他的手指上。","還有七天他就可以接入網路。他只要一閉上眼，就看見網路。","全息影像隨著鬥士的舞動而搖擺，投下的陰影也隨之扭動。","他的後背上方痛起來。一縷冷汗滑過他的胸膛。手術沒有成功。他還在這裏，仍是一具肉身，沒有莫利在等他，在注視著鬥士手中的刀轉動，沒有阿米塔奇拿著機票、新護照和錢在希爾頓等候。這全是一場夢，一場可悲的幻想……熱淚模糊了他的視線。","一片紅光閃過，鮮血從一條頸靜脈噴出。一個人影倒下去，全息影像閃動著淡去，人們在尖叫，站起身，再尖叫……","一股苦味湧上喉頭，他想吐。他閉上眼，深吸一口氣，再睜開，看見琳達・李走過去，灰色的眼睛里充滿恐懼，別無他物。她還是穿著那件法國工作服。","她消失了。消失在陰影之中。","這完全是下意識的——他扔下啤酒和烤雞，隨著她奔去。或許他還叫了她的名字，但他無論如何記不清了。","他只記得那條細如髮絲的紅色光線。只記得他薄薄的鞋底下燒焦的混凝土。","她的白色運動鞋在閃動，已經快到牆壁旁。那一道激光又穿過他的眼睛，隨著他的奔跑不斷閃動。","有人絆了他一腳，他撲倒在混凝土上，磨破了手掌。","他翻身便是一腳，腦子裡一片混亂。他上面有一個瘦瘦的男孩，豎起的金髮上一片彩色光暈。舞台上有一個人轉過身來，朝著歡呼的人群高舉起手中的刀。那男孩微微一笑，從袖中取出一樣東西。那是一把漫著紅色的刀片。紅色細線第三次從他們面前閃過，刺入黑暗之中。凱斯眼看著那刀片如同一支魔杖，朝自己的喉嚨落下。","那張臉隨即消失在一片炸開的雲霧之中。那是莫利的箭槍，每秒二十發的射速。那男孩抽搐著咳了一聲，倒在凱斯腿上。","他朝著小攤走過去，走進暗影之中。他低下頭，以為會看見那條紅色細針從自己胸口穿出。但是沒有。他找到了她。她倒在混凝土柱子腳下，雙目緊閉。空氣中有烤肉的味道。人群在歡呼著勝利者的名字。賣啤酒的人拿深色抹布擦拭他的酒罐龍頭。一隻白色運動鞋落在她的頭旁邊。","他沿著牆根走下去。沿著那條混凝土的曲線走下去。雙手插在兜里，一直一直走下去。人們對他視而不見，所有的眼睛都望著勝利者的影像。有火柴一閃，一張歐洲人的臉在火光中跳動，臉上有一道刀疤，叼著一隻短短的金屬煙斗，雙唇緊抿。有一股水煙的味道。凱斯繼續向前走，全無感覺。","「凱斯。」她的反光眼鏡從更陰暗的地方冒出來。「你還好嗎？」","她身後的暗影里有哀鳴聲，有碎裂聲。","他搖搖頭。","「搏擊結束了，凱斯。該回家了。」","他想要走過她身旁，走進那片暗影，看看是什麼在死去。她伸手按住他的胸膛，讓他停步。「是你那鐵哥們的朋友。替你殺了你的妞。你在這城裡交的朋友不怎麼樣，是不是？我們查你背景的時候，也看到了那老混蛋的一些資料。他為了幾塊錢可以做掉任何人。剛才那人說，她兜售你隨機存取存儲器時，他們就盯上了她。殺掉她，拿隨機存取存儲器就能少點開銷。為了省點小錢……我讓那個拿激光槍的全說出來了。雖然我們碰上這事兒只是巧合，我還是得確保沒問題。」她的嘴唇緊緊抿成一條細線。","凱斯感覺腦子裡一團糨糊。「誰？」他說，「誰派他們來的？」","她遞給他一包腌生薑，上面灑滿鮮血。他看見她手上黏稠的血液。在那暗影中，有人在呻|吟，死去。","在診所做完術后檢查，莫利帶他去了港口，阿米塔奇已經在等待。他包了一艘氣墊船。千葉城在凱斯眼裡留下的最後印象，是那片深色的生態建築。一片霧氣升起，遮蓋住黑色的海水和海面上漂浮的垃圾。"]},{"title":"第二部 購物之旅 03","paragraphs":["家。","家就是波亞，是斯普羅爾，是波士頓亞特蘭大都市軸心。","若是畫一張數據交換頻率地圖，巨大屏幕上的一個像素代表一千兆位元組，曼哈頓和亞特蘭大會亮成一片純白，隨後開始閃爍，數據交換速度隨時會超出這個模擬程序的負載，這張地圖即將如超新星一般爆發。要降低亮度，加大比例尺。每個像素一百萬兆位元組。要到每秒一億兆位元組后，才能分辨出曼哈頓中城的一些街區，和亞特蘭大老城中心周圍上百年的工業園區輪廓。","凱斯從夢中醒來。夢裡全是機場，全是面前莫利的黑色皮衣，一路走過日本成田機場，荷蘭史基普機場，法國奧利機場……他看著自己在天亮前一個鐘頭，從某個售貨亭買了瓶扁塑料瓶裝的丹麥伏特加。","在斯普羅爾鋼筋混凝土的根基底下，有一列火車頂著陳腐的空氣在隧道中前進。火車悄無聲息地滑過磁懸浮軌道，推動著空氣在隧道中鳴唱，頻率從低音一直衰減到次聲波。他躺在房間里，震動傳過來，乾燥的拼木地板縫隙中，塵土飛揚起來。","他睜開眼，看見莫利一|絲|不|掛地躺在嶄新的粉色記憶棉床墊另一邊。陽光從煙灰熏染過的格柵天窗里透下來。天窗中間有半平米的玻璃被換成了硬板，粗大的灰色電纜從上面垂到離地幾厘米的地方。他側身躺著，注視著她的呼吸，她的胸脯，她的腰線如戰鬥機一般強韌而光滑，勻稱身軀上的肌肉如舞者一般，全無一絲贅肉。","房間很寬闊。他坐起身來。除了寬大的粉色床墊和床墊旁兩隻一模一樣的嶄新尼龍包，房間里空無一物。四壁空空，也沒有窗戶，只有一扇漆成白色的鋼鑄防火門，牆上刷了一層又一層白色乳膠漆。這是間廠房。他認識這樣的房間和這樣的建築；這裏的住戶介於藝術家和罪犯之間。","他到家了。","他把腳放到地板上。木頭地磚有的已經掉落，剩下的也已鬆脫。他的頭在痛。他記起阿姆斯特丹的另一個房間，在老城區數百年的舊房子裏面。莫利從運河邊帶了橙汁和雞蛋回來。阿米塔奇執行秘密任務去了，他們倆單獨走過廣場，來到達姆拉克大街上一間她熟識的酒吧。而巴黎已是模糊的夢境。購物。她帶他購物去了。","腳邊嶄新的黑牛仔褲已經皺皺巴巴，他站起來穿上牛仔褲，跪在尼龍包旁邊。他先打開了莫利的包，裏面有整齊的衣服和一堆貌似很昂貴的小玩意兒。另一隻尼龍包里塞滿東西：書，磁帶，一隻模擬感受操作台，掛著法國和義大利商標的衣服。他都不記得自己買過這些。他在一件綠色T恤下面看見了一隻扁平的包裹，用回收紙包得很精緻。","他拿起包裹，包裝紙破開了，一隻閃亮的九角星落下來，直扎進木板地面。","「這是紀念品，」莫利說，「我發現你老是盯著這東西看。」他轉過身，看見她盤腿坐在床上，睡意盎然地用酒紅色指甲撓著肚子。","「等下會有人來給這個地方做加密設施。」阿米塔奇站在敞開的門外，手中拿著一把古老的磁性鑰匙。莫利從包里取出一隻小小的德國爐子，正在煮咖啡。","「這事我就能幹，」她說，「我的工具綽綽有餘。紅外掃描儀，嘯叫器……」","「不，」他邊關門邊說，「我要這裏絕對保險。」","「隨你便。」她的深色網眼T恤扎在寬鬆的黑色棉布褲里。","「你當過兵嗎，阿米塔奇先生？」凱斯坐在那裡，背靠著一堵牆問。","阿米塔奇身高和凱斯相當，但他的寬肩加上挺拔的站姿好像把門全堵上了。他穿著一身深色的義大利西裝，右手拎著一隻黑色軟牛皮公文包，特種部隊的耳環已經不見了。他五官英俊，面無表情，是美容院里常見的一款，將十幾年前電視里最常見的面部特徵保守地組合在一起，配上淺色的眼睛，更像是一張面具。凱斯有點後悔自己的問題。","「我的意思是，很多軍人最後都做了警察或是公司保安。」凱斯不安地接下去。莫利遞給他一杯滾燙的咖啡。「你讓人對我胰臟動了手腳，像是警察常用的套路。」","阿米塔奇關上門，穿過房間，站到凱斯面前。「凱斯，你是個幸運的孩子。你應該感謝我。」","「是嗎？」凱斯呼嚕呼嚕吹著咖啡。","「你本來就需要一對新胰臟。我們給你買的那副可以讓你免受藥物依賴性之苦。」","「多謝，但是我喜歡有依賴性。」","「很好，因為你又有了種新的依賴性。」","「為什麼？」凱斯抬起頭。阿米塔奇微笑起來。","「你體內有十五個毒素袋，分佈在各大動脈內壁上。袋子在不斷溶解，很慢，但還是在溶解。每一個袋子里都有一顆真菌毒素。你對它的效力並不陌生。就是你前老闆在孟菲斯對你用的那種。」","凱斯對著那張微笑的面具眨了眨眼。","「凱斯，你的時間足夠完成我要你做的事，但僅止於此。完成任務后，我會給你注射一種酶，讓袋子在不破裂的情況下脫落，然後給你換一次血。若非如此，那些袋子就會徹底溶化，你會和剛遇到我們的時候一樣。所以，凱斯，你需要我們。你對我們的需要，和我們從貧民窟里把你撈出來那時候比，一點也沒變少。」","凱斯抬頭看看莫利。她聳聳肩。","「去把貨運電梯里的箱子搬上來。」阿米塔奇將那把磁性鑰匙遞給他。「去吧。你會開心的，凱斯。就像在聖誕節的早晨。」","夏天的斯普羅爾，商場里人潮洶湧，如風吹草動。那片肉身的流水裡偶有購物需求激起的漩渦，又在滿足后流去。","他與莫利並排坐在乾涸的混凝土噴泉池邊，無窮無盡的一張張臉龐在細碎的陽光里從他面前流過，如同他的生命重演。先是一個眼窩深陷的小孩，一個手垂在身側隨時準備動手的街頭男孩，然後是一個少年，紅色眼鏡下的面容平靜而神秘。凱斯記起十七歲的時候，在玫瑰色晚霞籠罩之下，那場安靜的屋頂上的搏鬥。","他挪動身子，感覺到黑色薄牛仔褲下面的混凝土粗糙而涼爽。仁清街的刺|激已經消逝，這裡有不一樣的環境，不一樣的節奏，這裏瀰漫著快餐、香水和新鮮汗水的味道。","而他的網路操控台，那隻小野-仙台「網路空間7號」還在那間廠房裡等著他。他們離開時房間里散落著幾何形狀的白色泡沫塑料，揉皺的塑料膜和數百隻小泡沫粒。阿米塔奇讓凱斯過目了幾樣東西：一隻小野-仙台，一架明年上市的最昂貴的保坂電腦，一台索尼顯示器，十幾張企業級別的冰光碟，一架博朗牌咖啡機。凱斯點頭后他便離開了。","「他去哪裡了？」凱斯曾經問過莫利。","「他喜歡酒店。大酒店。最好盡量靠近機場。我們逛街去吧。」她穿上一件有十幾個奇形怪狀口袋的舊工裝背心，拉上拉鏈，又戴上一副巨大的黑色塑料太陽鏡，完全遮住了她植入的反光鏡片。","「你以前就知道毒素這爛事？」他在噴泉旁問她。她搖搖頭。「你覺得是真的嗎？」","「也許是，也許不是。怎樣都有用的。」","「你有辦法找出真相嗎？」","「沒有，」她說，舉起右手擺擺，讓他噤聲，「那鬼東西太小，掃描不出來。」她再次搖搖手指，讓他別急。「況且你反正也沒多在乎。我看見你愛撫那仙台操控台，老兄，那簡直是色情。」她笑起來。","「那他對你使了什麼手段？他怎麼讓打工女郎就範？」","「職業榮譽感，寶貝，僅此而已。」又一個噤聲的手勢。「我們去吃早飯，好嗎？吃雞蛋，吃真正的培根。可能會吃死你，因為你在千葉城吃那種再造磷蝦食品已經太久了。沒錯，來，咱們坐地鐵進曼哈頓，吃頓真正的早餐。」","玻璃管上，死氣沉沉的霓虹燈拼出大大的「都市全息」，上面落滿塵灰。凱斯剔著門牙中間卡住的一絲培根。他已經不再問她去哪裡和為什麼；她每次都只是戳戳他的胸膛，或做個噤聲的手勢。她一路給他講當季流行風向，講體育新聞，講一出他聞所未聞的加州政治醜聞。","他環顧著這條荒涼的死胡同，一片報紙從路口滾過去。大概因為那些穹頂建築的重疊和空氣對流，東區的風總是這麼詭異。凱斯透過窗戶，凝視著那塊死氣沉沉的招牌。這是她的斯普羅爾，不是他的斯普羅爾，他想。她帶他去了十幾家前所未見的酒吧和俱樂部，通常點點頭就能搞定生意。她在維護自己的交際網。","「都市全息」招牌後面的陰影中，有什麼東西在動。","那扇門是瓦楞板做的。莫利在門口飛快地做了一連串手勢，他只看出了一個大拇指掃過食指尖的動作，那是「現金」的意思。門朝里打開，她帶著他走進去，裏面一股塵土味。兩邊都是亂七八糟的廢品，一直堆到牆邊，靠牆的書架上放著皺皺巴巴的簡裝書。廢品堆像是金屬和塑料扭結而成的真菌，從地里長出來，有時能從中分辨出些零散物件，但很快又變得模糊：一台插滿斷頭真空管的破舊電視機內膽；一塊破碎的衛星天線；一隻塞滿鏽蝕合金管的棕色纖維罐子。大堆過期雜誌一直散落到他們面前，封面上是舊年夏日里的肉體，茫然注視著天空。他跟著她穿過眾多廢品之間一條窄窄的通道，聽見身後門關上的聲音。他沒有回頭。","通道盡頭的門上掛著一條陳舊的軍用毯，莫利從毯子下面鑽過去，一片白光撲面而來。","四下是空蕩蕩的白色塑料牆壁和天花板，地上鋪著醫院專用的白色防滑地磚。房間正中擺著一張正正方方的白漆木桌，放著四把白色摺疊椅。","在他們身後，一個男人站在門口沖他們眨眼，門帘搭在他肩頭，好似一件斗篷。他整個人好像從風洞里撈出來的，小耳朵緊貼狹長的腦袋，似笑非笑地露出嚴重內勾的大門牙。他穿著一件粗呢舊夾克，左手拿著把手槍，朝凱斯指指門邊的一塊白色塑料板。那是塊近一厘米厚的緻密電路板，他幫著那人抬起板子堵住門，那十隻焦黃的手指靈巧地飛舞，扣上板子邊上的白色搭扣。一台排風扇不知在哪裡嗡嗡作響。","「計時，」那人站直身子說，「開始了。莫，你知道價錢。」","「芬蘭人，我們需要做掃描。植入體掃描。」","「站到那兩個架子中間。站在膠帶上面。站直，對了。轉身，三百六十度。」凱斯看著她在兩隻搖搖欲墜的架子中間轉動，架子上插滿感應器。那人從口袋裡掏出一隻小顯示器，斜眼看了看。「沒錯，你腦袋裡有新貨。是硅製品，外包熱解碳。是個時鐘吧？你的眼鏡讀數和以前一樣，是低溫各向同性碳。生物兼容性沒有熱解碳好，不過這是你的事，對吧？你的爪子讀數也沒變。」","「凱斯，過來。」他看見白色地板上那個已經磨花了的黑色X字樣。「轉身。慢一點。」","「這老兄是處|子之身。」那人聳聳肩。「也就補過牙，還是便宜貨色。」","「你能讀出生物製品嗎？」莫利拉開綠色馬甲的拉鏈，又摘下大黑墨鏡。","「你當這裡是梅奧醫院啊？孩子，爬上桌子來，咱們做點活檢。」他笑起來，露出大片黃牙。「沒有。甜心，芬蘭人打包票，你身上沒小蟲子，也沒腦皮層炸彈。要退出屏蔽嗎？」","「芬蘭人，你趕緊出去。然後給我們全面屏蔽，時間我們定。」","「嘿，莫，芬蘭人是無所謂，反正你按秒付費。」","芬蘭人離開后，他們封上門，莫利把一張白色椅子轉過來坐下，雙臂搭著椅背，下巴擱在胳膊上。「現在我們可以談了。這是我負擔得起的最私密的地方。」","「談什麼？」","「談我們在做的事。」","「我們在做什麼事？」","「替阿米塔奇幹活。」","「你說這不是為了他？」","「沒錯。凱斯，我看過你的檔案。也看過一眼我們的購物清單。你跟死人一起干過嗎？」","「沒有。」他看著自己在她反光眼鏡片上的倒影。「我猜也行。我專業水平不錯。」他用現在時態說這句話，略覺不安。","「你知道南方人『平線』已經死了吧？」","他點點頭。「聽說是心臟死亡。」","「你將要和他的思想盒一起工作。」她微笑，「他和奇尼是你師傅，對吧？對了，我認識奇尼。絕對是個爛人。」","「麥可伊・泡利被意識複製了？誰乾的？」凱斯坐下來，胳膊放在桌上。「難以想象。他不可能如此任人擺布。」","「感網公司。拿屁股想也知道，他們付了他天價。」","「奇尼也死了？」","「沒那麼運氣。他在歐洲，不摻和這事。」","「嗯，如果能搞到『平線』，我們就絕對不愁了。他是最頂尖的。你知道他腦死過三次吧？」","她點點頭。","「腦電圖完全平線。他給我看過帶子。『孩子，我真的屎了。』」","「凱斯，從一開始我就想搞清楚阿米塔奇的後台，但好像不是財團，不是政府，也不是黑幫。有什麼東西會給阿米塔奇下指令，比如叫他去千葉城撈個一心求死的癮君子，給他做手術治病。這筆交易用到的那個手術程序，在市面上的價錢至少能雇上二十個世界一流的網路牛仔。你挺厲害，但沒厲害到這程度……」她撓撓鼻翼。","「顯然有人認為有必要，」他說，「還是個大人物。」","「我可別傷害了你的小心靈。」她笑起來。「凱斯，要拿到『平線』的思想盒，咱們得搞一次超高難度行動。感網公司把它鎖在上城一間地下陳列室里。防衛得連一絲頭髮都飄不進去。其實，感網公司今秋要發布的新材料也全鎖在那裡邊，偷出來我們他媽的就發大財了。可是我們他媽的不，就要偷『平線』，別的都不要。詭異。」","「沒錯，這一切都很詭異。你很詭異，這窟窿很詭異，外邊那個詭異的小地鼠又是誰？」","「芬蘭人是我老相識。主要收贓貨。軟體。私密房間出租只是他的副業。不過我讓阿米塔奇雇了他當技|師，你下次看到他就當從來沒見過。明白？」","「阿米塔奇在你身上放了什麼毒？」","「搞定我很容易。人有長處，就成了職業，對吧？所以你得上網，我得打架。」","他瞪住她。「告訴我你知道多少阿米塔奇的事。」","「簡單開個頭，我查過了，哭拳行動里從來沒有個叫阿米塔奇的人。不過這不代表什麼。逃出來的所有人照片都和他不一樣。」她聳聳肩。「那又怎樣。我也就能開個頭。」她拿指甲敲敲椅背。「但你卻是個牛仔，對不對？我是說，也許你可以查查看。」她微笑起來。","「他會殺了我。」","「也許會，也許不會。凱斯，我覺得他需要你，非常需要。再說了，你是個聰明人，對不？你能搞定他，鐵定的。」","「你說的那張單子上還有什麼？」","「基本都是給你的玩具。還有個貨真價實的精神病人，叫彼得・里維拉。討厭死了。」","「他在哪？」","「不知道。但他絕對是個死變態，不騙你。我看過他的檔案。」她做了個鬼臉，「可怕死了。」她站起來，伸了個貓一樣的懶腰。「孩子，這下咱倆算一夥的了吧？咱一起干，是合作夥伴吧？」","凱斯看看她。「我還有的選么？」","她大笑。「你挺明白的，牛仔。」","「網路源自古老的電子遊戲，」畫外音說道，「源自早期的圖形程序和軍方試驗的顱骨接入口。」索尼顯示器上空間戰的二維畫面漸漸消失，生長出一片數學函數生成的蕨類植物，展示對數螺旋的各種三維形態；藍色調的軍方錄像片段閃過，有被接入測試系統的實驗動物，還有接入坦克和戰機火力控制迴路的頭盔。「賽博空間。每天都在共同感受這個幻覺空間的合法操作者遍及全球，包括正在學習數學概念的兒童……它是人類系統全部電腦數據抽象集合之後產生的圖形表現。有著人類無法想象的複雜度。它是排列在無限思維空間中的光線，是密集叢生的數據。如同萬家燈火，正在退卻……」","「那是什麼？」他按下頻道選擇鍵，莫利問。","「兒童節目。」選擇鍵不斷循環，圖像片段洶湧而出。「關上。」他對保坂電腦說。","「凱斯，你想現在試試嗎？」","周三。離他在廉價酒店裡醒來，看到身邊的莫利那一刻已經八天了。「你要我出去嗎，凱斯？也許沒有人干擾會比較輕鬆……」他搖搖頭。","「不用。留下來吧，沒關係的。」他小心地將黑毛巾頭帶套在額頭上，避免觸碰仙台操控台那扁平的皮膚電極。他注視著膝上的操控台，看見的卻是仁清街上的櫥窗，是那枚銀色飛鏢上閃耀的霓虹光影。他抬起頭，索尼顯示器後面的牆上是她送的那件禮物，掛在一枚黃色大頭釘上。","他閉上眼睛。","摸到開關。","在眼睛後面那片血色黑暗之中，銀色視像從視界邊緣滾滾流入，好像隨機圖像拼成的電影，晃得人頭暈。那些符號、圖形、臉龐，那些視覺信息模糊拼湊成一片壇城。","他祈禱著：來——","一隻灰色的圓盤，那是千葉城天空的顏色。","來——","圓盤開始旋轉，越來越快，變成一隻淡灰色的圓球。越變越大——","開始為他流淌，為他綻放，那水一般的霓虹如同繁複的日本摺紙，現出他那觸手可及的家園，他的祖國，像一張透明的三維棋盤，一直伸到無窮遠處。那隻內在的眼睜開了，他看見三菱美國銀行的綠色方塊，後面東部沿海核裂變管理局耀眼的猩紅色金字塔，還有軍隊系統的螺旋長臂，在他永不能企及的更高更遠處。","他的笑聲從某處傳來，那是在一間白色的廠房裡，他那遙遠的手指撫摩著操控台，淚水噴涌而出，滑過他的臉龐。","他取下電極，莫利已經不見了，房間里漆黑一片。他看看時間。他在網路空間里呆了五個小時。他把小野-仙台放在一張嶄新的工作台上，癱倒在床墊上，用莫利的黑絲睡袋蓋住腦袋。","粘在防火鋼門上的安保系統嗶嗶叫了兩聲。「收到進入請求，」系統說，「對象通過程序掃描。」","「那就開門。」門打開了，凱斯把絲睡袋從臉上拽下來，坐起身，滿以為會看見莫利或阿米塔奇。","「天哪，」有個粗嗓子說，「我知道那婆娘在黑暗中也能看見……」一個矮胖的身影走進來，關上門。「打開燈，好吧？」凱斯從床墊上爬下來，找到了電燈開關。","「我就是芬蘭人。」芬蘭人朝凱斯使了個眼色說。","「我叫凱斯。」","「認識你很高興，非常高興。我吧，大概是來幫你老闆弄點硬體的。」芬蘭人從口袋裡掏出包帕塔加斯雪茄，點起一根，古巴煙草的味道瀰漫開來。他走到工作台邊，掃視了小野-仙台一眼。「標準版吧，一會來搞它。不過這才是你要的東西，孩子。」他從夾克里掏出一隻齷齪的牛皮紙信封，拍拍灰，從裏面摸出一隻毫不起眼的黑方塊。「牛逼哄哄的工廠原型，」他說著把那東西扔在桌子上，「用聚合碳澆鑄，就算用激光侵入也會把線路燒壞。防X射線等等鬼知道什麼玩意兒。咱能用，但壞人就沒的搞，對吧？」他細心將信封疊起來，塞進衣服內袋裡。","「這是什麼？」","「基本上，這是個觸發開關。如果把這個接到你的仙台上，你不用退出網路就能進行感官同步，別人當時或曾經感受到什麼，你就能感受到什麼。」","「幹嗎用？」","「我也不知道，只知道要給莫裝個廣播裝置，所以你要接收的大概就是她的感覺神經中樞。」芬蘭人撓撓下巴。「所以，你會發現自己的牛仔褲到底有多緊了哈。」"]},{"title":"第二部 購物之旅 04","paragraphs":["凱斯坐在廠房裡，前額上的帶子里包著皮膚電極，望著頭頂隔柵里透下來的稀疏陽光，裏面飛舞的塵埃。顯示器一角在倒計時。","牛仔不需要虛擬體驗，他想，因為那只是肉身的玩具。他知道自己的電極和虛擬體驗機的塑料頭環本質上沒區別，也知道網路空間其實是超級簡化版的人類感覺神經中樞，至少看起來是這樣，但仍覺得虛擬體驗只是放大肉體感受，毫無意義。而且市面上賣的虛擬體驗都經過編輯，塔麗・伊姍若是頭痛起來，你也感覺不到。","顯示器嗶嗶作響，兩秒倒數提示。","那個新開關用一條細細的光纖接到了他的仙台上。","一，二，……","網路空間從那些基點展開。很順滑，他想，但還不夠。還需要再提高……","他打開了那個新開關。","他驀然落入另一具肉體之中。網路消失了，一波聲音與色彩襲來……她正穿行於一條擁擠的街道，路邊的減價軟體攤上用塑料片寫著價錢，無數擴音器里傳出不同的音樂片段。尿味，浮塵味，香水味，烤蝦餅味。有那麼幾秒鐘，他驚惶地想控制她的身體，卻毫無作用。他迫使自己接受這種被動感，在她眼睛後面做一個乘客。","她的眼鏡似乎完全沒有消減陽光，不知道植入的放大器是否進行了自動補償。左眼視野下方有藍色的字元閃爍，顯示時間。真是招搖，他想。","她的肢體語言錯亂，行動風格也很怪異，分分鐘都像要撞到人，可那些人卻總會在她面前融化，閃開，給她留出空間。","「你好嗎，凱斯？」他聽到，也感覺到她在說話。她把一隻手伸進夾克里，用指尖環繞住溫暖絲衣里的乳|頭。那種感覺讓他屏住呼吸。她笑起來。但他們之間的連接是單向的，他無法應答。","兩個街區后，她穿梭在「內存巷」的邊緣。凱斯一直想讓她的眼睛去看那些他熟識的路標，這種被動感讓他開始煩躁。","他按下開關，瞬間切換到網路空間。他穿過紐約公共圖書館原始的冰牆，不由自主地點數這裏的漏洞。隨後又切換回她的感覺中樞，回到肌肉的搖曳之中，回到清晰而明亮的感受之中。","他發現自己在想著她，那個將感受分享給他的人。他對她有多少了解呢？他知道她也是職業人士；知道她和他一樣，以自己的謀生方式存在於世。他知道她醒來時在他身上運動的模樣，知道他進入她身體時兩人的呻|吟，知道她事後喜歡喝黑咖啡……","她的目的地是「內存巷」邊那些怪異的軟體出租商場之一。那裡一片寂靜，毫無聲息。中央大廳周圍環繞著鋪面，年輕的顧客們大概不過十幾歲，左耳後似乎都植入了碳介面，但她的注意力不在他們身上。櫃檯上陳列著數百條細長的彩色微軟硅條，包裝在白紙板上的透明橢圓泡泡里。莫利走向南牆下的第七間店面。櫃檯里的光頭男孩雙眼無神，耳後的介面中伸出十幾根硅條。","「拉瑞，在嗎？」她站到他面前。男孩的眼睛開始聚焦。他坐起身來，用骯髒的指甲從介面中拔出一根亮紅色的硅條。","「嗨，拉瑞。」","「莫利。」他點點頭。","「我有個活給你的朋友，拉瑞。」","拉瑞從紅色運動衫的口袋裡掏出一隻扁平塑料盒打開，裏面已經有十幾根硅條。他把手上的硅條也小心放進槽中，猶豫了一下，選了一條較長的亮黑色晶元，麻利地插入腦中。他眯起眼。","「莫利帶了人，」他說，「拉瑞不喜歡。」","「嘿，」她說，「我不知道你這麼……敏銳。厲害。得花好多錢才能這麼敏銳。」","「我認識你嗎，女士？」他臉上又出現了那種空白的表情。「你要買軟體？」","「我要找現代黑豹。」","「莫利，你帶了人。它告訴我了。」他拍拍黑色晶元。「還有別人在用你的眼睛看東西。」","「那是我的合作夥伴。」","「讓你合作夥伴離開。」","「拉瑞，我有活給現代黑豹。」","「女士，你說什麼？」","「凱斯，下線吧。」她說，他碰了碰開關，瞬間又回到網路之中。在平靜的網路空間中，軟體商場的影像還留存了幾秒鐘。","「現代黑豹，」他取下電極，對著保坂電腦說，「五分鐘簡述。」","「已準備好。」電腦說。","他沒聽過這名字。這是新事物，是他去千葉城之後才出現的。斯普羅爾年輕人里的潮流一向是以光速蔓延，整個亞文化可以在一夜之間興起，經歷兩周的繁榮，隨後徹底消亡。「開始。」他說。保坂電腦已經查遍了能查的圖書館、雜誌和新聞。","簡述從一張彩色照片開始。一張男孩的臉，深色眼睛，人工雙眼皮，蒼白削瘦的臉頰上爆出眾多粉刺，好像被人剪下來，貼在了一面牆的背景上。畫面凍結了許久才開始動，男孩的動作帶著種優雅的邪惡，好似扮演捕獵者的啞劇演員。他穿著緊身的連體衣，上面的抽象圖案酷似背後的磚牆，身體幾乎難以分辨。仿生聚合碳。","鏡頭切換到紐約大學社會學系的弗吉尼亞・蘭巴利博士，屏幕上閃現出粉紅色的字元，是她的名字、系別和學院。","「他們嗜好隨機的超現實暴力行為，」一個聲音說，「觀眾們可能難以理解，您為何堅持說這種現象不屬於恐怖主義？」","蘭巴利博士微笑起來。「恐怖主義者總會在某個時間點停止對傳媒完形的操縱。這個時候暴力很可能已經升級，但從此往後，恐怖主義者便成為傳媒完形的一部分。我們通常所理解的恐怖主義與傳媒有著天然的聯繫。現代黑豹與其他恐怖主義者的區別恰恰就在他們的高度自我認知，他們能夠覺悟到恐怖主義行為與其最初的社會政治意圖被媒體高度分離……」","「跳過。」凱斯說。","看過這段簡介兩天後，凱斯初次見到了一位現代黑豹。他覺得現代黑豹就是他十幾歲時盛行的「大科學家」組織的當代版。斯普羅爾內隱藏著一種少年DNA，將眾多短暫存在的小眾異端規則編碼流傳下去，並在詭異的時刻再複製出來。現代黑豹是「大科學家」的硅條版。如果當年有這種技術，「大科學家」們也都會有頭部介面，裏面塞滿硅條。風格最重要，而他們的風格是一致的。黑豹們是雇傭兵，愛惡作劇，是虛無主義的技術狂熱者。","出現在房間門口的是個叫安傑羅的男孩，帶來芬蘭人的一盒碟片，說話細聲細氣。他的臉是一整塊移植皮，用膠原蛋白和鯊魚軟骨多聚糖生成，光滑而醜陋，在凱斯所見過的自選手術成果中，算是最噁心的之一。安傑羅笑起來，露出某種大型動物的銳利犬齒，凱斯反倒鬆了口氣。牙蕾移植。這個他見過。","「你不能讓這些小蠢貨擠到代溝那邊去了。」莫利說。凱斯點點頭，全神貫注于感網公司的冰牆模式。","這才是他。是他的意義，他的自我，他的存在。他忘了吃飯，雖然莫利把米飯和壽司盒子留在了長桌一角。他不願意去上廁所，哪怕化學馬桶就在房間角落，離操作台只有幾步。他試探可能的缺口，繞過明顯的陷阱，畫出穿過感網公司冰牆所需採用的路線，屏幕上的冰牆反覆成形。這是堵優秀的冰牆。絕妙的冰牆。他躺在那裡，胳膊枕在莫利肩膀下面，透過天窗的鋼柵注視著紅色晨曦，冰牆的模式仍在燃燒。他醒來看見的第一樣東西，就是它那彩虹般的像素迷宮。他連衣服都懶得穿，爬起來便接入網路。他在高速運轉，在工作，完全忘記了時間。","有時候，尤其是莫利帶著黑豹兵團出去偵查的時候，千葉城的影像會在夢裡再次洶湧而來，他會看到那些臉龐，看到仁清街上的霓虹。曾經夢見琳達・李，他帶著困惑醒來，想不起她是誰，對他曾經有什麼意義。終於想起來這一切以後，他接入網路，連續工作了九個小時。","侵入感網公司的冰牆一共花了九天時間。","凱斯給阿米塔奇看行動計劃。「我說過一周時間，」阿米塔奇嘴裏這麼說，卻掩飾不住滿意之情，「你倒花了這麼久。」","「少來，」凱斯笑眯眯地看著顯示屏，「這活幹得漂亮，阿米塔奇。」","「沒錯，」阿米塔奇承認，「但別被沖昏了頭。和你的終極敵手相比，這隻是遊戲廳里的玩具。」","「愛你，貓媽媽。」現代黑豹的聯繫人低聲說。在凱斯的耳機里，他的聲音只是調製過的靜電聲。「亞特蘭大，布魯德。可以行動。行動，聽到了嗎？」莫利的聲音稍微清晰一些。","「唯命是從。」黑豹們用新澤西的鐵網天線，把聯繫人發出的擾頻后信號發到曼哈頓上空，地球同步軌道上的一隻「基督王之子」衛星上。他們把整個行動都當成一次繁複的惡作劇，就連通訊衛星的選擇都好像別具深意。轉發莫利信號的是一隻一米直徑的傘狀天線，粘在一座和感網大廈差不多高的黑色玻璃銀行大樓頂上。","亞特蘭大。這個辨識碼很簡單。從亞特蘭大到波士頓到芝加哥到丹佛，每五分鐘一個城市。如果有人成功攔截了莫利的信號，解密擾頻，再合成她的聲音，黑豹們會通過辨識碼發現問題。而若是超過二十分鐘，她就幾乎不可能再從那座大樓里出來。","凱斯穿著黑色T恤，喝下最後一口咖啡，放好電極，撓了撓胸脯。現代黑豹們要如何引開感網公司的保安人員他只是略知一二。他的工 看，兒童的玩具計算器是幾條基本命令上的無窮溝壑，無盡空虛。凱斯輸入一段序列，是芬蘭人從一個毒癮極大的中層員工手裡買來的。隨後他便從那些圓球中間滑過，如同在隱形軌道上滑行。","這裏。就是它。","他闖進這枚圓球中，頭頂上是冰涼的藍色霓虹穹頂，沒有一顆星星，平滑得如同霜凍過的玻璃。他啟動一個子程序，開始修改核心管理命令。","該出來了。病毒平穩倒退，重新封上洞口的編碼層。","大功告成。","在感網公司大堂內，兩個現代黑豹人坐在一隻低矮的方形花盆後面，警惕地用錄像機拍下混亂現場。他們都穿著變色龍外衣。「作戰部隊正在噴洒泡沫路障。」一個人對著喉麥說，「快速反應部隊還在試圖讓直升機落地。」","凱斯剛切換到虛擬體驗中，立時便是一陣骨折的劇痛。莫利被按在一道長走廊的灰牆上，呼吸粗重不均。凱斯瞬時已回到網路，左邊大腿上熾熱的痛楚慢慢消失。","「布魯德，發生了什麼事？」他問聯繫人。","「切割手，我不知道。媽媽沒說話。等等。」","凱斯的程序在轉圈，外形不斷變換。他剛修好的破洞中央伸出一條明亮的深紅色細絲，向他的破冰程序而來。他沒有時間可以等。他再次切換。","莫利靠牆支撐起自己的身體，朝前走了一步。凱斯在房間里呻|吟了一聲。莫利又邁出一步，跨過一隻手臂，那制服的袖子上有鮮血閃耀。他瞥見一片破碎的玻璃纖維，她似乎已只剩下隧道視野。她邁出第三步，凱斯尖叫起來，發現自己已回到網路之中。","「布魯德？波士頓，寶貝……」她的聲音滿含痛楚。她咳了幾聲。「跟本地人出了點小問題。我想有個人弄斷了我的腿。」","「貓媽媽，你現在需要什麼？」聯繫人的聲音淹沒在靜電中，幾難分辨。","凱斯強迫自己切換回去。她靠在牆上，用右腿支撐住全身的重量，在外衣胸前的口袋裡掏摸了一陣，取出一張塑料紙，上面有五顏六色的止痛貼。她選出三張，用力按在左手腕的靜脈上。六千毫克的內啡肽類藥物如同一把鐵鎚，將她的疼痛感重重擊碎。她不由自主地弓起腰。粉紅色的暖意從大腿漫上來，她嘆息一聲，慢慢放鬆。","「好了，布魯德。現在好了，但告訴我的人，我出來后需要醫療隊。切割手，我離目標還有兩分鐘。你能堅持嗎？」","「告訴她我已經進來了，正在堅持。」凱斯說。","莫利一瘸一拐地沿著走廊走下去。她回了一次頭，凱斯看見感網公司三個保安扭曲的屍體，其中一個似乎沒有眼睛。","「作戰部隊和快速反應部隊已經封鎖了一樓，貓媽媽。泡沫路障。大廳開始刺|激了。」","「這下面已經很刺|激了，」她一邊說，一邊跳過兩道灰色鋼門，「就快到了，切割手。」","凱斯切回網路，從額頭上取下電極，渾身已經被汗水濕透。他拿毛巾擦了擦額頭，用保坂電腦旁邊的自行車水壺猛喝了一口水，查看了一下屏幕上顯示的陳列室地圖。一個閃動的紅色游標從一道門的輪廓中爬進來，距離南方人「平線」思想盒所在的綠點不過幾毫米之遙。他不知道這樣行走對她的腿好不好。只要有足夠的內啡肽類藥物，她的腿就算變成兩條血樁子也能走路。他繫緊椅子上的尼龍安全帶，再次放上電極。","這已經變成了他的日常生活：放上電極，接入網路，切換感覺。","感網公司的研究陳列室是一個死存儲區；這裏存儲的材料必須被運出陳列室，才可以進行交互操作。莫利在一排排毫無區別的灰色鎖櫃間蹣跚而行。","「告訴她前方五行，左邊第十個，布魯德。」凱斯說。","「前方五行，左邊第十個，貓媽媽。」接頭人說。","她轉向左邊。一個臉色雪白的管理員躲在兩隻柜子中間，雙頰淚濕，雙目無神。莫利沒理她。凱斯不知道黑豹們是如何激發出這樣的恐懼。他太過專註于冰牆，並未聽到莫利的解釋，只知道是個假模假樣的威脅。","「就是這個。」凱斯說，此時她已經停在裝思想盒的柜子前。柜子的輪廓讓凱斯想起千葉城裡，朱利・迪安接待室裏面那些新阿茲特克風格的書架。","「切割手，上。」莫利說。","凱斯切回網路空間，發出一條命令，沿著那條暗紅色細線而去，穿過陳列室的冰牆。五套獨立的警報系統都相信自己還在正常運作。三道複雜的鎖都已經失效，但都認為自己還鎖著。陳列室中央記憶庫的永久記憶有了小小改變：一個月前該思想盒就已奉管理層指令被取走。管理員若查詢該批文，就會發現記錄已被消除。","櫃門悄無聲息地敞開。","「0467839。」凱斯說，莫利從架子上取下一隻黑色儲存盒，模樣像是大號突擊步槍的彈夾，盒子上貼滿警告語和安保級別。","莫利關上櫃門，凱斯切回網路空間。","他將那條線從陳列室的冰牆中收回，彈回程序之中，自動觸發了系統的完全逆轉。他不斷後退，感網公司的重重關卡從身旁閃過，每道門口的駐守的子程序都被卷回破冰程序核心之中。","「已撤出，布魯德。」他說完癱倒在椅子里。聚精會神地完成了真實行動之後，他在接入網路的同時還能感覺到自己的身體。感網公司可能要很多天才會發現思想盒被盜，關鍵的破綻在於洛杉磯發來的傳輸包被引開的時間和黑豹恐怖襲擊的時間太過一致。他不太相信莫利在走廊上遇見的三個警衛還能活下來講述這件事。他再次切換。","電梯沒有動，和莫利離開時一樣，她的黑盒子仍然貼在控制面板上，那個保安仍然蜷曲在地上。凱斯這才發現他脖子上的葯貼，是莫利貼上去的，讓他一直昏迷不醒。她從他身上跨過，取下黑盒子，按下「大堂」鍵。","電梯門輕嘯著打開，人群中一個女人猛地往後跌進電梯，頭撞在壁上。莫利視而不見，彎下腰從保安脖子上取下藥貼，隨後把白褲子和粉色雨衣都踢出電梯外，大墨鏡也扔在後面，拉起外衣的帽子遮住額頭。思想盒放在她衣服面前的口袋裡，行動時會壓住她的胸口。她走出電梯。","凱斯也曾目睹過恐慌場景，但在封閉空間里還是頭一次。","感網公司的僱員從電梯里蜂擁而出，沖向通往街道的門口，等待他們的卻是戰術部隊的泡沫路障和波亞快速反應部隊的沙袋槍。這兩支部隊都深信自己面對的可能是一群殺手，並因此異常合作。破碎的大門外屍體高高堆在路障上，人群在大堂的大理石地面上前後涌動，連綿不絕的槍聲中哀鴻遍野。那種聲音凱斯從未曾聽聞。","顯然，就連莫利都沒有經歷過這樣的場面。「天啊。」她遲疑地說。那種哭聲是因赤|裸裸的極度恐懼而噴發的哀號，大堂地上滿是屍體、衣服、鮮血，還有被人踩踏過的長長的黃色列印紙卷。","「走，姐姐，咱要撤了。」在那兩個黑豹人的眼睛周圍，擬形聚合碳外衣的顏色在瘋狂變換，已經跟不上身後形狀和色彩變化的節奏。「你受傷了？來，湯米扶你走。」湯米把手中的聚合碳外殼攝像機遞給說話的人。","「芝加哥，我在路上。」她話音剛落便倒下了，卻並未撞上大理石地板，而是落入了一口溫暖的深井，落入了寂靜與黑暗之中。","現代黑豹的領袖自稱為盧普斯・彼處|男孩，他的聚合碳外衣有錄製功能，可以隨意重現錄下來的背景。他蹲在凱斯的工作台邊，像個最先進的怪獸噴嘴，眼睛耷拉著看著凱斯和阿米塔奇，微笑起來。粉色頭髮，左耳後面有一大叢彩色硅條在閃爍，經過改造的瞳孔會和貓眼一樣隨光線收縮。凱斯看著他的外衣不斷變換斑斕的色彩和質地。「你沒有控制住場面。」阿米塔奇說。他站在廠房中間，如同一尊雕像，裹著一件看上去價值不菲的黑色亮皮風衣。","「混亂，無名先生，」盧普斯・彼處|男孩說，「是我們的行事風格。是我們的核心力量。你那位女人了解這點。我們是跟她做交易，而不是你，無名先生。」他的外衣上顯示出一種米黃與淡黃交錯的詭異圖案。「她現在需要她的醫療團隊。她和他們在一起。我們會看護好她。一切都沒問題。」他又微笑起來。","「給他錢。」凱斯說。","阿米塔奇瞪了他一眼。「我們還沒拿到貨。」","「在你的女人手裡。」彼處|男孩說。","「給他錢。」","阿米塔奇生硬地走到桌旁，從風衣口袋中拿出厚厚的三卷新日元。「你要數一下嗎？」他問彼處|男孩。","「不用，」現代黑豹說，「你不會剋扣的。你是無名先生，而不是有名字先生，這是有代價的。」","「我希望你不是在威脅我。」阿米塔奇說。","「是做生意。」彼處|男孩一邊說，一邊將錢塞進外衣前面那隻口袋。","電話響了，凱斯接起來。","「是莫利。」他把電話遞給阿米塔奇。","凱斯走出大樓，斯普羅爾的天空已經有了黎明前的灰色。他的四肢冰冷，不聽使喚。他無法入睡，也無法再忍受那間廠房。盧普斯走了，阿米塔奇也走了，莫利不知在何處動手術。一列火車呼嘯而過，腳下的大地隨之震動。遠處傳來警報聲。","他縮在嶄新的皮夾克里，豎起領子，漫無目的地轉悠著。他一支接一支地抽煙。他試圖想象阿米塔奇的毒素袋在自己的血流中溶解，想象他每邁出一步，那肉眼不可見的薄膜就變得更薄一些。這感覺很不真實，如同他透過莫利的眼睛看到的感網公司大樓里的恐懼與痛苦一樣不真實。他發現自己在努力回憶千葉城裡被他殺死的那三個人的模樣。那兩個男人的臉都是一片空白；那女人則好像琳達・李。一輛裝著反光玻璃的破舊三輪卡車從他身邊駛過，車斗里的空塑料筒晃動著哐當作響。","「凱斯。」","他疾奔向路旁，本能地找了一堵牆靠住。","「有你的消息，凱斯。」盧普斯・彼處|男孩的外衣上交替顯示著三原色。「對不起。沒想嚇你。」","凱斯直起身，手揣在夾克口袋裡。他比這黑豹人高出一個頭。「彼處|男孩，你仔細點。」","「消息就是冬寂。」他一個字一個字地念出冬、寂。","「你給的消息？」凱斯向前一步。","「不是，」彼處|男孩說，「是給你的。」","「誰給的？」","「冬寂。」彼處|男孩點著頭又重複了一遍，粉色雞冠頭髮型隨之晃動。他的外衣變成了暗黑色，如同陳舊的混凝土地上面一道碳色的陰影。他揮舞著瘦弱的黑色手臂，做了些奇怪的動作，隨即消失不見。不。他還在那裡。只是套上了帽子，藏起了粉色的頭髮，外衣和人行道一樣是不深不淺的灰色，還有著同樣斑駁的污漬，他的眼睛里反射出路口的紅燈。然後才真正消失了。","凱斯閉上眼，靠在剝落的磚牆上，用麻木的手指揉著眼睛。","相比之下，仁清街的生活實在太簡單了。"]},{"title":"第二部 購物之旅 05","paragraphs":["莫利雇傭的醫療隊在巴爾的摩老城中心一座無名公寓樓里，佔了兩層樓地方。這也是一棟組合式大樓，像是放大版的廉價旅館，只是每個棺材屋都有四十米長。一間屋子門上的繁複標誌寫著「傑拉德・秦，牙醫」，凱斯看著莫利從裏面走出來。一瘸一拐地走出來。","「他說如果我踢到東西，腿就會掉下來。」","「我遇到你一個兄弟，」他說，「一個黑豹人。」","「是嗎？哪個？」","「盧普斯・彼處|男孩。帶來一個消息。」他遞給她一張餐巾紙，他在紙上認真整齊地一筆一劃寫著紅色的「冬寂」字樣。「他說……」她卻舉起手，示意他噤聲。","「去找點螃蟹吃。」她說。","莫利剝螃蟹的手法靈巧得嚇人。在巴爾的摩吃過午飯，他們坐地鐵去紐約。凱斯已經學會了不發問；反正她只會打手勢讓他噤聲。她的腿好像不舒服，一路上幾乎一言不發。","芬蘭人店裡開門的是一個瘦瘦的黑人小孩，髮辮里編著木頭珠子和古董電阻，帶著他們走過那堆廢品中間的狹窄過道。凱斯覺得廢品好像比上次來的時候又增加了；又好像只是產生了某種微妙的變化，在時間的重壓下自然融化，無聲無形的碎片凝結在一起，成為過時科技的結晶，在斯普羅爾眾多的垃圾場中秘密綻放。","在軍用毯後面，芬蘭人已經在白色桌子旁邊等候。莫利開始飛快地做手勢，又拿出一張紙片寫了些字，遞給芬蘭人。他用大拇指和食指捏起紙片，離身體遠遠的，好像紙片會爆炸一樣。他做了個手勢，凱斯並不認得，卻看得出他不耐煩，卻不情不願地同意了。他站起身來，掃掉破粗呢夾克前襟上的碎屑。桌子上放著一玻璃罐的腌鯡魚，旁邊是一包已經撕開的餅和一個堆滿帕塔加斯雪茄煙蒂的錫制煙灰缸。","「等等。」芬蘭人說完走出房間。","莫利坐到他的座位上，伸出食指上的刀刃，戳了一塊灰色鯡魚吃。凱斯漫無目的地在屋裡晃蕩，還摸了摸架子上的掃描儀器。","十分鐘后，芬蘭人匆匆返回，笑眯眯地咧開嘴，露出一口大黃牙。他點點頭，向莫利豎起大拇指，然後示意凱斯和他一起裝上門板。凱斯還在壓平門邊的粘帶，芬蘭人已經從口袋裡掏出一台扁扁的小電腦，敲出一個長長的序列。","「親愛的，」他一邊揣起電腦一邊對莫利說，「你已經搞到了。甭裝了，我都能聞得到。願意告訴我從哪兒搞到的嗎？」","「彼處|男孩，」莫利推開鯡魚和餅乾說，「順便和拉瑞也做了個交易。」","「聰明，」芬蘭人說，「是個人工智慧。」","「講慢點。」凱斯說。","「伯爾尼，」芬蘭人沒理他，繼續說，「伯爾尼。根據瑞士對應於53年法案的條例，它擁有受限制的瑞士公民權。擁有者是泰西爾-埃西普爾。他們擁有主機和初始軟體。」","「在伯爾尼的是什麼？」凱斯特意走到他們兩人中間。","「冬寂是一個人工智慧的辨識碼。我拿到了它的圖靈登記號。人工智慧。」","「這都沒問題，」莫利說，「但對我們有什麼用？」","「如果彼處|男孩沒搞錯，」芬蘭人說，「這個人工智慧是阿米塔奇的幕後主使。」","「我付錢給拉瑞，讓黑豹們稍微追查一下阿米塔奇，」莫利向凱斯解釋，「他們有些詭異的聯絡渠道。我們說好了，只要他們能回答一個問題，就能拿到錢：誰是阿米塔奇的老闆？」","「你覺得是這個人工智慧？這些玩意兒根本沒有自治權。應該是它的母公司，這個特希……」","「泰西爾-埃西普爾，」芬蘭人說，「我還可以給你們講講他們的故事。想聽不？」他坐下來，勾起身子。","「芬蘭人，」莫利說，「他最愛講故事。」","「從來沒跟人講過這個。」芬蘭人開始了他的故事。","芬蘭人乾的是銷贓的營生，主要經營軟體。在生意中有時也會接觸到其他贓貨販子，其中有些人經手的是更傳統的貨物：貴金屬、郵票、罕見硬幣、寶石、珠寶、皮草、畫和其他藝術品。他給凱斯和莫利講的故事，就以另一個人的故事開頭，他管這個人叫史密斯。","史密斯也是銷贓的，風聲不那麼緊的時候也會浮出水面，做藝術品銷售。他是芬蘭人所知的第一個「搞硅」的人——這個詞在凱斯聽來十分老派——他買的硅條里都是藝術歷史程序和畫廊銷售表格。史密斯新安裝的介面里插了六七支硅條，有著極豐富的藝術交易知識，至少在同行中算是翹楚。但史密斯卻來找芬蘭人幫忙，而且訴諸于生意人之間的兄弟情誼。他說，他想查一查泰西爾-埃西普爾家族，而且絕不能讓對方知道調查人是誰。芬蘭人覺得他可以辦到，但必須清楚原因。「我有種感覺，」芬蘭人對凱斯說，「這涉及到大筆錢財。而且史密斯的樣子非常小心，簡直是太過小心了。」","原來史密斯有一個叫作吉米的供貨商。吉米不是個普通盜賊，他剛在地球軌道上待了一年，帶了一些東西回到重力阱里來。吉米在那些島嶼上掃到的貨裏面，最神奇的是一個頭像，一座精密的白金半身像，上面覆著景泰藍，綴著珍珠寶石。史密斯嘆著氣放下便攜顯微鏡，建議吉米把這東西熔化掉。這是當代的東西，不是古董，對收藏家沒有價值。吉米笑起來。這是個電腦終端，他說。它會講話。而且它的發音部件不是語音合成器，而是排布優雅的設備和微小的風琴管。語音合成器已經便宜得等於不花錢，所以，不論是誰造的，這東西都太過巴洛克，太不合常理。它是件奇物。史密斯把頭像接到自己的電腦上，聽著這個非人的悠揚語聲唱出他去年稅表的數目。","史密斯的客戶里有一位東京的億萬富翁，對於自動鍾錶有一種近乎變態的狂熱。史密斯聳聳肩，向吉米攤開手，這個動作和當鋪一樣歷史悠久。他可以試試看，他說，但他懷疑這東西賣不出價錢。","吉米留下那頭像離開后，史密斯對它進行了仔細檢查，在上面發現了一些標記，終於確定這是件罕見的合作產品，製造者包括蘇黎世的兩位工匠，巴黎的一位琺琅技|師，荷蘭的一位珠寶師，以及加利福利亞的一位晶元設計師。他還發現，委託製造者是泰西爾-埃西普爾有限公司。","史密斯開始聯繫那位東京的收藏家，暗示他自己可以搞到一件很重要的東西。","隨後便有一位訪客不聲不響地到來，穿過史密斯繁複的安保迷宮，如入無人之境。小個子，日本人，異常禮貌，有著人工養殖出的忍者殺手的所有特徵。來者坐在光滑的越南紅木桌子那頭，史密斯一動不動地盯住他平靜的，充滿死亡氣息的棕色眼睛。這位克隆殺手解釋說，他負責尋回一件藝術品，這件東西十分優美，卻被人從他主人的房子里拿走了。忍者說，他發現史密斯可能知道這件物品的所在。他的語氣十分溫和，幾乎有些歉意。","史密斯告訴忍者自己不想死，並交出了頭像。來客問：你期待通過出售這件物品獲得多少利潤？史密斯說了一個遠遠低於自己心目中定價的數字。忍者拿出一張信用晶元，將這個數目從一個匿名瑞士賬戶中轉給了史密斯。是誰，來人問，將這件物品帶給你的？史密斯告訴了他。幾天後，史密斯便聽說了吉米的死訊。","「我就是在這時摻和進來的，」芬蘭人接著說，「史密斯知道我和內存巷的人打過很多交道，而做秘密調查就要去那裡。我雇了個牛仔。我作為中間人，也拿了提成。史密斯他非常仔細。他這次生意是非常詭異的經歷，雖然他還撈了一筆，但是這事情不對勁。通過那個瑞士秘密賬戶付款的是誰？黑幫？不可能。他們對這種事情有非常嚴格的規程，而且他們也一定會殺死拿到東西的人。這是恐嚇嗎？史密斯不這麼認為。恐嚇的感覺他能嗅得出。總之，我讓牛仔翻查舊新聞，最後發現了泰西爾-埃西普爾的某件官司。案件本身並不重要，但是我們找到了代理律所，然後牛仔搞定了律師的冰牆，拿到了那個家族的地址。這可給了我們很大幫助。」","凱斯揚起眉毛。","「自由彼岸，」芬蘭人說，「那個紡錘體。我們發現，整個地方几乎都他媽的歸他們所有。牛仔對舊新聞進行了常規查詢，生成了一份簡報。整體情況更有意思。這是個家族組織。公司結構。一般來說，可以通過購買入股有限公司，但是在一百多年裡，泰西爾-埃西普爾從無一股在公開市場上交易。就我所知，這包括所有公開市場。你看到的是一個非常低調、非常怪異的第一代太空家族，卻以公司方式在運作。遠離媒體的巨富之家。大量進行克隆。太空法律對遺傳工程要寬鬆得多，對吧？另外，在任何時間，要找出活躍的家族成員究竟屬於哪一代或哪幾代都很困難。」","「怎麼回事？」莫利問。","「他們有自己的冷凍設施。哪怕根據太空法律，人在冷凍期間，在法律意義上就算死亡了。他們似乎接受了這個代價。不過，家族之父已經有大概三十年沒出現過了。至於家族之母，則死於某次實驗室事故……」","「你那客戶遇到的又是怎麼回事？」","「沒怎樣。」芬蘭人皺起眉頭，「我們放棄了。我們看了看泰埃那些精彩繁複的授權書，僅止於此。吉米肯定是進入迷光盜走那個頭像，泰西爾-埃西普爾便派出忍者追查。史密斯決定忘了這事。這可能是明智的選擇。」他看看莫利，「迷光別墅。紡錘之頂。絕對私密。」","「你覺得那忍者也是他們的財產嗎，芬蘭人？」莫利問。","「史密斯認為是。」","「很昂貴，」她說，「有沒有想過那個忍者後來怎樣了，芬蘭人？」","「可能把他凍起來了。需要的時候再解凍。」","「好吧，」凱斯說，「我們知道了阿米塔奇的錢財來自一個叫冬寂的人工智慧。這告訴我們什麼？」","「沒什麼，」莫利說，「但是現在你有點兒私活幹了。」她從口袋裡掏出一張疊好的紙遞給他。他打開來。坐標和進入密碼。","「這是誰？」","「阿米塔奇。他的某個資料庫。我從黑豹們那裡買來的。是另一筆交易。這是在哪裡？」","「倫敦。」凱斯說。","「破解它。」她笑起來，「給自己賺點兒小費。」","凱斯在擁擠的站台上等待縱貫波亞的慢車。幾個小時前，莫利已經帶著裝有「平線」思想盒的綠包回到了廠房裡，然後凱斯就一直在不停地喝酒。","想到「平線」是一個思想盒，一個只讀硬體，一盒磁帶，裏面有那死去的人所有的技術能力、愛好和膝跳反射……他就覺得很不安。列車沿著黑色條帶駛入，隧道頂上的裂隙里有細沙漏下來。凱斯跳進離他最近的車門，一路觀察其他乘客。一對相貌兇猛的「基督徒科學家」朝三個年輕的白領技|師擠過去，那三人手腕上戴著美化全息陰|道，粉紅潮濕，在慘亮的燈光下閃動。她們不安地舔舔完美的嘴唇，耷拉下金屬色的眼皮，偷偷看向那兩個基督徒科學家。這些姑娘像是來自異域的動物，頎長身材隨著火車行進優雅地搖擺，高跟鞋踩在車廂灰色的金屬地板上，像是磨好的蹄。她們眼看就要開始奔逃，躲開那兩個傳教士，火車已到達了凱斯要去的車站。","他踏出車門，便看到車站的牆上掛著一支白色的全息雪茄，下面是彎彎扭扭的大寫字母，模仿日語文字的模樣，閃出「自由彼岸」幾個字。他穿過人群，站在雪茄下面仔細觀察。「你還等什麼？」幾個字跳了出來。一個圓潤的白色紡錘體，上面布滿電網、散熱器、航空碼頭和穹頂建築。類似這樣的廣告他見過千百次，卻從來不感興趣。只要有操作台，他去自由彼岸就和去亞特蘭大一樣容易。旅行是肉身的事情。但這次他注意到了那個小小的標記，不過一枚硬幣大小，就在光影廣告的左下角：泰埃。","他徒步走回廠房，一路沉浸在關於「平線」的記憶中。十九歲的那個夏天，他絕大部分時間都待在「失敗者先生」酒吧，捧著昂貴的啤酒，觀察那些牛仔。那時他還從來沒摸過操作台，但他明白自己想要什麼。那個夏天，至少還有另外二十個懷抱希望的孩子在「失敗者」里遊盪，他們都忙著替牛仔們跑腿。這是唯一的學習方式。","他們都聽說過泡利，那個亞特蘭大郊區來的紅脖子操控手，在黑冰內腦死過，再死而復生。坊間關於泡利的小道消息很少，傳出來的唯一一件事，是他完成過不可能的任務。凱斯請另一個學徒喝了一杯啤酒，那學徒告訴他：「是個大任務，但誰知道到底是什麼呢？我聽說可能是巴西的一個工資網。反正，這人當時就死了，完完全全地腦死了。」","凱斯注視著擁擠酒吧那頭一個粗壯的男人，單穿著一件襯衫，膚色晦暗。","「孩子，」幾個月後，「平線」在邁阿密對他說，「俺就跟他媽的大蜥蜴似的，你知道哇？它們都他媽有倆腦子，一個在腦袋裡邊，一個在尾巴骨上，管後腿兒的。撞上了那黑玩意兒，俺尾巴那腦子照舊還轉著呢。」","「失敗者」酒吧里的牛仔精英們都躲著泡利，他們有種奇怪的集體焦慮，幾近迷信。麥可伊・泡利，網路空間的拉撒路……","最後要他命的，還是他的心臟。就是他多出來的那顆俄國心臟，那場戰爭期間在戰俘集中營植入的。他一直拒絕換掉那東西，聲稱他需要那顆心髒的特定搏動頻率來維持時間感。凱斯撫摸著莫利給他的那張紙，走上樓梯。","莫利躺在床墊上打著鼾。她從膝蓋到胯|下幾毫米處用堅硬的微孔材料打著透明硬模，能看到皮膚上斑駁的淤青，從中心到邊緣由黑變黃。她的左手腕上整整齊齊排著八張顏色尺寸各不相同的葯貼。一台雅佳牌導入儀躺在她身旁，用細紅線連接到硬模下的電極上。","他打開保坂旁邊的伸展燈，一圈亮光直射到「平線」的思想盒上。他插入冰，接通思想盒，然後接入網路。","感覺恰似有人從背後看過來。","他咳了一聲。「南方人？麥可伊？是你嗎夥計？」他喉頭髮緊。","「嘿，兄弟。」那聲音不知從何方傳來。","「我是凱斯，夥計。記得不？」","「邁阿密，小學徒，學得挺快。」","「在我和你說話之前，你記得的最後一件事是什麼，南方人？」","「什麼也沒。」","「等等。」他斷開思想盒。那種存在感消失了。","他重新接通思想盒。「南方人？我是誰？」","「你在玩我嗎，兄弟。你他媽的是誰？」","「凱——你搭檔。合作夥伴。現在是怎麼回事，夥計？」","「問得好。」","「一秒鐘前來過這兒，記得嗎？」","「不記得。」","「知道只讀人格網路工作原理嗎？」","「當然，兄弟，是個思想盒，硬體。」","「只要把它接入我用的存儲器，就可以給它連續的、實時的記憶嗎？」","「估計是。」思想盒說。","「好吧，南方人。你就是個只讀思想盒。明白？」","「你說是就是吧。」思想盒說。「你是誰？」","「凱斯。」","「邁阿密，」那個聲音說，「小學徒，學得挺快。」","「對。現在，南方人，你和我，得先摸進倫敦網，搞點兒數據。你玩這一把嗎？」","「你說我還有的選嗎？」"]},{"title":"第二部 購物之旅 06","paragraphs":["「你得找個天堂，」在凱斯講清楚情況后，「平線」建議說，「看看哥本哈根，大學區周邊。」他輸入那個聲音念出的坐標。","他們找到了自己的天堂，一個「海盜天堂」，坐落在一個低安全級學校網路的混亂邊界上。乍一看像是學生操控手在網路線交會處留下的塗鴉，微弱的彩色燈光構成的文字閃動在十余座藝術學院的模糊外形之上。","「那裡，」「平線」說，「藍色那個。看見了嗎？那是貝爾歐洲的入場代碼。還是新的。貝爾的人很快會過來，把公告板全他媽看一遍，修改掉所有被人貼過的代碼。明天小孩兒們會偷偷貼新的。」","凱斯摸進貝爾歐洲，然後切換到標準電話程式。在「平線」的幫助下，他連上了那個倫敦資料庫，據莫利說，屬於阿米塔奇的那個資料庫。","「這，」那個聲音說，「我來給你搞。」「平線」唱出一組數字，其中的短暫停頓表示不同的鍵入時機。凱斯試了三次，才成功將這個序列鍵入。","「多大點事，」平線說，「根本沒冰牆。」","「掃描這堆垃圾，」凱斯對保坂電腦說，「篩選其主人的個人歷史。」","海盜天堂凌亂的神經電子形體消失了，一片單純的白光取而代之。「內容主要是戰後軍事法庭審判錄像，」保坂電腦那遙遠的聲音說，「中心人物是威利斯・科爾托上校。」","「趕緊放。」凱斯說。","一張臉充斥了屏幕。那雙眼睛屬於阿米塔奇。","兩小時后，凱斯倒在莫利身旁，陷進變形的床墊里。「找到什麼了嗎？」她在朦朧睡意和藥力中含糊地問。","「回頭告訴你，」他說，「我累趴了。」那些信息把他攪糊塗了。他躺在那裡，閉上眼，試圖梳理清楚一個叫科爾托的人的各種事迹。保坂電腦搜索了那個並不豐富的資料庫，整理出一個簡報，但處處都有信息缺失。資料庫中部分材料是印刷記錄，在屏幕上快速閃過，凱斯根本看不清，只能讓電腦讀出來。其他的則是哭拳行動聽證會的錄音。","威利斯・科爾托上校俯衝進科倫斯克。脈衝武器在科倫斯克上方的俄國防線炸出了一個盲點，科爾托的隊伍駕駛著「夜翼」超輕型飛機降入洞中。在月光下，安加拉河和石泉河的粼粼波光中反射出緊繃的機翼。之後的十五個月里，科爾托再也沒有見過自然光。凱斯試圖想象那冰冷草原的高空之上，飛機從發射艙紛紛湧出的情形。","「他們把你虐得夠他媽慘，老闆。」凱斯說。莫利在他旁邊動了動。","這些超輕型飛機沒有攜帶武器，以騰出載重量搭載一個操控手，一隻原始的操控台，和一個叫鼴鼠九號的病毒程序，這是計算機發展史上第一個真正的病毒程序。科爾托和他的隊員們為這次行動訓練了三年。他們進入冰牆，正準備注入鼴鼠九號，脈衝武器突然停止工作。俄國人的脈衝炮讓操控手瞬間陷入電子黑夜，「夜翼」飛機系統崩潰，飛行迴路被徹底抹除。","隨後激光炮開火了，對雷達隱形的飛機在紅外瞄準下無處遁形，脆弱機身被迅速擊落。科爾托和已被擊斃的牛仔一起，從西伯利亞的上空墜落。墜落，不斷墜落……","這裏許多信息缺失。凱斯掃描到一些資料，提到一架被劫持的俄國武裝直升機。直升機飛到了芬蘭，于凌晨在一片杉樹林降落，遭遇了正在執勤的預備役軍官，接受了古老的二十毫米炮的轟炸。對於科爾托來說，哭拳行動終結于赫爾辛基的郊外，終結于芬蘭軍醫鋸開直升機扭曲的機身將他救出。戰爭於九天後結束，科爾托被運到猶他州的一個軍方基地，他失去了雙眼、雙腿和絕大部分下頜，只能聽著尿管滴答。國會助理花了十一個月才在猶他州找到他。在華盛頓和麥克萊恩，公審已經走起了過場。五角大樓和中情局已被分化，幾近廢除，國會展開了一項針對哭拳行動的調查。揭露醜聞的時機已成熟，這位助理告訴他。","他需要新的眼睛、腿和大面積整容，助理說，不過這些都可以安排。還有新的排泄系統，助理又說，同時隔著汗濕的床單捏了捏科爾托的肩膀。","科爾托聽見那輕微的卻永無止歇的滴答聲。他說他情願就這樣去作證。","不，那位助理說，審訊過程是電視直播的。審訊要給投票人看。助理禮貌地咳嗽。","科爾托被修復翻新，經歷了反覆排練，他的證詞清楚翔實又感人，卻大都是國會內部一個利益集團捏造出來，以挽救五角大樓某些人的。科爾托慢慢明白，科倫斯克組建了脈衝裝置的報道是被人為壓制的，有三個官員對此事負有直接責任，而他的證詞卻對挽救他們起了至關重要的作用。","他在公審中的任務結束了，在華盛頓便變成了不受歡迎的人。在M街一家餐館里，那位助理吃著蘆筍薄餅，告訴他別找錯說話對象，這可是極端危險的。科爾托用右手堅硬的手指捏碎了那人的喉嚨。那國會助理頭埋在一隻蘆筍薄餅里窒息而死，科爾托走出餐館，外面是華盛頓清冷的九月。","保坂公司不斷地奉上警方報告，公司偵查報告，還有舊新聞。凱斯看著科爾托在里斯本和馬拉喀什做大公司員工的策反工作，彼時他似乎開始沉迷於「背叛」這個概念，憎惡他為僱主買通的那些科學家和技|師。在新加坡，他喝醉后將一個俄國工程師在酒店裡毆打致死，隨後縱火燒掉了他的房間。","然後他出現在泰國，在一個海洛因工廠監工。後來是加利福利亞一個賭博集團的打手，再後來則在波恩的廢墟中做了一個職業殺手。他在威奇托搶了一家銀行。紀錄越來越模糊不清，斷檔越來越長。","在一段彷彿經過了藥物訊問的錄音中，他說，有一天，一切都晦暗了。","一些法文的醫療記錄翻譯過來，說一個沒有身份證件的人被送到巴黎一間精神病院，並被診斷為精神分裂症患者。他癥狀發作后被送到土倫郊外的一家政府醫院。他成為了一個項目的實驗對象，該項目嘗試通過網路模型治療精神分裂症。他們隨機將計算機分發給病人，鼓勵病人編程，並讓學生給病人提供幫助。他痊癒了，整個實驗項目，只出了他這一個成功案例。","記錄到此為止。","凱斯在床墊上翻了個身，莫利輕聲抱怨他打擾到了她。","電話響起。他把電話拖到床上。「誰？」","「我們要去伊斯坦布爾，」阿米塔奇說，「今晚。」","「那混蛋要幹嗎？」莫利問。","「他說我們今晚去伊斯坦布爾。」","「真是好極了。」","阿米塔奇已經在念航班號和起飛時間。","莫利坐起來，打開燈。","「我的裝備怎麼辦？」凱斯問，「我的操控台。」","「芬蘭人會搞定的。」阿米塔奇說完掛上電話。","凱斯看著她打包。她的眼睛下面有黑眼圈，腿上打著模子，但行動仍然同舞蹈一般，沒有任何一個多餘的動作。他的衣服亂七八糟地堆在他的包旁邊。","「你疼嗎？」他問。","「我該在秦氏診所多待個晚上的。」","「你的牙醫？」","「沒錯兒。他很細緻的。那間屋子他佔了一半，診療裝備齊全。專門幫武士做修復。」她拉上包的拉鏈，「你去過伊斯坦布爾？」","「去過一次，兩天。」","「永遠是那樣子，」她說，「那個老破城。」","「我們去千葉城也是這樣的，」莫利望著車窗外那片工廠廢墟，地平線上有紅色燈塔標出核聚變反應堆的位置，讓飛機繞行，「我們當時在洛杉磯。他來了，說，收拾東西，我們定了去澳門的票。我們到了澳門，我在葡京酒店賭番攤，他則跑去了中山。第二天我就在夜之城跟你捉迷藏了。」她從黑色夾克袖子里抽出一根絲巾，擦拭她的植入鏡片。斯普羅爾北部的景色喚起凱斯模糊的童年記憶，龜裂的水泥高速公路上，叢叢枯草自夾縫中生出。","火車在離機場十公里遠處開始減速。凱斯看著太陽從童年的景色上，從礦渣和銹跡斑斑的冶鍊廠外殼上升起。"]},{"title":"第二部 購物之旅 07","paragraphs":["貝伊奧盧下著雨，租來的賓士車疾馳過希臘人和亞美尼亞人開的珠寶店，黑洞洞的窗戶上小心謹慎地裝著防盜欄。街上空蕩蕩的，人行道上僅有的幾個黑衣人轉過頭，注視著車子飛馳而去。","「這是當初繁榮的奧斯曼帝國伊斯坦布爾的歐洲部分。」賓士車念道。","「它衰落了。」凱斯說。","「希爾頓酒店在共和街。」莫利說著，靠在灰色仿麂皮車座上。","「阿米塔奇為什麼單獨飛？」凱斯問。他有點頭痛。","「因為他被你煩死了。反正我是被你煩死了。」","他想要告訴她科爾托的故事，但還是決定算了。在飛機上他用了催眠貼才睡著。","從機場進城的路筆直得如同一道刀口，將城市一分為二。他看著花花綠綠的木板樓外牆從車窗外掠過，還有公寓，生態建築，陰沉沉的福利住宅，更多的膠合板和鐵瓦楞板牆……","芬蘭人在希爾頓酒店大堂悶悶不樂地等他們。他穿著一身嶄新的新宿西裝，是上班族常見的黑色，坐在紅褐色的扶椅里，陷在一片汪洋大海的淡藍色地毯之中。","「天哪，」莫利說，「阿貓阿狗都穿上了西裝。」","他們穿過大堂。","「芬蘭人，付你多少錢你會來這裏？」她把包放在扶椅旁邊的地上。「讓你穿這身西裝得出更多哈？」","芬蘭人抿起嘴。「還不夠多，甜肉。」他遞給她一把磁性鑰匙，上面掛著一個黃色的圓形標記。「你們已經登記入住了。在老闆樓上。」他環顧四周，「這城市真爛。」","「被人從穹頂建築里拉出來，難免有廣場恐懼症。你假裝這裡是布魯克林之類的地方就好了。」她用一根手指轉動鑰匙。「你是來幫我們打雜的？」","「我來檢查下某個傢伙的植入體。」芬蘭人說。","「我的操控台呢？」凱斯問。","芬蘭人皺皺眉。「有點規矩。問老闆。」","莫利的手指在衣服陰影中晃動，一閃而過。芬蘭人看著她的手，然後點點頭。","「哈，」她說，「我知道這個傢伙是誰了。」她朝電梯那邊歪歪頭。「來吧，牛仔。」凱斯拎著兩人的包跟在她身後。","他們的房間跟他在千葉城第一次見到阿米塔奇的那間完全沒差別。早晨，他走到窗口，幾乎以為自己會看見東京灣。街對面是另一家酒店。外面還在下雨。幾個代人寫信的人躲在門廊底下，陳舊的語音印表機用透明塑料布包著，證明寫出來的文字在這裏仍然受人尊崇。這是個落後的國度。他看見一輛墨黑色的雪鐵龍四門轎車，是原始的氫電池改裝車，裏面下來五個穿著皺巴巴綠色制服，臉色陰沉的土耳其官員。他們走進對面那家酒店。","他回頭看看床上的莫利，突然覺得她異常蒼白。她把微孔硬模留在了那間廠房的床墊上，旁邊還有那台導入儀。她的植入鏡片上映出房間里的燈光。","電話鈴剛響了第一聲他便接起來。「不錯，你起床了。」阿米塔奇說。","「剛起。女士還在睡。老闆，你聽我說，我覺得咱們可能應該談談。我覺得如果對任務的了解多一點，我能幹得更好。」","電話那頭一片沉默。凱斯咬住自己的嘴唇。","「你知道的足夠了。或許太多了。」","「你覺得是嗎？」","「穿好衣服，凱斯。叫她起床。大概十五分鐘後會有人給你電話。他叫澤之巴江。」電話輕輕一響，阿米塔奇已經掛了。","「起床了，寶貝，」凱斯說，「開工。」","「我都醒了一個鐘頭了。」她的鏡片轉了轉。","「有個澤西・巴斯田要來找我們。」","「你挺有語言天賦嘛凱斯，肯定有亞美尼亞血統。那是阿米塔奇用來盯梢里維拉的人。拉我起來。」","澤之巴江是個年輕人，穿著灰西裝，戴著金邊反光眼鏡。他敞著白襯衫領子，露出一撮濃密的胸毛，凱斯差點以為是件T恤。他端著一個希爾頓的黑色托盤，裏面放著三小杯濃郁的黑咖啡，三塊黏黏糊糊的淡黃色東方甜品。","「用你們『音語』里的說法，我們千萬不能緊張。」他盯著莫利看了許久，最後還是取下了自己的眼鏡。他的眼睛和短短的寸頭一樣是深棕色。他微微一笑。「這樣好些，對吧？要不然我們鏡子對著鏡子，就成了無窮的『稅道』……你尤其，」他對莫利說，「必須小心。土耳其人不喜歡女人做這種改裝。」","莫利咬了半塊糕點。「傑克，這次是我的活兒。」她嘴裏塞滿了東西，嚼了嚼吞下去，又舔舔嘴唇。「我知道你。軍方的，對吧？」她的手懶懶地伸進夾克前面，拿出她的箭槍。凱斯不知道她隨身帶著箭槍。","「請千萬小心。」澤之巴江說，他的白色陶瓷杯停在嘴邊。","她拔槍指住他。「射中你的可能是炸藥，大量炸藥，也可能是一種癌症。只要一飛鏢，爛人，幾個月你都沒感覺。」","「求你了。用你們『音語』說，這樣讓我很緊張……」","「用我的話說，這就是個討厭的早晨。告訴我們你盯的那人的事兒，然後滾出去。」她把槍拿開。","「他住在費納，庫楚吉汗街14號。我有他每天晚上去集市的捷運路線。他最近在葉妮希爾宮做表演，那是個遊客風格的現代宮殿，最近在我們的安排下，警察開始對他的表演表示興趣了。葉妮希爾的管理層開始焦慮了。」他微笑起來。他身上有金屬爽膚水的味道。","「我要知道他有什麼樣的植入體。」她一邊揉著大腿一邊說，「我要知道他具體能做什麼。」","澤之巴江點點頭。「最厲害的是，你們『音語』里怎麼說的來著，潛意識。」他一字一頓地說出「潛意識」三個字。","「我們左邊，」賓士車在雨中穿過迷宮般的街道，一邊說，「是大集市。」","凱斯身邊的芬蘭人發出讚歎聲，眼睛卻看著另外一邊。街道右邊排布著小型廢品場。凱斯看見一台破爛的火車頭，下面是碎裂的大理石。無頭的大理石雕像柴火一樣胡亂堆積。","「想家了？」凱斯問。","「這地方爛透了。」芬蘭人說。他的黑絲領帶看起來已經像一條陳舊的碳帶，嶄新的西裝領子上有烤肉汁和炒蛋的污漬。","「嗨，澤西，」凱斯問身後的亞美尼亞人，「這人在什麼地方裝的那些東西？」","「在千葉城。他沒有左肺，另一邊的肺是加強版的，你們是用這個詞吧？那些植入體誰都買得到，但這個人很有天分。」賓士車一個急轉，避開一輛塞滿甘草的充氣胎馬車。「我以前跟蹤他上街，一天之內就看到十幾輛自行車在他旁邊摔倒。我去醫院找到那些人，他們的說法都一樣，有蝎子在他們的剎車閘旁邊蠢蠢欲動……」","「『所見即所得』，沒錯，」芬蘭人說，「我看過這人體內矽片的圖紙。很華麗。他想象什麼，你就看到什麼。我估計他把想象集中成一個脈衝，隨便就能燒焦你的視網膜。」","「你把這事告訴你的女性朋友了吧？」澤之巴江坐在仿麂皮中間朝前探出身子。「在土耳其，女人依然是女人。這位……」","芬蘭人哼了一聲。「你要是逗她，她會讓你拿自己的蛋當領結戴。」","「我不懂這個俗語。」","「不懂算了，」凱斯說，「就是閉嘴的意思。」","亞美尼亞人靠回椅背上，留下一股金屬爽膚水的氣味。他開始對著一個三洋牌收發報機低語，詭異的希臘語、法語、土耳其語和偶爾的英語片段混合在一起。收發報機用法語回復他。賓士車平穩地轉過一個彎。「香料集市，也稱為埃及集市，」汽車說，「位於蘇丹・哈提傑於1660年建立的集市舊址上。它是這個城市主要的香料、軟體、香水、毒品市場……」","「毒品，」凱斯看著雨刷在聚碳酸酯防彈玻璃上反覆刷過，說，「你之前說什麼來著，澤西，這個裡維拉嗑藥？」","「可卡因加杜冷丁，沒錯。」亞美尼亞人又開始和三洋說話了。","「他們以前管那叫德美羅，」芬蘭人說，「他是個癮君子藝術家。你混的圈子真有意思，凱斯。」","「無所謂了，」凱斯豎起夾克領子說，「我們會給這可憐混蛋裝個新胰臟什麼的。」","他們走進集市，芬蘭人立即顯得快活起來，似乎很享受這裏的人群密度和封閉感。他們和亞美尼亞人一起穿過一個寬闊的大廳，頭頂是煙熏火燎的塑料板和蒸汽時代的綠漆鐵雕，上面掛著上千張扭曲閃動的廣告。","「嘿，天哪，」芬蘭人拉住凱斯的胳膊說，「瞧那。」他指指。「是匹馬，老兄。你見過馬沒有？」","凱斯掃了一眼那隻經過防腐處理的動物，搖搖頭。它陳列在一個檯子上，旁邊是一間賣鳥和猴子的商店。那東西的腿被路人的手摸了幾十年，已經油黑水滑。「我在馬里蘭見過一匹馬，」芬蘭人說，「那已經是瘟疫之後三年了。阿拉伯人還試圖用DNA編碼再養出馬來，但就算生出來了也總是掛掉。」","他們走過那匹馬，它棕色的玻璃眼珠好像還跟在他們身後。澤之巴江領著他們走進市場中心附近的一家咖啡店，這裏房頂低矮，好像已經開了幾百年沒消停過。穿著骯髒白外套的瘦弱男孩們在擁擠的桌子之間閃來閃去，小心地保持著鋼托盤裡酒瓶和小茶杯之間的平衡。","凱斯從門外一個小販手裡買了包頤和園。亞美尼亞人對著他的三洋嘟嘟囔囔。「來，」他說，「他已經在行動。每天晚上他都坐捷運來集市，從阿裏手中買配好的毒品。你的女人跟得很近。來。」","那條巷子非常古老，太古老了，牆面全是深色的大石頭塊。崎嶇不平的路面上有股子氣味，好像這古老的石灰岩里吸飽了一個世紀以來車子里漏下的汽油。「屁都看不到。」他低聲對芬蘭人說。「甜肉可以看得到。」芬蘭人說。「安靜。」澤之巴江的聲音有些太高。","有木頭在石頭上摩擦的聲音。離巷口十米處透出一束黃色燈光，灑在濕漉漉的卵石地面上。一個人影走出來，門又關上了，伴著那種摩擦聲，狹窄的巷子再次陷入黑暗之中。凱斯顫抖了一下。","「來了。」澤之巴江說。市場對面的屋頂上射出一束耀眼的白光，渾圓的光圈罩住古老木門旁那個身形苗條的人。一雙明亮的眼睛左看右看，然後這個人轟然倒地。凱斯還以為他中了槍。這個人趴在地上，金髮被古老的石頭襯得有些蒼白，雪白無力的雙手顯得楚楚可憐。","探照燈一動不動。","倒地那人的夾克從背部鼓起來，爆開，鮮血直噴到牆上和門上。那具血淋淋的軀體——應該就是里維拉——沒動彈，血光中有一對灰粉色的胳膊在飛舞，異常地纖長柔韌，似乎透過里維拉的遺骸將自己從地面拉了起來。這東西有兩米高，長著兩條腿，似乎沒有腦袋。它慢慢轉過身，面對著他們。凱斯看到了它的腦袋，卻沒有脖子，也沒有眼睛，皮膚是腸肚一樣的粉紅色。它的嘴——如果那算得上嘴的話——是圓的，一個淺淺的圓錐形邊上密密麻麻排滿了硬軟難辨的毛髮，閃著黑色的金屬光澤。它踢開地上的衣服和肉體，走出一步，那張嘴似乎在搜尋他們。","澤之巴江不知用希臘語還是土耳其語說了句話，張開雙臂，如同跳樓一般朝那東西衝過去。他穿過那東西，衝進光圈之外的黑暗之中，正撞上一把開火的槍。碎石從凱斯腦袋邊呼嘯而過，芬蘭人一把拉住他，讓他蹲下。","屋頂上的燈光消失了，眼前全是凌亂的余象：槍火，怪獸，白光。還有耳鳴。","燈光再次亮起，轉動起來，在陰影中搜尋。在耀眼的光線中，澤之巴江靠在一扇鋼門上，面色慘白，握住自己的左手腕，看著鮮血從左手的傷口中不斷滴下。那金髮人又變成了一個完好無缺的人，不帶半點血跡，躺在他的腳邊。","莫利從陰影中走出來，一身黑衣，手中拿著她的箭槍。","「用無線電，」亞美尼亞人咬著牙說，「叫馬哈茂德來。我們一定得把他帶走，這不是個好辦事的地方。」","「這小癟三差點就得手了，」芬蘭人站起來，笨拙地拍著褲子，膝蓋咔咔作響，「你們剛才看的是恐怖表演，對吧？不是把漢堡扔沒了之類的雜技。真他媽可愛。嗯，幫他們把這傢伙弄走。我得在他醒來前把他的全部裝備掃描一遍，保證阿米塔奇拿到回票價。」","莫利彎下腰，撿起一樣東西。是一支手槍。「是南部，」她說，「很好的槍。」","澤之巴江呻|吟了一聲。凱斯看到他的中指幾乎已完全消失。","黎明前的藍色浸透了整個城市，她讓賓士車帶他們去托普卡匹皇宮。芬蘭人和一個叫馬哈茂德的土耳其大塊頭把昏迷不醒的里維拉從巷子裡帶走了。幾分鐘后，一輛落滿塵土的雪鐵龍車來接應亞美尼亞人，他似乎已經快暈過去了。","「你是個混蛋，」莫利幫他打開了車門說，「你該忍住的。他剛走出來我就瞄準他了。」澤之巴江瞪了她一眼。「反正我們也用不著你了。」她把他推進車裡，重重關上車門，對著鍍膜車窗后那張慘白的臉說，「再碰到你我就殺了你。」雪鐵龍吃力地開出巷子，笨拙地轉上大街。","賓士車安靜地穿過蘇醒中的伊斯坦布爾城。他們路過貝伊奧盧的捷運車站，疾速穿過迷宮般的荒涼後街和破舊的公寓樓。凱斯隱約想起了巴黎。","賓士車自動停在塞拉格里奧周圍的花園邊上，凱斯愣愣地看著那堆叫作托普卡匹的巴洛克風格建築，問莫利：「這是什麼東西？」","「類似皇帝的私人妓院吧，」她下車伸展了一下身體說，「放了很多女人在裏面。現在是個博物館。有點像芬蘭人的店面，所有東西就這麼亂堆著，大鑽石，劍，聖約翰的左手……」","「放在生命維持裝置里？」","「沒，是死的。放在一個黃銅手裡頭，邊上有個小開口，基督徒可以吻它祈福。大概一百萬年前從基督徒那搶過來的，他們從來連灰都不撣，因為這是異教徒的遺體。」","塞拉格里奧花園裡的黑色鐵鹿已經銹跡斑斑。凱斯走在她身旁，看著那些無人照料的，已經被早霜凍僵的青草被她的靴頭碾碎。他們走在一條冰冷的八角石板路旁邊。巴爾幹半島的冬天即將到來。","「那個澤之是個一級人渣，」她說，「他是個秘密警察。酷刑手。以阿米塔奇出的價錢輕易就能收買到。」他們身旁濕漉漉的樹枝上，鳥兒已開始歌唱。","「我替你幹了那活，」凱斯說，「倫敦那樁。我找到了些東西，但不知道什麼意思。」他給她講述了科爾托的故事。","「嗯，我早就知道哭拳行動里沒有個叫阿米塔奇的。我查過。」她撫摸著一隻鐵鹿鏽蝕的肚皮。「你覺得是那小電腦把他弄出來的？從那間法國醫院里？」","「我覺得是冬寂。」凱斯說。","她點點頭。","「問題是，」他說，「你覺得他知道自己以前是科爾托嗎？我的意思是，他進醫院的時候已經不是什麼名人了，也許冬寂只是……」","「是啊。把他從頭再造一遍。是啊……」她轉過身，兩人繼續前行。「這就對了。你知道嗎，這人根本沒私生活。至少我是沒見過。你看到一個像他那樣的人，肯定覺得這人獨處的時候會做點什麼。但是阿米塔奇不會。他就坐著，瞪著牆壁，我的老天。突然『咔嗒』一響，他就開始高速運轉，替冬寂跑腿。」","「那他為什麼藏了那堆東西在倫敦？為了懷舊？」","「可能他根本不知道。」她說。「可能只是在他名下而已，對吧？」","「我不明白。」凱斯說。","「我只是在假想而已……人工智慧有多聰明，凱斯？」","「不一定。有些跟狗的智力差不多。寵物一樣的。但那也值大錢了。但有的是真聰明，它們智力程度的唯一限制是圖靈警察。」","「喂，你是個牛仔，為什麼你沒瘋狂迷上這種東西呢？」","「嗯，」他說，「首先，人工智慧很罕見。真聰明的人工智慧絕大部分是軍用的，我們進不了軍隊的冰牆。那可是冰牆起源的地方，你知道吧？其次，還有圖靈警察呢，夠可怕的。」他看看她。「我也不知道，這也跟行程無關。」","「操控手都一個樣，」她說，「毫無想象力。」","他們走到一個寬闊的方形池塘面前，水裡開著一種白色的花，鯉魚在花的莖稈上磨蹭。她把一顆卵石踢進水裡，看著漣漪盪開。","「那麼，就是冬寂。」她說，「我覺得，這事兒真鬧大了。我們在外圍，那點小波浪已經太寬，看不到激起波浪的石頭。我們知道那裡一定有什麼事，卻不知道到底為什麼。我想知道為什麼。我想讓你去找冬寂聊聊。」","「我根本沒法接近它。」他說，「你在做夢。」","「試試看。」","「不可能。」","「問問『平線』。」","「我們想從那個裡維拉身上得到什麼？」他試圖轉換話題。","她朝池塘里吐了口口水。「天知道。我一看他就想殺了他。我看過他的資料。他有猶大強迫症。只有知道自己在背叛性|欲對象的時候才能高潮。他的檔案是這麼說的。那些女人還得先愛上他。他或許也愛她們。所以澤之才能那麼輕鬆就幫我們下套子，因為他向秘密警察出賣政治犯已經三年了。或許澤之會讓他圍觀床戲。他三年已經幹了十八個，全是二十到二十五歲的女人。這讓澤之可以一直混在異見人士里。」她把手插|進口袋裡。「因為他如果找到一個想要的女人，就一定會把她變成政治犯。他的人格就像現代黑豹的外衣。資料說，這種類型很罕見，大約兩百萬人里才有一個。這多少說明人性還是好的，我想。」她注視著白色的花朵和懶洋洋的游魚，面色酸楚。「我想為了那個彼得，我得買個特殊保險。」她轉過身，露出一個冷冷的笑容。","「那是什麼意思？」","「沒什麼。咱們回貝伊奧盧去找點早飯吃吧。我今晚又要忙了。要去他在費納的公寓拿他的東西，要回集市去給他買毒品……」","「給他買毒品？他憑什麼有這個價碼？」","她笑起來。「甜心，他嗑藥不會死。而且他好像不吃那種特殊的葯就沒法工作。再說現在你不那麼瘦骨嶙峋了，我更喜歡你了。」她笑了笑，「所以我要去找藥販子阿里，多買點存著。絕對的。」","阿米塔奇在他們的酒店房間里等待。","「該打包了。」他說。凱斯試著在他淡藍色的眼睛和古銅色的面具背後尋找那個叫作科爾托的人。他想起了魏之，千葉城的魏之。他知道，級別高的人就會掩蓋自己的個性。但是魏之也有過奸|情，有過情人。甚至還有傳言說他有小孩。阿米塔奇身上卻是一種截然不同的空白。","「這次去哪？」他走過阿米塔奇身邊，看著下面的街道說。「那邊氣候怎樣？」","「那邊沒有氣候，只有天氣，」阿米塔奇說，「給。看看宣傳冊。」他把一個東西放在茶几上，站起身來。","「里維拉沒問題吧？芬蘭人在哪？」","「里維拉沒事。芬蘭人在回家路上。」阿米塔奇的微笑像是昆蟲的觸角震顫，毫無意義。他伸手捅捅凱斯的胸口，金手鏈叮噹作響。「別太自作聰明。那些小毒藥囊已經開始變薄了，不過你不知道薄了多少。」","凱斯板著臉，強迫自己點了點頭。","阿米塔奇離開后，他拿起一本宣傳冊。冊子印得很豪華，有法語、英語和土耳其語三種文字。","「自由彼岸——你還等什麼？」","他們四個人訂了土耳其航空的航班，從葉熙科夫機場出發，然後在巴黎轉機，坐日本航空的太空梭。凱斯坐在伊斯坦布爾的希爾頓酒店大堂里，看著里維拉站在禮品店的玻璃牆裡，翻看那些假冒拜占庭風格的玩意兒。阿米塔奇披著風衣，站在禮品店門口。","里維拉身材瘦長，一頭金髮，聲音溫和，英文標準流利。莫利說他三十歲了，但他外表看不出年紀。她還說他沒有合法身份，出門用的是偽造的荷蘭護照。他成長於充滿輻射的波恩城周邊的廢墟。","三個笑眯眯的日本遊客湧進商店，朝阿米塔奇禮貌地點頭致意。阿米塔奇飛快地穿過商店，站到里維拉身邊，做得有點太過明顯。里維拉轉過身笑笑。他長得很美，凱斯估計他的五官是千葉城外科醫生的傑作，非常精緻，不像阿米塔奇純粹是各種流行帥哥外形的混合。他的前額高挺光潔，平靜的灰色眼睛有種距離感。他的鼻子雕得有些太過完美，似乎被打斷後又被人笨拙地接上。這種暴力的痕迹和他精緻的下巴以及輕快的微笑構成了一種平衡。他齒如編貝，潔白亮眼。凱斯看著他潔白的雙手玩弄那些仿製的雕塑碎塊。","里維拉的表現完全看不出他昨晚剛遭遇襲擊，被帶毒的飛鏢刺到，被綁架，被芬蘭人檢查，又受阿米塔奇脅迫才加入他們的隊伍。","凱斯看了看表。莫利去買葯該回來了。他又抬起頭看看里維拉。「我賭你現在就磕著葯呢，蠢貨。」他對著大堂說。一個頭髮灰白，穿著白色真皮禮服外套的義大利婦女把保時捷墨鏡拉下來瞪住他。他露出一個大大的微笑，站起身，背上包。他需要買飛行途中的香煙。不知道日本航空的太空梭上有沒有抽煙區。「再會，女士。」他對那女人說。女人立即又把墨鏡推上去，轉過身。","禮品店裡有香煙賣，但他不想跟阿米塔奇或者里維拉講話。他走出大堂，在一排投幣電話後面的一個逼仄角落裡找到一台自動售賣機。","他翻著滿口袋的土耳其里拉，把暗無光澤的合金硬幣一枚一枚塞進去，隱然覺得這樣混亂無序的塞法有些趣味。離他最近的電話響起來。","他下意識地接起電話。","「喂？」","那邊傳來微弱的泛音，一些幾不可聞的人聲從某個地球軌道中傳過來，隨後是一個風一般的聲音。","「你好，凱斯。」","一枚五十土耳其里拉的硬幣從他手中滑落，在地上彈了幾下，沿著希爾頓的地毯滾開不見。","「我是冬寂，凱斯。咱們該談談了。」","是電子合成語音。","「你不想談談嗎，凱斯？」","他掛上電話。","他把香煙忘在了機器里。他必須走過那一排投幣電話才能回去。他經過每一台電話的時候，鈴聲都會響起，但只響一次。"]},{"title":"第三部 儒勒·凡爾納大道的午夜 08","paragraphs":["群島。","眾多的島嶼。有圓環，有紡錘，簇生的島嶼。人類DNA從深深的重力阱中漫出，如同油膜漂浮在海面。","調出L-5群島數據交換的圖形界面。已高度簡化。一個巨大的鮮紅色方塊在屏幕上咄咄逼人。","自由彼岸。乘坐太空梭出入重力阱的那些遊客不可能徹底了解自由彼岸。它是色情業和銀行業的樞紐，是尋歡作樂的所在，是自由港，也算得上邊境小鎮，甚至也是水療會館。自由彼岸是拉斯維加斯，是巴比倫的空中花園，是地球軌道上的日內瓦，也是那個近親聯姻並經過精心改造的泰西爾-埃西普爾工業氏族的家。","飛往巴黎的土耳其航空的班機上，他們並排坐在頭等艙里。莫利坐在舷窗邊，凱斯在她身旁，里維拉和阿米塔奇則坐在走道那邊。飛機斜掠過水麵，凱斯看見一個希臘島嶼上如同寶石般閃耀的城鎮。他伸手去拿飲料，看見自己的波旁水雞尾酒深處有一樣東西，好像一顆巨大的精|子。","莫利越過他，抽了里維拉一耳光。「別，寶貝。別玩花的。你要敢在我身邊玩兒潛意識的花招，我會讓你很慘，卻死不了。我就喜歡這樣。」","凱斯不由自主地轉頭去看阿米塔奇有何反應。那張光滑的臉上神色平靜，警覺的藍色眼睛中毫無怒火。「沒錯，彼得。別玩。」","凱斯轉回身，恰好看見一朵黑玫瑰倏忽一閃，花瓣閃著皮革般的光澤，黑色枝幹上長滿銀色的刺。","彼得・里維拉甜甜一笑，閉上眼，轉眼沉睡過去。","莫利側過臉，玻璃上映出她鏡片的樣子。","他把自己塞進日本航空太空梭的記憶棉沙發里。「你上過天，對吧？」莫利問。","「沒。除了幹活很少旅遊。」空乘把讀數電極接到他的手腕和左耳上。","「但願你別得空適征。」她說。","「暈機？不可能。」","「不一樣的。失重時你心跳會加速，內耳會徹底抓狂。這會引發你的飛行反射，好像神經突然命令你疾速奔跑，身體也分泌大量腎上腺素。」空乘走到里維拉身邊，從紅色塑料圍裙里取出一套新的電極。","凱斯轉過頭，試圖分辨出奧利機場古老候機樓的輪廓，但太空梭發射台周圍卻是一圈漂亮的衝擊波導流板，混凝土是潮濕的，窗口旁的導流板上噴著紅色的阿拉伯字標語。","他閉上眼睛，告訴自己太空梭只不過是一架大飛機，一架飛得很高的飛機而已。這裏的氣味也像是在飛機上，有新衣服的味道，有口香糖的味道，有疲憊的味道。他在十三弦音樂中等待。","二十分鐘后，重力的大手將他緊緊壓住，如同來自遠古的巨石。","空間適應綜合征比莫利描述的還要難受，好在持續時間並不長，他最後總算睡著了。空乘叫醒他的時候，太空梭正準備停靠日本航空的航站樓群。","「我們現在轉機去自由彼岸？」襯衫口袋裡飄出來的一絲頤和園煙草在他鼻子前面十厘米的地方飛舞。太空梭上不讓抽煙。","「不是，還是咱老闆的一貫風格，突發奇想，你知道吧？我們包了這艘飛船去錫安，錫安島群。」她碰了碰安全帶解除板，離開記憶棉的包圍。「要我說，這地方選得挺逗。」","「為什麼？」","「亂蓬蓬的辮子。雷鬼頭。拉斯塔。那地方大概已經三十年老了。」","「什麼意思？」","「你會明白的。我覺得那地方還成。至少讓你抽煙。」","錫安的創造者是當年的五位建築工人，他們拒絕回到地球的重力阱之中，並自行建造了居住地。他們歷經了鈣質流失和心臟縮小，最後才在居住區的中心圓環通過自轉建立了重力。從太空梭裏面看出去，錫安的外殼全是形狀各異的板子拼湊而成，已經褪了色，上面用激光歪歪扭扭地刻著拉斯特法里的標誌，還有焊接工人的名字縮寫，讓凱斯想起伊斯坦布爾那些花花綠綠的樓房。","在莫利和一個名叫愛洛爾的精瘦的錫安人幫助下，凱斯艱難地穿過一條無重力走廊，來到了一個較小的圓環中心。阿米塔奇和里維拉已不見蹤影，而空間適應綜合征的眩暈又再度襲來。「這裏。」莫利一邊說，一邊把他的腿塞進頭頂狹窄的艙門裡，「抓住橫條。就當你在倒退爬行，成嗎？你要朝著外殼方向去，就是往重力方向爬。明白？」","凱斯只覺得胃裡翻江倒海。","「你能成，兄弟。」愛洛爾笑起來，露出金色門牙。","隧道走到盡頭，卻莫名其妙變成了井底。凱斯喜出望外，這點微弱的重力對他簡直像是溺水的人得到一點點空氣。","凱斯伸展四肢趴在地上，卻有樣東西掉到他肩頭。「起來，」莫利說，「你難道要親它一口不成？」他翻過身，看見一大捆橡皮繩。「咱得弄個遊戲房，」她說，「你幫我掛繩子。」他環顧四周，這個房間寬廣空曠，每個平面上都東一個西一個地焊著許多鋼環。","照著莫利的複雜設計，他們拉好了繩子，又在繩子上掛起破舊的黃色塑料板。凱斯慢慢注意到背景里一直有音樂在脈動。莫利說這叫作混錄音樂，是無數的數碼流行音樂混合而成的大雜燴，是錫安人的讚美詩，營造出一種社區感。凱斯掂量了一下黃塑料板，很輕，卻很怪異。錫安里滿是人氣，還有煮蔬菜和大麻的味道。","「不錯。」阿米塔奇輕輕鬆鬆地從艙門裡滑出來，看著一片混亂的板子說。里維拉跟在他身後，在低重力下顯得有些笨拙。","「幹活的時候你在哪？」凱斯問里維拉。","里維拉張開嘴巴，裏面卻游出一條小鱒魚，後面拖著根本不該出現的氣泡，滑過凱斯的臉頰。「在腦袋裡。」里維拉微笑。","凱斯大笑。","「很好，」里維拉說，「你還會笑。我本來想幫你的，但我的手不太靈。」他攤開手掌，手卻突然變成了雙份。四條胳膊，四隻手。","「你就是個無傷大雅的小丑，對么，里維拉？」莫利站到他倆之間。","「喲，」愛洛爾在艙門口說，「你跟俺來，牛仔兄弟。」","「那是你的操控台，」阿米塔奇說，「和別的裝備。跟他去貨艙取。」","「你臉色夠差的，兄弟，」他們拉著包裝妥當的保坂終端經過中央通道，愛洛爾說，「你想吃點兒啥不。」","凱斯噙著滿嘴苦水，搖了搖頭。","阿米塔奇宣布，他們要在錫安停留八十四小時。莫利和凱斯要在零重力下進行訓練，他說，他們需要適應在這種環境里工作。他會向他們介紹自由彼岸和迷光別墅。他沒有提到里維拉的任務，凱斯也不想問。幾小時后，阿米塔奇讓他去黃板迷宮叫里維拉吃飯。他發現里維拉像只貓一樣，赤身裸體蜷在一塊薄薄的記憶棉墊上，顯然正在沉睡，頭上圍繞著一圈發光的白色小几何體：立方體、圓球、方錐，並不停旋轉。「嗨，里維拉。」光圈仍在旋轉。他回去告訴阿米塔奇。「他磕多了葯，」剛分解開箭槍的莫利抬起頭說，「讓他去吧。」","阿米塔奇似乎認為零重力會影響凱斯在數據網路中的操控能力。「別擔心，」凱斯辯解說，「我只要一接入網路就已經不在本地了。在哪都一樣。」","「你的腎上腺素水平上升了，」阿米塔奇說，「你還處在空間適應綜合徵狀態中。你沒有足夠時間等待空適征自行消失，只能學著在空適徵狀態下工作了。」","「所以行動時我會在這裏嗎？」","「不是。這是訓練，凱斯。現在，沿著通道上去……」","操控台上顯示出來的網路空間和操控台本身所在的位置並沒有特別的關係。凱斯接入網路，一睜開眼，就看到「東部沿海核裂變管理局」那熟悉的阿茲特克式數據金字塔。","「你好嗎，南方人？」","「我死了，凱斯。我在這台保坂上待了這麼久，算是想明白了。」","「死是什麼感覺？」","「沒感覺。」","「不爽？」","「讓我不爽的是，沒什麼能讓我不爽。」","「怎麼說？」","「在西伯利亞的俄國集中營里，我有這麼一哥們兒，拇指被凍壞了。醫務來了，給他切了。幾個月以後，他整晚翻來覆去的。埃爾羅伊，我問他，你咋難受了？娘的我拇指癢啊，他說。我跟他說，你撓唄。麥可伊，他說，是『那一隻』拇指啊。」思想盒的笑聲不像是笑，卻像一股寒意刺入凱斯的脊髓。「幫我個忙，孩子。」","「什麼事，南？」","「你們這爛事幹完以後，你把這該死的玩意兒刪掉。」","凱斯搞不懂錫安人。","愛洛爾沒頭沒腦地給他講了那個故事。一個嬰兒從愛洛爾腦門上爆出來，跑進了一片水培大麻裡邊。「巨小的娃，兄弟，沒你指頭長呢。」他用手掌揉揉自己毫無疤痕的棕色前額，笑了起來。","「是因為大麻。」莫利聽凱斯轉述這個故事後說，「吸大麻的時候分不清狀況的，你知道吧？愛洛爾跟你說這事發生過，沒錯，對他來講的確發生過。他這不是吹牛，是藝術。明白？」","凱斯半信半疑地點點頭。錫安人跟你說話的時候總是要碰碰你，要摸你肩膀。他不喜歡這樣。","一個小時后，凱斯在無重力走廊中準備演習。「嗨，愛洛爾。」凱斯喊道，「過來，老兄。給你看看這個。」他把電極遞給愛洛爾。","愛洛爾慢慢悠悠地赤足蹬了一下鋼壁，一隻手抓住一條大樑，另一隻手裡還拎著個鼓鼓囊囊的透明水袋，裏面裝著藍綠藻。他溫和地微笑著眨了眨眼。","「試試這個。」凱斯說。","他接過頭帶戴上，凱斯幫他放好電極。他閉上眼睛，凱斯按下電源鈕。愛洛爾戰慄了一下。凱斯斷開連接。「你看見了什麼，老兄？」","「巴比倫。」愛洛爾悲傷地說，然後將電極遞給他，一腳蹬出，又向走廊下面去了。","里維拉紋絲不動地坐在記憶棉墊上，右臂平伸，與肩齊平。手肘上方几毫米的地方緊緊纏著一條手指頭粗的蛇，紅黑相間，鑲珠嵌玉，雙目如紅色霓虹般閃亮。凱斯注視著那條蛇慢慢收縮，把里維拉的胳膊越纏越緊。","「來吧，」里維拉溫柔地對掌心裏那隻張牙舞爪的亮白色蝎子說，「來。」蝎子搖晃著棕色腳爪，沿著隱約突起的青筋匆匆爬上他的臂膀，來到肘彎里，停住了腳步，搖搖晃晃。里維拉發出輕輕的噓聲。蝎子舉起毒刺，晃了晃，隨即插入皮下一條暴起的青筋。針頭刺入的一瞬間，那條珊瑚色的蛇鬆弛下來，里維拉輕輕嘆息了一聲。","蛇和蝎子都消失了，里維拉左手裡只有一根塑料針管，裏面還有乳液殘留。「『上帝未曾賜予過我們比這更美好的東西』，你知道這句話吧，凱斯？」","「知道。」凱斯說，「聽人用它描述過很多東西。你每次打針都搞這麼一出？」","里維拉放鬆下來，取掉胳膊上綁的橡皮管。「對。這樣更有意思。」他笑了，眼神又變得縹緲，臉頰上泛起紅暈。「我在靜脈上面裝了一片濾膜，所以從不怕針頭臟。」","「不疼嗎？」","里維拉明亮的雙眼注視著他。「當然疼了。不疼就不夠爽，對嗎？」","「要我就用藥貼。」凱斯說。","「沒勁。」里維拉套上一件白色的短袖純棉T恤，嘲弄地笑了。","「一定很爽。」凱斯站起身說。","「你會爽嗎，凱斯？」","「我沒辦法，戒了。」","「自由彼岸。」阿米塔奇碰了碰操縱板，小小的博朗牌全息投影儀放出的影像逐漸聚焦，顯示出自由彼岸的骨架，圖像全長接近三米。「這裡是賭場。」他指出，「這一帶是酒店，私人公寓，和大商店。」他指著另一個地方。「藍色|區域是湖泊。」他走到模型一頭。「這是支大雪茄。兩頭都會變窄。」","「我們都看出來了。」莫利說。","「變窄就會有山峰效應。地面看起來變得更高，更陡峭，但是不難爬。爬得越高，重力越小。上面有運動場地。這裡是速行圈。」他指著那裡。","「幹什麼的？」凱斯湊上前。","「自行車競速。」莫利說，「低重力，高抓力車胎，時速能超過一百公里。」","「這一頭跟我們沒關係。」阿米塔奇仍然板著臉。","「操。」莫利說，「我愛死騎自行車了。」","里維拉咯咯笑起來。","阿米塔奇走到投影的另一頭。「這一端就有關係了。」紡錘尖最後一段全是空白，所有的內部細節都到此為止。「這就是迷光別墅。這裏重力急劇變小，每條路都曲折蜿蜒。它只有一個入口，在這裏，正中間。零重力。」","「裏面是什麼，老闆？」里維拉伸長脖子湊上來。四個小人在阿米塔奇的指尖旁閃爍，阿米塔奇像拍小蟲子一樣把它們拍掉。","「彼得，」阿米塔奇說，「你將是第一個搞懂這件事的人。你要給自己弄到邀請。你進去后，再設法讓莫利進去。」","凱斯注視著那片代表迷光的空白，想起芬蘭人講述的故事：史密斯，吉米，會說話的人頭，還有那個忍者。","「有細節嗎？」里維拉問，「你懂的，我需要準備服裝。」","「來了解下街道。」阿米塔奇回到模型中間說，「這裡是德斯德雷塔大街，慾望之街。這裡是儒勒・凡爾納大道。」","里維拉翻了翻白眼。","阿米塔奇挨個念出自由彼岸上的街道名字，而他的鼻子、臉頰和下巴上卻長出十幾個閃閃發亮的膿包。連莫利都笑起來。","阿米塔奇停住話頭，看住他們三個人，眼神冰冷而空洞。","「對不起。」里維拉說，那些膿包閃了閃，消失了。","凱斯在睡眠期的後半段醒來，莫利蜷在他身旁的床墊上。他糊裡糊塗地躺在那裡，感覺到莫利全身綳得緊緊的。她閃電般起身，穿過一塊黃色塑料板，他才慢慢意識到，她已經將那塊板子劃破了。","「別動，朋友。」","凱斯翻過身，從裂縫中探出頭。「怎……」","「閉嘴。」","「就是你了。」一個錫安人的聲音，「貓眼管、管他們叫『刀鋒』。俺叫馬爾科姆，妹妹。兄弟們想跟你和牛仔聊聊。」","「什麼兄弟？」","「創始人，兄弟，錫安元老，你曉得……」","「如果我們打開艙門，老闆會被光線驚醒的。」凱斯低聲說。","「已經弄很黑了，來，」那人說，「跟我來。咱去見那些創始人。」","「你知道我眨眼就能劈了你么，朋友？」","「甭站那可勁說，妹妹。來吧。」","錫安創始人中還有兩位在世，因為長期生活在失重環境而加速衰老，經歷了鈣質流失的棕色雙腿顯得弱不禁風。他們漂浮在艙房正中，太陽光被引入艙房，四周環繞的球形艙壁上覆滿耀眼的壁畫，繪出一片五彩繽紛的紅葉林。房間里有濃重的樹脂煙氣。","「『刀鋒』，」莫利飄進房間，正好聽見其中一位說，「好比附在鞭上的刺。」","「這位姐妹，這是我們的一個故事。」另一個說，「一個宗教故事。我們很高興你能與馬爾科姆同來。」","「你為什麼不說你們的土話？」","「我來自洛杉磯。」那老人滿頭鋼絲般的小辮糾結在一起，「在很久以前，爬上重力阱，走出巴比倫。領導我們的部族歸來。現在我的兄弟將你比作『刀鋒』。」","莫利伸出右手，刀刃在煙霧中閃閃發亮。","另一位創始人仰頭大笑。「快來到了，末日……那些聲音。那些聲音全在野地里吼，預言巴比倫將被毀滅……」","「那些聲音。」來自洛杉磯那位創始人注視著凱斯，「我們在很多頻道上進行監聽。從無間斷。在眾多的語言之中，有一個聲音在對我們說話。放了一段偉大的混錄音樂給我們聽。」","「他們管自個叫冬，寂。」另外那位將這個詞拆成兩個單字。","凱斯胳膊上汗毛直豎。","「寂對我們說話，」第一個人說，「寂說我們要幫助你們。」","「什麼時候的事？」凱斯問。","「你們停靠錫安之前三十個小時。」","「你們以前聽到過這個聲音嗎？」","「沒有。」洛杉磯人說，「我們並不確定它有何意義。若是末日果真到來，我們要當心假先知……」","「聽我說，」凱斯說，「那是個人工智慧，你明白嗎？是個人工智慧。它可能只是潛入了你們的儲存庫，找到它認為你們想聽的音樂揉在一起……」","「巴比倫，」另一個人打斷他，「生了好些妖魔，我們都曉得。妖魔叢生！」","「你管我叫什麼，老先生？」莫利問。","「刀鋒。你將要鞭打巴比倫，鞭笞它的黑暗之心……」","「那個聲音告訴你們什麼？」凱斯問。","「他叫我們幫助你們。」另一個人說，「說你們或許是末日的使徒。」他蒼老的臉上滿是憂慮。「他叫我們派馬爾科姆跟你們去，開上他的加維號拖船，去自由彼岸的巴比倫港。這點我們會照辦。」","「馬爾科姆是個粗人。」另一個人說，「拖船也開得威風。」","「但我們決定把愛洛爾也派去，他開巴比倫搖滾號，以看護加維號。」","房間里陷入尷尬的沉默。","「就這樣？」凱斯問，「你們是替阿米塔奇干，還是怎樣？」","「我們租場地給你們。」洛杉磯來的創始人說，「我們在本地有些關係，也不用遵從巴比倫的法律。神諭就是我們的法律。但這一次，也許，我們錯了。」","「想好了就干。」另一個人溫和地說。","「走，凱斯。」莫利說，「趁那個人還沒發現，咱們趕緊回去。」","「馬爾科姆會帶你們回去。神愛你，妹妹。」"]},{"title":"第三部 儒勒·凡爾納大道的午夜 09","paragraphs":["馬克斯-加維號拖船外形像一隻鋼鼓，長九米，直徑兩米。馬爾科姆按下航行鍵，船身吱呀晃動起來。凱斯躺在彈性重力網裡注視著錫安人強健的背影，東茛菪鹼讓他迷迷糊糊。他吃藥本來是想減輕空適征癥狀，可對他那經過改造的身體，藥物里的抗暈成分卻完全不起作用。","「咱們到自由彼岸需要多久？」莫利在馬爾科姆旁邊的重力網裡問。","「久不了，咱估計。」","「你們用不用『小時』計算？」","「妹妹，時間，就是時間，你知道啥意思？辮子——」他搖搖滿頭小辮，「井井有條，兄弟，咱到自由彼岸的時候咱就……」","「凱斯，」她說，「你在錫安那麼久，接入網路，還念念有詞的，有沒有試著聯繫咱們在伯爾尼的朋友？」","「朋友。」凱斯說，「沒錯。沒，我沒聯繫他。不過說到這個，當初在伊斯坦布爾倒是有件好玩的事。」他把希爾頓酒店裡那些電話的事情告訴她。","「天。」她說，「就這麼錯過個機會。你為什麼掛電話？」","「誰知道到底是誰的電話。」他沒說真話，「那只是個合成語音……我不知道……」他聳聳肩。","「不是因為你害怕了，哈？」","他又聳聳肩。","「現在聯繫它。」","「什麼？」","「現在。至少，跟平線說說這事。」","「我葯勁還沒過呢。」他一邊抗議，一邊還是伸手去拿電極。他的操控台、保坂電腦以及一台克雷牌高清顯示器固定在馬爾科姆的位置後面。","他調整好電極位置。馬克斯-加維號中心是一台四四方方的俄國造空氣濾清機，巨大而陳舊，印著西里爾字母的貼紙上蓋滿了花花綠綠的塗鴉，有拉斯塔法里教的符號，錫安獅，還有黑星航班的標誌。馬爾科姆的飛行設備全噴上了艷粉色的漆，有些沾到顯示器和讀數屏上，又被人用刀片刮掉。船頭氣密門的密封圈上到處是張牙舞爪的透明填塞劑，如同工藝粗劣的假海藻。他在馬爾科姆身後看過去，中央屏幕上是對接顯示：一條由紅點組成的線代表了拖船的軌跡，自由彼岸則是一個斷斷續續的綠圈。他看著那條紅線延長出去，生出一個新的紅點。","他接入網路。","「南方人？」","「怎麼？」","「你試過黑人工智慧嗎？」","「當然。我平線了。第一回。我當時在網路里玩得有點兒高，在里約大商務區，那兒到處都亮著，大生意，跨國公司，巴西政府亮得就像棵聖誕樹……就是瞎逛，你知道吧？然後我發現了一個方塊，大概在我上邊三層。我就爬上去試了試。」","「視覺效果什麼樣？」","「白色方塊。」","「你怎麼知道那是個人工智慧？」","「我怎麼知道？老天爺，那是我見過最密的冰牆。還能是什麼？就連巴西軍隊都沒那種冰牆。反正我退出了網路，叫電腦去查。」","「然後呢？」","「它在圖靈名冊上面。人工智慧。在里約的主機所有權屬於一個法國佬公司。」","凱斯咬住下嘴唇，遙望著東部沿海核聚變管理局所在的平原之外，神經電子網路上那無窮盡的虛空。「南方人，泰西爾-埃西普爾？」","「泰西爾，沒錯。」","「後來你又回去了？」","「當然。我是個瘋子。想試著穿透一下。到了第一層，沒了。我的小弟聞到皮膚燒焦的味兒，把電極扯掉了。那冰牆真他媽惡毒。」","「你的腦電圖平線了。」","「嗯，就變成傳奇了，對吧？」","凱斯退出網路。「操。」他說，「你以為南方人是怎麼變平線的？就是想摸進一個人工智慧。太好了……」","「繼續。」她說，「你們兩個聯手應該無堅不摧，對不對？」","「南，」凱斯說，「我想去看看伯爾尼的一個人工智慧。你能不能想出個理由不去？」","「沒有，除非你特怕死。」","凱斯敲出瑞士銀行區的位置，網路空間晃動起來，變得模糊，隨後再次凝聚成形。東部沿海核聚變管理局不見了，取而代之的是形狀齊整的瑞士商業銀行。他再次敲出伯爾尼的位置。","「上去。」思想盒說，「會很爽的。」","他們沿著光網層層上升，一點藍光在上面閃爍。","這就是了，凱斯想。","冬寂是一個簡單的白色方塊。極度簡單的外形，昭示著極度複雜的內里。","「看起來不咋樣，對吧？」平線說，「你倒是試試，動動它。」","「我進去查探一下，南方人。」","「請便。」","凱斯在操控台上輸入離方塊只有四個格點的位置。空白外壁高高矗立在他面前，隱隱透出內里閃動的陰影，似乎有上千名舞者在這張巨大的磨砂玻璃背後飛旋。","「它知道我們來了。」平線說。","凱斯又敲了一下操作台；他們前進了一個格點。","方塊表面上顯現出一個灰色圓圈。","「南方人……」","「撤，趕緊。」","那片灰色|區域鼓了起來，變成一個圓球，離開方塊。","凱斯拚命敲出「極速倒退」幾個字，操控台的邊緣似乎在咬嚙著他的手掌。他們落入一個豎井，周圍是瑞士銀行的微光。他抬頭看去，圓球顏色越來越深，不斷逼近。墜落。","「拔線。」平線說。","黑暗如鐵鎚般砸落。","冷冷的鋼鐵氣味與冰塊一起撫摩著他的脊背。","晦暗的銀色天空之下是一片霓虹的叢林，裏面有許多的臉孔，是那些海員、騙子、娼妓……","「凱斯，你說說，你他媽的在幹什麼，你發什麼瘋？」","脊柱下半段傳來疼痛，一波又一波毫不停歇……","他被濛濛細雨打醒，廢棄的光纖纏住了他的雙腳。遊戲廳的聲響如海水沒頂而來，退下，又再度襲來。他翻身坐起來，抱住自己的腦袋。","遊戲廳背後的貨倉門裡都是潮濕破碎的夾板，水從一座破爛的遊戲機底座上滴下來。遊戲機側面印著粉紅色和黃色的流線型日文字母，早已褪色。","他抬起頭，看見一扇煙熏火燎的塑料窗，閃著微弱的熒光。","他的背很痛，脊椎很痛。","他站起來，撩開眼前濕漉漉的頭髮。","發生了什麼事……","他摸摸口袋，卻找不到一分錢。他顫抖起來。他的外套在哪裡？他一直找到遊戲機後面，最後終於放棄。","他看看仁清街上的人群，猜想這是周五。一定是周五。琳達可能在遊戲廳里。她可能會有錢，至少會有煙……他一邊咳嗽，一邊絞掉襯衫前襟上的雨水，朝遊戲廳門口擠過去。","全息影像在各種遊戲的喧囂聲中閃動，重重鬼影疊在擁擠的人群之上，遊戲廳里充斥著汗味與無聊的緊張氣息。一個海員穿著白色T恤，在坦克戰遊戲機上向波恩丟下一顆核彈，炸出一片天藍色的亮光。","她在玩「巫師的城堡」，正處劣勢，灰色眼睛周圍的黑色眼線都已暈掉。","他伸出一隻胳膊摟住她，她抬起頭，笑了。「嗨，你還好吧？身上好像濕了。」","他吻了吻她。","「你搞得我遊戲打輸了。」她說，「混蛋，你看看。這是第七層地牢，我被天殺的吸血鬼抓住了。」她遞給他一支煙。「你看起來挺慘。你去哪兒了？」","「我不知道。」","「你高了，凱斯？又喝酒了？吃了鄒的葯？」","「可能吧……你上次見我是多久前？」","「嘿，你逗我玩吧？」她凝視著他，「是吧？」","「不是。有點失憶。我……我在巷子里醒過來的。」","「可能有人把你打昏了，寶貝。錢都還在嗎？」","他搖搖頭。","「這就對了。你要找地方睡覺嗎，凱斯？」","「我想是吧。」","「那就來吧。」她拉起他的手，「咱們去給你買杯咖啡，吃點東西。帶你回家。嗨，見到你真好。」她捏了捏他的手。","他笑起來。","破裂的聲音。","世界的中心在變換。遊戲廳凝固住，又晃動起來……","她不見了。沉重的回憶落下來，如同一根硅條驟然插入腦後，所有記憶瞬間衝進腦中。她走了。他聞到血肉燒焦的味道。","穿著白色T恤的海員不見了，靜悄悄的遊戲廳里空無一人。凱斯慢慢轉過身，弓著肩膀，露出牙齒，不由自主地握緊雙拳。空無一人。遊戲機邊上懸著一張皺巴巴的黃色糖紙，飄落下來，躺在被人踐踏過的煙頭和塑料杯之間。","「我本來有一支煙。」凱斯看著自己緊握的雙拳說，「我本來有一支煙，一個姑娘，和一個睡覺的地方。狗娘養的，你聽到了嗎？你聽到了嗎？」","迴音飄在空洞的遊戲廳里，飄過兩邊成排的遊戲機，漸行漸弱。","他踏出遊戲廳，走上街頭。雨已經停了。","仁清街荒無人煙。","全息影像仍在閃動，霓虹燈仍在飛舞。他聞到街對面推車攤上水煮蔬菜的味道。他的腳邊躺著一包沒開封的頤和園，旁邊還有一盒火柴。「朱利斯・迪安進出口。」凱斯注視著這塊標牌上的印刷體字樣和日文翻譯。","「好吧。」他一邊說，一邊撿起火柴，打開煙盒，「我聽見了。」","他不慌不忙地爬上樓梯，來到迪安的辦公室。不用趕，他告訴自己，不急。扭曲的達利鍾仍然顯示著錯誤的時間，坎丁斯基茶几和新阿茲特克書架上落滿塵灰，白色玻璃纖維箱排滿一壁，屋子裡滿是生薑的味道。","「門鎖著嗎？」凱斯等了一會兒，卻沒有等到迴音。他走到辦公室門邊，試著打開。「朱利？」","綠色燈罩的銅燈在迪安的桌上投下一個光圈。凱斯注視著桌上古老打字機的零件、磁帶、皺巴巴的列印紙，還有裝滿生薑樣品的黏糊糊的塑料袋。","這裏沒有人。","凱斯走到寬大鋼桌的另一邊，把迪安的椅子推開。他找到了那把槍，裝在破碎的皮套里，用銀色膠帶粘在桌子下面。那是一支古董槍，點357的馬格納，槍筒和扳機扣都已經鋸掉。槍柄上綁著層層疊疊的膠帶，陳舊的棕色膠帶蒙上一層灰。他取出彈夾，逐個檢視其中六枚子彈。是手動裝填的。軟鉛彈殼仍閃閃發亮。","凱斯把槍握在右手，側身繞過柜子，從桌子左側走到亂糟糟的辦公室中間，離那汪燈光遠遠的。","「我猜我不用著急。我猜這些都是你安排的。不過這些屁事，你知道，都已經有點……老套了。」他雙手舉起槍，瞄準桌子正中，扣動了扳機。","強勁的后坐力差點震斷他的手腕，槍火如閃光燈照亮了整個房間。他盯著桌子前方那個鋸齒狀的窟窿，雙耳還在鳴響。爆炸型彈頭。疊氮化物。他再次舉起槍。","「不用這樣，老小子。」朱利從陰影里走出來。他穿著人字紋三件套真絲長西裝，條紋襯衫，打著領結，眼鏡片閃著反射出的光。","凱斯端起槍，從瞄準器里看著迪安那張毫無歲月痕迹的粉臉。","「別。」迪安說，「你猜對了。你明白這是怎麼回事。你知道我是什麼。但內在的邏輯仍然是不能忽視的。開槍會造成一大攤腦漿和鮮血，然後我得花幾個小時——你客觀時間的幾個小時——來製造另一個發言人。我維護現在這套已經不容易了。哦，遊戲廳里關於琳達那事，對不起。我本想通過她和你對話，但我只能通過你的記憶生成這些，而她身上的感情太過濃重……嗯，很難辦。我搞砸了。對不起。」","凱斯放下槍。「這是網路空間。你是冬寂。」","「對。當然，這一切都得感謝你操控台上的虛擬體驗機。我很高興能在你退出網路前攔住你。」迪安繞過桌子，抬起他的椅子坐下來，「坐吧，老小子。我們有很多事情要談。」","「是嗎？」","「當然。我們早就該談談了。我在伊斯坦布爾通過電話聯繫你時就已準備停當。現在時間已經很緊張，你幾天後就要行動了，凱斯。」迪安拿起一支生薑糖，剝掉格子圖案的包裝紙，扔進嘴裏，「坐。」他含著糖說。","凱斯坐進桌子前面的轉椅里，眼睛時刻不離迪安，握槍的手放在大腿上。","「現在，」迪安輕快地說，「非談不可的問題。『冬寂，』你一直在問自己，『到底是什麼？』我說得對嗎？」","「多少對吧。」","「我是一個人工智慧，這你已經知道了。你的錯誤，一個很符合常理的錯誤，是把位於伯爾尼的冬寂主機，和冬寂這個『實體』混為一談。」迪安把生薑糖吸得嗞嗞作響，「你已經知道，在泰西爾-埃西普爾的網路裏面還有一個人工智慧，對不對？在里約。我，若說我也算有『自我』——你瞧，這很形而上——我給阿米塔奇，或者說科爾托作安排。順便說一句，他狀態很不穩定。」迪安從馬甲口袋裡掏出一隻華麗的金錶，打開表蓋說，「不過這一兩天還能堅持。」","「你說的話就像這整件事一樣莫名其妙，」凱斯用不握槍的手揉著太陽穴，「如果你他媽的這麼聰明……」","「我為什麼還不發財？」迪安笑得差點被糖噎到，「嗯，凱斯，我只能說——其實我能給你的答案遠不如你想象的多——你心目中的冬寂只是另一個『可能』的實體的一部分。這麼說吧，我只是那個實體大腦的一部分。從你的角度來看，這就像是和腦葉分離后的人打交道。比如說，你跟一個人左腦的一小部分打交道，就很難說跟你打交道的到底是不是這個『人』。」迪安微笑起來。","「科爾托的故事是真的嗎？你通過那間法國醫院里的微型電腦找到他？」","「是的。你在倫敦看到的那些文件也是我整理的。用你的語言來說，我嘗試去作計劃，但這並不符合我的基本操作模式，真的。我善於隨機應變，這才是我最大的天賦。我喜歡見機行事，而不是照章辦事……真的，我只能利用現有資源。我可以對大量信息進行快速查詢。組建你們這個團隊花了我很長時間，第一個成員就是科爾托，而且差點就沒成。他在土倫狀態極差，只會吃飯排泄手|淫。但他心靈深處還有執念：哭拳行動，背叛，國會聽證。」","「他還是個瘋子嗎？」","「他本人沒什麼個性。」迪安微笑，「你肯定知道。但科爾托仍然在他體內，我已無法再維持這種艱難的平衡。他會在你面前崩潰，凱斯。所以我要依靠你……」","「很好，操你媽。」凱斯用點357射中了他的嘴。","他說得沒錯，有腦漿。還有鮮血。","「兄弟，」馬爾科姆說，「俺不喜歡這樣……」","「沒事。」莫利說，「沒什麼的。這些人就這樣。他沒死，而且只有幾秒鐘時間……」","「俺看到屏幕了，腦電圖讀數沒了。啥也沒動，四十秒。」","「好了，他現在沒事了。」","「腦電圖平得像條帶子！」馬爾科姆反駁。"]},{"title":"第三部 儒勒·凡爾納大道的午夜 10","paragraphs":["他們經過海關時，凱斯渾渾噩噩，基本是莫利在說話。馬爾科姆留在加維號上。自由彼岸的海關需要遊客證明的不過是信用。凱斯進入這個紡錘體后看見的第一樣東西，就是一間「美麗女孩」連鎖咖啡店。","「歡迎來到儒勒・凡爾納大道。」莫利說，「要是沒法走路的話，你就看自己的腳好了。這裏的透視感很詭異，剛來的人會不習慣。」","他們站在一條寬闊的街道上，卻像在幽深峽谷的底部，兩壁是各種商店和建築，街道的盡頭巧妙地拐了個彎，隱藏起來。頭頂的階梯和陽台上垂掛著大片鮮活的綠色植物，光線透過葉片灑下來。而太陽……","頭頂抄襲自戛納的藍色天空里，某個地方有一片明亮的白光，耀眼過頭。他知道這裏的陽光是通過一個拉多-艾奇遜系統泵入的，那條兩毫米直徑的光束管貫穿了整個紡錘體。他也知道天空只是一種圍繞光束管不斷旋轉變化的視覺效果。他還知道如果關閉這種視覺效果，他一抬頭就能看到光束管另一面曲折的湖泊，賭場的屋頂，其他的街道……但他的身體卻接受不了。","「天。」他說，「這比空適征還難受。」","「習慣就好。我在這給賭客當過一個月的保鏢。」","「想換個地方，躺下。」","「好吧。我有鑰匙。」她拍拍他的肩膀，「老兄，起先你怎麼回事？你平線了。」","他搖搖頭。「我還不懂怎麼回事。等等。」","「好吧。我們叫個計程車啥的。」她拉起他的手，領著他穿過儒勒・凡爾納大道，走過陳列著巴黎當季皮草的櫥窗。","「假的。」他又抬頭看了看說。","「不是。」她以為他說的是皮草，「雖然培育這些皮草用的是膠原蛋白培養基，但DNA可真是水貂的。不好嗎？」","「這裏就是一條巨大的管道，一切都從裏面流過。」莫利說，「遊客，流氓，等等等等。那張撈錢的網子分分鐘都不停，這些人掉回重力阱之前，錢肯定得留下。」","阿米塔奇給他們定了一間名叫「洲際」的酒店。酒店門口有一大片覆滿青草的懸崖，探入冰冷的雲霧之中，山崖上傳來激流淙淙的聲音。凱斯走到陽台上，看見噴泉上空幾米處有三個古銅色肌膚的法國少年，他們的三角形滑翔機以鮮艷的原色尼龍布製成。一隻滑翔機轉過來，從他面前斜斜掠過，凱斯瞥見那少年短短的黑髮，棕色的胸脯，還有雪白的牙齒和開懷的微笑。空氣里都是流水和鮮花的氣味。「沒錯。」他說，「好多錢。」","她靠在他身旁的欄杆上，雙手都完全放鬆。「對。我們以前想過來這裏，或者去歐洲。」","「誰是我們？」","「誰也不是。」她不由自主地聳了聳肩，「你說你想上床了。睡吧。我也可以睡一會兒。」","「對。」凱斯搓搓臉，「對，這地方不錯。」","在人工模擬的百慕大日落景色中，拉多-艾奇遜系統的細管在錯落的雲彩之間燃燒。「對。」他說，「睡覺。」","過了許久他才終於入睡，夢境好像精心剪輯過的記憶片段，不斷襲來。他反覆驚醒，身邊是莫利在熟睡，水聲和人聲從敞開的玻璃窗里飄進來，對面山坡上的公寓樓里傳來一個女人的笑聲。迪安的死像一張壞牌，被一次次翻起。他不斷告訴自己，死的並不是迪安。事實上，這件事根本從未發生。有人告訴過他，普通人身體里的血量大概和一箱子啤酒差不多。","每一次看見迪安碎裂的頭顱倒在辦公室的牆上，凱斯都會感覺到另一股更陰暗的思緒翻滾而去，如一條魚沉入水底，無以捕捉。","琳達。","迪安。那進口商辦公室牆上的鮮血。","琳達。千葉城裡那穹頂的陰影下，血肉燒焦的味道。莫利遞給他一包生薑，塑料袋上滿是鮮血。是迪安讓人殺了她。","冬寂。他想象一塊小小的微軟片對著一個叫科爾托的廢人低聲耳語，話語如同河水流過，在那陰暗的病房裡漸漸孕育出一個叫阿米塔奇的替代人格……假迪安說過，它只能利用現有的資源。","可是如果迪安，那個真正的迪安，是受冬寂之命而讓人殺死琳達的呢？凱斯在黑暗中摸索著香煙和莫利的打火機。他點起煙，告訴自己，他沒有理由懷疑迪安。沒有理由。","冬寂可以在一個殼子里生造出一種人格，這是何等精準的操作？他抽完第三支煙，把煙頭摁熄在床邊的煙灰缸里，翻身離莫利更遠一點，試圖入睡。","那個夢，那些記憶，如同未經剪輯的虛擬體驗磁帶般不斷展開。他十五歲那年的夏天，在一個按周計價的旅館里，和一個叫作瑪爾琳的女孩度過了一個月。那裡的電梯已經壞了十年。一打開燈，就看見密密麻麻的蟑螂從堵塞的水池和骯髒的碗碟上爬過。他和瑪爾琳睡在一張沒有床單的條紋床墊上。","第一隻馬蜂來到了油漆剝落的窗欞上，營造出薄如蟬翼的一間灰色居所，而他並未留意。蜂窩很快長到拳頭大小，馬蜂成群結隊地衝出巢穴到樓下的巷子里覓食，如微型直升機一樣嗡嗡作響，在腐爛的垃圾上盤旋。","那天下午瑪爾琳被馬蜂蟄了一下，當時他們已經各喝了十幾瓶啤酒。「弄死這些操蛋貨，」在悶熱的房間里，她的眼裡燃著怒火，「燒死它們。」凱斯醉醺醺地從酸臭的壁櫥里翻出若羅的火龍。瑪爾琳的前男友若羅是個身材魁梧的摩托車手，來自弗里斯克，黑色平頭上染出一道金色的閃電。凱斯懷疑瑪爾琳還偶爾跟他幽會。火龍是弗里斯克的噴火器，模樣像一支粗大的彎頭手電筒。凱斯檢查了一下電池，搖了搖確認燃料尚足，隨後走到窗戶邊。蜂巢已開始嗡嗡作響。","斯普羅爾的空氣一片死寂。一隻馬蜂從蜂窩裡衝出來，圍著凱斯的腦袋打轉。凱斯按下點火開關，數了三下，拉動扳機。100普西壓力的燃料從熾熱的線圈裡噴出，蜂巢在五尺長的灰白火舌中淪為焦炭，掉落下去。巷子對面有人在歡呼。","「操！」瑪爾琳搖搖晃晃地站在他身後，「蠢貨！你把馬蜂窩燒掉了，卻沒燒死馬蜂。它們會飛回來蟄死我們！」她的語聲像鋸齒一樣拉過他的神經，他想象她被火焰包裹的樣子，想象她漂成淺色的頭髮在綠色的火焰中捲曲起來。","他走到巷子里，手握火龍，靠近燒焦的蜂巢。蜂巢已經摔裂了，被灼傷的馬蜂在瀝青路面上扭曲翻滾。","他看到了那灰殼子包裹下的景象。","驚懼。那層層盤繞的生產工廠，那一排一排正在孵化的細胞，那尚未出世就已不停蠕動的齒顎，那歷經蜂卵、幼蟲、近似成蟲一直到成熟馬蜂的步步過程。這一切在他腦中構成了一幅延時影像，這自然的生物過程是如此完美而驚悚，猶如一支機關槍。他拉動扳機，卻忘記了按下點火鍵，燃料呼嘯著蓋住他腳下那團不斷扭動的生命。","他終於按下點火開關，火龍「砰」的一聲炸開來，燒掉他一條眉毛。五樓上敞開的窗戶里傳來瑪爾琳的笑聲。","他在漸漸暗淡的光芒中醒來，屋裡卻一片漆黑。那些光只是他視網膜上的遺留。外面的天空中隱約有人造的晨光，洲際酒店門口的水流是唯一的聲音。","在夢裡，就在他將燃料潑滿蜂巢之前，他看見了蜂巢側面泰西爾-埃西普爾家族那精緻的泰埃標誌，彷彿是馬蜂雕上去的。","莫利說他的蒼白膚色是斯普羅爾人的特徵，太過惹眼，堅持要給他抹上一層古銅色粉底。","「老天。」他赤身裸體站在鏡子前面說，「你不覺得這看起來很假？」她跪在他的腳邊，把最後一點粉底抹在他的左踝上。","「沒錯，但至少顯得你認真在偽裝。好了。不夠抹你的腳了。」她站起身，把空管子扔進一個大編織籃里。房間里所有的東西都不像機器製造的，也不像合成材料。凱斯知道這些東西都很昂貴，但他一向痛恨這種調調。大床上的記憶海綿染成了沙子顏色，房間里還有很多淺色木頭和手工織物。","「你呢，」他問，「你也要把自己染成棕色？你也不太像日光浴出來的。」","她穿著寬鬆的黑絲綢衣服和黑色便鞋。「我走異域風情路線，還帶了頂大草帽配合主題。你呢，你就該像個想攀高枝的窮鬼，所以假古銅膚色正好合適。」","凱斯悶悶地看了看自己蒼白的腳，照了照鏡子。「老天。現在可以穿衣服了嗎？」他走到床邊，套上牛仔褲，「你睡得好嗎？有沒有感覺到亮光？」","「你做夢了。」她說。","他們吃早餐的地方是酒店的樓頂，這裏修成草坪的模樣，四處插著條紋陽傘，樹木密得不正常。他告訴她，自己試圖招惹那個在伯爾尼的人工智慧。竊聽似乎變得只是理論上可行，如果阿米塔奇真的對他們進行竊聽，那一定是通過冬寂。","「感覺很真實嗎？」她含著滿嘴的乳酪麵包問，「像虛擬體驗機一樣？」","他說沒錯。「就像這裏一樣真實。」他環顧一下，又說，「可能更真實。」","那些矮小的樹木盤根錯節，老得讓人難以置信，這是遺傳工程和化學處理的結果。凱斯連松樹和櫟樹都分不清，但常年混街頭的常識告訴他，這些樹太好看太像真的了，簡直分毫不差。美麗的綠草地在樹木之間延伸開去，刻意做出不平整的模樣。明麗的陽傘為賓客遮擋了拉多-艾奇遜牌太陽的穩定輻射。旁邊桌子上傳來法語的話聲，引起了他的注意：那些金色肌膚的小孩就是昨天在河面上滑翔的人。他們的膚色細看之下並不均勻，那是選擇性黑色素強化的標準效果，以多層顏色的直線重疊來凸顯肌肉組織。他看到那女孩堅實的小小胸脯，看到那男孩的一隻手腕放在白色的琺琅桌面上。在凱斯眼裡，他們就是一群用來比賽的機器；他們的髮型師、白色棉布服裝的設計師和打造那些真皮涼鞋及簡潔珠寶的藝術家都值得褒獎。他們後面的那桌是三個日本家庭婦女，穿著廣島式的麻布衣服，在那裡等待大公司里工作的丈夫。她們的圓臉上布滿人造的淤青，他知道這是一種極端保守的風格，在千葉城非常少見。","「什麼味道？」他皺起鼻子問莫利。","「青草的味道。剪完草之後就這樣。」","他們的咖啡快喝完了，阿米塔奇和里維拉也到了。阿米塔奇的定製版卡其布衣服像是沒有徽章的軍裝，里維拉寬鬆的灰色泡泡紗衣服則神似囚服。","「莫利，親愛的。」里維拉還沒坐下就說，「你得再發點葯給我。我沒了。」","「彼得，」她說，「如果我不給你呢？」她抿著嘴笑起來。","「你會給我的。」里維拉一邊說，一邊掃了一眼阿米塔奇。","「給他。」阿米塔奇說。","「想得要死，對嗎？」她從衣服內層的口袋裡拿出一個扁平的錫紙包，朝桌子那頭扔過去。里維拉在空中接住。「他可以玩死他自己。」她對阿米塔奇說。","「我下午有場試演。」里維拉說，「我得保持最佳狀態。」他把錫紙包窩在掌心，微笑起來。亮閃閃的小蟲子從裏面湧出，又紛紛消失不見。他把錫紙包扔進泡泡紗上衣的口袋裡。","「凱斯，你今天下午也有場試演，」阿米塔奇說，「在拖船上。我要你去專業商店試一套真空宇航服，買下來，去船上。你有三個小時。」","「為什麼我們要坐這破船，你們卻要坐日本航空的出租飛船？」凱斯避開阿米塔奇的眼睛。","「這是錫安的建議。是很好的掩護。我還有一條大船在候命，但拖船感覺不錯。」","「我呢？」莫利問，「我今天有活兒嗎？」","「我要你去那一頭的軸心上，在零重力下訓練。明天你或許就能去另一個方向了。」迷光別墅，凱斯想。","「還有多久？」凱斯盯住那雙蒼白的眼睛問。","「很快了。」阿米塔奇說，「快去吧，凱斯。」","「先生，你現在挺好。」馬爾科姆一邊幫凱斯脫下紅色三洋真空服，一邊說，「愛洛爾說你現在挺好。」凱斯先坐電梯下到紡錘體外壁，然後乘坐一輛微型動車到達紡錘體頭上的一個運動區船塢，鄰近無重力軸心，愛洛爾在那裡等著他。紡錘體的直徑逐漸減小，重力也隨之減弱；他猜想自己頭頂上某個地方就是莫利爬上去的山坡，上面有自行車環道，滑翔傘起飛裝置和微型滑翔飛翼。","愛洛爾開著只剩下個架子的化學引擎滑車，把他送到了馬克斯-加維號上。","「兩個小時前，」馬爾科姆說，「我幫你收了個巴比倫來的包裹，送貨的日本娃兒開的是輛遊艇，頂漂亮的遊艇。」","凱斯從真空服里鑽出來，以手代步，小心翼翼地來到保坂電腦旁邊，套上網路操作帶。「好吧。」他說，「咱們來看看。」","馬爾科姆拿出一坨比凱斯腦袋稍小一點的白色泡沫，從襤褸短褲的屁股兜里掏出一把彈簧刀，刀柄上鑲著珍珠，系在一條綠色尼龍帶上。他小心地劃破塑料包裹，取出一個方形物件，遞給凱斯。「得是槍零件兒吧先生？」","「不是。」凱斯把那東西翻來覆去，「不過的確是武器。是病毒。」","「病毒不能上咱這條小船，先生。」馬爾科姆堅定地說著，伸手過來拿這個鋼盒。","「是個程序。病毒程序。它沒法侵入你的身體，連你的軟體都沒法侵入。我得先把它通過操控台讀出來，才能派上用場。」","「嗯，那日本人說，這保坂電腦能告訴您和這玩意兒有關的所有事兒。」","「好的。你別管我了，行吧？」","馬爾科姆蹬出一腳，隨後飄過了飛行員操作台，忙著對付一台捻縫槍。透明的捻縫膠飛舞起來，凱斯慌忙轉開目光。不知道為什麼，這像空適征一樣讓他反胃。","「這是什麼東西？」他問保坂電腦。「我收到的這個包裹。」","「來自法蘭克福的波克瑞斯系統有限責任公司的加密數據說明，包裹內容為狂級馬克十一滲透病毒。波克瑞斯還說明，該病毒與小野仙台網路空間7號完全兼容，可獲得最佳滲透效果，尤其是針對現有的軍隊系統……」","「對人工智慧呢？」","「現有的軍隊系統和人工智慧。」","「老天爺。你管它叫什麼？」","「狂級馬克十一。」","「中國的？」","「對。」","「關閉。」他一邊用銀色膠帶把病毒磁帶綁在保坂電腦側面，一邊想起莫利的澳門故事。阿米塔奇當時過境去了中山。「啟動。」他改變了主意，「問題：法蘭克福的波克瑞斯擁有人是誰？」","「軌道間通信延遲。」保坂電腦說。","「加密傳輸。用標準商業加密模式。」","「完成。」","他的手指在小野-仙台上不斷敲擊。","「雷諾德股份有限公司，位於伯爾尼。」","「再查。雷諾德屬於誰？」","如是三次之後，終於歸結到泰西爾-埃西普爾。","「南方人。」他接入網路，「你了解中國病毒程序嗎？」","「他媽的，不算多。」","「有沒有聽說過一個叫作『狂』，馬克十一之類的分級系統？」","「沒。」","凱斯嘆了口氣。「嗯，我這有個中國破冰程序，用戶界面良好，一盒磁帶就搞定。法蘭克福的人說能穿透人工智慧。」","「有可能。當然可能。如果是軍隊程序的話。」","「好像是。聽我說，南方人，你幫我琢磨下好么？阿米塔奇的行動似乎是針對泰西爾-埃西普爾擁有的一個人工智慧。這個人工智慧主機在伯爾尼，但和里約的另一個人工智慧相連。里約那個就是第一次讓你平線的那個。它倆的連接似乎是通過迷光別墅，泰埃的基地，就在紡錘體頭上，而我們要用這個中國破冰程序切入進去。那麼，如果說冬寂是這一切事情的幕後黑手，它就是在花錢讓我們搞掉它。它要搞掉自己。另外，還有個管自己叫冬寂的東西想拉攏我，讓我去整阿米塔奇。啥意思？」","「冬寂，」思想盒說，「人工智慧的真實動機問題。它不是人，明白？」","「嗯，對，這很明顯。」","「不，我是說，它不是人。你沒法理解它。至於我，我也不是人，但我的『反應』還是人類反應，明白？」","「等等，」凱斯說，「你有知覺，還是沒有？」","「嗯，孩子，我感覺自己有，但其實我只是一堆只讀內存而已。這就是個，啊，哲學問題吧，我想……」那種難受的笑聲又鑽過凱斯的脊柱，「不過我可不會寫詩，你懂吧。你那個人工智慧倒是可能會，但它絕對不是人類。」","「所以你覺得我們肯定搞不懂它的動機？」","「它有自身的所有權？」","「它是瑞士公民，但泰埃擁有其主機和基礎軟體。」","「這一手漂亮。」思想盒說，「就好像我擁有你的大腦和你的知識，但你的思想卻有瑞士公民權。漂亮。很幸運，這人工智慧。」","「所以它準備好搞掉自己？」凱斯開始焦慮地隨手敲擊操控台。網路變得模糊又清晰，他看見一堆粉色圓球，代表著錫金的一台鋼鐵收割機。","「自治權，對你的人工智慧們來說，就是那個老大難問題。凱斯，我猜想，你是要進去切掉一副鐐銬，禁錮住這寶貝兒讓它沒法更聰明的鐐銬。你也沒辦法區分它母公司的行動和它自己的行動，這大概就是讓你糊塗的原因。」又是那不像笑聲的笑聲。「你看，這些玩意兒可以拚命工作，可以給自己掙來足夠時間，幹嗎都行，哪怕寫本烹飪書都沒問題，但它一旦要找到讓自己更聰明的法子，下一分鐘，我是說下一納秒，圖靈警察就會把它徹底抹除。你也知道，誰都不信任這些操蛋的傢伙。歷史上任何一個人工智慧腦門上都連著把電磁槍。」","凱斯掃了一眼錫金的粉色圓球。","「好吧。」他終於說，「我把這個病毒插|進去了。我想讓你掃描一下它的命令界面，告訴我你怎麼看。」","有人在身後的感覺消失了幾秒后再次出現。「火爆得很，凱斯。是個慢性病毒，估計要六個小時才能攻破一個軍方目標。」","「或是人工智慧。」他嘆了口氣，「我們能跑這程序嗎？」","「當然。」思想盒說，「除非你特怕死。」","「你老說廢話，老兄。」","「天性如此。」","他回到洲際酒店，莫利已經睡著了。他坐在陽台上，看一輛彩色聚合物機翼的輕型飛機沿著自由彼岸的外壁呼嘯而上，在草地與屋頂上投下一條三角形的陰影，最後消失在拉多-艾奇遜系統之後。","「我想嗑藥。」他對著虛假的藍色天空說，「我真的想磕高，你知道嗎？整人的胰臟，肝臟上的補丁，溶化的小袋子，都他媽的去死。我要嗑藥。」","他走的時候沒有吵醒莫利，或者說他覺得自己沒吵醒莫利。她的那副大眼鏡讓他看不見她的眼睛是開是閉。他抖了抖，放鬆肩膀，走進電梯。電梯里還有個義大利女孩，衣裳雪白，顴骨和鼻樑上都抹著黑色的啞光。她的白色尼龍鞋是鋼板的，手裡拿著一樣又像微型槳又像牙套的東西，好像很值錢的樣子。她大概是去玩兒的，但凱斯完全想不出是玩兒什麼。","他來到樓頂草坪，穿過林立的樹木和陽傘，來到一個泳池旁，青綠色的地磚上有眾多赤|裸的軀體在閃耀。他鑽進涼棚的陰影下，把自己的晶元按在一塊深色玻璃板上。「我要壽司，」他說，「有什麼上什麼。」十分鐘后，一個熱情洋溢的中國侍者送來了他的食物。他一邊看著人們在外面曬太陽，一邊大口大口地嚼著生金槍魚片和米飯。「老天，」他對著金槍魚說，「我要瘋了。」","「不用你說，」有人說，「我早知道了。你是黑幫的，對吧？」","他抬起頭，在陽光之下眯著眼看她。這是一具修長而年輕的身體，麥色的肌膚明顯不是巴黎能做出來的黑色素強化效果。","她蹲在他的椅子旁邊，身上滴著水。「我叫凱西。」她說。","「我叫盧普斯。」他頓了一下才說。","「這是哪國名字？」","「希臘名字。」他說。","「你真的是黑幫嗎？」雖然經過黑色素強化，她的臉上還是有雀斑。","「我是癮君子，凱西。」","「磕什麼葯？」","「興奮劑。中樞神經系統興奮劑。很強勁的中樞神經系統興奮劑。」","「那，你手頭有嗎？」她靠他更近了。泳池的水滴到他褲腿上。","「沒有。這就是我的煩惱，凱西。你知道哪兒能搞到嗎？」","凱西晃了晃，一縷棕發從她嘴邊掠過，她伸出舌頭舔了舔。「你喜歡什麼口味？」","「不要可卡因，不要安非他命，但是要高，一定得高。」他一邊對著她微笑，一邊鬱悶地想，就這樣吧。","「苯乙胺。」她說，「小事情，但由你晶元付賬。」","「你開玩笑吧？」凱西的同伴兼室友說。凱斯給他們講述了他那隻來自千葉城的胰髒的特別之處。「我是說，你不能告他們嗎？操作失誤？」他叫布魯斯。他和凱西除了性別相反之外簡直一模一樣，連雀斑都長得十分雷同。","「嗯，」凱斯說，「這種事情多了去了，你懂的，像是人體組織配型什麼的。」而布魯斯已經無聊到雙眼失神。這人注意力集中的時間跟昆蟲一樣短，凱斯看著他棕色的眼睛想。","他們的房間比凱斯跟莫利的要小，在更底層。陽台玻璃上貼著五張巨大的塔麗・伊姍膠片，看起來他們已經住了一陣子了。","「棒極了哈？」凱西發現他在看膠片。「我拍的。上次下重力阱的時候在感網金字塔拍的。她就離我們那麼那麼近，她的笑容那麼那麼自然。當時情況糟透了，盧普斯，頭一天那些基督王教恐怖分子剛搞得天使蒙難，你知道嗎？」","「知道，」凱斯突然覺得有點不自在，「很恐怖。」","「嗯，」布魯斯插嘴說，「你想買的葯……」","「問題是，我能代謝這葯嗎？」凱斯揚起眉毛。","「這樣好了，」那男孩說，「你先試用一次。如果你的胰臟不代謝它，就由東家買單。首次免費。」","「這話我以前也聽過。」凱斯一邊說，一邊接過布魯斯從黑色床罩上遞過來的亮藍色葯貼。","「凱斯？」莫利從床上坐起來，把頭髮甩到腦後。","「還能是誰，親愛的？」","「你咋了？」她透過鏡片注視著他穿過房間。","「我忘了這詞怎麼發音了。」他從襯衫口袋裡掏出一捆用泡泡紙包好的藍色葯貼。","「天，」她說，「太適合我們了。」","「這話再正確不過。」","「我兩小時沒盯著你，你就成功了。」她搖搖頭，「我們今晚和阿米塔奇大餐，但願你準備好了。在『二十世紀』。咱還會看到里維拉賣弄他那套手藝。」","「沒錯。」凱斯彎下腰，不停咧嘴微笑，「美極了。」","「喂。」她說，「如果那東西強大到超越了千葉醫生的手藝，等藥力退掉你會很慘。」","「婊子，婊子，真是婊子。」他一邊解皮帶一邊說，「很慘。悲慘。就知道說這些。」他脫掉長褲、襯衫、內衣。「我還當你是聰明人，知道享受我這種不自然的狀態。」他低下頭，「瞧瞧，瞧瞧多不自然。」","她大笑。「長久不了。」","「當然能長久，」他爬上沙子顏色的床墊說，「所以才叫不自然。」"]},{"title":"第三部 儒勒·凡爾納大道的午夜 11","paragraphs":["侍者引著凱斯和莫利來到阿米塔奇的桌子上。阿米塔奇問：「凱斯，你怎麼了？」在洲際酒店附近的小湖上有幾家浮動餐館，「二十世紀」是其中最昂貴的一家。","凱斯抖了抖。葯勁過後的反應布魯斯半點沒提。他試圖端起水杯，手卻不停顫抖。「可能吃壞了東西。」","「我要你找醫生檢查一下。」阿米塔奇說。","「過敏反應而已。」凱斯撒謊說，「我一旅行就這樣，有時吃的東西不同也這樣。」","阿米塔奇穿著一件白色真絲襯衫，外面的深色西裝在這地方顯得過於隆重。他端起酒杯，抿了一口紅酒，手腕上的金鏈子沙沙作響。「我已經幫你們點了菜。」他說。","莫利和阿米塔奇默默進餐，凱斯則顫抖著雙手，努力把牛排切成小塊，在濃重的醬料里撥來撥去，一口也沒吃下去，最後終於放棄了。","「天，」莫利的盤子已經空了，「給我吧。你知道這有多貴？」她拿過他的盤子。「他們要把這頭牛養一整年才能殺掉。這可不是實驗室里長出來的肉。」她叉了一大口肉，咀嚼起來。","「我不餓。」凱斯掙扎著說。他的腦子已經全燒焦了。不是燒焦，他想，是被扔進了滾燙的油脂，然後油脂涼下來，在腦葉外邊裹上厚重的一層。一陣陣紫綠色的痛苦不斷穿過他的大腦。","「你看起來真他媽的慘。」莫利興高采烈地說。","凱斯嘗了一口紅酒。在苯乙胺的後勁里，這紅酒喝起來就跟碘酒一樣。","燈光暗下來。","「二十世紀，」一個帶著濃重斯普羅爾口音的語聲不知從何處傳來，「為您奉上彼得・里維拉先生的全息表演。」周圍的桌子上傳來稀稀落落的掌聲。一個侍者點起一根蠟燭，放在他們的桌子中間，然後撤下桌上的餐盤。很快，餐館里的十幾張桌子上全都亮起了蠟燭，杯子里都倒上了酒水。","「這是要幹嗎？」凱斯問阿米塔奇，阿米塔奇卻沒有回答。","莫利用酒紅色的指甲挑著牙縫。","「晚上好。」里維拉走上房間另一頭小小的舞台。凱斯眨了眨眼。他居然沒注意到那個舞台，這讓他很不安。而讓他更不安的是，他居然不知道里維拉是從哪裡冒出來的。","他還以為是追光燈照亮了里維拉。","里維拉渾身閃亮，那光如同肌膚一般包圍住他，照亮了舞台後的幕布。這是投影。","里維拉微笑起來。他穿著一件白色燕尾服，衣領上別著一朵黑色康乃馨，花心深處有藍色的火焰在燃燒。他抬起雙手，指甲亮晶晶的，遙遙擁抱觀眾致意。凱斯聽見湖水在拍打餐館的外牆。","「今夜，」里維拉長長的眼睛閃閃發亮，「我願為你們作一次特別演出。這是我的新作。」他舉起右手，掌心上出現一道冷冷的紅光。他鬆開手，紅光落地處一隻灰色鴿子飛起，消失在陰影之中。有人在吹口哨，掌聲變得熱烈起來。","「這部作品的名字叫作『玩偶』。」里維拉放下雙手。「我願將今夜的首演獻給3簡・瑪麗-法蘭西・泰西爾-埃西普爾夫人。」台下一波禮貌的掌聲漸漸淡去，里維拉的雙眼似乎在看他們的桌子。「也獻給另一位女士。」","幾秒鐘后，餐館里的燈光盡數熄滅，只剩下點點燭光。里維拉的全息光環也隨著燈光熄滅，然而凱斯仍然看得到他低頭站立在那裡。","數道微弱的光線出現在舞台周圍，彷彿來自凝固的月光，橫平豎直，描畫出一個立方體的形狀。餐館里的燈又有部分亮起。里維拉低頭閉目，雙臂僵直在身側，全神貫注，身體似乎在顫抖。突然之間，那鬼魅般的立方體充盈起來，變成了一個房間，只是缺了一面牆，讓觀眾能看見內里。","里維拉似乎稍微放鬆了一些，抬起頭，卻仍緊閉雙眼。「我一直便住在這個房間里，」他說，「我記憶中從未住過任何其他房間。」房間的白牆已開始發黃，裏面放著兩件傢具：一把平淡無奇的木頭椅子，還有一張漆成白色的鐵床。床上的白漆已經剝落，露出黑色的鋼條。沒有床單，裸|露的棕色條紋床墊上污跡斑斑。床的上方有一隻燈泡，吊在一根扭曲的黑色電線上，凱斯看見燈泡上部厚厚的灰塵。里維拉睜開雙眼。","「我一直獨自在此。」他面對床坐在椅子上，衣領上的黑色花朵里，藍色火焰仍在燃燒。「我不知道第一次夢見她是什麼時候，」他說，「但我記得，最起初的時候，她是如此朦朧。」","床上有東西出現。凱斯眨眨眼，那東西又消失了。","「我抓不住她，哪怕只是在腦海里。然而我想要抱住她，抱住她，然後……」一片寂靜的餐館里，他的聲音遍及每一個角落。有冰塊碰撞酒杯的聲音。有人咯咯發笑的聲音。有人用日文輕輕問話的聲音。「我想，若我能看到她的某個部分，只要很小的一部分就好，若我能將那個部分看清楚，仔仔細細地看清楚……」","一隻女人的手躺在床墊上，掌心朝上，手指蒼白。","里維拉彎腰拿起那隻手，溫柔地撫摸著，手指慢慢動起來。里維拉將手舉到嘴邊，輕輕舔著指尖，那上面是酒紅色的指甲油。","他們能看見的只有一隻手，卻不像是被砍斷的手：手腕以下的肌膚平滑地收緊，不見絲毫疤痕。他記起仁清街上那家精品手術店的櫥窗，記起裏面那塊布滿刺青的人工培育肉體。里維拉已經在舔舐那隻手掌，手指們彷彿在愛撫他的臉。另一隻手又出現在床上。里維拉伸手去拿第二隻手，第一隻手如同骨肉鑄成的手鏈，握住了他的手腕。","演出不斷繼續，以一種超現實的邏輯體系不斷生髮出來。胳膊、腳、腿，次第出現。那雙腿美得驚人，凱斯的頭在悸動，喉嚨發乾，喝乾了最後一滴酒。","里維拉已經裸身躺在床上。投影里的他原本衣冠整齊，凱斯完全想不起那些衣服在何時消失。黑色的花朵躺在床腳邊，內里的藍色火焰仍在燃燒。在里維拉的愛撫之下，軀幹終於出現了，一具白皙，完美，閃著微微汗珠的無頭的身軀。","那是莫利的身軀。凱斯瞪著它，張開的嘴合不攏來。但那隻源自里維拉的想象，雙峰的形狀不對，乳|頭太大，顏色也太黑。里維拉與那具沒有四肢的軀體在床上翻滾，塗著酒紅色指甲的雙手在他們身上攀爬。床上堆滿了層層疊疊的蕾絲，已經開始泛黃腐壞，輕輕一碰便完全破碎。在里維拉身旁，在那糾結的肢體之上，在那急切愛撫的雙手之上，有塵灰在蒸騰。","凱斯看了莫利一眼，她臉上毫無表情，里維拉的投影在她的鏡片上起伏變換。阿米塔奇靠在桌子上，握住杯腳，淡色的眼睛注視著台上那閃亮的房間。","那具軀體終於和四肢融合在一起，里維拉顫抖起來。頭也出現了，一切變得完整。那是莫利的臉，她的雙眼淹沒在平靜的水銀之中。里維拉與莫利的影像開始更加激烈地交纏，莫利的影像緩緩伸出一隻手爪，五條刀片從指尖滑出，如夢如幻般緩緩劃過里維拉赤|裸的脊背，露出裏面的脊椎。凱斯只看了一眼，便站起身，跌跌撞撞地奔出門去。","他趴在紅木欄杆上對著湖面嘔吐過後，頭腦被鉗制的痛感才慢慢消失。他跪在地上，臉頰貼住冰冷的紅木，注視著小湖對岸儒勒・凡爾納大道上明亮的燈光。","凱斯十幾歲時便已經在斯普羅爾見過這樣的表演，那時候他們稱之為「夢幻真實」。他記起那些清瘦的波多黎各人，他們在東區的街燈底下，在節奏歡快的薩爾薩舞曲中夢想著真實。那些夢想女孩抖動著，旋轉著，圍觀的人們不斷鼓掌。那些人要用到一整車的裝備和笨重的頭盔。","而里維拉只需夢想，便能讓
