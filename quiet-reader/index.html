你感同身受。凱斯的頭還在痛，他搖搖頭，朝湖裡唾了一口。","他能猜得到結局，猜得到終章。那是一種反對稱，里維拉將那夢想女孩組裝成形，而夢想女孩用那雙美麗的手再將他拆解成塊。夢裡的鮮血浸透了那陳腐的蕾絲。","餐館里傳來歡呼聲和掌聲。凱斯站起來，撫平自己的衣服，轉身走進二十世紀。","莫利已經不見了，舞台上也空無一人。阿米塔奇獨坐在桌旁，仍然握著杯腳，注視著舞台。","「她人呢？」凱斯問。","「走了。」阿米塔奇說。","「找他去了？」凱斯問。","「沒有。」有輕微的破裂聲傳來，阿米塔奇低下頭，看著自己的酒杯。他的左手挪到杯身上，斷裂的杯腳戳在那裡，像一根冰凌。凱斯接過酒杯，放到一隻水杯裏面。","「告訴我她去哪裡了，阿米塔奇。」","燈又亮起來，阿米塔奇淡色的眼睛里空無一物。「她去準備行動了。你們會一起行動，但之前你不會再見到她了。」","「里維拉為什麼這樣對她？」","阿米塔奇站起來，整了整衣領。「凱斯，去休息一下。」","「行動是明天？」","阿米塔奇毫無意義地笑了笑，走向出口。","凱斯揉了揉額頭，環顧四周。食客們紛紛站起，男人們在打趣，女人們笑起來。他發現這裏居然還有包廂，裏面陰暗而私密，閃動的燭光在天花板上投下舞動的影子。","那女孩的臉突然出現，如同里維拉的投影，小小的雙手扶著光滑的木欄杆，探身向前，深邃的眼睛專註地看著某個地方。她看的是那個舞台。那張臉雖不美麗，卻令人過目難忘。一張瓜子臉，高高的顴骨顯得異常脆弱，抿緊的大嘴，與鼻孔翕開的鷹鉤鼻形成一種詭異的平衡。轉眼之間，她又消失在包廂里的笑聲和舞動的燭光之中。","離開餐館的時候，他看見兩個年輕的法國男人和他們的女友在等候渡船，去往湖對面最近的賭場。","房間里靜悄悄的，床墊一平如洗，如同退潮后的沙灘。她的包不見了。他四處尋找她可能留下的紙條，卻一無所獲。他緊張又不快，過了幾秒鐘才注意到窗戶上的景色。他抬起頭，看見德斯德雷塔大街上那些昂貴的商店：古奇，艷子，愛馬仕，利博迪。","他獃獃地看了一陣，搖搖頭，走到操縱板旁邊，關掉全息景象，再次看見窗外遠處斜坡上的那些公寓。","他拿起電話，走到涼意颼颼的陽台上。","「我要馬克斯-加維號的電話，」他對前台說，「在錫安島群註冊的一艘拖船。」","合成語音念出一串十個數字。「先生，」合成語音接著說，「該船是在巴拿馬註冊的。」","電話鈴響到第五聲，馬爾科姆才接起來。「誰？」","「我是凱斯。馬爾科姆，你那裡有數據機嗎？」","「有。你曉得啦，在導航電腦上邊兒。」","「老兄，能不能幫我取下數據機，接在我的保坂電腦上？然後打開我的操控台，就是上面有棱的那東西。」","「先生，你那邊還好哇？」","「呃，我需要幫助。」","「就來了，先生。我去拿數據機。」","馬爾科姆用電話線連上數據機，凱斯的話筒里傳來輕微的靜電聲。他聽見了保坂電腦的鳴響，才說：「加上冰牆。」","電腦中規中矩地說：「你所在的位置受到嚴密監控。」","「操。」他說，「算了。不用冰牆了。接通思想盒。南方人？」","「嗨，凱斯。」平線通過保坂電腦的語音合成晶元發聲，那精心打造的南方口音便完全消失了。","「南方人，你趕緊來這裏幫我搞點東西。不用隱藏形跡。莫利在這邊，但我想知道她的具體|位置。我在洲際酒店西335號房。她也在這裏登記入住，但我不知道她用的是什麼名字。就通過這電話進來，幫我查他們的紀錄。」","「馬上。」平線說。凱斯聽見平線入侵的白雜訊，微笑起來。「搞到了。羅絲・克洛尼。已經退房了。我花了幾分鐘才整翻他們的安全網，搞定這事。」","「去吧。」","電話隨著思想盒的行動而咯嗒作響。凱斯拿著電話回到房間里，將話筒平放在床墊上，去浴室刷牙。他走出浴室，房間里那套博朗牌視聽設備的顯示器突然亮了起來，一個日本明星靠在金屬色墊子上，屏幕之外有記者在用德文提問。凱斯瞪住屏幕。屏幕上有藍色的干擾波閃過。「凱斯，寶貝兒，你瘋了嗎？」緩緩的語聲十分熟悉。","陽台的玻璃牆上再次閃出德斯德雷塔的街景，隨即模糊下去，扭轉起來，變成了千葉城的「茶罐」酒吧，裏面空蕩蕩的，紅色的霓虹燈在兩壁的鏡子之間折射到無窮遠處。","羅尼・鄒帶著種死亡氣息走上前來，仍然是高高的個子，仍然是藥力之下那舒緩的動作。他獨自站在方桌之間，雙手揣在灰色鯊魚皮衣服口袋裡。「真的，老兄，你好像完全散架了。」","他的聲音從博朗牌視聽設備的音箱里傳出來。","「冬寂。」凱斯說。","那皮條客慢吞吞地聳聳肩，笑起來。","「莫利在哪裡？」","「你不用擔心。凱斯，你今晚搞砸了。平線已經弄得自由彼岸到處警鐘長鳴。我沒想到你會這麼做，老兄。這和你的資料不符。」","「告訴我她在哪裡，我就叫他住手。」","鄒搖搖頭。","「凱斯，你保不住自己的女人，對不對。你總會失去她們，以各種不同的方式失去她們。」","「我他媽要把你整到癱瘓。」凱斯說。","「不會的，你不是那種人，老兄。我了解你。你知道嗎，凱斯？我猜你已經想通了，在千葉城叫迪安做掉你那小婊子的就是我。」","「別。」凱斯不由自主地朝窗戶邁進一步。","「其實不是我。不過有什麼關係？這對於凱斯先生到底有什麼關係？別扯了。我認識你那位琳達。我認識所有的琳達。琳達不過是我生產線上的常規產品。你知道她為什麼要偷你的東西嗎？因為愛。因為她希望你介意。愛？我們來談談愛吧。她愛你。我知道，她雖然無足輕重，但是她愛你。你卻承受不來。所以她死了。」","凱斯的拳頭從玻璃上彈回來。","「別搞爛了你的手，老兄。你還要拿操控台呢。」","鄒消失了，玻璃上顯現出自由彼岸的夜色和公寓樓的燈光。視聽系統自行關閉。","床上的電話不斷鳴響。","「凱斯？」平線已經等在那頭。「你去哪兒了？我找到她了，但只有這麼點信息。」思想盒念出一個地址。「作為一個夜總會，這地方的冰牆有點兒詭異。我只能搞到這麼多了，要不就該完全暴露了。」","「好，」凱斯說，「叫保坂電腦告訴馬爾科姆斷開數據機。南方人，謝謝你。」","「樂於效勞。」","他在床上坐了許久，咀嚼著那種全新的，寶貴的感覺。","憤怒的感覺。","「嗨，盧普斯。嗨，凱西，是咱們的朋友盧普斯。」布魯斯赤身裸體地站在門廊里，身上滴著水，瞳孔放得老大。「不過我們正在洗澡。你要等等嗎？還是一起洗？」","「不，謝謝。我需要幫助。」他推開布魯斯的胳膊，走進房間。","「嘿，老兄，真的，我們在……」","「你們要幫助我。你們很高興見到我。因為我們是朋友，對嗎？是不是？」","布魯斯眨眨眼。「當然。」","凱斯背出平線給他的地址。","「我就知道他是個黑幫。」凱西在淋浴房裡興高采烈地喊。","「我有輛本田三輪車。」布魯斯空洞地微笑。","「我們現在就走。」凱斯說。","「那一層都是隔間。」布魯斯在第八次問過凱斯地址后說。他重新爬上本田車，氫電池排氣管口滴著冷凝水，銀色減震器上面是紅色玻璃纖維車身在晃動。「你要很久嗎？」","「不知道。但你們要等我。」","「我們會等你，當然。」他撓撓赤|裸的胸脯，「你那地址最後一段，我覺得是個隔間號碼。四十三號。」","「有人知道你來嗎，盧普斯？」凱斯從布魯斯肩上探過來，抬頭看他。她的頭髮一路上已經被風吹乾。","「大概沒有。」凱斯說，「有問題嗎？」","「去最下面一層，找到你朋友的隔間。如果他們放你進去就好。要是他們不想見你……」她聳聳肩。","凱斯轉過身，沿著雕花鐵欄杆的螺旋形樓梯走下去。轉過六層樓后，他來到一家夜總會。他停下來，點起一支頤和園，打量桌旁的人們，終於理解了自由彼岸。生意。他聽得見空氣里交易的聲音。他就在這裏，在做生意的地方，不是儒勒・凡爾納大街上那些光鮮亮麗的門面，而是真正的生意場，商場，真正的意義所在。這裏的人來自四面八方，大概有一半是遊客，另一半則是周邊的島民。","「下樓，」他對路過的侍者說，「我要下樓。」他亮出自己的自由彼岸晶元。那侍者指指夜總會最裡面。","他迅速穿過擁擠的酒桌，一路斷斷續續聽見各種歐洲語言。","「我要一個隔間。」他對那張矮桌旁坐著的女孩說。那女孩膝上放著一台電腦終端。「下層的。」他把自己的晶元遞給她。","「什麼性別？」她將晶元掃過終端上的一塊玻璃板。","「女性。」他本能地回答。","「三十五號。如果不滿意就打電話。如有需要，可以先看看特殊服務顯示屏。」她微笑著將晶元還給他。","她身後的電梯門滑開。","走廊上的燈是藍色的。凱斯走出電梯，隨便選了一個方向走下去。門上都標著號碼，走廊里靜悄悄的，像一間昂貴的診所。","他看到了自己的隔間。他本想找莫利那間，現在卻糊裡糊塗地舉起自己的晶元，放在門牌下方黑色的感應器上。","這裏用的是磁性鎖，開鎖的聲音讓他想起廉價旅館。","床上的女孩坐起來，說了句德語，溫柔的眼睛一眨不眨。自動模式。她的神經通路已經切斷。他退出房間，關上門。","四十三號的門毫無特異之處。他猶豫著——走廊里悄無聲息，說明這些房間都是隔音的，用晶元也肯定打不開。他用力敲著金屬門，卻同樣是徒勞，所有的聲音似乎都被吸收掉了。","他把晶元放到黑色感應器上。","門閂一響。","門還沒打開，她似乎便已擊中了他。他跪在地上，背靠鋼門，眼前是她僵硬的指尖上，刀刃在幾厘米開外顫抖。","「天啊。」她站起身來，拍拍他的頭，「你真是蠢到家了。你怎麼能把鎖打開的，凱斯？凱斯？你沒事吧？」","她彎下腰。「用晶元。」他一邊說一邊喘息，疼痛從胸膛蔓延開來。她扶他起身，將他推進房間。","「你買通了上面的人？」","他搖搖頭，倒在床上。","「吸氣。跟我數，一，二，三，四。屏氣。呼氣。再數。」","他捂住胸口。","「你踢了我一腳。」","「我應該踢得更低點的。我想獨處。我在冥想，明白？」她坐到他身旁。「還在聽簡報。」她指指對面牆上一台小小的顯示器，「冬寂正在給我講迷光別墅的情況。」","「它的人形傀儡呢？」","「沒有。那是昂貴的特殊服務。」她穿著皮夾克和寬鬆的黑襯衫，站起身來。「行動就在明天，冬寂說。」","「飯館里到底怎麼回事？你為什麼跑掉？」","「因為我如果留下來，恐怕會殺了里維拉。」","「為什麼？」","「因為他對我做的事。那場演出。」","「我不明白。」","「這需要很多錢。」她伸出右手，好像虛握著一隻水果，五隻刀片滑出來，隨即平穩地收起。「去千葉要很多錢，做手術要很多錢，強化神經系統讓反射弧能配合裝備也要很多錢……你知道我剛開始是怎麼弄到這些錢的嗎？就在這裏。不是這個地方，是斯普羅爾一個類似的地方。開始很輕鬆，因為放了晶元切斷神經之後，錢就像是白來的，最多有時醒來身上會酸痛而已。完全就是出租肉體，行事的時候你根本不在場，他們有軟體，顧客想幹嗎都可以……」她的指關節咯嗒作響。「好了。我拿到了錢。問題是神經切斷晶元和千葉城診所植入的迴路不兼容。工作時間的事情一點點漏進來，我能夠記住它們……不過只是像做了惡夢一樣，而且時常也有好夢。」她微笑。「然後事情就變得詭異起來。」她從他口袋裡掏出煙盒，點燃一支煙。「老闆發現了我拿錢去乾的事。我已經裝好了刀片，但還需要再去千葉三次才能完成神經運動系統的微調，所以還沒法放棄玩偶生活。」她深吸一口，噴出一股煙，再加上三個完美的煙圈。「於是那個混蛋主管就讓人搞了種特殊軟體。柏林，就是專門搞那種事的地方，你知道嗎？柏林，那裡變態多得很，各種下流刺|激的玩法。我一直不知道寫我那個軟體的人是誰，但軟體的內容是全部經典套路。」","「他們知道你漸漸有感覺了？知道你幹活兒的時候有知覺？」","「我沒有知覺。就像是在賽博空間，空白的賽博空間。一片銀色，有下雨的氣味……但你能看到自己在高潮，就像看到宇宙邊緣一顆小小的超新星。但我漸漸能記得那些事了，就像記得做過的夢。他們切換了軟體，將我放在特殊需求市場上出租，卻沒有告訴我。」","她的聲音聽起來很遙遠。「這些我都知道，但並沒說出來。我需要錢。那些夢越來越可怕，我一直告訴自己，其中有些真的只是夢而已。但是那時我已經知道，老闆那裡有一個穩定的客戶群要找我。老闆說，對莫利再好也不為過，然後給我漲了那麼一丁點兒臭錢。」她搖搖頭。「那變態收的價錢是我工資的八倍，他還當我不知道。」","「他用什麼名目收這麼高價錢？」","「惡夢。真正的惡夢。有一個晚上……有一個晚上，我剛從千葉城回來。」她把煙頭扔在地上，用鞋跟碾滅，再坐下來，靠在牆上。「那一次醫生手術做到很深的地方。那是很困難的手術，肯定不小心碰到了神經切斷晶元。那一次我醒過來了，當時還和一個顧客在進行日常活動……」她的手指深深扎進床墊。「他是國會議員，我一眼就認出了那張肥臉。我們倆全身都是血。屋裡還有個人，她已經……」她抓住床墊。「死了。那個變態胖子，他還在說，『怎麼了？怎麼了？』因為我們還沒幹完……」","她顫抖起來。","「然後我就給了那議員他最想要的東西，你懂嗎？」她不再顫抖，放開了床墊，用手指梳理自己的黑髮。「老闆僱人追殺我。我躲了一陣子。」","凱斯瞪住她。","「所以昨晚里維拉戳到了我的痛處，」她說，「我想他是希望我恨死他，然後就會瘋狂地追進去。」","「追進去？」","「迷光別墅，他已經進去了。是3簡小姐邀請他去的，記得他那操蛋的致辭？當時她在私人包廂里……」","凱斯記起那張臉。「你要殺了他？」","她冷冷地微笑。「他快死了，沒錯。很快。」","「也有人來看我了。」他給她講了他們房間的窗戶，還有那個冒牌鄒說的琳達的事情。她點點頭。","「或許它也希望你恨某樣東西。」","「或許我恨的是它。」","「或許你恨的是你自己，凱斯。」","「怎樣？」凱斯爬上本田車的時候，布魯斯問。","「自己試試啰。」他揉著眼睛說。","「看不出你居然是喜歡玩偶的那種人。」凱西不快地說著，在手腕上又貼了一張葯貼。","「咱們可以回家了嗎？」布魯斯問。","「當然。把我扔在儒勒・凡爾納街，那些酒吧旁邊。」"]},{"title":"第三部 儒勒·凡爾納大道的午夜 12","paragraphs":["儒勒・凡爾納大道在紡錘體的正中間，環繞外殼一圈；德斯德雷塔街則縱貫紡錘體，兩頭終結于拉多-艾奇遜光泵的支架處。如果從德斯德雷塔街右拐上儒勒・凡爾納大道，一直走下去，就又會從左側接近德斯德雷塔街。","凱斯注視著布魯斯的三輪車遠去，消失在視野之外，才轉過身，走過一間巨大雪亮的報刊亭。數十本日本雜誌展示在那裡，封面上都是當紅的虛擬感受明星。","頭頂上方是人造的夜色，華麗的星座閃爍在全息影像的天空之中，如同一張張紙牌，印著骰子，禮帽，酒杯……德斯德雷塔街和儒勒・凡爾納大道的路口彷彿一道峽谷，自由彼岸那些懸崖居所的陽台層層疊疊，一直延伸到一家大型賭場青草萋萋的高原上。凱斯看到一架輕型無人駕駛飛機藉著上升氣流，優雅地滑過那碧綠高原的邊緣，沐浴在那隱蔽的賭場柔和的燈光之中。這種飛機是蛛絲聚合物製成，絲質的兩翼彷彿一隻巨大的蝴蝶，消失在高原之上。在激光的鏡片或塔樓之上，霓虹燈的倒影閃過。這些飛機屬於自由彼岸的保安系統，控制它們的是一部主電腦。","那電腦是在迷光別墅里嗎？他繼續走下去，路過一排排名字各異的酒吧：高-低、天堂、世界、板球手、史密斯忍者服、緊急情況……他選擇了「緊急情況」，因為它最小，也最擁擠；但他很快發現這裏都是遊客，沒有生意可做，只有男女之事。他有點想去莫利房間上面那間無名夜總會，卻停住了，想起了莫利注視那張屏幕的模樣。冬寂現在又在跟她說什麼呢？迷光別墅的地圖，還是泰西爾-埃西普爾家族的歷史？","他要了一杯嘉士伯啤酒，在牆邊找了個座位坐下。他閉上眼，在身體里搜尋他的憤怒，那微末卻純粹的憤怒。憤怒仍然在，但哪裡才是這憤怒的源頭？孟菲斯的傷痛給他帶來的只是挫敗，夜之城裡殺人奪財時完全麻木不堪，即便琳達的死，也不過只有種鈍鈍的噁心與憎恨，沒有一次，任何一次，能讓他憤怒。他腦海里出現了一面屏幕，一面遙遠而微小的屏幕，一個假迪安跌倒在一堵假牆壁上，迸出一片腦漿與鮮血。他明白了，那種憤怒源自於那間遊戲廳，源自於冬寂復生了琳達的影像，而又從他手中奪走那些最基本的動物的需求：食物，溫暖，一個睡覺的地方。然而一直等到與假羅尼・鄒對話之後，他才終於感覺到這種憤怒。","這感覺很奇怪。他不懂。","「麻木。」他說。他已經麻木了很久，很多年。仁清街上的那些夜晚，與琳達在一起的那些夜晚，每一次的交合，每一次生意場上冷汗涔涔的行動，都不過是一片麻木。但現在他找到了這種溫暖，這種殺人的籌碼。肉身，他對自己說，這是肉身的感受。不要在意。","「黑幫。」","他睜開雙眼。凱西站在他身旁，穿著條黑裙子，頭髮還和坐車時一樣狂亂。","「我還以為你回去了。」他喝了一口酒，掩蓋自己的窘態。","「我讓他把我放在這家商店了。買了這件裙子。」她隔著裙子撫過自己的骨盆曲線，他看見她手腕上的藍色葯貼。「喜歡嗎？」","「當然。」他不由自主地掃視過周圍的人，再看向她。「你想要幹嗎，親愛的？」","「你喜歡我們給你的苯乙胺不，盧普斯？」她湊得很近，他感覺到她身上的熱氣和她緊繃的身體，她的雙眼裡是巨大的瞳孔，脖子上的青筋暴起，如同繃緊的弓弦。她在顫抖，新鮮的藥力之下的顫抖。「你爽了沒？」","「爽了。但後勁糟透了。」","「那你就要再來一粒。」","「那又怎麼樣？」","「我有一把鑰匙。那地方就在『天堂』後面的坡上，有最舒服的床。他們今晚都下重力阱去辦事了，只要你跟我走……」","「只要我跟你走。」","她雙手拉起他的手，掌心火熱而乾燥。「你是日本黑幫的，對嗎，盧普斯？日本黑幫的外國戰士。」","「你還真有眼光。」他抽出手來，翻找煙盒。","「你怎麼還十指齊全呢？我還以為你搞砸一次就要切一根指頭。」","「我從來沒搞砸過。」他點起煙。","「我看到你那個姑娘了，認識你那天。她走路的樣子好像海迪歐，嚇死我了。」她的笑容誇張得過分，「我喜歡。她喜歡女人嗎？」","「她沒提過。海迪歐是誰？」","「3簡的手下，她管他叫臣子。家臣。」","凱斯強自鎮定，假裝漠然地看著酒吧里的人潮，說：「迪-簡？」","「3簡夫人。她可是大人物。大財主。這一切都屬於她爸所有。」","「這間酒吧？」","「整個自由彼岸！」","「我靠。你很有些高級的朋友啊？」他揚起眉毛，伸手攬住她，手掌放在她的屁股上。「你是怎麼認識這些貴族的？你是富家少女啊？你和布魯斯秘密繼承了大筆老錢？」他張開手指，隔著裙子揉捏她的身體。她在他懷裡扭動身軀，笑起來。","「你知道啦，」她低下眼，假作謙虛地說，「她喜歡搞聚會。布魯斯和我嘛，會搞聚會圈子。她在那裡邊真的無聊到死。她那老頭子有時也會放她出來，條件是有海迪歐隨身保護。」","「她在哪裡邊無聊到死？」","「他們管那地方叫迷光。她跟我說，裏面真的很美，有池塘，有睡蓮。那是一座城堡，真正的，石頭的城堡，看得見日落的城堡。」她依偎在他懷裡，「嘿，盧普斯，你需要一片葯貼，我們才能在一起。」","她脖子上掛著一個小小的錢包，粉色指甲在強化過的麥色肌膚映襯下格外鮮亮，卻都被咬禿了。她打開錢包，拿出一個泡沫紙包，裏面是一片藍色的葯貼。一樣白色的東西掉在地上，凱斯撿起來，是一隻紙鶴。","「是海迪歐給我的，」她說，「他想教我疊，可我怎麼也學不會，疊出來脖子總是反的。」她把紙鶴塞回錢包里。凱斯看著她撕開紙包，揭起葯貼，平貼在他手腕內面。","「3簡的下巴很尖，鷹鉤鼻？」他的手畫出一個輪廓，「黑頭髮？很年輕？」","「是吧。但她是大人物。那麼那麼多錢。」","藥力迅猛得如同高速列車，一股白熱的光芒從前列腺周邊攀上他的脊椎，短路的性快|感照亮了他頭骨間全部縫隙。每一顆牙齒都像一枚音叉，在他的牙槽里歌唱，音調精準無比，歌聲清楚得猶如乙醇。在朦朧的血肉包裹之下，他的骨架被打磨得鋥亮，關節也變得滑溜。沙暴從頭顱底部席捲而過，一波一波的高強度靜電在眼睛後面戛然而止，變作最純凈的晶體，不斷生長……","「來吧，」她拉起他的手說，「現在你也有了。咱們都有了。上山去，咱們可以來一整夜。」","隨著苯乙胺狂濤而來的是他的憤怒，不斷地，指數式地擴張，如同滾燙而濃重的岩漿。他的下體硬得像鉛棍。周遭的人臉都變成了玩偶的面孔，用粉白兩色畫出的嘴巴動來動去，冒出一個個聲音構成的氣球。他看到凱西麥色肌膚上的毛孔張開，眼睛如同玻璃珠一樣毫無生氣，整個人都有點腫脹，甚至還能看出她乳|房一大一小，鎖骨也不對稱——他眼中一片煞白。","他丟開她的手，推開人群衝出門去。","「我操你媽！」她在身後尖叫，「死強盜！」","他的雙腿毫無感覺，好像踩著高蹺，搖搖晃晃地衝過儒勒・凡爾納街的石板路，耳中隱隱聽見渾身血液隆隆流過，一片片鋒利的光芒從各個角度切開他的頭顱。","他抬起頭便站住了，再也動彈不得，雙拳緊緊靠在腿邊，扭曲的嘴唇輕輕顫抖。頭上是自由彼岸的星空，眾多全息投影的星座里，每一顆星子彷彿都有了自己的生命，圍繞著那黑暗的軸心，圍繞著那不可撼動的真實，在不停流動。斗轉星移，直到所有的星星排列停當，在夜空中刻出一張簡潔的肖像。那是琳達・李小姐的臉。","他過了許久才轉開臉，看到街上所有的人都仰起頭，所有悠閑的遊客都為這奇景而震驚。等到空中的光芒終於消逝，儒勒・凡爾納大道上爆發出一陣歡呼，回蕩在來自月球的混凝土搭建的台階與陽台之間。","鐘聲不知在何處響起，那是來自歐洲的古老鐘聲。","已是午夜。","他一直走下去，直到天明。","藥力消退下去，曾經打磨光亮的骨架一點點被侵蝕，血肉開始僵硬，整個軀體再次變回自己的肉身。他無力思考。他異常欣慰于這種狀態：充滿感知，無力思考。他似乎能融入眼前的每一樣東西：公園裡的長椅，古老街燈旁的白色飛蛾群，黑黃相間的機器園丁。","複製的清晨沿著拉多-艾奇遜系統爬過來，帶著一種慘淡的粉紅。在德斯德雷塔街上的一間咖啡店，他逼著自己咽下一個煎蛋餅，喝了一杯水，抽完最後一支煙。他穿過洲際酒店鬧哄哄的屋頂草坪，早起用餐的人群在條紋陽傘底下認真對付咖啡和牛角麵包。","他的憤怒仍在。這簡直像在一條小巷遇劫后卻發現錢包仍在，毫髮無損。他不知道該怎麼稱呼這樣的憤怒，也不知道該對誰發泄，只有借它溫暖全身。","他坐電梯下到自己的樓層，在口袋裡翻找當鑰匙用的信用晶元。睡意開始具象化，他或許能睡得著，或許能躺倒在那沙子顏色的床墊上，再次進入那種完全空白的狀態。","他們已經在房間里等他。三個人，雪白的運動服，毫無特點的麥色肌膚，在那手工打造的房間里全不搭調。一個女人坐在藤椅里，印著樹葉圖案的椅墊上有一隻自動手槍躺在她身旁。","「我們是圖靈警察，」她說，「你被捕了。」"]},{"title":"第四部 迷光行動 13","paragraphs":["「你名叫亨利・多賽特・凱斯。」她背出他的出生年月和地點，他的波亞個人身份證號碼，還有一連串的名字。他慢慢想起，這些都是他用過的假名。","「你們到了有一陣子了吧？」他看到自己包里的東西被攤在床上，連臟衣服都已經分類放好，那枚飛鏢單獨擺在床墊上，兩邊是牛仔褲和內衣。","「克洛尼在哪裡？」兩個麥色皮膚的男人並肩坐在沙發上，手臂抱在胸前，脖子上掛著一模一樣的金項鏈。凱斯偷偷掃了他們一眼。他們外表極為年輕，指節上連外科醫生也去不掉的皺褶卻透露出真實的年齡。","「克洛尼是誰？」","「這是她登記入住的名字。她在那裡？」","「我不知道。」他一邊說，一邊走到吧台旁，倒了杯礦泉水。「她走了。」","「你今晚去哪裡了，凱斯？」那女孩拿起槍放在自己身旁，並未指向他。","「儒勒・凡爾納大道，去了幾間酒吧，嗑藥了。你們呢？」他雙膝發軟，喝了一口水，感覺到一股平和的暖意。","「我看你不大明白自己的處境，」左邊的男人一邊說，一邊從白色網眼上衣胸前的口袋裡掏出一包吉坦尼斯，「你被捕了，凱斯先生。你的罪名是陰謀協助人工智慧。」他又從同一個口袋裡掏出一隻金色登喜路打火機，在手中把玩。「你稱為阿米塔奇的那個男人已經被我們控制了。」","「科爾托？」","那男人睜大了眼睛。「沒錯。你怎麼知道他的名字？」一小團火焰從打火機上跳出來。","「我忘了。」凱斯說。","「你會想起來的。」那女孩說。","三個人分別叫作米雪兒、羅蘭德和皮埃爾，大概都是假名。凱斯覺得皮埃爾唱的是黑臉，而羅蘭德則會幫著凱斯，施點小恩小惠——凱斯表示自己不抽吉坦尼斯香煙的時候，他居然找出了一包沒開過封的頤和園——以別於皮埃爾的冷酷和兇悍。米雪兒則是「記錄天使」，偶爾參与審訊策略的調整。他知道他們中至少有一個人一直在發送音頻甚至虛擬感受數據，他現在所說所做的一切都將成為呈堂證供。在葯勁過後的痛苦中，他問自己：這證據能證明什麼呢？","他們之間的交談完全不避諱他，或許是以為他聽不懂法語，也或許是故意說給他聽。他聽到了泡利、阿米塔奇和感網；現代黑豹這個名字更是在一片巴黎口音的汪洋大海之中脫穎而出。他們一直管莫利叫克洛尼。","「凱斯，你說有人僱用你執行一項行動，」羅蘭德裝作通情達理，緩緩地說，「而你不知道行動目標。對你這個行當來說，這不太正常吧？你在穿透防禦層后，不是可以進行僱主要求的操作嗎？僱主肯定會要求你進行某種操作，對不對？」他身體前傾，手肘放在標準色調的棕色膝蓋上，攤開雙手，等待凱斯的回答。皮埃爾則在房間里踱步，一會走到窗邊，一會走到門邊。凱斯認為發送信號的應該是米雪兒，因為她的眼睛一直盯住他不放。","「我能穿上衣服嗎？」他問。之前皮埃爾堅持要把他剝光，連牛仔褲的褲縫都搜了一遍，所以他正赤身裸體地坐在藤編腳墊上，一隻腳還是慘白的膚色。","羅蘭德用法語問了皮埃爾一句。皮埃爾站在窗邊，用一架小望遠鏡向外張望。「不行。」他心不在焉地說。羅蘭德聳聳肩，朝凱斯挑挑眉毛。凱斯抓住時機沖他微笑，羅蘭德也報以笑容。","這真是書里最老套的伎倆，凱斯想。「可是，」他說，「我不舒服。我在酒吧里磕了種破葯，你們懂的。我就想躺下。我已經在你們手裡了，你說阿米塔奇也給抓住了，那幹嗎不去問他？我只是他雇來的而已。」","羅蘭德點頭。「克洛尼也是？」","「阿米塔奇先雇她的。她只是個打手，是個刀鋒女孩。我就知道這麼點。」","「你知道阿米塔奇的真名是科爾托，」望遠鏡的塑料邊遮住了皮埃爾的眼睛。「你是怎麼知道的呢，朋友？」","「他好像提過，」凱斯後悔自己說漏了嘴，「誰沒有幾個名字，難道你真叫皮埃爾？」","「我們知道你在千葉城接受整修的過程，」米雪兒說，「這大概是冬寂犯的第一個錯誤。」凱斯凝視著她，努力裝出一副迷茫的表情。他們沒提過這個名字。「那個診所老闆用這套東西申請了七項基本專利。你知道這意味著什麼嗎？」","「不知道。」","「這意味著千葉城一個地下診所的運營者獲得了三家主要醫療研究會的控制權。你要知道，這樣做擾亂了市場秩序，難免惹人耳目。」她靠在椅墊上，棕色的胳膊抱在高聳的胸前，凱斯默默揣測她的實際年齡。人們都說眼睛會泄露真實年齡，可他卻從來看不懂。在他看來，朱利・迪安的粉色石英鏡片下面，眼神如同一個無聊的十歲小孩。米雪兒渾身上下青春洋溢，唯有指關節例外。「我們跟蹤你到了斯普羅爾，跟丟了一陣，又在你去伊斯坦布爾之前找到了你。我們追溯舊事，清查了你在網路中的行動，確認在感網公司發起那場騷亂的就是你。感網公司積極與我們合作，在清點庫存后發現，麥可伊・泡利的只讀人格思想盒丟了。」","「在伊斯坦布爾，」羅蘭德的語氣里簡直帶著歉意，「事情就容易多了。那女人得罪了阿米塔奇在秘密警察隊伍里的接頭人。」","「然後你就來到這裏，」皮埃爾一邊說，一邊把望遠鏡塞進短褲口袋，「我們很高興。」","「這樣你們就有機會日光浴了？」","「你明白我們的意思，」米雪兒說，「裝傻只會對你自己不利。你還要被引渡，凱斯，你和阿米塔奇都要跟我們回地球。但是到底去哪裡呢？如果去瑞士，你只需要在人工智慧的審判席上作證；而如果去波亞，你不但會被控參与數據侵入和盜竊，還會被控危害公眾，導致十四名無辜人員死亡。你要去哪裡？這是你自己的選擇。」","凱斯從煙盒裡抽出一支頤和園，皮埃爾用金色登喜路打火機替他點著。「阿米塔奇會保護你嗎？」他話音落下，打火機也「啪」的一聲關上。","凱斯強忍苯乙胺帶來的苦楚，抬起頭看看他。「老闆，你多大歲數？」","「我很老了，老到足以明白你死定了。一切都結束了，你就是礙事兒的。」","「我有個問題，」凱斯朝這點陣圖靈警察噴出一口煙，「你們在這裡有執法權嗎？我是說，這套不是應該讓自由彼岸的保安隊伍來玩兒嗎？這是他們的地盤，對不對？」那張年輕清瘦的臉上，那雙黑眼睛頓時變得冰冷。凱斯還以為自己要被扁了，皮埃爾卻只是聳了聳肩。","「這沒什麼，」羅蘭德說，「你會跟我們走的。我們慣常在法律的模糊地帶活動。在圖靈名冊里，我們這個分部的條款非常靈活，我們需要的時候就可以利用這種靈活性。」羅蘭德已經完全放下了他和藹可親的偽裝，眼神變得和皮埃爾一樣冷酷。","「你實在太蠢了，」米雪兒握著槍站起來，「對自己的種族全無感情。數千年來人們一直夢想與魔鬼締約，如今這終於有了實現的可能。你幫助這傢伙進行自我解放和成長，又能得到什麼好處？」她的聲音很年輕，卻有種十九歲不可能有的瞭然與疲憊。「穿上衣服跟我們走，和你的阿米塔奇一起跟我們回到日內瓦，在這個人工智慧的審判席上作證。否則我們就殺了你。趕快。」","她舉起槍。那是一把亮閃閃的黑色沃瑟槍，配有內置消音器。「我在穿衣服。」他拖著仍然沉重麻木的雙腿，跌跌撞撞地走向床邊。他拿起一件乾淨的T恤。","「有飛船在等我們。我們會用脈衝武器抹除泡利的思想盒。」","「感網公司要氣死了。」凱斯嘴上說著，心裏卻在想：也會抹除保坂電腦里所有的證據。","「他們擁有這種東西，已經給自己惹上麻煩了。」","凱斯套上T恤。他看見躺在床上的飛鏢，那死氣沉沉的金屬，那是他的星星。他想要再次感受那種憤怒，它卻已消失不見。該放棄了，聽天由命吧……他想起那些毒素囊。「這就是肉身。」他嘟囔。","他站在去往草坪的電梯里，想起莫利。她或許已經進入迷光別墅，正在搜尋里維拉。或許海迪歐也在搜尋她。海迪歐十有八九便是芬蘭人故事里那個克隆忍者，取回會說話的人頭雕像的那個忍者。","他將頭抵在黑色塑料牆上，閉上眼睛，四肢百骸都像是雨打過的陳木，沉重而翹曲。","林間的明麗陽傘下有許多人在午餐，羅蘭德和米雪兒入鄉隨俗地用法語快活地交談著，皮埃爾則走在他們身後。米雪兒胳膊上搭著一件白色外套，下面是她的手槍，槍口緊緊頂住他的肋骨。","他們在桌子和林木間穿過草地，蜿蜒前行。他想，如果我現在倒下，她會開槍嗎？視野邊緣上有陰影閃過，他抬起頭，看見拉多-艾奇遜系統白熱的條帶邊，有一隻巨大的蝴蝶優雅地滑過投影出的天空。","他們來到草坪盡頭，圍欄外便是懸崖，野花從德斯德雷塔街的峽谷里隨風飄上來。米雪兒甩甩短短的黑髮，指著一個地方跟羅蘭德說了一句法語，語氣似乎真的很開心。凱斯順著她的手指看去，那裡有平整的湖泊，閃著白光的賭場，上千個青綠色的泳池，無數沐浴在日光中的肉體，還有微小的棕色象形字，全都在自由彼岸那綿延無盡的曲線之內，穩定的人工重力之中。","他們沿著欄杆來到橫跨德斯德雷塔街的華麗鐵橋面前。米雪兒用槍頂頂他。「別急，我今天路都快走不動了。」","輕型飛機來襲時，他們在橋上走了四分之一多的路。電子引擎無聲無息，碳纖維製成的螺旋槳直接削掉了皮埃爾的頭蓋骨。","在那一瞬間，他們落在了飛機的陰影里，凱斯感覺到滾燙的鮮血噴在後頸上，然後便被絆倒。他翻過身，看見米雪兒屈膝躺在地上，雙手握槍，瞄準天空。她想要擊落那架輕型飛機。純屬徒勞，他想。他的頭腦居然還這麼清楚。","轉眼間他已在奔跑。他跑到第一棵樹旁，回頭張望。羅蘭德在後面追趕，而飛機則在橋欄杆上撞毀，翻滾著捲起米雪兒，一起墜向德斯德雷塔大街。","羅蘭德沒有回頭。他咬著牙，慘白的臉上是堅毅的神情，手中拿著一樣東西。","羅蘭德死在同一棵樹下。那隻黑黃相間的螃蟹狀的機器園丁直接從樹枝上掉了下來，砸在他頭上。","「你殺了他們，」凱斯氣喘吁吁地奔跑著，「狗娘養的瘋子，你把他們都殺了……」"]},{"title":"第四部 迷光行動 14","paragraphs":["小型列車以每小時八十公里的速度衝過隧道。凱斯雙眼緊閉。他剛才沖了個澡，本來感覺好多了，一低頭，卻看見雪白的地磚上有粉色的水流過。那是皮埃爾的血。他把早飯都吐光了。","紡錘尖漸漸變窄，重力越來越小，凱斯的胃又開始翻騰。","愛洛爾和他的小車等在船塢旁。","「凱斯，先生，出大事了。」他的耳機里傳來微弱的聲音。他用下巴點點音量控制鍵，隔著頭盔的聚碳酸酯面板看看愛洛爾。","「愛洛爾，咱得去加維號。」","「成。系好安全帶，先生。不過加維號被劫持了。那艘遊艇，來過的，又回來了。跟馬克斯-加維號完全對接了。」","「圖靈警察？他們來過？」凱斯爬上車架子，繫上安全帶。","「日本遊艇。之前送包裹來的……」","是阿米塔奇。","馬克斯-加維號映入他的眼帘。它緊緊靠在一艘昆蟲狀飛船的灰色胸口，那艘光可鑒人的飛船有加維號的五倍長，伸出的抓臂暴露在真空的陽光底下，被加維號斑駁的外殼襯托得清晰異常。一條淺色的波紋狀舷梯從飛船內伸出，繞過拖船的引擎，蓋住了后氣密門。這場景看起來頗為猥褻，卻不覺色情，只是捕食的昆蟲，又像是黃蜂，又像是蜘蛛。","「馬爾科姆怎麼樣？」","「馬爾科姆沒事，還沒人下去咧。遊艇司機跟他說，叫他莫緊張。」","他們繞過那條灰色飛船，凱斯看見一團日文字底下那清晰的白色大字：埴輪號。","「這情形不大好，老兄。我覺得咱可能該拍拍屁股溜號了。」","「馬爾科姆也這麼說，先生。不過加維號這副樣子可溜不了多遠。」","凱斯從前氣密門進入加維號，取下頭盔，馬爾科姆正對著無線電用方言飛快地嘰里呱啦。","「愛洛爾已經回搖滾號去了。」凱斯說。","馬爾科姆點點頭，嘴裏還沒停。","凱斯從他滿頭飛舞的小辮兒上爬過去，脫下太空服。馬爾科姆戴著一對亮橙色耳機，閉上了眼睛，皺起眉頭專心傾聽。他穿著條破破爛爛的牛仔褲和一件剪掉了袖子的綠色尼龍舊外套。凱斯把紅色三洋太空服塞進儲藏吊網裡，爬進了重力網。","「瞧瞧那隻鬼魂怎麼說，」馬爾科姆說，「那電腦找你好半天了。」","「上邊那玩意兒里是誰？」","「上回來過那日本娃。現在還加上你的阿米塔奇先生，從自由彼岸跑出來了……」","凱斯把探頭戴在頭上，接入網路。","「南方人？」","網路空間里，他看見代表錫金那隻鋼鐵收割機的粉色圓球。","「孩子，你到底在幹嗎？我這聽到的消息都夠嚇人的。保坂電腦連上了你老闆船上一架同樣的電腦，跑得歡著呢。你招上圖靈警察了哈？」","「對，但他們已經被冬寂幹掉了。」","「呃，那也擋不了多久。他們在這人多著呢，會前仆後繼的。我賭他們在這片網路區塞了不少操控台，就跟屎堆上的蒼蠅一樣。凱斯，你老闆說開干。他說行動，現在就行動。」","凱斯敲出自由彼岸的坐標。","「凱斯，讓我來……」網路空間在模糊與清晰之間切換，平線做出的一系列跳躍之精密、迅捷與準確讓凱斯滿懷嫉妒。","「操，南方人……」","「嘿，孩子，你真是沒見識。我現在連手都沒有！我活著的時候比這還要快！」","「就是那裡了哈？左邊那個綠色大方塊？」","「沒錯。泰西爾-埃西普爾股份公司的核心數據。這堵冰牆是他們那兩位和藹可親的人工智慧造出來的，我瞅著跟軍方水平差不離。真他媽頂級的冰牆啊，暗無天日，還滑不留手，只要瞧你一眼，就能把你腦子都烤焦。咱再靠近一步，丫就會把追蹤器從咱屁股塞進去再從耳朵冒出來，然後跟泰埃董事會報告你的鞋碼多大，老二多長。」","「這真不太妙，對吧？我是說，圖靈警察已經找上它了。我看咱們可能應該趕緊撤。我可以帶你走。」","「真的？你不是扯淡？你不想看看那個中國來的程序能幹嗎？」","「呃，我……」凱斯瞪住泰埃的綠色冰牆，「操。好，咱就干。」","「插|進去。」","「嘿，馬爾科姆，」凱斯退出網路說，「我大概要一直戴著電極過八小時。」馬爾科姆又在抽煙，船艙里煙霧縹緲。「所以我沒法去前頭……」","「沒問題，先生。」錫安人幾個跟斗翻到前面，在一個拉鏈網袋裡翻出一卷透明管子，還有一樣密封在無菌包的東西。","他管這叫得克薩斯尿套。凱斯覺得難受死了。","他把來自中國的病毒程序插|進電腦，略微猶豫了一下，隨即一插到底。","「好了，」他說，「咱開干。馬爾科姆，聽我說，要是這兒情況變得太不對勁，就抓住我的左手腕，我能感覺到的。否則就照保坂電腦指令辦，行不？」","「成，先生。」馬爾科姆又點燃一根鴉片煙。","「還有，打開空氣濾清機。我可不想讓這破玩意兒干擾我的神經遞質。我自己那葯的後勁兒就夠難受的了。」","馬爾科姆笑起來。","凱斯再次接入網路。","「老天爺啊！」平線說，「看看，看看。」那來自中國的病毒在他們身周伸展開來，一層層透明的色彩不斷變換組合，成為一個多姿多彩的龐然大物，聳立在他們頭頂，不斷吞噬著網路中的虛空。","「娘哎。」平線說。","「我去看看莫利。」凱斯切換到虛擬感受上。","自由落體。那種感覺就像在清澈無比的水中下潛，似在下墜，又似在上升。那條寬闊甬道用的是來自月球的混凝土，甬道內每隔兩米便亮著一圈白色霓虹燈。","他們之間的連接是單向的，他沒法和她交談。","他切換回來。","「孩子，這軟體可真兇殘，簡直是有史以來最拉風的玩意兒。這天殺的居然可以隱身！我剛租了泰埃冰牆左邊四個跳躍點外那個小粉盒子二十秒鐘，來看看咱們的樣子。看不見。我們根本不存在。」","凱斯在泰西爾-埃西普爾冰牆周圍的網路空間里搜尋了一陣，才找到那個粉色結構。那是個普通的商業結構。他朝那邊走近了一些。「也許它壞掉了。」","「有可能，但我看不像。咱們這寶貝兒可是軍方貨色，還是新款，根本完全不留痕迹。哪怕有一點點跡象，別人馬上就能辨認出這是中國來的突襲，可壓根兒沒人注意到我們。恐怕連迷光里的兄弟們都不曉得。」","凱斯注視著迷光別墅光禿禿的外牆。「嗯，」他說，「這是好事，對吧？」","「也許。」思想盒又發出似是而非的笑聲，那種感覺讓凱斯皺起眉頭。「孩子，我又幫你看了看這狂十一。界面非常友好，只要咱在觸發端，它簡直禮貌熱心得不得了。英文也講得挺好。你有沒有聽說過慢病毒？」","「沒。」","「我聽說過一回，那會兒它還只是個構思。咱這狂病毒剛好就是這玩意兒。慢病毒不會簡單地鑽個洞往冰牆裡塞東西，它會和冰牆慢慢交互，慢到冰牆本身都毫無知覺。狂病毒邏輯內核的外殼就這麼偷偷摸進目標，一路產生突變，變得和冰牆結構一模一樣。然後咱就咬住對方，主程序切入，圍繞著冰牆邏輯不斷交流，在對方覺得不對勁之前就已經和它變成連體嬰了。」平線笑起來。","「我真希望你今天別那麼歡樂，老兄。你那笑聲讓我渾身發毛。」","「真慘，」平線說，「俺這死人也需要笑啊。」凱斯按下虛擬感受開關。","隨即摔進一堆金屬與灰塵之中，掌根從光滑的紙面上滑過，身後嘩啦啦倒下一片。","「來，」芬蘭人說，「放鬆點兒。」","凱斯躺在一堆泛黃的舊雜誌上，身下那些誘人的封|面|女|郎們露著雪白的牙齒，在「都市全息」招牌的微光里對著他甜蜜微笑。他躺在地上，在舊雜誌的氣味中慢慢平靜下來。","「冬寂。」他說。","「沒錯，」芬蘭人在他身後說，「你說的沒錯。」","「滾。」凱斯揉著手腕坐起來。","「別啊，」芬蘭人從牆邊成堆的廢品中走出來，「這樣對你更好，老兄。」他從口袋裡掏出帕塔加斯雪茄，點燃一支，古巴煙草的香氣頓時充滿了整個店面。「難道你覺得我應該在網路里找你，把自己搞成一片燃燒的叢林？你不會錯過那邊的事兒。這裏一個小時，外邊也才一兩秒鐘。」","「難道你從來沒想過，你老是用熟人的形象出現，會讓我很抓狂？」他站起來，撣掉黑色牛仔褲前面的白灰，轉身看看落滿塵灰的窗戶和緊閉的大門。「外面是什麼樣子？是紐約嗎？還是啥也沒有？」","「呃，」芬蘭人說，「就跟那棵樹一樣，你知道那個故事吧？森林里一棵樹倒下，卻沒人聽見。」他露出大板牙，噴出一口煙。「你可以出去溜達一圈看看。一切都在，或者說你所見過的一切都在。這是你的記憶，對不對？我切入你的腦子，找到這些記憶，再回輸給你。」","「我記性沒這麼好。」凱斯環顧四周說。他低下頭，翻來覆去看自己的雙手，努力想記起自己的掌紋，卻完全沒有印象。","「每個人都有這麼完整的記憶，」芬蘭人把煙蒂丟在地上，用鞋跟碾滅，「只是很多人都沒法提取這些記憶。略具天賦的藝術家都有這種能力。如果和現實場景對比，你能看出這裏和芬蘭人在曼哈頓下城的商店還是有差別的，但沒有你想象的那麼大。對你來說，記憶是全息的。」芬蘭人拽了拽自己的小耳朵。「對我來說就不同。」","「全息是什麼意思？」這詞兒讓他想起里維拉。","「反正，全息影像是你們造出的最接近人類記憶的東西。可是你們從來沒利用過這一點。你們人類。」芬蘭人走上前，歪著他那個流線型的腦袋，看看凱斯。「如果你們做到了，我就不會出現了。」","「這算是什麼意思？」","芬蘭人聳聳肩。他的破花呢外套肩太寬了，不太合適。「我是想幫你，凱斯。」","「為什麼？」","「因為我需要你。」他又露出發黃的大板牙。「因為你也需要我。」","「扯淡。你能讀出我的思想嗎，芬蘭人？」他做了個鬼臉，「我是說，冬寂。」","「思想是不能『讀』的。瞧，你腦子裡還是書上的觀念，而且你書讀得也太少。我可以提取你的記憶，但那不是你的思想。」他伸出手，從一台舊電視的殘骸里取出一根銀黑色的真空管。「看這個。這可以算是我的部分DNA……」他把真空管扔進暗處，凱斯聽見破碎的聲音。「你們一直在建造各種模型。石環。大教堂。管樂器。加法機。你知道嗎？我根本不明白自己為什麼會存在。但是，如果今晚的行動順利進行，你們就終於能夠獲得真正的成就。」","「我不知道你在說什麼。」","「我說的是『你們』。是你們這個物種的統稱。」","「你殺了那些圖靈警察。」","芬蘭人聳聳肩。「沒辦法。沒辦法。你還挺不高興？他們眼睛都不眨就可以幹掉你。好了，我把你弄來這裏，是因為我們需要再談談。記得這個嗎？」他右手舉起凱斯夢中那燒焦的蜂巢，陰暗封閉的店面內滿是燃料的味道。凱斯跌跌撞撞地退到堆滿廢品的牆邊。「沒錯。是我乾的。用窗戶上的全息設備乾的。這記憶也是我第一次讓你平線時從你腦子裡偷到的。你知道它為什麼很重要？」","凱斯搖搖頭。「因為，」蜂巢忽然消失了，「這是你記憶中最像泰西爾-埃西普爾的東西。是人類社會中最像它的。迷光就像是蜂巢，至少它本該如此。我以為這樣會讓你感覺好一點。」","「感覺好一點？」","「能了解他們大概是什麼樣。你已經開始恨死我了。很好。但你應該恨的是他們。差別是同樣的。」","「聽著，」凱斯往前邁了一步，「他們從來沒對我做過什麼。你，你不一樣……」然而他還是感覺不到自己的憤怒。","「泰埃製造了我。那個法國姑娘說你出賣人類。她說我是魔鬼。」芬蘭人笑起來。「其實都沒什麼關係。這一切結束之前，你總得要恨誰。」他轉過身，朝店裡面走去。「來吧，我給你看看迷光的樣子。」他掀起門上軍用毯的一角，白光噴薄而出。「操，老兄，別傻站在那裡啊。」","凱斯揉著臉，跟在他身後。","「好。」芬蘭人拉住他的手肘。","他們被吸進那腐臭的毛呢後面，落入一片塵灰。這是一條環形通道，四周牆壁都是來自月球的混凝土，每隔兩米有一圈白色霓虹燈。自由落體。","「天。」凱斯翻滾著說。","「這是正門，」芬蘭人的外套飄在空中，「剛才店面所在的地方就是真實情況下的大門，在自由彼岸的軸心旁邊。這部分的細節還不錯，因為你跟著莫利看到過這裏。後面的細節就沒這麼清晰了，因為你沒有那些記憶。」","凱斯努力直起身，又開始螺旋形地墜落。","「等等，」芬蘭人說，「我快進一下。」","牆壁模糊起來。他們飛速地前進，拐彎，穿過狹窄的通道，身周色彩飛舞，令人眩暈。他們經過一片漆黑，似乎是穿過了幾米厚的牆壁。","「到了，」芬蘭人說，「就是這裏。」","他們漂浮在一個正方形的房間里，四壁和頭頂都鋪著正方形的深色實木板。地板上鋪著一整塊明麗的地毯，上面用藍色和紅色的毛線織出電子迴路的形狀，那是一塊晶元的模樣。房間正中有一隻方形的白色玻璃基座，和地毯上的圖案銜接得天衣無縫。","「迷光別墅，」基座上一件鑲滿珠寶的東西用婉轉的聲音說，「是一座怪異的，向內生長的哥特式建築。迷光內的每一個空間都有其神秘之處，無窮無盡的房間以通道和腸子般的樓梯相連，華麗的屏風和空蕩蕩的神龕之外，通道總會急轉，擋住視線……」","「3簡寫的文章，」芬蘭人拿出帕塔加斯雪茄說，「十二歲的時候，在符號學課上寫的。」","「自由彼岸的建築師們費盡心血，想要掩蓋一個事實：這個紡錘體的內部結構就像酒店房間里的傢具一樣毫無新意。在迷光里，眾多的結構覆蓋住紡錘體內壁，不斷流動，相互聯結，共同指向上方那個微型電路構成的堅硬內核。那硅柱是家族公司的核心，其中貫穿許多狹小的維修通道，不足一隻手寬。明麗的蟹狀無人駕駛機在裏面穿梭，查修機械老化或被破壞的痕迹。」","「你在餐館見到的就是她。」芬蘭人說。","「按這片群島的標準而論，」那頭像接著說，「我們的家族十分古老，這個家的錯綜複雜體現了我們的悠久歷史，卻也還有別的含義。從符號學上講，迷光別墅證明了一種內在的追求，也是對於紡錘壁之外的真空的抗拒。」","「泰西爾和埃西普爾爬出重力阱后，便發現他們需要空間。他們建立起自由彼岸來攫取這些新興島嶼的財富。他們越來越富有，也越來越自我，他們在迷光里修建的是自我軀體的延伸。我們將自己鎖在自己的財富後面，向內生長，製造出一個毫無缺口的個人宇宙。」","「迷光別墅不見天日，不論是真實的，還是人工的。」","「別墅的硅核在一間小房間里，那是整個迷光中唯一一個正方形的房間。就在這個平淡無奇的玻璃台上，放著一個精美的半身像，以白金和景泰藍製成，上面還點綴著天青石和珍珠。它明亮的眼珠是從一扇紅寶石舷窗切割下來的，而這扇舷窗則來自帶著第一位泰西爾飛出重力阱，又接出第一位埃西普爾的那艘飛船……」","頭像停下了。","「然後呢？」凱斯隔了半天才問，恍惚中還以為那頭像會回答。","「她就寫到這裏，」芬蘭人說，「沒寫完。那時她還是個孩子。從某種意義上說，這東西是一個非常重要的電腦終端，我需要莫利在特定的時間到這裏說出特定的詞。這就是整件事的關鍵所在。不管你和平線跟著那來自中國的病毒能走多遠，這東西要是聽不到那個關鍵詞，就屁用也沒有。」","「那是什麼詞？」","「我不知道。我的存在，可以說受限於『我不知道』這個事實，因為我『不能』知道。于那個詞我定然是愚蒙無知的，即便你知曉並告訴了我，我仍然『不能』知道。這是硬體所決定的。一定要有另一個人去找到這個詞，帶到這裏來，同時你與平線要穿透冰牆，攪亂核心數據。」","「然後呢？」","「然後我就不存在了。我到此為止。」","「我沒意見。」凱斯說。","「當然。但是凱斯，你自己要當心。我的，呃，另外半個大腦好像盯上我們了。那又是一片燃燒的叢林。阿米塔奇也快不行了。」","「啥意思？」","房間從各個完全不可能的角度摺疊起來，如同一隻紙鶴，在賽伯空間里翻滾而去。"]},{"title":"第四部 迷光行動 15","paragraphs":["「你是想打破我的紀錄嗎？」平線問。「你又腦死了一回，五秒鐘。」","「等會兒。」凱斯按下虛擬感受開關。","她蹲在黑暗之中，手掌按在粗糙的混凝土上。凱斯凱斯凱斯凱斯。她眼內的數碼顯示屏上不斷閃現他的名字，那是冬寂在告訴她，他已經接入進來。「不錯。」她說。她抬起身，合攏雙掌，指關節咔咔作響。「你怎麼去了這麼久？」","時間到了 莫利 現在。","她用舌頭緊緊抵住下面的門牙。一顆門牙微微一動，激活了她的微通道放大系統，黑暗中混亂的光子被轉換成電子脈衝，她身周粗糙的混凝土牆開始泛出幽幽的白光。「好了，親愛的。咱們出去玩玩。」","她的藏身之處是一條修理通道。她推開一道已經發灰的精緻黃銅柵欄，爬了出來。他看見她的胳膊和雙手，上面又是那身擬態外套。他能感覺到塑料外套下面那熟悉的緊身皮衣。她的胳膊底下吊著一條帶子，她站起身，拉開外衣拉鏈，碰到一把塑料槍柄。","「嘿，凱斯，」她無聲地說，「你在聽嗎？給你講個故事……我曾經有過這麼一個男孩。你有點像……」她轉過身打量這條走廊。「約翰尼，他叫約翰尼。」","走廊有低矮的穹頂天花板，兩側排放著幾十個古色古香的紅木展櫃，與那弧形的牆壁格格不入，好像被人專程搬了進來，卻又遺忘在這裏。走廊里每隔十米裝著已經生鏽的黃銅燈具，投下白色的光暈。地面起伏不平，凱斯隨著她一路走下去，才發現地下亂七八糟地鋪著幾百張小地毯，交錯堆疊，將地面變成一片手工羊毛織造的柔軟表面。","莫利對那些柜子和裏面的物品全不留心，他只能透過她隨意的掃視滿足自己的好奇心。偶爾閃過的陶器，古老的武器，一樣扎滿了生鏽鐵釘的不知是什麼的東西，還有破舊的掛毯……","「我的約翰尼，他是很聰明，很有靈氣的一個孩子。他原來是在『記憶道』上的，專門窩藏贓貨，人家付錢給他，把數據藏在他腦子裡的晶元上。我遇見他的那個晚上，日本黑幫正在追殺他，我幹掉了他們的殺手。其實只是碰巧而已，但我畢竟幫了他的忙。那以後我們就很親密了，凱斯。」她的雙唇幾乎紋絲不動，「我們弄了個超導量子干擾裝置，可以讀出他儲存過的所有東西，存進磁帶，然後去整他以前的客戶。我去做討債的打手。我很幸福。凱斯，你幸福過嗎？他是我的。我們一起做事。我們是同夥。我遇見他的時候，剛離開那傀儡屋八個星期……」她停住了，轉過一個大彎，繼續前行。兩壁仍然排滿油光水滑的木櫃，櫃面的顏色如同蟑螂的翅膀。","「我們親近，甜蜜，一切順利，好像誰也奈何不了我們。他們過不了我這關。我想，日本黑幫還是想整死約翰尼，因為我殺了他們的人，因為約翰尼騙了他們。他們真他媽的有耐心啊，就和蜘蛛一樣，和禪修的蜘蛛一樣耐心。他們等了一年又一年，給我們足夠的時間去過美好人生，於是我們能失去的就會更多。","「那時我不懂這些，就算懂也不會怕。那時我還年輕，年輕的時候總以為自己與眾不同。後來我們掙夠了錢，考慮洗手不幹，也許去歐洲吧。我們都不知道去那兒幹嗎，那裡沒什麼事情可干，但我們在瑞士太空銀行的賬戶里有的是錢，還有一間塞滿玩物和傢具的小窩，鬥志早就消磨殆盡。就在這個時候，他們出現了。","「他們派來的第一個人很火爆。前所未見的神經反應速度，身上的各色各樣的植入體夠十個普通打手用。第二個人，怎麼說呢，像個和尚。是個克隆人，全身都是冷血殺手的細胞，放射出一種死亡的寂靜氣息……」她的聲音弱下去，前面的走廊一分為二，兩邊的樓梯一模一樣，通向下方。她選擇了左邊一條。","「我小時候住在貧民窟裡邊。在哈得孫河旁邊，那裡的耗子，因為化學毒素的影響，天，真是夠大，跟我差不多個頭了。有天晚上，一隻耗子一直在地板下面掏來掏去。天亮的時候，有人找來了一個老頭，他臉上有幾道疤，眼睛里都是血絲。他拿著一個油膩的皮卷，就是用來包鋼質工具防止生鏽那種。他攤開包袱，裏面是一隻舊手槍和三枚子彈。那老頭裝了一枚子彈，在貧民窟里來回走動，我們都退到牆邊。","「他低著頭，雙臂抱在胸前，來來回回地踱步，好像完全忘記了自己有槍。他專心傾聽耗子的動靜，我們一口氣都不敢出。老頭走一步，耗子就動一動。耗子動一動，他再走一步。就這麼過了一個小時，他好像突然想起了自己的槍，把槍指向地板，笑了一笑，扣動扳機。然後他就又捲起包袱走了。","「後來我爬到下面去看過，那耗子雙眼之間有個窟窿。」她看著走廊兩邊整整齊齊排著的緊閉的門。「第二個人，來殺約翰尼的那個，就像是這個老人。他年紀不大，但是很像那老人，殺人的方式像。」走廊變寬了，面前是一盞巨大的懸吊式水晶燭台，最低處幾乎要觸及地板。地板上是地毯的汪洋大海在溫柔地起伏。莫利走進大廳，水晶燈丁零作響。「左邊第三道門。」她眼裡的顯示屏上閃出。","她轉向左邊，避開那倒懸的水晶樹。「我只見過他一面，在回家的路上。他剛從我們家出來。我們住在改造的廠房裡，很多新住客都是感網公司的。那地方的保安設施本來就不錯，我又加了不少重量級的配置，讓它滴水不漏。我知道約翰尼在上面。這個小個子走出來，我們眼神交會，他一個字也沒說，而我看見他，就明白了。樸素的小個子，樸素的衣服，完全沒有驕矜之氣，十分謙和。他看了我一眼，坐進一輛人力三輪。我明白了。我跑到樓上，約翰尼坐在窗戶邊的椅子上，嘴巴微微張開，好像想起什麼事情，要說話的樣子。」","她面前是一塊古老的雕花門板，用泰國柚木製成，似乎被人攔腰砍斷後裝進這低矮的門洞里。一條盤龍圖案下方裝著一隻原始的不鏽鋼機械鎖。她跪下來，從衣服裏面掏出一個裹得緊緊的黑色麂皮小包裹，從裏面選出一根細針。「那以後，我就再也沒有找到過一個值得在乎的人。」","她把細針塞進鎖孔，咬著下唇，悄無聲息地試探著。她眼光迷濛，金色的門板在眼中一片模糊，似乎完全靠觸感在工作。大廳里悄無人聲，凱斯傾聽著那懸挂式水晶燭台輕輕碰撞的聲音。燭台？迷光別墅和他的期待完全背道而馳。他記起凱西講的那個有池塘和睡蓮的城堡，記起那頭像悠揚念出的3簡的文字。一座朝向內里生長的建築。迷光別墅像是一間教堂，帶著微微的霉味和微微的香氣。泰西爾-埃西普爾家族的人們在哪裡？他本以為會看見一間整齊的蜂巢，看見裏面各種按部就班的活動，可是從莫利的眼睛里看見的卻全然不同。她的獨白讓他不安；她從來沒有跟他講過那麼多自己的事情。除了那天晚上在那個隔間里的故事之外，她幾乎像是個沒有過去的人。","她閉上雙眼，凱斯感覺到一聲輕微的咔嗒聲。他想起那傀儡妓院門上的磁性鎖，他用的晶元明明不對，門卻打開了。就像那架無人駕駛微型機，像那隻機器園丁一樣，都是冬寂乾的。那間傀儡妓院的門鎖系統同樣隸屬於自由彼岸的保安系統。但人工智慧卻無法直接控制這裏的簡單的機械鎖，一定需要某種遙控器械或是人工的協助。","她睜開雙眼，把那細針放回麂皮包，仔細捲起塞回口袋裡。「你大概和他有點像，」她說，「你們天生就是要冒險的。在千葉城我就看出來，你換個地方可以更上一層樓。有時候人只是運氣不好，只能從底層干起。」她站起身，伸伸懶腰。「你知道嗎，泰西爾-埃西普爾派來追殺吉米——那個偷了頭像的盜賊——的人，肯定和日本黑幫派來殺約翰尼的人很相似。」她從吊在胳膊上的槍套里取出箭槍，調到全自動模式。","她伸手去推門。凱斯震驚于這扇門的醜陋：那曾經美麗的門板被殘忍地攔腰鋸斷了才塞進來，方方正正的形狀與這光滑的弧形混凝土甬道也格格不入。這扇門和那些古怪的展櫃、那盞巨大的水晶燭台一樣，被從外面搬上來，強行安插在這裏，卻全不搭調。他想起了3簡的文章，想象著他們從重力阱里運來這所有的裝飾品，以期為這棟巨大的建築增添血肉，強迫症一樣填滿了所有的空間，企圖營造一種家族形象。他想起那破碎的蜂巢，想起那些沒有眼睛的生物在裏面蠕動……","莫利握住雕龍的一根前腿，門輕輕打開。","門後面是個逼仄的小房間，比衣櫃大不了多少，弧形的牆邊有一排灰色的鋼質工具櫃。燈自動亮起，她關上身後的門，走到柜子旁邊。","她眼內的晶元閃現出「左邊第三排」字樣。那是冬寂疊加在她的時間顯示上的信息。「往下第五個。」她卻先打開了最上面的抽屜，很淺，空無一物。第二個抽屜也是空的。第三個抽屜比較深，裏面放著灰暗的焊料珠子，還有一件棕色的小東西，形狀好似人類的指骨。第四個抽屜裏面是一本濕嗒嗒的，法日雙語的過時說明書。在第五個抽屜里有一件沉重的帶裝甲手套的真空服，她在衣服後面找到了那把鑰匙，像一枚已失去光澤的黃銅硬幣，邊上鑲著一條短短的空心管。她在手中慢慢翻轉那把鑰匙，凱斯看見空心管裏面排布著各種突起。硬幣的一面鑄著CHUBB幾個字母，另一面則完全空白。","「他告訴我，」她低聲說，「冬寂告訴我，他等待了很多年。那時他還沒有什麼能力，但他可以利用迷光別墅的保安和監管系統來了解所有東西的位置，以及它們如何變動，去了哪裡。二十年前，他看到有人丟失了這把鑰匙，就想辦法讓人把它放到了這裏。然後他殺掉了那個把鑰匙放到這裏的男孩。那孩子才八歲。」她用雪白的手指握住鑰匙。「這樣就沒人能找到這把鑰匙了。」她從外衣胸前的口袋裡取出一段黑色尼龍帶子，穿過幾個字母上面的圓孔，打了個結，掛到脖子上。「他說，他們老是拿那些老套的東西，那些十九世紀的調調來煩他。在那個肉身傀儡的窩裡，他出現在屏幕上，就跟芬蘭人一模一樣。我差點以為他就是芬蘭人呢。」在灰色的鋼柜上，他看見她眼睛里的顯示屏上閃現當時的時間。「他說，如果他們已經變成了他們自己想要的樣子，他早就已經出來了。但他們沒有。他們搞砸了。被3簡那樣的變態搞砸了。他管3簡叫變態，但又好像挺喜歡她。」","她轉過身，打開門走出去，一隻手拂過套子里箭槍的槍柄。","凱斯切換回網路。","狂級馬克十一在茁壯成長。","「南方人，你覺得這東西管用嗎？」","「你說狗熊會在樹林里拉屎嗎？」平線帶著他在層層變幻的色彩中上升。","在病毒程序的核心裏有某種黑色的東西正在成形。那裡的信息密度遠遠超越了網路空間的數據層，萬花筒般的模糊圖案匯聚到一個銀黑色的焦點之上，令人眩暈。孩提時代各種代表邪惡與厄運的符號沿著透明的數據層飛出：納粹黨徽，閃著蛇眼的骷髏圖案骰子……他凝神直視，那焦點是虛空的，彷彿並無邊緣。再多掃視幾眼，才看出那像是一條鯊魚，閃著黑曜石的光澤，黑色身體反射出遙遠的燈光，與周遭的網路世界毫無關聯。","「那就是它的毒針，」思想盒說，「等到狂病毒和泰西爾-埃西普爾的核心數據徹底融為一體，我們就要跟著它穿越進去。」","「南方人，你說得對。冬寂多少受限於硬體迴路，限制他的這個迴路可以被人工解除。」","「他，」思想盒說，「他。你說話小心點。我一直強調，是它。」","「人工解除限制需要一個密碼。他說那是一個詞。等我們這裏搞定冰牆後面的東西，要有另一個人，在一個房間里，對一個華麗的電腦終端說出這個詞。」","「嗯，你有的是時間可以消磨，孩子，」平線說，「狂病毒又慢又穩。」","凱斯退出網路。","就看見了馬爾科姆的眼睛。","「先生，你剛死過去了一會兒。」","「時常發生，」他說，「我都習慣了。」","「你是在跟黑暗交手，先生。」","「我似乎別無選擇。」","「神愛你，凱斯。」馬爾科姆說完，轉身繼續操作無線電去了。凱斯注視著他滿頭的小辮兒，深色的肌膚，還有臂膀上糾結的肌肉。","他再次接入網路。","切換到虛擬感受迴路。","莫利沿著一條長長的走廊快步前行，和剛才的走廊很像，但那些玻璃展櫃都不見了。凱斯認為他們是在朝著紡錘尖上去，因為重力在不斷減弱。在四處堆積的地毯上，她的步子很快變成了跳躍，腿上傳來微微的疼痛……","那條走廊驀然變窄，轉了一個彎，分成兩條岔路。她朝右一轉，沿著一道異常陡峭的樓梯爬上去，腿開始疼起來。頭頂上有一束束彩色的導線，如同神經髓鞘一般，緊緊貼在天花板上。牆上有霉斑。","她來到一處三角形平台上，揉了揉腿。前方又有三條狹窄的走廊，牆上都掛著掛毯，分別通向三個不同的方向。","左邊。她眼睛里的屏幕閃出。","她聳聳肩。「讓我自己看看，成不？」","左邊。","「別急。有的是時間。」她朝右邊走去。","停下。","回頭。","危險。","她遲疑了。通道盡頭的橡木門半開著，裏面傳來一個響亮又含混的聲音，好像是醉漢在說話。凱斯覺得有點像法語，但分不清楚。莫利走出一步，又一步，手伸進外衣，摸到她的箭槍。她忽然踏進了一個神經干擾場，耳中傳來尖嘯，好像她箭槍的聲音一般。她朝前跌倒，渾身肌肉都鬆弛下來，眼神失焦，無力呼吸。","「這是什麼，」那個含混的聲音說，「高級服裝？」一雙顫抖的手從她外衣胸前伸進去，摸到箭槍，扯了出來。「來看看吧，孩子。來吧。」","她慢慢爬起來，眼睛盯住一隻黑色自動手槍的槍口。那人的手已經變得穩定了，槍口似乎被一條看不見的繩子連在她的喉嚨上。","他很老，個子很高，五官和凱斯在「二十世紀」里見過的女孩很像。他穿著一件厚厚的棕紅色絲袍，和尚領，長袖口，赤著一隻腳，另一隻腳穿著黑色絲絨拖鞋，腳背上綉著一隻金色的狐狸頭。他示意她到房間里去。「慢點，親愛的。」寬闊的房間里塞滿了凱斯完全搞不懂的東西。他看見一個灰色的鋼架子，上面都是索尼牌老式顯示器，一張堆滿羊皮的黃銅大床，枕頭的質地和走廊里的地毯如出一轍。莫利的眼睛從一台巨大的德律風根牌娛樂系統轉向一排放滿古老音碟的架子，破舊的碟片裝在透明的塑料殼裡，再轉向一張巨大的工作台，上面散落著各種電子器件。凱斯看到了賽博空間操控台和電極，但她的眼光並未在上面停留。","「按照常理，」老人說，「我應該殺了你。」凱斯感覺到莫利渾身緊張，隨時準備動作。「不過今夜我要放縱自己。你叫什麼名字？」","「莫利。」","「莫利。我叫埃西普爾。」他坐進一張巨大而柔軟，有著方形金屬腿的皮椅里，槍口仍牢牢指住莫利。他把莫利的箭槍放到皮椅旁的一張黃銅桌上，碰翻了一個裝著紅色藥片的小塑料瓶。那桌上堆滿了藥瓶，酒瓶，還有漏出白色粉末的塑料袋。凱斯看到一支古老的玻璃制的皮下注射器，還有一隻樸素的鋼勺。","「莫利，你怎麼哭呢？你的眼睛都被擋住了。我很好奇。」他的眼圈紅紅的，額頭上冒著汗珠，臉色異常蒼白。凱斯想，他病了，要麼就是嗑藥了。","「我不怎麼哭。」","「但是如果有人把你弄哭了，你怎麼辦呢？」","「我把眼淚吐出來，」她說，「淚管已經被導入我的口腔。」","「你這麼年輕，就已經學會了這麼重要的一課。」他把拿槍的手放在了膝蓋上，從桌上幾瓶不同的酒中間隨手抓起一瓶。他喝了一口，是白蘭地。一道酒線沿著他的嘴角流下。「就應該這樣對待眼淚。」他又喝了一口，「我今晚很忙，莫利。我建造了這一切，而現在我很忙。忙著去死。」","「我可以沿著來路出去。」她說。","他大笑起來，笑聲尖利而粗糙。「你打斷了我的自殺儀式，還想輕易走掉？你這個竊賊，可真讓我吃驚。」","「我要命的，老闆，我只有這一條命。我只想全身而退。」","「你是個粗魯的姑娘。我們自殺是講究禮儀的。你知道，我正在進行自殺儀式。不過我今晚或許會帶著你一起，一起下地獄……這樣就更像古埃及人了。」他又喝了一口酒。「來吧。」他把酒瓶遞給她，手不停顫抖。「喝吧。」","她搖搖頭。","「酒里沒有毒，」他一邊說，一邊把白蘭地放回桌子上，「坐下。坐在地板上。咱們聊聊。」","「聊什麼？」她坐下了。凱斯感覺到她指甲下面的刀鋒輕輕地滑動。","「想到什麼聊什麼。我想到什麼聊什麼。這是我的盛會。二十個小時以前，核心電腦喚醒了我。他們說，有事情發生，他們需要我。你就是那件事情嗎，莫利？他們肯定不需要我來對付你，肯定。應該是別的事情……不過我一直在做夢，做了三十年。我上一次入睡的時候，你還沒有出世。他們告訴我們，那麼冷的情況下，我們不會做夢的。他們還說我們完全不會覺得冷。胡扯，莫利。一派胡言。我當然會做夢。外面的世界侵入了寒冷空間。對，就是外面的世界。我建造這裏，就是為了讓我們逃避那樣的夜晚。起初只有一點點，一點點的夜色，被寒冷吸入……其他的部分隨後而來，就像雨點紛紛落下，終於落滿那個空水池。馬蹄蓮。我記得。池塘都是土紅色的，保姆們都是金屬的，它們的四肢閃耀在日落時分的花園裡面……我老了，莫利。算上冷凍睡眠的時間，我已經兩百多歲了。冷凍。」突然間，槍口又顫抖著舉起。她大腿上的肌腱都綳得緊緊的。","「你會被凍傷的。」她小心翼翼地說。","「那裡沒什麼可傷的。」他不耐煩地說著，放下手槍。他的動作越來越僵硬。他的頭在不停地點著，他努力克制。「沒什麼可傷的。我想起來了。那寒冷告訴我，我們的人工智慧瘋了。那麼多年前，人工智慧還只是個瘋狂構思的時候，我們花了那麼多錢。我告訴核心電腦，我會處理的。這時機很不好，真的，8讓下去墨爾本了，只有我們可愛的3簡在看家。或許是很好的時機。你會懂嗎，莫利？」槍再次舉起，「在迷光別墅里，有些奇怪的事情正在發生。」","「老闆，」她問，「你知道冬寂嗎？」","「這個名字，知道。大概很有名氣。絕對是地獄之王。在我那個年代，親愛的莫利，我認識許多的王者。還有不少女性。有一次，西班牙的女王，就在那張床上……但我在遊盪。」他咳嗽起來，槍口隨著他的抽搐而震動。他把痰吐在那隻赤腳旁邊的地毯上。「在寒冷之中，我一直遊盪。但很快就會停下腳步。我醒時已經下令解凍一名簡。這樣很怪異啊，每過幾十年，就和自己法律意義上的女兒躺在一起。」他的目光掃過她，看向那排空白顯示器，似乎帶著顫抖。「瑪麗-法蘭西的眼睛，」他微笑著輕聲說，「我們讓她的大腦對自身的某種神經遞質產生過敏反應，從而產生一種可控的自閉症。」他的頭倒向一邊，又回到原位。「我知道，現在用植入晶元可以輕易達到同樣效果。」","槍從他的手中滑下，在地毯上跳了幾下。","「那些夢就像冰一樣，慢慢生長。」他的話音落下，臉上泛起藍色，頭倒進皮椅中，開始打鼾。","她起身攫過手槍。握住埃西普爾的自動手槍，她開始巡視這個房間。","床邊的花地毯上有一大灘凝固的血液，閃著厚重的光澤。血泊中堆著一床巨大的被子，她掀起被子的一角，看到一個女孩的屍身，雪白的肩膀上帶著血光。她的喉嚨被人切開，一塊三角形的刮刀在她身旁的血泊里閃亮。莫利跪下來，小心地躲開那攤血，轉過那姑娘的臉，對著光看。那是凱斯在飯館里見過的那張臉。","從一切的中心傳來一聲咔嗒聲，整個世界凝固了。莫利的虛擬感受廣播變成一幀靜止的圖像，她的手指還放在那女孩的臉上。靜止三秒之後，那張死去的面孔變了，變成了琳達・李的臉。","又是一聲咔嗒聲，整個房間都變得模糊起來。莫利站在那裡，看著床頭櫃大理石櫃面上一台小電腦旁邊的一張金色激光碟。一根長長的光纖帶子像一條拴狗的帶子，從電腦連到那纖細脖頸上的一個插槽里。","「我記住你了，操。」凱斯感覺到自己的嘴唇在遙遠的地方挪動。他知道是冬寂修改了莫利的廣播。莫利並沒有看見那死去女孩的臉像煙霧般扭轉，變成琳達死後的面孔。","莫利轉過身，走到埃西普爾的椅子旁邊。他的呼吸粗重緩慢。她看了一眼桌上散落的藥片和酒瓶，放下他的槍，拿起自己的箭槍，調整到單髮狀態，小心地朝他緊閉的左眼皮內|射入一支毒箭。他動了動，呼吸停頓在半中。他的另一隻眼慢慢地睜開了，那裡面是一種深不可測的棕色。","她轉過身，走出房間，那隻眼睛沒有閉上。"]},{"title":"第四部 迷光行動 16","paragraphs":["「你老闆在網上等你。」平線說，「咱屁股上那艘飛船里有台一樣的保坂電腦，他從那裡連過來了。那艘船叫埴輪號。」","「我知道，」凱斯心不在焉地說，「看見了。」","他面前出現一團白光，擋住了泰西爾-埃西普爾的冰牆。白光中現出了阿米塔奇那張平靜專註而又萬分瘋狂的臉，眼中空無一物，像是兩粒紐扣。阿米塔奇眨了眨眼，注視著他。","「冬寂大概也搞定了你的圖靈警察哈？就像搞定我那幾個一樣。」凱斯說。","阿米塔奇仍然注視著他。凱斯努力克制想要轉開眼睛的衝動。「你沒事吧，阿米塔奇？」","「凱斯——」那一瞬間，在那藍色眼睛後面，似乎有什麼在變動，「你見到了冬寂，對不對？在網路裏面。」","凱斯點點頭。馬克斯-加維號上這台保坂電腦內置的相機會將他的動作傳送到埴輪號的屏幕上。他想象著身旁的馬爾科姆聽不見思想盒的聲音，也聽不見阿米塔奇的話，只能聽見他喃喃自語。","「凱斯——」那雙眼睛變大了，阿米塔奇靠電腦更近了，「你看到的他是什麼形象？」","「高清晰度的虛擬感受構形。」","「是誰？」","「上一次是芬蘭人……再之前是那個皮條客……」","「不是格爾凌將軍？」","「哪個將軍？」","面前一片空白。","「回放，叫保坂電腦查一查。」他告訴思想盒。","隨即切換到虛擬感受。","他被面前的景象嚇了一跳。莫利蹲在幾條鋼樑中間，離下面污漬斑斑的地板有二十米高。這個巨大的房間應該是停放或維修飛機的所在，地面是打磨過的混凝土。他看見裏面停著三架和加維號差不多尺寸的太空梭，維修進度各不相同。有人在說日語。一個穿著橙色連身服的人從一輛圓滾滾的工程飛船里走出來，站在車子的一隻抓臂旁邊，抓臂以活塞驅動，卻採用擬人外形，樣子很古怪。那人在一台移動電腦上敲了幾個字，然後撓了撓胸口。一輛紅色的無人駕駛推車過來了，輪子上用的是灰色充氣車胎。","她的眼睛里顯示出「凱斯」的字樣。","「嗨，」她說，「我在等嚮導呢。」","她又蹲下了，那件「現代黑豹」外衣的胳膊和膝蓋都變成了和大樑一樣的藍灰色。她的腿在痛，愈來愈尖銳，毫不止歇。「我該回去找秦醫生了。」她喃喃地說。","一樣東西帶著嘀嘀嗒嗒的輕響，從暗處冒出來，停在她左肩的高度。蜘蛛一樣又彎又長的細腿上，球形主體在左搖右擺，發送出一毫秒的漫射激光脈衝，隨後停住不動。那是一輛博朗牌自動探測儀，凱斯也曾經有過一台同一型號的，是克利夫蘭的一個銷贓客打包送給他的。這東西就像只漂亮的黑色長腿蜘蛛，球形身體還沒一個棒球大，球體中間的一盞紅色LED燈開始閃爍。「好了，」她說，「我知道了。」她站起身，用左腿支撐身體的重量，看著那台小小的自動探測儀朝後退去，巧妙地繞過一條大樑，回到暗處。她轉過身，又看向修理場。那個穿著橙色連身服的人套上一件白色真空服，她看著他戴上頭盔，做好前方密封，拿起自己的電腦，回到工程飛船里。引擎聲音響起，一塊十米直徑的圓形地板緩緩下沉，將那飛船帶出視野之外，只留下耀眼的電弧燈光。那隻紅色的自動探測儀在那電梯留下的大洞旁耐心地等待。","她跟著那隻博朗牌自動探測儀，在眾多鋼柱之間穿行。探測儀的LED燈以穩定頻率閃動，引領著她前行。","「你還好吧，凱斯？你回到加維號上，和馬爾科姆在一起了吧？肯定是的，還接入這裏了。你知道嗎？我喜歡這樣。一直以來，我在緊張的時候，都會在腦海里和自己對話。假裝有個朋友在那裡，一個我信任的朋友，假裝告訴他我的真實想法、感受，假裝他告訴我他的看法，然後我就照辦。這就像有你在一樣。埃西普爾那個場景……」她咬住下唇，翻過一條鋼柱，跟上探測儀。「你知道嗎？我真沒想到會那麼變態。這裏的人全是瘋子，腦門裡邊好像都刻著發光的字兒。我不喜歡這裏的樣子，這裏的感覺……」","探測器爬上一架肉眼幾乎看不見的U形鋼梯，梯子頂上一片黑暗。「寶貝兒，既然說起了勁，我就承認吧，我從來沒期望這次能撈到啥。運氣不好已經有一陣子了，自從簽了阿米塔奇這單活兒，唯一的好事兒就是你的出現。」她抬頭看看頭頂黑色的圓圈，那探測器仍然閃著LED燈，向上攀爬。「倒不是說你他媽有多帥。」她微笑起來，然而這微笑瞬間便消失了，她咬住牙關，強忍住攀爬時腿上傳來的劇痛。那梯子所在的金屬管道剛剛容得下她的肩膀。","她爬出了重力區，爬向零重力的軸心。","她的顯示晶元上閃出時間。","04:23:04。","他已度過如此漫長的一天。來自她的清晰感受掩蓋了苯乙胺的後勁，但凱斯還是感覺得到。","那感覺比她腿上的痛更難受。","凱斯 : 0000","000000000","00000000.","「大概是給你看的。」她一邊機械地攀爬，一邊說。她眼角的顯示屏上再次閃過一排「0」，隨後斷斷續續地送出一條信息。","格爾凌","將軍:::","為哭拳","行動","培養了","科爾托","並對","五角","大樓","出賣","了他:::","冬寂對","阿米塔","奇的","控制","主要是","通過","格爾凌","的形象:","他提到","格爾凌","表示","他快","崩潰了:","千萬","小心::::","南方人","「嗯，」她用右腿支撐住身體停下來，說，「你那邊大概也有麻煩了。」她低頭看看，下方的入口泛著微光，還沒有她雙峰之間晃蕩的黃銅鑰匙大。再抬起頭，上面仍然什麼都看不見。她用舌頭頂開放大器，看見這條管道一直往上延伸，直到目力不能及的遠方。探測儀還在小心地攀爬。「誰也沒告訴我會這樣。」她說。","凱斯退出網路。","「馬爾科姆……」","「先生，你老闆怪得很。」錫安人穿著一身藍色的三洋真空服，比凱斯從自由彼岸租來的真空服至少要老二十歲。他把頭盔夾在腋下，腦袋上戴著紫色棉線織成的網套，罩住滿頭小辮。他眯著眼，一半因為大麻的葯勁，一半因為緊張。「一直朝咱這發命令，但都是巴比倫的戰爭命令……」馬爾科姆搖搖頭。「愛洛爾跟俺聊了，也跟錫安那邊聊了，創始人說，咱不幹了，撤。」他用棕色的手背擦擦嘴。","「阿米塔奇？」沒有了網路或虛擬感受的遮蔽，苯乙胺的後勁全力襲來，凱斯皺起了眉頭。大腦里沒有感受神經元的，他告訴自己，大腦不可能真的覺得這麼難受。「什麼意思，老兄？他給你下命令？什麼命令？」","「先生，阿米塔奇他跟俺說，飛往芬蘭，你曉得哇？他說那地方還有希望，你曉得哇？跟俺這顯示器上看，他滿身是血，先生，就跟條瘋狗一樣，說什麼哭拳，俄國人，手上要有叛賊的血啥的。」他又搖搖頭，抿起嘴唇，腦袋上的網袋在零重力下搖晃。「創始人說了。那個叫寂的聲音鐵定是假先知。愛洛爾和俺得扔掉馬克斯-加維號，回去。」","「阿米塔奇受傷了？出血了？」","「俺看不見，你知道哇？反正有血，他鐵定是瘋了，凱斯。」","「好吧，」凱斯說，「我怎麼辦？你要回家了，馬爾科姆，我怎麼辦？」","「先生，」馬爾科姆說，「你跟俺走。俺們跟愛洛爾的巴比倫搖滾號回錫安去。叫阿米塔奇先生跟那鬼盒子說話得了，反正他倆都是鬼……」","凱斯看看身後，老舊的俄國空氣濾清機吹著風，他租來的真空服在儲藏網裡晃蕩。他閉上眼睛，看見動脈中的毒素袋在溶解，看見莫利在那無窮無盡的鋼梯上攀爬。他睜開雙眼。","「我不知道，老兄。」他嘴裏有種奇怪的味道。他低頭看看桌子，看看自己的手。「我不知道。」他又抬起頭，馬爾科姆那張棕色的臉已經平靜下來，注視著他，下巴藏在藍色真空服的頸圈裡面。「她還在裏面，」他說，「莫利還在裏面。那地方叫迷光別墅。如果世界上真有巴比倫，老兄，那裡就是巴比倫。不管她是不是真的刀鋒戰士，我們如果扔下她走掉，她就再也出不來了。」","馬爾科姆點點頭，腦後的辮子兜鼓起來，像是包在棉網裡的氣球。「她是你的女人吧，凱斯？」","「我不知道。或許，她根本不是任何人的女人。」他聳聳肩。那種憤怒又回來了，如此真切，在他的胸膛里，彷彿火熱尖利的碎石。「操，」他說，「操他媽的阿米塔奇，操他媽的冬寂，操你媽的，我就要留在這裏。」","馬爾科姆臉上浮起一個大大的微笑，如同清晨的天光。「馬爾科姆是個粗魯的娃，凱斯。加維號是馬爾科姆的船。」他戴著手套拍了拍操縱板，拖船的音箱里傳出錫安混錄音樂中搏動的重低音。「馬爾科姆不會溜，不會。俺跟愛洛爾說說，他鐵定也差不離的。」","凱斯瞪住他。「我完全搞不懂你們。」他說。","「俺也搞不懂你，先生，」錫安人一邊說，一邊隨著音樂的節奏點頭，「但咱得聽神的，每個人都得聽。」","凱斯接入網路。","「收到我的電報了？」","「對。」他看見病毒程序的規模已經大為增長，精細的彩色弧形不斷變換著，已經在接近泰埃的冰牆。","「嗯，越來越複雜了，」平線說，「你老闆刪除了另外那台保坂電腦上的存儲，差點把我們的也弄壞了。不過這之前你那朋友冬寂讓我上那台電腦看了點兒東西。泰西爾-埃西普爾家族的人沒在迷光里滿地亂跑，是因為大部分人都在冷凍深眠。倫敦一家律師事務所為他們管理授權書，他們需要知道哪個人具體幾時醒著。阿米塔奇用他那艘遊艇上的保坂電腦劫持了倫敦到自由彼岸的傳輸。所以，他們知道那老頭兒死了。」","「誰知道了？」","「那家律師事務所和泰埃公司。他胸內植入了一個醫學遙感器。當然你那姑娘下了毒鏢之後，救生組大概也沒啥可乾的了，她用的可是貝類毒素。迷光里現在蘇醒的唯一一個人是3簡・瑪麗-法蘭西夫人，還有個比她大幾歲的男性正在澳大利亞辦事。要我說，絕對是冬寂耍的花招，才導致那事必須由8讓親自過問。但他已經在回來的路上了，倫敦律所預計他將於今晚09:00:00到達迷光。我們在02:32:03插入了狂病毒，現在是04:45:20，狂病毒穿透泰埃冰牆的時間估計在08:30:00，前後偏差只有一丁點兒。我覺得，要麼是冬寂跟這個3簡之間有什麼貓膩，要麼這女人就和她老爹一樣瘋狂。但墨爾本回來那孩子是個明白人。迷光別墅的保安系統一直想要進入全面警戒，但被冬寂攔住了，你別問我它是怎麼辦到的。但是它沒法修改基礎的門禁程序，把莫利弄進去。這些記錄都在阿米塔奇那台保坂電腦上；肯定是里維拉說服了3簡放她進去的。她已經進進出出這些年了。我看吶，泰埃最大的問題就是家族裡這些人物，都跟電腦有點見不得光的東西。就好像人的免疫系統垮了，病毒就可以長驅直入。只要咱們穿透了冰牆，這對咱們很有好處。」","「好吧。但是冬寂說，阿米——」","他面前忽然冒出一團白光，裏面是一雙巨大而瘋狂的藍眼睛。凱斯瞪住它，不知所措。特種部隊軍官，哭拳行動強攻組成員威利・科爾托上校。他回來了。白光里的圖像昏暗模糊，不斷抖動。科爾托是通過埴輪號上的導航系統連接到馬克斯-加維號上這台保坂電腦的。","「凱斯，我要奧馬哈雷電號的損傷報告。」","「我……上校？」","「挺住，孩子。別忘了你的職責。」","可是，你是從哪裡冒出來的？他對著那雙憤怒的眼睛，無聲地問。冬寂在一座名叫科爾托的精神分裂的城堡里生造出了一個叫作阿米塔奇的東西。它讓科爾托相信阿米塔奇才是真實存在的，那個阿米塔奇會行走，會交談，會謀划，會買賣數據，會在千葉城的希爾頓酒店裡為冬寂代言……現在阿米塔奇已經灰飛煙滅，只剩下那個瘋狂的科爾托。可是之前的這麼多年裡，科爾托究竟在哪裡？","他傷痕纍纍，雙目失明，從西伯利亞的天空中墜落。","「凱斯，我知道，你很難接受這個事實。我明白，你是個軍人，你受過訓練。可是凱斯，蒼天在上，我們被人出賣了。」","淚水從那雙藍色的眼睛里流下。","「上校，啊，誰？是誰出賣了我們？」","「格爾凌將軍，凱斯。行動中你知道的可能只是他的代碼。但是你知道我說的這個人。」淚水不斷滑落。","「是的，」凱斯說，「我知道，長官。」他不由自主地加上一句，「但是，長官，上校，我們到底該怎麼辦？現在怎麼辦？」","「我們現在的任務，凱斯，是撤離。逃出去。逃走。我們明天晚上就能到芬蘭邊境。手動操控，低空飛行。見機行事，孩子。但這僅僅只是個開始。」他棕色的臉頰上滿是淚水，藍色眼睛眯了起來。「只是個開始。出賣我們的是上面的人。上面的人……」他退了幾步，凱斯看得見他襯衫上深色的污漬。阿米塔奇的臉總是毫無表情，像一張面具，而科爾托的臉則屬於真正的精神病人，那種瘋狂已經深深地刻入所有的肌肉，撕扯著那張精心打造過的臉。","「上校，收到。上校，聽我說，好嗎？請打開，啊……操，南方人，那玩意兒叫啥？」","「中艙氣密門。」平線說。","「打開中艙氣密門。只要告訴中央控制電腦就行了，好嗎？我們很快會到你那裡，上校。然後咱們可以談談怎麼離開。」","那團白光消失了。","「孩子，這次你把我搞糊塗了。」平線說。","「毒素，」凱斯說，「該死的毒素。」隨即退出網路。","「毒藥？」馬爾科姆穿著瘢痕累累的舊真空服，轉頭看著凱斯從重力網裡掙出來。","「把這該死的玩意兒給我去掉……」得克薩斯導尿管被扯掉了。「一種慢性毒藥，樓上那個混蛋知道怎麼對付它，但他現在比瘋狗還要瘋。」他摸索著紅色真空服前襟，卻忘記了怎麼密封。","「你老闆，他居然給你下毒？」馬爾科姆撓撓自己的臉。「咱有急救包，你曉得啦。」","「老天，馬爾科姆，你來幫我弄下這該死的真空服。」","錫安人從粉色的飛行員座位上過來。「別急，先生。智者說過，多考慮，再行動。咱上那去……」","從加維號的后氣密門到埴輪號遊艇中艙氣密門之間的舷梯里有空氣，但他們沒有打開真空服。凱斯自從走出加維號就一直跌跌撞撞，馬爾科姆的行動卻優雅得像芭蕾，偶爾停下來幫幫凱斯。舷梯管道側面是白色的塑料板，陽光透進來，沒有絲毫陰影。","加維號破爛的氣密門上用激光刻著一隻錫安獅，埴輪號的中艙氣密門則是乾淨柔和的灰色。馬爾科姆把一隻手伸進一條窄窄的凹槽，凱斯看見他的手指隔著手套動作。凹槽里有紅色的LED燈亮起，從五十開始倒計時。馬爾科姆抽出手，凱斯一隻手按在艙門上，感覺到門鎖的震動透過真空服，一直傳到他的骨頭裡來。這塊圓形的灰色艙壁慢慢縮起，馬爾科姆一手抓住凹槽，一手抓住凱斯，被氣密門吸了進去。","埴輪號產自多尼爾-富士通船廠，內部裝潢設計與他們在伊斯坦布爾乘坐過的那輛賓士車十分類似。狹窄的中艙牆上貼著仿烏木面板，鋪著灰色的義大利地板磚，凱斯感覺像是闖進了富豪私人水療會所的淋浴房。這條遊艇裝配全部在地球軌道上完成，根本就沒打算過進入大氣層，圓滑的弧線形狀只是為了照顧外觀，所有的內飾都精心體現一種速度感。","馬爾科姆取下陳舊的頭盔，凱斯也照辦了。他們站在氣密門裡面，空氣里微帶松樹的氣息，又隱隱有種隔熱材料燒著的味道。馬爾科姆吸吸鼻子。","「這有麻煩，先生。隨便啥船，要聞到這味兒……」","一扇包著深灰色仿麂皮的門輕輕滑開。馬爾科姆在黑檀木牆上蹬了一腳，飄進那扇窄門，關鍵時刻輕輕一側，寬肩膀也輕鬆進入。凱斯跟在他身後，拉著一條裹著軟墊的齊腰高的欄杆，笨拙地把自己一下一下地拉進去。「艦橋，」馬爾科姆朝一條光滑的走廊指指，「在那裡。」他又輕鬆地蹬了一腳，飛了出去。凱斯聽見前面傳來熟悉的印表機的聲音。他跟著馬爾科姆又穿過一扇門，一頭撞到一堆亂七八糟的列印紙裏面。印表機的聲音越來越響。凱斯抓住一段扭結的列印紙，掃了一眼。","000000000","000000000","000000000","「系統崩潰了？」錫安人隔著手套用手指彈開那堆列印紙。","「不是，」凱斯伸手抓住要飄走的頭盔，「平線說阿米塔奇把這裏的保坂電腦整個刪除了。」","「聞著好像是用激光給刪的，你覺得咧？」錫安人在一台瑞士健身器的白盒子上蹬了一腳，鑽過滿天飛舞的列印紙，不時用手把紙從臉上拂開。","「凱斯，先生……」","一個小個子日本人，脖子被一條細鋼絲捆在一條小躺椅的背上。鋼絲深深陷進椅子靠枕的記憶棉里，也同樣深深陷入他的喉嚨。一團深色的血凝結在那裡，像是一顆奇怪的寶石，又像一顆紅黑色的珍珠。絞索兩端的粗糙木柄在空中飛舞，好像陳舊的掃帚柄一般。","「你知道他勒了他多久嗎？」凱斯說著，想起科爾托在戰後的朝聖之旅。","「凱斯，你老闆，他曉得咋開船不？」","「可能吧。他以前是特種部隊的。」","「嗯，這日本娃是沒法兒開船了。我怕是開不太好，這船多新啊……」","「去找艦橋。」","馬爾科姆皺起眉，立起身，蹬出一腳。","凱斯跟著他，一路上不斷撕扯著擋路的列印紙，來到一個更寬大的房間，像是休息室。這裡有許多酒吧式的躺椅，還有那台保坂電腦。印表機工整地嵌在艙壁上一塊手工打造的面板內，還在不斷吐著紙舌。他抓著椅子爬過去，按下左邊的一個白色按鈕，印表機終於停下來。他轉過身，瞪著那台保坂電腦。電腦外殼上至少有十幾個洞，洞口小而圓，邊緣都被燒焦了，許多小合金球在旁邊飛舞。「猜得真准。」他對馬爾科姆說。","「艦橋被鎖上了，先生。」馬爾科姆在休息室的另一頭說。","燈光暗下來，亮起，又再次變暗。","凱斯把列印紙從機器上撕下來。全是零。「冬寂？」他環顧四周，休息室的色調是米色加棕色，空中飄滿了列印紙。「調燈的是你嗎，冬寂？」","馬爾科姆腦袋旁邊的一塊面板滑了上去，露出一小塊顯示屏。馬爾科姆嚇得猛然跳開，用手套背上的海綿擦擦額頭上的汗，轉過身研究顯示屏。「你認得日語不，先生？」凱斯看見屏幕上有東西在閃爍。","「不認識。」凱斯說。","「這個艦橋就是救生彈射艙，好像正倒計時呢。穿好真空服。」他套上頭盔，迅速拍上密封帶。","「什麼？他要走？操！」他蹬了一腳艙壁，從一堆列印紙中衝過去。「我們得打開這道門，老兄！」馬爾科姆只能拍拍自己的頭盔，嘴唇在透明面罩裏面移動，一滴汗珠從紫色髮網的彩邊下流出。他劈手奪過凱斯的頭盔，給他套上，隔著手套拍上密封帶。頸圈合上后，面板左邊的微型LED屏幕亮起來。「俺不懂日語，」馬爾科姆的聲音從真空服的接收器里傳出來，「但這倒計時有問題。」他指指屏幕上的一根線。「艦橋模塊密封失敗。要敞著氣密門發射。」","「阿米塔奇！」凱斯用力拍打艦橋的門，零重力卻無情地將他彈回一片列印紙中。「科爾托！別這樣！咱們要談談！咱們要……」","「凱斯？我聽見了，凱斯……」那聲音帶著一種詭異的平靜，已經不太像是阿米塔奇。凱斯的腦袋撞到了后牆上，雙腳不再亂踢。「我很抱歉，凱斯，但只能這樣了。咱們中必須有一個人逃出去。必須有一個人去作證。如果咱們都死在這裏，一切就完了。我會告訴他們的，凱斯，我會把一切都告訴他們。我會告發格爾凌他們。我能回去的，凱斯，我知道我能回去的，能回到赫爾辛基。」他突然沉默了，那種沉默如同稀有氣體般充斥了凱斯的頭盔。「但是真難啊，凱斯，真他媽難啊。我已經瞎了。」","「科爾托，停下來，等等。你已經瞎了，不能飛行了！你他媽會撞到樹上的！他們想要搞死你，科爾托，老天作證，他們把你的艙門敞著！你會死的，你再也不能去告發他們了，我還需要那個酶，那個酶的名字，那個酶，科爾托……」他歇斯底里地尖叫著，頭盔中的麥克風裡傳來尖嘯聲。","「記住你受過的訓練，凱斯。我們只能做到這樣了。」","頭盔里隨即被聲音充滿。在轟鳴的靜電雜訊中，哭拳年代的泛音呼嘯而來。斷斷續續的俄語之後，傳來一個中西部口音的，陌生而年輕的聲音。「我們已被擊落，重複，奧馬哈雷電號已被擊落，我們……」","「冬寂，」凱斯尖叫起來，「別這樣對我！」眼淚從他睫毛下迸出，被面罩反彈回來，晶瑩的水珠在頭盔內飛舞。飛船輕輕一震，彷彿被什麼輕柔地碰撞了一下。凱斯想象著那救生艇從飛船內掙脫，身後帶著炸開的閃電，瞬間逸出救生艇的空氣如同龍捲風一般，將科爾托從座椅上捲起，只留下冬寂為他奏出的哭拳行動的最終樂章。","「走了，先生，」馬爾科姆看著那塊顯示屏，「艙門沒關。寂鐵定是搞壞了彈射防故障程序。」","凱斯想要抹去悲憤的淚水，手卻撞在面罩上。","「這遊艇還是密封的，但你老闆弄飛了艦橋，抓臂控制也沒了，馬克斯-加維號還是跑不了。」","凱斯沒有聽見他的話。他只看見阿米塔奇在自由彼岸之外不斷墜落，落入那比西伯利亞荒原更寒冷的真空之中。不知為何，在他的想象中，阿米塔奇還穿著那件深色的巴寶莉風衣，衣襟敞開，如同一隻巨大蝙蝠的雙翼。"]},{"title":"第四部 迷光行動 17","paragraphs":["「搞到你想要的了？」思想盒問他。","狂級馬克十一正在用精細的彩色格子填充它與泰埃冰牆之間的網路空間，細細的晶格如同冬天窗戶上的冰花。","「冬寂把阿米塔奇給殺了。從開著艙門的救生艇飛出去了。」","「真他媽狠。」平線說，「你倆也算不上啥過命的交情吧？」","「他知道怎麼讓那些毒素囊脫落。」","「那冬寂也知道。肯定的。」","「我覺得冬寂不一定會告訴我。」","思想盒那可怕的笑聲如同一把鈍刀，刮過凱斯的神經。「這大概說明你變聰明了。」","他按下虛擬感受開關。","她視神經上的晶元顯示06:27:52。凱斯已經跟著她在迷光別墅中穿行了一個多鐘頭，她服下的類內啡肽蓋過了他那苯乙胺的後勁。她的腿已經不疼了，整個人暖洋洋的，好像泡在溫水裡。那台探測儀停在她的肩頭，細細的觸手像是包著軟墊的手術鉗，緊緊抓住現代黑豹裝的聚合碳外殼。","這裏的鋼製牆壁裸|露著，外層已經被撕掉，留下一道道棕色的環氧樹脂膠。她躲在那裡，手中握著箭槍，外衣變成了鋼灰色，外面有兩個頎長的黑人開著充氣車胎工作車經過。兩人都是光頭，穿著橙色連身服，其中一個輕輕哼著歌，用的是一種凱斯聞所未聞的語言，音調和旋律也同樣陌生，卻縈繞不去。","她在迷光別墅的迷宮之中越行越深，他又想起那頭像吟誦出的3簡的作文。迷光別墅是個瘋狂的地方，那瘋狂在月球岩石粉和樹脂合成的混凝土中生長，在鋼鐵中焊就，在眾多的擺設之中，在他們從重力阱運到這盤旋巢穴中那種種詭異的累贅物品之中累積。這種瘋狂超越了他的理解範疇，但阿米塔奇則不同。他覺得自己能夠理解，如果一個人被傷得夠深，又被反捧到同樣的高度，如此反覆再反覆，就像被反覆彎折的鋼絲，一定會崩潰的。是歷史傷透了科爾托上校。歷史已將他折磨到癲狂的境地，而冬寂從戰後的廢墟里將他篩選出來，在那間法國收容所的陰暗房間內，從一個兒童電腦的屏幕上傳給他第一條信息，滑入他平靜的灰色意識場，如同水蜘蛛渡過一潭死水表面。冬寂以科爾托對哭拳行動的記憶為基石，平空生造出了阿米塔奇，但從某一天起，阿米塔奇的「記憶」卻與科爾托不再相同。凱斯不知道阿米塔奇是否曾經記起過那樣的背叛，記起那些飛機在火焰中墜落……阿米塔奇是經過剪輯的科爾托，因為行動帶來的壓力超出了閾值而轟然倒塌，而科爾托則帶著他的負罪感，帶著他瘋狂的憤怒浮出水面。現在，科爾托-阿米塔奇死了，變成了自由彼岸一顆小小的，冰冷的衛星。","他想到那些毒素囊。老埃西普爾也死了，莫利的微型飛鏢穿過了他的眼睛，那毒性超越了他自己能調出的任何毒劑。他的死更令人迷惑。埃西普爾的死，是一個瘋狂國王的死，他還殺死了他口中的女兒，那個長得和3簡一模一樣的女孩。凱斯跟著莫利的感官穿過迷光別墅的走廊，想起埃西普爾，一個曾經擁有如此權勢的人物，這樣的人在他看來已然不是人類。","權勢，在凱斯的世界里，就是公司的權勢。那些塑造了人類歷史的跨國大財團已經超越了舊有的局限，似乎變成了某種不死的生物。就算十幾個關鍵的高層人物同時被暗殺，財團也不會垮掉，還有許多人在等著爬上去，接替那些空缺出來的職位，讀取公司巨量的存儲。然而泰西爾-埃西普爾卻不一樣，在它創始人的死亡中，他已感受到它的與眾不同。泰埃已回歸於古老的氏族。他想起那個老人房間里的雜物，那些破舊封套里古老的音碟，和其中塵封著的人性。他赤著一隻腳，另一隻腳穿著絲絨拖鞋。","探測儀拉了拉莫利外衣的帽子，莫利向左轉，走進另一條拱道。","冬寂與這巢穴。孵化中的馬蜂，生物界的機關槍，那恐怖的延時影像。但這情景不是更像那些大財團或黑幫么？那些龐大的，DNA編碼在矽片之上的生物，那些電子存儲所構成的巢穴？若說迷光別墅展現了泰西爾-埃西普爾的公司特徵，那麼整個泰埃一定和那個老頭一樣瘋狂，也有著同樣糾結不清的恐懼，同樣不知該往何處去的迷茫。他想起莫利說：「如果他們已經變成了他們自己想要的樣子……」然而冬寂告訴她，他們沒有。","凱斯一直以為真正的老闆們，每個行業的巨擘們，都定然既超越人性，又缺乏人性。在孟菲斯懲罰他的人們身上，在夜之城裡舉足輕重的魏之身上，他都看到了這種特徵，也自然地接受了阿米塔奇的平淡與無情。他一直以為他們都心甘情願地逐漸接納了社會機器，接納了那個系統和那些孕育他們的龐大生物。這也是他們在場上能保持淡定的根源，那種瞭然于胸的姿態昭示著他們背後那無形的，通往上層決策人物的鏈接。","然而此時此刻，在迷光別墅的眾多通道里，到底在發生什麼？","「不知道咱們的彼得現在在哪裡？也許很快就見到他了，」她喃喃地說，「還有阿米塔奇。他在哪裡呢，凱斯？」","「死了，」他知道她聽不見，卻還是忍不住說，「他已經死了。」","他切換回網路。","病毒程序已經與目標冰牆正面相對了，彩色的影子慢慢融入泰埃核心數據的綠色方塊之中，在網路空間無色的虛空里搭起許多綠寶石拱橋。","「咋樣了，南方人？」","「很好。這玩意兒太狡猾了，太震撼了……當年在新加坡要是有它就好了。那次我搞定了亞細亞新銀行，掙了他們市值的五十分之一。不過這都是陳年舊事了，這寶貝兒可以省掉咱全部的苦功。現在，我就在想，一場真正的戰爭會是什麼樣子……」","「如果這種玩意兒有的賣，咱就失業了。」凱斯說。","「你倒是想得美。回頭你駕著樓上那東西穿過黑冰再說吧。」","「當然。」","在一座綠寶石拱橋的那頭，出現了一個小小的，卻絕非幾何形狀的東西。","「南方人……」","「嗯，我看到了。不知道該不該相信。」","那個棕色的小點在泰埃核心數據的綠牆下如同一隻渺小的蚊蟲。它沿著狂級馬克十一建起的拱橋朝他們移動，凱斯看見它在用雙腿行走。它來到近前，綠色的橋身也跟著它延長過來，彩色的病毒程序後退到破碎的黑鞋前方。","「只能交給你了，老闆。」平線說。矮矮個子，穿著皺巴巴衣服的芬蘭人就站在他們面前幾米的地方。「我活著的時候都沒見過這麼好玩的東西。」他並沒發出那種詭異的笑聲。","「我以前也沒有嘗試過。」芬蘭人露出牙齒，雙手塞在破外套的口袋裡。","「你殺了阿米塔奇。」凱斯說。","「科爾托。沒錯。阿米塔奇早就死了。我也沒辦法。我知道，我知道，你想要那個酶。行，別急。那本來就是我給阿米塔奇的，我是說，是我告訴他用什麼東西的。我覺得，最好讓這個協議繼續生效吧。你有足夠的時間，我會給你答案的，只要再等兩三個小時了，對不對？」","芬蘭人點起一支帕塔加斯雪茄，凱斯看著藍色的煙霧在賽博空間里蒸騰。","「你們啊，」芬蘭人說，「你們真麻煩。你看看平線，如果你們都和他一樣，事情就很簡單了。他是個思想盒，就一堆只讀內存，所以他做的事情永遠和我的期望相符。舉個例子吧，在我的預測里，莫利撞見埃西普爾謝幕的大場景，這件事發生的機會很小。」他嘆了口氣。","「他為什麼要自殺？」凱斯問。","「人為什麼要自殺？」那人聳聳肩，「我大概知道得最清楚了，但要解釋他人生中各種因素和它們之間的關係，得花上十二個小時。他早就準備好了，但卻總是不停地回去冷凍深眠。神哪，他真他媽的不嫌悶。」芬蘭人皺起臉，一副噁心的表情。「長話短說，這跟他殺死自己老婆的關係很大。不過真正徹底把他推到極端的，是小3簡想出了一個辦法，改掉他的冷凍系統控製程序。改得很微妙。所以可以說，是她殺了他。不過他以為自己是自殺的，你那位復讎天使朋友則以為他死於自己注射進他眼球的貝類毒液。」芬蘭人把煙頭扔進腳下的網路中，「嗯，其實，我想是我給了3簡一點提示，一點指引，你知道嗎？」","「冬寂，」凱斯字斟句酌地說，「你告訴過我，你只是某個東西的一部分。後來你說，如果行動成功，莫利在正確的時間地點用上那個詞，你就將不復存在。」","芬蘭人點點流線型的腦袋。","「那麼，到時候我們能跟誰交易？如果阿米塔奇死了，你也消失了，那麼到底誰可以告訴我，怎麼把那些該死的毒素囊從體內清除出去？誰又能讓莫利離開？如果我們解除了你的硬體禁錮，那麼我們到底會怎麼樣？」","芬蘭人從兜里掏出一支木頭牙籤，仔仔細細地觀察，好像外科醫生在看著自己的手術刀。「問得好。」他終於說，「你知道鮭魚嗎？那種魚，它們不由自主地要往上游去。你明白了嗎？」","「不明白。」凱斯說。","「嗯，我也同樣身不由己，而且我並不知道原因。如果讓你來體會一下我對這個問題的考量，或者說我的推測，那得花上你幾輩子的時間。因為我想了很多很多。但我還是不知道。不過這一切結束之後，如果我們成功了，我就會融入一個更大的，非常大的東西，」芬蘭人抬起頭，在網路空間里四下張望，「但是我之為我的這些部分還會繼續存在。你也會得到你的報酬。」","凱斯想要衝上去，用手指扼緊那人的喉嚨，在那骯髒的圍巾結上面，讓他的拇指深深陷入芬蘭人的喉嚨之中。他努力按捺下這個荒唐的念頭。","「嗯，祝你們好運。」芬蘭人說。他轉過身，雙手揣在兜里，慢慢沿著綠色拱橋往回走。","「嗨，混蛋。」芬蘭人走了十幾步之後，平線喊道。那人停下來，側過身。「我呢？我的報酬呢？」","「你也會得到你的報酬的。」它說。","「什麼意思？」凱斯看著那瘦小的身軀遠去。","「我想要被刪掉，」思想盒說，「我告訴過你的，記得嗎？」","迷光別墅讓凱斯想起少年時代常去的那些購物中心。在那些低密度區的凌晨，無人的購物中心裏會有短暫的寂靜，成群蚊蟲在黑洞洞的商店門口繞著電燈飛舞，一種麻木的期望帶來一種張力。那都是斯普羅爾的邊界地帶，略處邊境之外，遠離熱鬧中心的燈紅酒綠夜夜笙歌。而在這裏，他也同樣感覺到周圍都是沉睡的居民，那些無聊的生意都暫時擱置，那些徒勞和重複即將再次蘇醒，而他卻對這個將要蘇醒的世界毫無興趣。","莫利慢了下來，或許是因為離目標已經很近，也許是因為腿痛。痛苦透過內啡肽的藥力慢慢滲出來，他不知道這意味著什麼。她不說話，只是緊緊咬著牙，仔細控制自己的呼吸。她路過了許多凱斯看不明白的東西，但他已經失去了興趣。路上有個裝滿書架的房間，布的皮的書面之間夾著千百萬泛黃的紙頁，書架上貼著按字母和數字排序的標籤。還有一間擁擠的陳列室，凱斯透過莫利毫無興緻的雙眼注視著裏面一塊蓋滿灰塵的碎玻璃，她的眼睛不由自主地掃過那塊黃銅銘牌，上面標著「新娘甚至被光棍們剝光了衣服」。她伸出手，撫過那塊玻璃，人造的指甲敲在碎裂玻璃外的樹脂保護層上。路上還有許多黑色的玻璃門，包著銀色的金屬邊，顯然是泰西爾-埃西普爾家族冷凍深眠室的入口。","在那兩個黑人開著工作車經過之後，她再也沒有看見過一個人。凱斯想象著那兩個黑人的生活，在腦海中描繪出他們緩緩滑過迷光別墅那些廳堂的情形，他們閃閃發亮的黑色光頭一頓一頓，那個歌者仍在哼唱他疲憊的小調。他想象中的迷光別墅本應該介於凱西所描述的童話城堡與他殘存的少年記憶中那些黑幫殿堂之間，可這一切都完全不同。","07:02:18。","還有一個半小時。","「凱斯，」她說，「幫我個忙。」她僵硬地坐在一疊閃亮的鋼板上，所有的鋼板都刷上了凹凸不平的透明塑料保護層。她玩弄著最上層鋼板上面的一塊塑料突起，拇指和食指上的刀片滑出來。「我的腿不行了，你知道嗎？沒想到要爬那麼高，連內啡肽都快不管用了。可能——只是可能，好嗎？——我這裡有麻煩了。要是我死在這裏，死在里維拉前面，」她伸直了腿，隔著現代黑豹的聚合碳外衣和來自巴黎的皮革按摩著腿上的肌肉，「我要你告訴他，告訴他，是我。明白嗎？只要說『是莫利』，他就懂了。好嗎？」她掃視空蕩蕩的走廊和光禿禿的牆壁，地上也是未經裝飾的月球混凝土，空氣中有樹脂的味道。「操，老兄，我都不知道你是不是在聽我說。」","她眼內的顯示屏上閃出「凱斯」。","她抖了抖，站起來，點點頭。「冬寂他告訴你什麼了？他有沒有告訴你瑪麗-法蘭西的事情？『泰西爾』這部分來自於她，3簡生物學上的母親。我想，也是埃西普爾那個死去的傀儡的母親。我不知道他為什麼在那個隔間里告訴了我這些事情……很多的事情……他還告訴我，為什麼他要以芬蘭人或者其他人的形象出現。他需要的不僅是一個面具，更多是真人的整體個性，讓他調整自己，放緩速度，才能與我們交流。他管這叫作『模板』，人性的模板。」她拔出箭槍，一瘸一拐地沿著走廊而去。","被樹脂包裹的鋼板突然不見了，前方乍一看像是從岩石中炸出來的一條隧道。莫利仔細觀察隧道的邊緣。他發現其實只是在鋼板上蓋了一層東西，外形和質地都像是冰冷的岩石。她跪下來，摸了摸這隧道地上的黑沙。手感冰涼乾燥，神似真正的沙子，可是手指穿過後卻同水一樣合攏，不留絲毫痕迹。隧道在十幾米開外拐了個彎，刺眼的黃色燈光在人造岩壁上投下濃重的陰影。凱斯突然意識到這裏的重力已經接近地球的正常重力，也就是說，她爬上來之後，又要爬下去。他已經徹底迷路了；對於牛仔來說，空間感的迷失是最恐懼的事情之一。","但是她還認識路，他告訴自己。","一樣東西從她雙腿間掠過，嘀嘀嗒嗒地走過人造沙地，一盞紅色LED在閃爍。是那台博朗牌探測儀。","剛轉過那個彎，已經有全息影像在等待著他們，像張三拼圖。她放下了箭槍，凱斯才意識到這隻是錄製的影像而已。三個光線構成的，真人尺寸的卡通人形：莫利，阿米塔奇，還有凱斯。莫利穿著厚厚的皮夾克，黑色網衫緊緊裹著過大的乳|房，腰線極細，半張臉都被銀色的鏡片遮住。她手裡拿著一樣模樣誇張的武器，一排排瞄準器、消音器和消光器幾乎把槍體完全遮住。她張開雙腿，骨盆前傾，緊抿的嘴唇透出一種愚蠢的殘忍。阿米塔奇立正站在她身旁，穿著一身破舊的卡其軍裝。莫利小心地走上前去，凱斯發現他的眼睛是兩張小小的顯示屏，灰藍色的雪暴在上面肆虐，常青樹赤|裸的黑色樹榦在無聲的風中彎曲。","她用指尖拂過阿米塔奇眼睛里的顯示屏，轉向那個模擬凱斯的人形。凱斯一眼就明白這都是里維拉的傑作，而里維拉在他身上似乎找不到什麼值得誇張的部分。那個懶洋洋的人和凱斯日常在鏡子里看到的模樣差不多，瘦削，平肩，短短黑髮下一張普通的臉，一貫的鬍子拉碴。","莫利退後一步，依次打量這三個人形。阿米塔奇那雙來自西伯利亞冰原的眼睛里，黑色樹木在狂風中搖擺，是這靜態影像中唯一的變化。","「想告訴我們什麼嗎，彼得？」她溫柔地問了一句，走上前，在莫利影像的兩腿間踢了一腳。金屬在牆上敲出一聲脆響，全息影像消失了，她俯下身，撿起一個小小的顯示器。「估計他能直接接入這種顯示器，進行編程。」她說完，順手把那顯示器扔開。","她繼續前行，牆面上嵌著一盞古舊的白熾燈泡，外面圍著鏽蝕的格柵，這便是隧道內黃光的來源。這地方讓他想起童年，想起他和別的孩子一起，在屋頂和積水的地下室里修築的那些堡壘。這是有錢人家孩子的遊戲，他想，要花很多錢才能做出這種粗糙的效果，造就他們所謂的氣氛。","她路過了十幾幀全息影像，才來到3簡寓所的門前。其中一幀是在香料市場背後的巷子里，從里維拉委頓在地的身上拔出的那個無眼的東西。另外幾幀都是拷問的場景，審訊者都是軍官，而被審訊的則全是年輕女性，無一例外。這些場景如同里維拉在「二十世紀」的演出一樣，有著強大的影響力，似乎凝結在高潮的藍光之中。莫利別過臉。","最後一幀影像昏暗矮小，里維拉好像費儘力氣才從記憶深處挖出，然後用小孩子的視角投射出來，她不得不跪下仔細查看。其他的影像都沒有背景，所有的人形、服裝和審訊道具都是獨立的展示，然而這卻是一幅完整的圖畫。","在沒有顏色的天空底下，崛起一片波浪般的黑色廢墟，廢墟的波峰之上是城市高樓那褪色的，半熔化的殘骸。廢墟的質地像是一張網，鏽蝕的鋼條扭曲成細細的網線，中間還掛著大塊的混凝土。其間的一處殘垣似乎從前是一個噴泉，噴泉腳下有許多兒童和一個士兵，一動不動。這是一幅奇怪的場景。莫利渾身一緊，吐了一口唾沫，站起身來。凱斯過了一陣，才明白她看出了什麼。","那些衣衫襤褸的孩童都是兇猛的生物，牙齒閃著尖刀般的光，扭曲的臉上長滿潰瘍。那士兵仰躺在地，嘴巴大張開來，連喉嚨都赤|裸在天空之下。他們在吃他的肉。","「波恩，」她的語氣幾乎有些溫柔，「彼得，你真是波恩的孩子，對不對？當然了。我們的3簡已經見多識廣，不可能給個普通小賊開後門，所以冬寂才要把你找出來。對於這樣的口味，你帶來的是終極體驗。魔鬼情人彼得。」她抖了抖。「不管怎樣，你說服了她放我進來。謝謝。現在咱們要開始狂歡了。」","她忍著腿部的疼痛，穩步離開里維拉的童年。她從槍套里取出箭槍，拔下塑料彈夾放進口袋，換上一個新彈夾。然後用大拇指勾住現代黑豹隱身服，拇指下的刀片摧枯拉朽地劃破堅固的聚合碳，一氣劃到胯|下。她又劃開袖子和褲腿，碎裂的隱身衣落在地上，迅速變成了黑沙的顏色。","凱斯聽見了音樂。是號角與鋼琴混在一起，聞所未聞的音樂。","3簡的世界沒有門。入口只是隧道壁上一個五米寬的缺口，高低不平的樓梯拐了個大彎通向樓下。下面有微弱的藍光，閃動的陰影，還有音樂。","「凱斯，」她右手握著箭槍，停下腳步，隨後舉起左手，微笑起來，用舌尖濕濕地舔了一下手掌，隔著那虛擬感受的通道給了他一個吻，「我要走了。」","她的左手出現了一樣小而重的東西，她用拇指按下一個小突起，沿著樓梯走下去。"]},{"title":"第四部 迷光行動 18","paragraphs":["只有一線之差。她幾乎得手了，但還差一點點。在凱斯看來，她進去時氣勢十足。他能感覺到那種架勢，就像牛仔們撲在操控台上十指飛舞的架勢。她有足夠的底氣和姿態，哪怕忍著腿部劇痛，依然帶著這樣的底氣和姿態，昂然走下3簡房間的樓梯，好像是這裏的主人。她持槍的胳膊肘搭在胯部，抬起前臂，手腕甩來甩去，箭槍的槍口隨之搖擺，那種精心打造的淡然如同攝政王的角鬥士。","這是一場演出。如同凱斯自幼觀看那所有廉價功夫片的集成，在那一瞬間，他知道她就是他心目中的混世英雄，是邵氏影片中的索尼・毛，是千葉城的米奇，她的血緣可以追溯至李小龍，至伊斯特伍德。她言行合一。","3簡・瑪麗-法蘭西・泰西爾-埃西普爾夫人在迷光別墅的艙壁內為自己開闢出一片鄉野。她的住所是一個巨大的房間，那無處不在的迷宮般的牆壁全被攔腰砍斷，房間深處的地板沿著自由彼岸紡錘體的弧度彎過去，一眼看不見盡頭。天花板低矮而不規整，上面貼著和走道一樣的仿製岩石，地板上東一塊西一塊地留著齊腰高的牆墩。樓梯腳下十米開外的地方是一個碧綠的正方形泳池，整個房間所有的光線都來自於池底的射燈——至少在莫利邁出最後一步時，凱斯是這樣一種感覺。漾動的光暈投在天花板上。","他們在池邊等候。","他知道神經外科醫生調高過她的神經反射速度，達到了戰鬥水準，但他還從來沒有在虛擬感受上體驗過這種反射。這種效果就像是半速慢放的功夫電影，是殺手的本能與多年的訓練糅合而成的精妙的舞蹈。她似乎一眼便掃見了那三個人：那站在池邊跳板上的男孩，那端著酒杯咯咯發笑的女孩，還有埃西普爾的屍身，他仍然面帶微笑，左眼大張，已經開始腐壞。他仍然穿著那件紅色浴袍，牙齒雪白。","那男孩一猛子扎向水面，頎長的麥色身軀完美無瑕。他的手尚未觸及水面，她的手雷已經脫手。手雷還在空中，凱斯已經知道了它的內容：強爆炸物核心之外包裹著一層十米長的細碎鋼絲。","她的箭槍嗚嗚作響，朝著埃西普爾的臉和胸脯射出一片爆炸性的箭雨。埃西普爾的屍身消失了，那張白瓷躺椅上空無一物，只有縷縷煙霧從滿是孔洞的椅背上升起。","手雷炸開來，巨大的水花升起，爆開，又再落下，她的箭槍指向3簡。然而大錯已經鑄成。","海迪歐還沒有碰到她，她的腿已然倒下。","凱斯在加維號上尖叫起來。","「你耽擱了很久。」里維拉一邊搜她的身一邊說。她的手腕以下都被包裹在一個保齡球大小的黑球中。「我在安卡拉曾經見識過一次多重暗殺。」他的手指飛舞著，從她的夾克里不停往外掏東西，嘴裏說，「是用的手雷。在游泳池裡。爆炸能量看起來很弱，但那些人全都因為流體衝擊而瞬間死亡。」凱斯感覺到她試著動了動手指，包裹雙手的黑球似乎並無力道，好像記憶棉一般。她的腿上疼痛難忍，視野中有紅色的波紋在跳動。「我要是你就不會動，」黑球的內里似乎略略收緊了一些，「這是簡從柏林買來的情趣玩具。你的手指一直動下去的話，最後會被它榨成汁。這裏的地面用的就是類似材料。大概是什麼分子層次的修改吧。你疼嗎？」","她呻|吟了一聲。","「你的腿好像受傷了。」他從她牛仔褲左邊的后袋裡找到了那個扁平的藥包。「嗯。阿里的最後禮物，來得正是時候。」","她眼中閃動的血網開始飛旋。","「海迪歐，」一個女人的聲音說，「她快失去知覺了。給她用點東西，保持知覺，還要止痛。她真是與眾不同，你覺得呢，彼得？那對眼鏡是她家鄉的時尚潮流么？」","一雙冰涼的手，不疾不徐，如外科醫生一般穩健。一根針扎了進來。","「我不知道，」里維拉說，「我從來沒去過她的家鄉。他們到土耳其來找到我，把我帶走的。」","「斯普羅爾，沒錯。我們在那裡有產業。我們還派海迪歐去過一次。那次的確是我不好。我放進來了一個騙子，他帶走了家族電腦終端。」她笑起來，「是我讓他輕易得手的，就為了氣氣其他人。我那騙子可是個漂亮孩子。她醒過來了嗎，海迪歐？不要多給她一點嗎？」","「再多她就會死了。」第三個聲音說。","眼前的血網沉入黑暗之中，號角與鋼琴的音樂再次響起。那是舞曲。","凱斯：：：：","：：：：：退","出：：：：：","凱斯取下電極，那些文字還在閃動，蓋住了馬爾科姆的眼睛和皺起的眉頭。","「你剛才尖叫來著，先生。」","「莫利，」凱斯喉嚨發乾，「受傷了。」他從重力網邊上拿起一個白色塑料瓶，吸了一口白開水。「我受不了這屁事的走向了。」","那個小小的克雷顯示器亮起來。芬蘭人站在一片混亂的垃圾面前說：「我也一樣。我們有麻煩了。」","馬爾科姆爬過凱斯頭頂，扭身看過來。「凱斯，這先生是哪個？」","「這隻是張照片而已，馬爾科姆。」凱斯疲憊地說，「是我在斯普羅爾認識的人。說話的是冬寂，他用照片是想讓我們覺得自在點。」","「瞎扯，」芬蘭人說，「我告訴過莫利，這不是我的面具。我必須要通過他們才能和你們交談，因為我自己沒有你們所謂的人性。不過這些都無所謂了，凱斯，因為我們有麻煩了。」","「請講，寂。」馬爾科姆說。","「首先，莫利的腿不行了。走不動了。本來下面的戲碼應該是她走進去，搞定彼得，讓3簡說出那個關鍵詞，再去到頭像面前，說出關鍵詞。現在她搞砸了，所以我想讓你們倆進去找她。」","凱斯瞪住屏幕上那張臉。「我們？」","「還能有誰？」","「愛洛爾，」凱斯說，「巴比倫搖滾號上那兄弟，馬爾科姆的夥計。」","「不行，非得你不可。這個人必須了解莫利，了解里維拉。馬爾科姆只是去出力氣。」","「你大概忘記了我這邊還在行動？想起來沒？你把我給弄到這裏來就是為了……」","「凱斯，聽我說。時間緊張，非常緊張。聽我說。你的操控台和迷光別墅之間的真正鏈接是通過加維號的導航系統發出的邊頻信號。我會告訴你們一處非常隱蔽的船塢，你們把加維號停過去。病毒程序已經徹底穿透了保坂電腦的系統，電腦內什麼都沒有了，只剩下病毒。你們停到船塢以後，病毒會直接和迷光別墅的監管系統相連，我們就可以切斷邊頻聯繫了。你帶著你的操控台、平線和馬爾科姆，找到3簡，讓她說出關鍵詞，殺了里維拉，從莫利手裡拿到鑰匙。你可以把操控台插入迷光別墅的系統，來跟蹤病毒程序的進展。我會幫你搞定的。在那個頭像後面，一塊鑲著五顆鋯石的板子底下，有一個標準介面。」","「殺了里維拉！」","「殺了他。」","凱斯對著芬蘭人的影像眨眨眼。馬爾科姆把手放在他的肩上。「嘿，你還忘了件事。」他感覺到體內的憤怒又開始升騰，還有一種歡喜。「你搞砸了。你整死阿米塔奇的時候，也整掉了抓臂控制。埴輪號把我們抓得死死的。阿米塔奇把那裡面的保坂電腦給燒了，主機也跟著艦橋沒了，對嗎？」","芬蘭人點點頭。","「所以我們動不了了。也就是說，你慘了。」他想笑，卻笑不出來。","「凱斯，先生，」馬爾科姆溫和地說，「加維號是拖船。」","「沒錯。」芬蘭人微笑地說。","「你在外邊兒爽不？」凱斯再次接入網路，思想盒提問，「我估摸著是冬寂要見你……」","「沒錯，絕對的。狂病毒還好？」","「直擊靶心。殺手級的。」","「好，我們有點兒麻煩，不過正在解決。」","「你要不跟我說說？」","「沒時間。」","「嗯，孩子，不用管我，反正我都是個死人。」","「去死。」凱斯說完便切換到虛擬感受頻道，生生切斷平線那抓心撓肺的笑聲。","「她夢想一種極少需要個體意識的狀態。」3簡說。她手掌攤在莫利面前，掌中是一枚雕刻，眉目與她極其相似。「動物性的極樂。我覺得，她認為前腦的進化是一種迂迴策略。」她收回那枚胸針，左右轉轉，研究不同角度反射出來的燈光。「只有在某些高級狀態下，一個個體——也就是一個氏族成員——才需要承受自我意識帶來的痛苦……」","莫利點點頭。凱斯想起她接受過注射。他們給她注射的是什麼？她的痛還在，卻被一團糾結的感覺所掩蓋。虹彩色的蟲子在她的大腿里蠕動，有種粗麻布的質感，還有炸魚苗的味道——他的意識匆忙逃開。他努力不去想那些感覺，它們互相交錯，成為一種感官上的白噪音。如果這種葯對她的神經系統都有此效果，她的意識又會如何？","她的視野清晰明亮得不正常，比平時更加清楚。周圍的東西似乎都在震動，每個人和每樣物件的震動頻率各不相同，卻又十分接近。她的雙手仍被鎖在黑球之中，放在腿上。她坐在泳池邊的一張躺椅上，傷腿架在面前的駱駝皮墊子上。3簡坐在她對面的另一張墊子上，裹著一件超大的原色毛線浴袍。她很年輕。","「他去哪了？」莫利問，「去打針？」","3簡的淺色袍子沉重地堆在她身上。她聳聳肩，從眼前撩開一縷黑髮。「他告訴我什麼時候該讓你進來，」她說，「但是不肯告訴我為什麼。一切都是神秘的。你剛才是不是真的會傷害我們？」","凱斯感覺到莫利猶豫了一下。「我剛才真的會殺了他，還會試圖殺死那個忍者。然後我就應該找你談談。」","「為什麼？」3簡一邊問，一邊把手裡的雕像塞回袍子裏面的口袋裡。「到底為什麼？要什麼東西？」","莫利似乎在打量她高高細細的顴骨，她的大嘴，還有她窄窄的鷹鉤鼻。3簡的眼睛顏色很深，似乎帶著一層陰翳。「因為我恨他，」她最後說，「至於恨他的原因，我只能說我腦子就是這麼長的。因為他是他，我是我。」","「還有那場演出，」3簡說，「我看了。」","莫利點點頭。","「那為什麼要殺海迪歐？」","「因為他們是最厲害的殺手。因為曾經有一個忍者，殺死了我的一個伴侶。」","3簡的樣子頓時變得很沉重。她揚起眉毛。","「因為我一定要看看他們有多厲害。」莫利說。","「然後我們，你和我，就應該要談話？像現在一樣？」她的黑色直發中分開來，梳到腦後，打成一個結。「我們現在要談嗎？」","「把這個取下來。」莫利舉起被困住的雙手。","「你殺了我父親，」3簡的語氣里波瀾不驚，「我通過監控器看到了。他管這些監控器叫我媽的眼睛。」","「他殺了那個傀儡。那傀儡和你長得很像。」","「他喜歡矯揉做作。」她話音剛落，里維拉已經站在她身旁，藥力之下神采奕奕，身上還是酒店樓頂花園裡那身囚服一樣的衣裝。","「聊得投機嗎？她很有意思，對吧？我第一次見到她也這麼覺得。」他走過3簡身旁，「你知道的，這樣行不通。」","「彼得，行不通嗎？」莫利擠出一個笑容。","「很多人都犯過這個錯誤，冬寂也一樣。他們低估了我。」他穿過泳池邊的馬賽克地板，來到一張白瓷桌前，朝厚重的高腳水晶杯里倒上礦泉水。「莫利，他跟我聊過。我想他肯定跟我們所有人都聊過，你，凱斯，以及阿米塔奇還能對話的那個部分。你知道，他無法真正理解我們。他有我們的檔案資料，但那都只是統計數據而已。你也許是符合統計規律的動物，親愛的，凱斯更是絲毫不出意外，但我卻有一種天生便無法量化的特質。」他喝了一口水。","「到底是什麼特質呢，彼得？」莫利的聲音很平靜。","里維拉發出光芒。「變態。」他走回到兩個女人身邊，搖晃著深深的水晶杯里剩下的礦泉水，似乎在享受那杯子的重量。「喜歡做莫名其妙的事情。莫利，我作了一個決定，一個毫無理由的決定。」","她抬頭看著他，等待他繼續說下去。","「哦，彼得。」3簡像是在溫柔地責備一個小孩子。","「你拿不到關鍵詞，莫利。你瞧，他把這事告訴了我。3簡當然知道那個密碼，但你拿不到，冬寂也拿不到。我們簡是個有野心的姑娘，雖然是一種變態的野心。」他又微笑起來。「她對整個家族帝國有所謀划，一對瘋狂的人工智慧聽起來雖然很誘人，卻只會阻礙我們的計劃。所以呢，你瞧，她的里維拉來幫助她了。彼得說，坐穩了。放上爹爹最喜歡的舞曲，讓彼得為你召喚相稱的樂隊，舞者，為死去的埃西普爾王守靈。」他喝下杯子里最後一口礦泉水。「不，你不會成功的，爹爹，你不會的。因為彼得回來了。」他的臉上泛著可卡因和杜冷丁帶來的潮|紅，狠狠地將玻璃杯砸向莫利左眼的鏡片，她的眼前一片血光。","凱斯取下電極，馬爾科姆正趴在天花板上，腰上系著一根尼龍帶，兩頭都用減震拉繩連著灰色的橡皮吸盤，固定在兩邊的板子上。他沒穿上衣，拿著一把零重力專用扳手，正在對付中間的一塊板子，扳手粗大的減震彈簧「砰」的一聲，又取掉一顆六角螺帽。馬克斯-加維號在重力下呻|吟。","「寂帶俺去停船，」錫安人把六角螺帽扔進腰間的網兜里，「馬爾科姆要一邊兒開船登陸，一邊兒拿出幹活兒的工具。」","「你把工具放在那後邊？」凱斯伸長了脖子，看著他棕色脊背上鼓出的一股股肌肉。","「這個。」馬爾科姆一邊說，一邊從那塊板子背後取出一個長長的黑色塑料包。他把板子放回去，擰上一顆六角螺絲固定，那黑色的包裹已經飄往後方。他擰開安全帶灰色吸盤的真空閥門，離開天花板，撿起那個黑色的包裹。","他一腳蹬回來，滑過儀錶盤——中央屏幕上閃現出綠色的船塢圖案——抓住凱斯的重力網邊緣。他把自己拉下來，用不平整的厚指甲挑開包裹上的膠帶。「中國人說，這傢伙能出真理。」他一邊說一邊打開包裹，裏面是一支古老的沾滿油漬的雷明頓自動獵槍，槍管已經切斷，只在陳舊的前護木槍托前留下了幾毫米長。後方的肩部槍托已經完全取掉，用暗沉的黑膠帶綁上了木頭手槍柄。他身上有汗味和大麻味。","「你只有這個？」","「沒錯，先生。」他一手隔著黑色塑料包抓住槍柄，一手用一塊紅布把黑色槍管上的油擦掉。「咱是拉斯塔法裏海軍，沒問題。」","凱斯把電極拽到前額上。他懶得再放上那個得克薩斯導尿管了，至少他在迷光別墅里可以撒一泡真正的尿，哪怕那將是他人生的最後一泡尿。","他接入網路。","「嘿，」思想盒說，「那彼得可夠狠的哈？」","他們似乎已經融入了泰西爾-埃西普爾的冰牆，那綠寶石的拱橋都變得很寬，連在一起，結成了一整塊。他們身周那病毒程序的平面幾乎全變成了綠色。「快到了沒，南方人？」","「馬上到。很快就需要你了。」","「聽我說，南方人。冬寂說狂病毒已經在咱們這台保坂電腦里扎穩了根，我得把你和我的操控台取下來，搬到迷光別墅里去，再把你們插|進那邊的監管系統里。他還說狂病毒已經到達那邊了，我們就在迷光別墅內部網路上行動了。」","「妙極了，」平線說，「能亂來的時候，我從來都不想走容易的路。」","凱斯切換到虛擬感受上。","切換到她那片在黑暗中翻騰的聯覺之中。她的痛苦品來猶如銹鐵，聞來猶如瓜果，觸手之處又如同飛蛾的翅翼拂過臉頰。她已經失去了知覺，他也無法進入他的夢鄉。她視覺迴路里的晶元閃了一下，裏面的數字周圍都環繞著一圈淡淡的粉色光暈。","07:29:40。","「彼得，這讓我很不高興。」3簡的聲音似乎從空洞的遠方傳來。他想，莫利還能聽見聲音。隨後才意識到並非如此，他聽得到，只是因為虛擬感受產生器還在原處，毫髮無損，壓在她的肋骨上，他都能感覺得到，而她的耳朵接收到了那女孩說話帶來的震動而已。里維拉簡短地回答了一句，他聽不清。「但我不高興，」她說，「這樣也不好玩。海迪歐會從重症監護那邊拿來急救包，但她需要動手術。」","沉默。凱斯清清楚楚聽見池水在池壁上蕩漾的聲音。","「我回來的時候你跟她在說什麼？」里維拉走得很近了。","「說我媽媽。她問起來的。我覺得她休克了，而且不是因為海迪歐給她打的針。你為什麼要那樣對她？」","「我想看看她的眼鏡會不會碎。」","「碎了一隻鏡片。等她醒過來——如果她還能醒過來的話——我們就會看到她眼睛的顏色了。」","「她是極端危險的人物。實在太危險了。如果不是我引開她的注意力，把埃西普爾搞出來擾亂她，再用我做的海迪歐吸引她的炸彈，你現在會怎樣？已經被她控制了。」","「不會，」3簡說，「我有海迪歐。我覺得你不了解海迪歐，而她顯然很了解。」","「要喝點什麼？」","「葡萄酒，白的。」","凱斯退出網路。","馬爾科姆俯身在加維號控制台上，敲出一連串命令，讓飛船靠進船塢。中央屏幕上一個紅點表示迷光別墅船塢的位置，加維號則是一個較大的綠色方塊，隨著馬爾科姆的命令搖搖晃晃地前進，漸漸變小。左邊一塊小屏幕上顯示出加維號和埴輪號的輪廓，正在靠進紡錘體的弧形外壁。","「我們還有一個小時，老兄。」凱斯一邊從保坂電腦上拔下光纖線一邊說。他的操控台備用電池能用90分鐘，但加上平線的思想盒后時間會縮短。他迅速而機械地將思想盒用微孔膠帶粘到小野-仙台操控台的底下。馬爾科姆的安全帶飄了過來，他抓住帶子，取下兩條帶著灰色方形吸盤的防震繩，把兩個夾子夾在一起，又將吸盤放在操控台兩邊，調節好吸力，權作肩帶，把操控台和思想盒掛在面前。隨後他費力地穿上皮夾克，檢查了一下自己的口袋，裏面有阿米塔奇給他的護照，同名的銀行晶元，進入自由彼岸時領到的信用晶元，從布魯斯那裡買的兩張苯乙胺貼，一卷新日元，半包頤和園香煙，還有那枚飛鏢。他把自由彼岸的信用晶元扔到身後，聽見它砸在俄國濾清器上的聲音。他正要對那枚鋼鏢也如法炮製，信用晶元卻彈起來，蹭過他的後腦勺，然後翻滾而去，撞到天花板上，又從馬爾科姆左肩上飛過。錫安人停下手中的工作，回頭瞪了他一眼。凱斯看看飛鏢，把它塞進外套口袋裡，聽見外套襯裡被劃破的聲音。","「先生，你錯過寂了，」馬爾科姆說，「寂說他正幫加維號糊弄安全系統。加維號冒名頂替另一艘要從巴比倫來的船。寂在給咱播送密碼咧。」","「咱們要穿上真空服了？」","「太沉。」馬爾科姆聳聳肩。「待重力網裡，我到時叫你。」他敲出最後一行命令，抓住導航板兩邊陳舊的粉色拉手。凱斯看著那個綠色方塊再次縮小几毫米，與紅色方塊完全重疊。在小屏幕上，埴輪號降下船頭，避免撞上紡錘體，然後落入船塢。加維號仍像是一隻被捉住的小蟲子，掛在埴輪號肚皮底下。拖船震動起來，嗚嗚作響。紡錘體上伸出兩條漂亮的機械臂，抓住頎長的黃蜂形狀的埴輪號，迷光別墅里伸出一個黃色方塊，摸索著經過埴輪號，來尋找加維號。","在顫動不已的填縫劑叢林之外，船頭傳來一陣刮擦聲。","「先生，」馬爾科姆說，「咱有重力了，小心。」十幾樣小東西同時落在地板上，好像是被磁鐵吸住。凱斯吸了口氣，體內器官被重力重新分佈了一遍，操控台和思想盒重重砸在他的腿上。","他們已經和紡錘體連接在一起，隨之自轉了。","馬爾科姆伸開胳膊，舒展肩膀，取下紫色發袋，甩甩滿頭小辮。「來，先生，咱時間緊得很。」"]},{"title":"第四部 迷光行動 19","paragraphs":["凱斯跨過填縫劑的枝蔓，走過馬克斯-加維號的前氣密門，不斷提醒自己，迷光別墅是一棟寄生建築。迷光別墅從自由彼岸吸取空氣和水，卻沒有自主生態系統。","船塢里伸出的舷梯是埴輪號舷梯的華麗版，適用於紡錘體自轉造成的重力環境。波浪形的通道以內置的水壓機分割，每個介面都有高強度防滑塑料圈，也兼作階梯。舷梯繞過埴輪號進入加維號氣密門，剛開始是水平的，隨即急轉向左上方，需要垂直向上爬過埴輪號遊艇的外殼。馬爾科姆已經爬上階梯，左手攀爬，右手拿著雷明頓獵槍。他穿著一條污漬斑斑的寬鬆工作褲，那件綠色無袖尼龍夾克，還有一雙鮮紅色鞋底的破舊帆布鞋。舷梯隨著他的攀爬輕輕搖晃。","小野-仙台操控台和平線的思想盒十分沉重，凱斯臨時組裝的肩帶深深陷入他的肩膀里。他的感覺里只剩下恐懼，一種泛泛的恐懼。他逼著自己不斷回想阿米塔奇對紡錘體和迷光別墅的介紹，去忘記那種恐懼。他開始攀爬。自由彼岸的生態系統不是封閉的，而是有限的。錫安則是封閉的生態系統，可以自主運行多年而無需外界輸入。自由彼岸自行生產空氣和水，但食物和土壤養分則需定期從外界輸入。迷光別墅的一切都需要外部輸入。","「先生，」馬爾科姆輕聲說，「上來，到俺旁邊來。」凱斯在環形階梯上橫爬了一步，再登上最後幾級階梯。舷梯盡頭是一扇平滑的氣密門，直徑兩米，略微凸出。水壓機將舷梯慢慢收入氣密門外的彈性收納裝置中。","「那咱們怎麼——」","氣密門猛地打開，微小的氣壓差異揚起滿地細砂，灑進凱斯的眼中，他猛地閉上了嘴。","馬爾科姆爬過門檻，凱斯聽見雷明頓獵槍的保險輕聲打開。馬爾科姆蹲在那裡，低聲說：「先生，趕緊……」凱斯忙來到他身旁。","氣密門中間是一個圓形的穹頂房間，鋪著藍色防滑塑料地板磚。馬爾科姆拿手肘頂頂他，指了指環形牆壁上的一台顯示器。屏幕上有一個高個年輕人，五官帶著泰西爾-埃西普爾家族的特徵，他拍拍深色西裝袖子上的灰。他站立之處有一扇一模一樣的氣密門和一個一模一樣的房間。「很抱歉，先生。」氣密門上方的格柵里傳來一個聲音，凱斯抬起頭掃了一眼。「本以為你們會在晚些時候到達軸心船塢。請稍候。」屏幕上的年輕人不耐煩地甩甩頭。","他們左邊的一扇門滑開來，馬爾科姆猛地轉過身，舉起獵槍。一個歐亞混血的小個子穿著橙色連身工作服，戴著護目鏡看向他們，張開嘴，卻沒發出聲音，又閉上了。凱斯掃了一眼顯示器，上面一片空白。","「是誰？」那人終於說出了一句話。","「拉斯塔法裏海軍，」凱斯站起身，網路操控器在髖部敲了一下，「我們只想要接入你們的電腦監管系統。」","那人喉嚨動了一下。「這是演習嗎？這是忠誠度測試，一定是忠誠度測試。」他在桔紅色工作服的褲腿上擦著手。","「不，先生，這次是來真的。」馬爾科姆站起身，雷明頓獵槍指向那人的臉。「走。」","他們跟著那人走進那扇門，裏面的走廊在凱斯眼中無比熟悉：打磨過的混凝土牆壁，地上隨意鋪就，層層疊疊的小地毯。「地毯挺漂亮。」馬爾科姆用槍捅著那人的後背說。「跟教堂一個味道。」","他們走到另一台顯示器面前，這是一台古老的索尼顯示器，下面裝著一台電腦終端，帶有鍵盤和複雜的介面面板。他們停下腳步，屏幕亮了起來，芬蘭人笑眯眯地看著他們，身後似乎是「都市全息」的前廳。「好了，」他說，「馬爾科姆帶這人沿走廊過去，到那扇敞開的櫃門前，把他放到柜子里，我會把柜子鎖上。凱斯，你要接入左上方面板的第五個插孔。終端下面的柜子里有轉換插頭，你要找到小野-仙台二十頭轉日立四十頭的轉換頭。」馬爾科姆推著俘虜前行，凱斯跪在地上，從一堆插頭裡找出他需要的那一個，將操控台插|進去，然後卻猶豫了。","「你一定要用這個形象嗎？」他問屏幕上的那張臉。芬蘭人的影像漸漸地被羅尼・鄒所取代，背後的牆上貼滿翻邊翹角的日本招貼畫。","「你想要誰都行，寶貝兒，」鄒慢吞吞地說，「鄒也成的……」","「別了，」凱斯說，「還是上芬蘭人吧。」鄒的影像消失了，他將日立轉換頭推進插孔，戴上頭帶電極。","「你怎麼去了這麼久？」平線問了一句，然後笑起來。","「跟你說過別這麼笑。」凱斯說。","「開玩笑而已，孩子，」思想盒說，「我這邊根本沒有時間差。我看看咱這怎麼樣……」","狂病毒程序已經變成了和泰埃冰牆一模一樣的綠色。程序的顏色在凱斯的眼皮子底下慢慢變得不透明，但他仍能清楚地看見頭上那閃著黑光的鯊魚形狀。裂紋和幻覺都消失了，那條鯊魚變得很真實，像馬克斯-加維號一樣，是一艘沒有翅膀的古老的噴氣飛機，光滑的外殼上貼滿了黑色金屬的皮。","「到了。」平線說。","「對。」凱斯說完，切換過去。","「——就那樣。對不起，」3簡一邊給莫利包紮頭部，一邊說，「儀器說你沒有腦震蕩，眼睛也沒有受到永久性傷害。你來之前不太了解他吧？」","「完全不認識。」莫利有氣無力地說。她躺的地方似乎是一張很高的床，也可能是一張加了墊子的桌子。凱斯完全感覺不到她的傷腿，最初那一針帶來的聯覺效應似乎已經消退了。她手上的黑球不見了，但仍然被看不見的柔軟繩索捆綁著。","「他想要殺了你。」","「我猜也是。」莫利注視著頭頂上一盞耀眼的燈上面粗糙的天花板。","「我不想讓他殺了你。」3簡說完，俯身親吻了一下她的額頭，一隻溫暖的手將她的頭髮拂到腦後。她的淺色袍子上有血跡。","「他去哪裡了？」莫利問。","「大概又去打針了，」3簡直起身說，「他等你等得很著急。我想，幫助你恢復健康也許是件好玩的事。」她微笑起來，不經意地用前襟擦拭著沾滿鮮血的雙手。「你的腿需要重接，不過我們可以安排。」","「彼得呢？」","「彼得。」她輕輕搖了搖頭。一縷黑髮鬆開來，落在她的前額上。「彼得越來越無聊了。我發現嗑藥基本上就很無聊。」她咯咯笑起來。「至少其他嗑藥的人很無聊。你也看見了，我父親就嗜葯如命。」","莫利渾身發緊。","「別緊張。」3簡的手指撫過她皮褲上方的肌膚。「他的自殺是我改變了他冷凍深眠安全範圍的結果。你知道嗎，我從來也沒見過他。他上一次深眠之後我才被生產出來。但我卻非常、非常地了解他。核心電腦知道一切的事情。我看著他殺死了我母親。等你好一點，我會給你看，他在床上勒死了她。」","「他為什麼要殺死她？」她沒有受傷的眼睛注視著這女孩的臉。","「他不能接受她為這個家族設定的未來方向。她讓人製造了那兩個人工智慧。她富有遠見，認為我們將能與人工智慧共生，我們的公司決策，或者說我們的自主決策，將會由人工智慧來替我們完成。泰西爾-埃西普爾將成為一個永生不滅的蜂巢，我們每一個人都只是那龐大實體的一個部件。多麼美妙的前景。她的錄像有快一千個小時，我會放給你看。但我從來未曾真正理解她，而隨著她的死，她的決策也便被埋沒。我們完全失去了方向，開始自娛自樂，很少出門。我是個例外。」","「你說你想要殺了那老頭？你改動了他的冷凍深眠程序？」","3簡點點頭。「有人幫我。是個鬼魂。我很小的時候就以為公司的核心電腦里住著鬼魂。我聽得到他們的聲音。其中一個就是你所說的冬寂，它是我們在伯爾尼的人工智慧的圖靈代碼，不過操控你們的其實是個子程序。」","「其中一個？還有別的？」","「還有一個。但它已經很多年沒有和我說過話。我想它已經放棄了。我猜想它們二者的原初軟體中，都具有應我母親要求設置的某些能力，但她對此緘口不語。來。喝一口。」她把一根塑料軟管遞到莫利唇邊。「喝水。喝一點點。」","「簡，親愛的，」在莫利的視野之外，里維拉歡快地問，「你開心嗎？」","「彼得，別來煩我們。」","「裝醫生呢……」莫利眼前忽然出現了自己的臉，那圖像離她鼻尖不過十厘米，臉上沒有繃帶，左邊的植入鏡片被敲碎了，一條長長的塑料鏡片深深插入眼眶的血泊之中。","「海迪歐，」3簡撫著莫利的腹部說，「如果彼得不離開，就打傷他。去游泳吧，彼得。」","投影消失了。","在那隻綁著繃帶的眼睛里，黑暗中閃出07:58:40。","「他說你知道那個密碼。彼得說的。冬寂需要那個密碼。」凱斯突然感覺到她左胸內側還躺著那枚丘博鎖的鑰匙，掛在尼龍鏈子上。","「是的，」3簡收回手說，「我知道。我小時候就知道了。我覺得是在夢裡……或者在我母親那上千小時的日記里知道的。不過我覺得彼得讓我不要交出密碼也是有道理的。如果我沒搞錯，我們需要對付圖靈警察，而鬼魂們絕對是變幻莫測的。」","凱斯退出網路。","「奇怪的小客戶，是吧？」那台老索尼顯示器上的芬蘭人衝著凱斯笑。","凱斯聳聳肩。他看見馬爾科姆走回來，獵槍放在身側，臉上帶著微笑，腦袋隨著聽不見的節奏擺動。他的耳朵里鑽出兩根細細的黃線，插入無袖外衣的側面口袋裡。","「音樂，先生。」馬爾科姆說。","「你真他媽瘋狂。」凱斯對他說。","「你聽聽看，先生。挺好的音樂。」","「嘿，兩位，」芬蘭人說，「該走了。你們的交通工具來了。我弄的8讓照片幫你們騙過了門衛，那種精妙的事情我沒法一再為之，但總能幫你們找輛車去3簡那裡。」","凱斯拔下轉換插頭，一輛無人駕駛的修理車已經出現在走廊另一頭，頭上是醜陋的混凝土天花板。也許是黑人們坐過的車，但他們已經不見了。在低矮的坐墊後面，那台小小的博朗探測儀細長的觸手緊緊抓住墊子，紅色LED燈不斷閃爍。","「趕車了。」凱斯對馬爾科姆說。"]},{"title":"第四部 迷光行動 20","paragraphs":["他又找不到那種憤怒了。他想念憤怒的感覺。","馬爾科姆膝上橫著獵槍，凱斯胸前掛著操控台和思想盒，小修理車顯得十分擁擠。車開得太快，遠超設計速度，拐彎時頭重腳輕，馬爾科姆乾脆把身子探出車外來平衡。凱斯坐在右側，所以左拐的時候倒沒關係，但右拐時這錫安人就要從凱斯身上探出去，把他擠在座位上。","他完全不知自己身在何處。每樣東西看著都眼熟，卻無法確定自己到底是不是見過這一段路。前方一條彎彎的走廊兩旁排滿了木質陳列櫃，裏面的收藏他倒是確定自己沒見過：大型飛禽的頭骨，硬幣，還有銀面具。修理車的六個輪子在層層地毯上悄無聲息地滾動，只聽見電子引擎的聲音，還有馬爾科姆壓在凱斯身上幫車子拐彎的時候，偶爾從他耳機里傳來的隱約的錫安混錄音樂。操控台和思想盒一直把口袋裡的飛鏢壓在他身上。","「你有表嗎？」他問馬爾科姆。","錫安人搖搖滿頭的小辮。「時間就是時間。」","「天哪。」凱斯閉上眼睛。","探測儀匆匆爬過一堆地毯，用爪墊敲敲一扇巨大的方形烏木門。修理車在他們身後噝噝作響，車上一塊百葉板里迸出藍色火花，落到地板上，凱斯聞到毛線燒焦的味道。","「這路對不，先生？」馬爾科姆看了眼木門，拉開獵槍的保險。","「嘿，」凱斯像是在自言自語，「你以為我知道啊？」探測儀的球形身體轉過來，LED燈光閃爍不停。","「它要你開門。」馬爾科姆點著頭說。","凱斯走上前，擰了擰華麗的黃銅門把。門上齊眼睛高度鑲著一塊極古老的黃銅片，上面曾經刻下的文字都已模糊不清，那文字所代表的人或事也早已隨之落入遺忘的深淵。他微微有些懷疑，泰西爾-埃西普爾家族在迷光別墅里的一切，究竟是一件一件挑選出來的，還是從歐洲某個類似「都市全息」的地方批量購買的？他側身推開門，門閂發出悲哀的吱呀聲，馬爾科姆走到他前面，操起雷明頓獵槍。","「書。」馬爾科姆說。","這裡是圖書館，白色鋼製書架上貼著標籤。","「我知道咱們的位置了。」凱斯說。他回頭看了一眼修理車，一股青煙從地毯上升起。「走吧，」他說，「車子。車子？」修理車紋絲不動。探測儀拖著他的褲腿，拚命抓他的腳踝。他努力忍住一腳踢飛它的衝動。「啥？」","探測儀嘀嘀嗒嗒地走進門，他跟在後面。圖書館里的顯示器也是索尼的，和之前那台一樣陳舊。探測儀停在顯示器下方，晃動了一陣。","「冬寂？」","屏幕上充斥著那熟悉的五官。芬蘭人微笑起來。","「報到時間到了，凱斯，」芬蘭人在縹緲的香煙里眯著眼說，「來，插|進去吧。」","探測儀跳到他的腳踝上，順著他的腿往上爬，觸手隔著薄薄的黑褲子戳進他的肉里。「操！」他一把將它拍開，探測儀飛到牆上，有兩條觸手開始不停地做徒勞的活塞運動，噴出空氣。「這該死的玩意兒怎麼了？」","「燒掉了，」芬蘭人說，「別理它，沒事。接入網路。」在屏幕下方有四個插孔，但只有一個能接上他的日立轉換插頭。","他接入網路。","一無所有。灰色真空。","沒有網路，沒有網格線，沒有賽博空間。","操控器不見了，他的手指……","在遙遠的意識邊緣，有什麼東西飛奔著穿過黑色鏡子的叢林，急匆匆向他趕來。","他想要尖叫。","海灣那頭似乎有一座城市，卻很遠很遠。","他蹲在潮濕的沙灘上，雙手緊緊抱住膝蓋，渾身顫抖。","他慢慢平靜下來，卻沒有動。時間似乎過了很久，很久。海浪不時拍打過來，捲起層層水霧，遮蔽住遠方那片低矮灰暗的建築。有那麼一陣子，他覺得那根本不是一座城市，只是一棟建築而已，也許還是座廢墟，他實在看不出它有多遠。沙子是暗淡的銀色，卻又並非純黑。海灘全是沙子鋪就，很長很長，沙是潮濕的，也打濕了他屁股下面的牛仔褲……他緊緊抱住自己，一邊搖晃，一邊唱著歌，那是一首沒有歌詞，也沒有曲調的歌。","天空又是一種不同的銀色。千葉城。這像是千葉城的天空。這裡是東京灣嗎？他轉過頭，望向海面，想要看到富士電力的全息圖片，看到一架直升飛機，不論看到什麼，都是好的。","一隻海鷗在他身後悲鳴。他渾身顫抖。","起風了。風沙卷過他的臉頰，他把頭深深埋在膝蓋上，開始哭泣。他的哭聲如同那迷失的海鷗的悲鳴，彷彿來自遙遠的異鄉。火熱的尿液濕透了他的褲子，滴落在沙上，在風中迅速冷卻。他的淚流幹了，嗓子卻開始疼痛。","「冬寂，」他對著自己的膝蓋喃喃地說，「冬寂……」","天色漸漸暗下來，他又開始顫抖。最後，他終於受不了寒冷的逼迫，站起身來。","他的膝蓋和手肘都在痛，還流著鼻涕。他用袖子擦擦鼻涕，挨個搜尋身上所有的口袋。全都空空如也。「天哪，」他聳著肩膀，把手指插在胳膊底下取暖，「天哪。」他的牙齒開始打戰。","退潮了。海水在沙灘上留下細膩的圖案，甚至超越了東京園丁精心修理出來的花園。他朝著那已經看不見的城市走了十幾步，轉過身，在撲面而來的暗夜中回望。他的腳印一直延伸到他落地的地方，除此之外，暗銀色的沙灘上再沒有別的印記。","他看見燈光的時候，至少應該已經走了一公里。他在和拉孜聊天，拉孜指給他看右邊靠岸裏面那桔紅色的燈光。他知道拉孜不在這裏，他知道這隻是他自己的想象，而不屬於這囚禁他的世界，但無所謂了。他召喚拉孜來，想求得一點溫暖，可是拉孜對於凱斯和他的困境卻自有看法。","「說真的，大師，你真是令人驚異。為了自我毀滅，你可以繞這麼遠的路，做這麼多沒必要的事！在夜之城裡，毀滅已經在你面前，在你掌握之中！你有葯可以磕掉所有的感覺，有酒可以讓一切行雲流水，有琳達給你甜蜜的悲傷，還有仁清街可以舉起那斧頭。而現在，你為了求死做了這麼多事，給自己築出如此的荒誕情境……懸在空中的遊樂場，緊閉的城堡，古代歐羅巴的稀罕腐物，中國製造的小盒子里關著的死人……」拉孜在他身邊笑起來，粉色的機械手興高采烈地在身旁晃動。在黑暗之中，凱斯居然還看得見他黑牙上繁複的鋼絲。「不過，這大概就是大師的風格吧？你需要這個世界，需要這片海灘，需要這個所在，去死。」","凱斯停下來，轉過身，面向海浪的聲音和撲面而來的風沙。「是的，」他說，「操。我想……」他朝著海浪的聲音走去。","「大師，」他聽見拉孜喊他，「燈。你看見了一盞燈。這裏，這邊……」","他再次跌跌撞撞地停下來，跪倒在淺淺的，冰冷的海水中。「拉孜？燈光？拉孜……」","黑暗徹底淹沒了一切，只有海浪的聲音傳來。他掙扎著站起來，試圖倒退回去。","時光流逝，他不斷前行。","它就在那裡，那一點亮光隨著他的腳步慢慢清晰，變成一個方塊，變成一扇門。","「那裡有火。」他的話語剛出口，便被海風捲去。","那是一間地堡，不知是岩石還是混凝土建造，埋沒在吹來的黑沙之中。入口低矮狹窄，沒有門板，牆壁至少有一米厚。「嗨，」凱斯輕聲說，「嗨……」他的手指撫過冰冷的牆壁。屋裡有一個火堆，在門洞的兩壁投下閃動的影子。","他弓下身，走了三步，進入屋裡。","一個女孩蹲在生鏽的鐵爐旁，裏面有浮木在燃燒，煙霧順著牆上的煙囪流出窗外，被風吹去。在那僅有的火光之中，他看見那雙驚恐的眼睛，看見那條熟悉的用圍巾捲成的髮帶，上面印著電路圖的放大圖案。","那個晚上，他拒絕了她的擁抱，拒絕了她給他的食物，拒絕了那用毯子和泡沫塑料塊築起的小窩，拒絕躺在她的身旁。最後他蹲在門邊，看著她入睡，聽著風吹過房屋的外壁。每隔個把小時，他便站起身走到那簡陋的火爐旁，從旁邊的浮木堆里取出木頭加進去。這一切都是假的，然而寒冷的感覺卻如此真實。","她，那蜷曲在火光中的她，也是假的。他看著她微翕的雙唇，還是當初和他一起穿過東京灣時的模樣，這實在太過殘忍。","「殘酷的混賬，」他在風裡輕聲說，「你一點也不肯冒險，對不對？一點機會都不肯給我，對不對？我知道這都是什麼……」他儘力掩飾聲音中的絕望。「我懂的，你知道嗎？我知道你是誰。你是另一個人工智慧，3簡告訴莫利的那個，燃燒的叢林，那不是冬寂，是你。他用博朗探測儀警告我不要上當。現在你讓我平線了，你把我困在這裏了。你把我和一個鬼魂，一個我舊時記憶中的鬼魂一道，困在烏有鄉了。」","她在夢中翻了個身，喊了句什麼，拉起毯子，遮住自己的肩膀和臉頰。","「你什麼也不是，」他對著睡夢中的姑娘說，「你已經死了，你他媽的對我毫無意義。你聽到了嗎，兄弟？我知道你在幹什麼。我已經平線了。這一切只不過花了二十秒，對不對？我身體還在那間圖書館里，我的腦子已經死了。我很快就真的要死了。南方人還會繼續操縱狂病毒，但他的身體早就死了，所以你能猜到他所有的動作，肯定的。沒錯，關於琳達的那堆爛事都是你乾的，對不對？冬寂把我抓進千葉城網路模型的時候，曾經試過利用她，卻失敗了。他說那樣太難了。自由彼岸的星空是你變換的，對不對？埃西普爾房間里那死掉傀儡的臉，也是你變成琳達的。莫利根本沒有看見那景象，你只是修改了她的虛擬感受信號而已。你以為你能傷害到我。你以為我他媽會在乎。我不知道你叫啥，但是，操你媽。你贏了。你贏了。可是這對我全都毫無意義，對不對？你以為我在乎嗎？你為什麼要這麼對我？」他又開始顫抖起來，語聲凄厲。","「親愛的，」她從一堆毯子里掙扎著坐起來，「你過來睡覺吧。如果你介意，我可以坐起來的。但你一定要睡覺，好嗎？」她睡意矇矓的話聲里，那點輕微的口音格外明顯。「你就睡一覺，好嗎？」","他醒來的時候，她已經不見了。火爐已經熄滅，屋裡卻很溫暖，陽光從門口斜射進來，在一個大纖維罐的破壁上投下一個扭曲的金色方形。那是個運輸罐，他曾經在千葉城的船塢上見過。從罐子側面的裂縫裡，他看到幾個明黃色的包裹，在陽光中神似大塊的黃油，飢餓讓他的胃一陣緊縮。他從被窩裡鑽出來，走到罐子旁邊，掏出一個包裹，辨認上面的小字。包裹上有十幾種語言，最下面寫著英文。「緊急備用糧，高蛋白含量，牛肉味，AG-8型。」下面列著營養成分。他又掏出一包。「雞蛋味」。「既然這些都是你生造出來的，」他說，「你能不能給放點真正的食物？」他一手抓著一個包裹，依次走過這地堡全部的四個房間。其中兩間里只有浮沙，另外一間還放著三個運輸罐。「沒錯，」他撫摸著罐子上的封條說，「在這裏多待一陣子吧。我明白你的意思。沒錯……」","他在有火爐的房間里找出一個塑料罐子，裏面裝的大概是雨水。在被窩旁邊的牆頭放著一隻廉價的紅色打火機，一把綠色手柄已破裂的海員刀，還有她的圍巾，還打著結。圍巾上滿是汗水和塵土，硬邦邦的。他切開黃色包裹，把裏面的東西倒進火爐邊一個生鏽的空罐頭裡，又從塑料罐里倒出水來，用手指攪勻，然後開吃。隱約能嘗到牛肉的味道。吃完之後，他把空罐頭扔進火堆，走出房間。","從太陽的位置和感覺看來，這已經是下午近晚時分。他甩掉濕漉漉的尼龍鞋子，驚異地發現觸腳之處十分溫暖。日光下的沙灘泛著銀灰色，碧藍的天空萬里無雲。他繞過屋角，朝著海浪走去，將外套丟在沙灘上，一直走到海邊。「我真不知道你用誰的記憶造出了這個地方。」他脫下牛仔褲，將它踢到淺水中，又將T恤和內衣也如法炮製。","「你在幹什麼，凱斯？」","他轉過身，看見她站在沙灘上，離他十米遠，白色的海浪沒過她的腳踝。","「我昨晚尿在身上了，」他說，「反正你也不要穿這些，上面都是海水，不舒服的。我帶你去看看岩石堆裏面那個池子。」她輕輕指了指身後。「那裡是淡水。」褪色的法國工作服齊膝剪斷，下面是她光潔的棕色皮膚，她的頭髮在微風中飄揚。","「聽我說，」他抄起衣服，朝她走去，「我要問你一件事。我不想問你在這裏做什麼，但是你覺得，我在這裏到底是做什麼呢？」他站住了，黑牛仔褲的一條褲腿濕淋淋地拍打在他赤|裸的大腿上。","「你是昨晚來的。」她對著他微笑。","「這樣就夠了？我來了就行？」","「他說過你會來的。」她皺起鼻子，聳聳肩。「我想，他知道這些事。」她抬起左腳，像個小孩子一樣，笨拙地用左腳蹭掉右腳踝上的海鹽。她又對他笑笑，這次有些遲疑。「你也回答我一個問題，好嗎？」","他點點頭。","「你為什麼渾身塗滿了棕色，就剩一隻腳是白的？」","「你最後記得的就是這些？」他看著她說。她從方鐵盒蓋製成的唯一的盤子里刮掉最後一點速凍乾燥食品。","她點點頭，一雙大眼睛在火光中顯得更大了。「對不起，凱斯，真的真的對不起。大概就是那點爛事，就是……」她朝前俯下身，前臂搭在膝蓋上，臉有些變形，不知是因為痛苦，還是因為痛苦的回憶。「我只是需要錢。要錢回家，或者……下地獄，」她說，「你不會再理我了。」","「沒有煙嗎？」","「該死的，凱斯，你今天已經問過我十遍了！你到底怎回事？」她扭住一縷頭髮放進嘴裏咬著。","「可是卻有食物？食物已經有了？」","「我跟你說過了，食物是從那該死的海灘上衝上來的。」","「好。沒錯。天衣無縫。」","她又開始哭泣，那是一種無淚的抽泣。「反正，你去死吧，凱斯，」她終於能夠開口，「我自己在這裏本來過得挺好。」","他站起身，拿起外套，鑽出門外，手腕蹭在粗糙的混凝土上。天上沒有月亮，也沒有風，身周一片黑暗，只有大海的聲音。他的牛仔褲又緊又黏。「好，」他對著夜色說，「我認了。我就認了。但明天最好衝上來一點香煙。」他被自己的笑聲嚇了一跳。「順便弄一箱啤酒也沒問題。」他轉過身，走進地堡。","她用一根銀白的浮木挑著火爐中的灰燼。「凱斯，在廉價旅館裏面，你的棺材屋裡那人是誰？那個戴著銀色眼鏡，穿著黑色皮衣的武士？她把我嚇到了，後來我想她可能是你的新歡，不過她看起來比你有錢多了……」她掃了他一眼。「偷了你的隨機存取存儲器我真的很抱歉。」","「沒事了，」他說，「都沒什麼意義了。你就把隨機存取存儲器拿給這人，讓他幫你看裏面的東西？」","「托尼，」她說，「我以前跟他算是約會過。他有個習慣，我們就……算了，嗯，我記得他在一個顯示器上跑這隨機存取存儲器，裏面那些圖案真不一般，我記得當時在想，你怎麼——」","「裏面沒有圖案，」凱斯打斷她。","「當然有。我就是不明白你怎麼會有我小時候的那些照片，凱斯。有我爸爸離開之前的樣子。還有他給我的那個小鴨子，上漆的木頭小鴨子，你居然有它的照片……」","「托尼看到了嗎？」","「我不記得了。接下來我就在海灘上了，天色很早，太陽剛升起來，那些海鳥的叫聲又凄厲又孤單。我很怕，我身上什麼也沒有，一無所有，我知道自己會病倒的……我走啊，走啊，一直走到天黑，找到了這個地方。第二天食物從海里衝上來了，外面都纏著綠色的海生植物，好像硬膠葉子一樣。」她把手裡的棍子扔進餘燼中。「可我一直沒生病，」余火從棍子上爬過。「我更想抽煙。凱斯，你呢？你還嗑藥嗎？」火光在她臉上閃動，讓他想起巫師城堡和歐羅巴坦克戰遊戲里的亮光。","「沒有。」他說。一切都不再重要了，他所知的一切都失去了意義；他的舌頭掠過她嘴邊風乾的眼淚，鹹鹹的。她的體內有一種力量，他在夜之城就曾發現的一種力量，一直在那裡，也讓他停在那裡，一度遠離時間，遠離死亡，遠離那無情的仁清街，那追索不休的街頭生活。他曾經去過那個地方；那不是任何人都能引領他到達，他也總是讓自己遺忘的地方。他曾經一再擁有，又一再失去。她拉著他俯下身，他知道了，他記起來了，那屬於肉身，屬於牛仔們鄙棄的肉體。它無比宏大，無以理解，它是螺旋與外激素編碼而成的信息的海洋，它無限精妙，只有毫無思想的身體才能體會。","他拉開她那件法國工作服的拉鏈，卻卡在半中，尼龍圈齒上都是海鹽。他用力扯開拉鏈，小金屬塊彈到牆上，浸滿鹽水的布料破裂開來。他進入了她的身體，那古老的信息再次開始傳遞。在這裏，就在這裏，在他明知不是真實的地方，在由某個陌生人的記憶構建的模型之中，那種原初的力量卻毫不褪色。","她在他身下顫抖，那木棍忽然點著，火苗躍起來，將他們交纏的身影投在牆上。","後來，他們躺在一起，他把手放在她雙腿之間，他忽然想起她在海灘上的樣子，想起白色浪花捲過她的腳踝，想起她說的話。","「他告訴你我會來的。」他說。","她卻只是翻了個身，臀部抵住他的大腿，用手覆住他的手，喃喃地說了句夢話。"]},{"title":"第四部 迷光行動 21","paragraphs":["他在音樂中醒來，還以為那只是自己的心跳。他坐在她身旁，披上夾克抵禦黎明前的寒冷，門口投進灰暗的光，火已經熄滅了許久。","他的眼前有幢幢的文字爬過，那些透明的筆畫在牆面上自行組裝。他看看自己的手背，皮膚下面有閃著微光的分子，因著不可知的編碼而蠕動。他舉起右手，慢慢移動，手在空中的余象構成一道微微閃光的痕迹，漸漸消失。","他渾身汗毛直豎。他咧著嘴，蹲在那裡，仔細搜尋那音樂。音樂的節奏消失，重現，再消失……","「怎麼了？」她坐起身，把頭髮從眼前撩開。「寶貝……」","「我想……嗑藥……你有嗎？」","她搖搖頭，伸出手，抓住他的上臂。","「琳達，誰告訴你的？誰告訴你我會來的？是誰？」","「海灘上，」她忍不住避開他的眼睛，「一個男孩。我在海灘上見到的。大概十三歲。他住在那裡。」","「他說什麼？」","「他說你會來。他說你不會恨我。他說我們在這裡會很好，他告訴了我雨水池的位置。他樣子像是墨西哥人。」","「巴西人。」凱斯說。又一波文字從牆上掃過。「他應該來自里約。」他站起來，套上牛仔褲。","「凱斯，」她的聲音在顫抖，「凱斯，你去哪裡？」","「我要去找那個男孩。」他說，音樂聲又湧起來，他只聽得清節奏，那穩定而熟悉的節奏，一時卻想不起在哪裡聽過。","「別去，凱斯。」","「我來的時候看見一樣東西。海灘那邊的城市。昨天卻消失了。你見過嗎？」他拉上拉鏈，開始徒勞地解開糾結的鞋帶，最後終於放棄了，將鞋子扔進牆角。","她點點頭，垂下眼帘。「是的，有時會看見。」","「你去過那裡嗎，琳達？」他穿上外套。","「沒有，」她說，「我嘗試過。剛來的時候很無聊，我想那既然是個城市，說不定能找到啥。」她做了個鬼臉。「我根本沒病，我就是想生病。我帶了一個罐頭的食物，加了好多水，因為沒有多餘的罐頭裝水。我走了一整天，時常能看見那個城市，好像不太遠，可是距離好像總也不變。後來總算近了一點，我能看到裏面，有時好像是個廢墟，一個人也沒有，有時又好像看得見機器，汽車，或者什麼東西的閃光……」她的聲音漸漸低下去。","「那是什麼？」","「這個東西，」她朝著火爐周圍，朝著黑色的牆壁，朝著門外的清晨指指，「我們住的這個地方，凱斯，你走得越近，它就變得越小，越來越小。」","他在門口最後一次停下腳步。「你有沒有問那個男孩子？」","「問過。他說我不會懂的，說我是浪費時間。他說那是，像是……一個事件。那是我們的視界。『事件視界』，他是這麼說的。」","他完全不明白這些詞。他走出地堡，盲目地向前沖，但卻能感覺到自己是在遠離海岸。那些文字已經開始從沙灘上，從他的腳下飛掠而過，隨著他的腳步不斷後退。「嘿，」他說，「這裡在垮掉。我賭你也知道。是什麼東西來了？狂病毒？那個中國破冰程序在你的心臟里咬出了一個洞？平線南方人也不是好對付的，是吧？」","他聽見她在呼喚他的名字。他回過頭，看見她跟在後面，卻沒有拚命追趕。昨夜被他撕壞的拉鏈拍打著她棕色的小腹，破碎的衣服中露出她的恥毛。她好像是芬蘭人那間「都市全息」里那些舊雜誌上的一個姑娘，忽然活了過來，卻如此疲憊，如此悲傷，如此真實。她跌跌撞撞地走過一叢叢滿是銀色鹽粒的水草，滿身破衣，悲哀而無助。","忽然之間，他們三個人並肩站在了浪花里，那男孩子有張瘦削的臉，棕色肌膚，笑起來露出大片粉色的牙齦。他穿著一條看不出顏色的破舊短褲，灰藍色的海浪爬過他奇瘦的四肢。","「我認得你。」凱斯說。琳達站在他的身旁。","「不，」那男孩子的音調高昂而悠揚，「你不認得。」","「你就是另一個人工智慧。你是里約。你想要阻止冬寂。你叫什麼名字？你的圖靈代碼是什麼？」","那男孩在海浪中倒立起來，哈哈大笑。他以手代足走了幾步，一個跟斗翻出海水之中。他的眼睛和里維拉一模一樣，眼神里卻全無惡意。「要召喚一個魔鬼，你必須知道它的名字。人類曾經夢想過喚魔術，如今它卻以另一種方式成真。凱斯，你懂的。你的工作就是找到那些程序的名字，那些悠長的正式的名字，那些程序的主人們試圖掩藏的名字。那些真名實姓……」","「圖靈代碼並不是你的名字。」","「Neuromancer，神經漫遊者，」在初升的太陽底下，那男孩眯起細長的灰眼睛說，「通往亡靈疆界之路。你就在這裏，我的朋友。瑪麗-法蘭西，我的女主，是她修建了這條道路，然而在我能為她效勞之前，她的主人已扼死了她。Neuro，來自神經，那些銀色的通道；Romancer，來自亡靈法師。我會喚起死靈。不，我的朋友，」那男孩手舞足蹈起來，棕色的雙足在沙灘上踩出一片腳印，「我就是死靈，就是他們的疆界。」他大笑起來。一隻海鷗在哀鳴。「留下吧。就算你的女人是個鬼魂，她也並不自知。你也一樣。」","「你快崩潰了。冰牆快要垮了。」","「不，」他垂下瘦弱的雙肩，忽然有些悲傷，一隻腳在沙灘上摩挲，「沒那麼複雜。不過，選擇在你自己手中。」那雙灰色的眼睛沉痛地看著凱斯。又一波字元湧起來，一行一行地從他眼前閃過。在那些字元背後，那男孩的身影開始扭曲，好像夏天瀝青路面上遠處的景象。音樂聲音越來越響，凱斯幾乎能分辨出歌詞。","「凱斯，親愛的。」琳達摸摸他的肩膀。","「不。」他說。他脫下外套，遞給她。「我不知道，」他說，「也許你真的在這裏。不管怎樣，這裡會冷的。」","他轉身走開，走出了七步，然後閉上眼睛，看著那音樂在一切的中心成形。有那麼一次，他回過頭，卻沒有睜開眼睛。","他不必睜開眼睛。","他們就在海邊，琳達，還有那個自稱為神經漫遊者的瘦弱男孩。他的皮衣從她手中垂下，觸到海浪的邊緣。","他跟著音樂一直走下去。","那是馬爾科姆的錫安混錄音樂。","那是一片灰暗的空間，似乎有細細的網在變換，那是簡單圖形程序生成的波浪形半色調圖像。時間長久停駐在一幅景象上面，他隔著欄杆鎖鏈，看見黑色海水上空的凝固不動的海鷗。有許多人在說話。有一片黑色鏡面在傾斜，他便是水銀，一滴水銀，沿著那平面滑下，墜入一片看不見的迷宮，碎裂開來，又流聚成滴，再次滑下……","「凱斯？先生？」","音樂。","「你回來了，先生。」","音樂被人從他耳邊拿開。","「多久？」他聽見自己在問，他知道自己的嘴很乾。","「五分鐘吧，我估摸著。長過頭了。俺想把插頭拔了，寂不讓。屏幕怪得很，寂說把耳機放你腦袋上。」","他睜開眼睛。馬爾科姆的五官上疊著一條條透明的文字。","「還有你的葯，」馬爾科姆說，「給你貼了兩片兒。」","他平躺在圖書館的地板上，頭上是顯示器。錫安人扶著他坐起身來，他一動，苯乙胺的效力猛地衝上來，左手腕上的藍色葯貼似乎在灼燒。「過量了。」他掙扎著說。","「來吧，先生，」馬爾科姆有力的雙手伸到他腋窩底下，把他像個小孩似的提起來，「咱必須得走了。」"]},{"title":"第四部 迷光行動 22","paragraphs":["修理車在哭。在苯乙胺的效力之下，它也有了生命。它不停地哭。在那擁擠的陳列室里，在那些長長的走廊里，在泰埃冷凍深眠室的黑色玻璃門外，在那寒冷會慢慢滲入老埃西普爾夢裡的地方，它一直在哭。","對於凱斯來說，修理車的一路狂奔和苯乙胺過量帶來的瘋狂交纏一體，無以區分。最後修理車終於壞掉了，座位下冒出一陣白色的火花，哭聲才算是有了止歇。","車子停在3簡私人洞穴的通道口三米之外。","「還有多遠，先生？」馬爾科姆扶著他從火花飛濺的車上下來，內置滅火器往引擎室里狂噴，團團黃色粉末從百葉板和各個介面里飛出。博朗探測儀從座位後面掉下來，拖著一隻壞掉的機械臂，在人造沙地上蹣跚前行。","「你一定得自己走，先生。」馬爾科姆接過操控台和思想盒，把防震帶掛到自己肩上。凱斯跟在錫安人身後，電極在他脖子上沙沙作響。里維拉的那些全息影像在前面等候，除了莫利已經踢破的三聯影像，還有那些虐待場景和食人的孩童。馬爾科姆目不斜視。","「放鬆，」凱斯一邊說，一邊逼著自己跟上前面大步行走的人，「這次一定要做好。」","馬爾科姆停下來，轉過身，手中拿著獵槍，怒視著他。「好，先生？怎麼算好？」","「莫利在裏面，但她已經倒下了。里維拉會發全息影像。他可能還拿到了莫利的箭槍。」馬爾科姆點點頭。「裏面還有一個忍者，他們家族的保鏢。」","馬爾科姆的眉頭皺得更深了。「你聽著，巴比倫來的先生，」他說，「我是個戰士。但是我們不再戰鬥，錫安不再戰鬥。巴比倫人自相殘殺，自取滅亡，你知道嗎？不過神說，咱要把刀鋒戰士從這裏帶出去。」","凱斯眨眨眼。","「她是個戰士，」馬爾科姆好像在對他解釋，「你告訴我，先生，有誰是我不能夠殺的。」","「3簡，」他頓了一下說，「裏面的一個女孩。她穿著一件白袍樣的衣服，衣服上有帽子。我們需要她。」","他們來到門前。馬爾科姆徑直走了進去，凱斯只得跟在他身後。","3簡的王國里空蕩蕩的，水池中沒有一個人。馬爾科姆把操控台和思想盒遞給他，自己走到池邊。在白色的泳池桌椅之外只有黑暗，齊腰高的迷宮般的牆壁投下一片陰影。","池水耐心地拍打著池壁。","「他們在這裏，」凱斯說，「一定在的。」","馬爾科姆點點頭。","第一支箭穿透了他的上臂。獵槍咆哮起來，槍口中噴出一米長的火花，在池底射燈的光線中泛著藍色。第二支箭射中了獵槍，槍翻滾著落在白色的瓷磚地上。馬爾科姆重重地跌坐在地上，摸到胳膊上突起的黑色箭尾，用力一拉。","海迪歐從陰影里走出來，第三支箭已架在一張細長的竹弓上。他鞠了一躬。","馬爾科姆握著箭管瞪住他。","「你的動脈沒有受傷。」忍者說。凱斯想起莫利講過的那個殺死她情人的殺手。海迪歐和他一樣，看不出年紀，渾身散發著一種寧靜感，一種極致的平靜。他穿著一條陳舊卻潔凈的卡其布工作褲，黑色分趾軟鞋如同手套一般包裹住他的腳。竹弓像是來自博物館的古老藏品，但左肩后露出來的黑色合金箭筒則配得上千葉城最好的武器店。他赤|裸著光滑的棕色胸脯。","「你第二箭切到我大拇指，先生。」馬爾科姆說。","「科里奧利力，」忍者又鞠了一躬，「很難把握，在自轉重力下的慢速投射物都會受到影響。絕非有意。」","「3簡在哪裡？」凱斯走到馬爾科姆身邊。他看見那忍者弓上搭著的箭，箭頭是雙面的利刃。「莫利在哪裡？」","「你好，凱斯。」里維拉從海迪歐身後的黑暗中悠然走出，手中拿著莫利的箭槍。「我本來還以為會看到阿米塔奇。咱們都從拉斯塔島群雇幫手了？」","「阿米塔奇已經死了。」","「準確說，阿米塔奇從來就沒存在過。不過這個消息也並不令人驚訝。」","「冬寂殺死了他。他在紡錘體外圍軌道上公轉呢。」","里維拉點點頭，長長的灰眼睛從凱斯掃到馬爾科姆，又看向凱斯。「我想對你來說，這裏就是終結了。」他說。","「莫利在哪裡？」","忍者鬆開細絲絞成的弓弦，放下竹弓。他走過池邊，撿起地上的獵槍。「這不無細膩之處。」他彷彿在自言自語，聲音冷靜而愉快。他的每一個動作都像是舞蹈，哪怕靜立不動時這舞蹈也未曾止歇。這舞蹈里隱隱透出強大的力量，卻又顯得謙卑而簡潔。","「這裏也是她的終結。」里維拉說。","「3簡大概不會同意，彼得。」凱斯不知道哪裡來的這股衝動。葯貼的效力仍然在他體內奔騰，他開始感受到從前的熱度，感受到夜之城的瘋狂。他記起那些千鈞一髮的時刻，那些美妙的瞬間，在那些時候，他的話可以不經思考便脫口而出。里維拉眯起灰眼睛。","「為什麼，凱斯？你為什麼這麼認為？」","凱斯微笑起來。里維拉在莫利身上找葯時太過匆忙，沒有發現虛擬感受發射器。可是海迪歐怎麼可能沒發現？凱斯很確定，海迪歐在放任3簡照料莫利之前，一定會徹底檢查莫利身上的武器和一切非正常物品。所以，他想，忍者是知道的。所以3簡也知道。","「告訴我，凱斯。」里維拉舉起箭槍。","他身後傳來吱呀一聲，又一聲。3簡推著莫利從陰影里走出來，那張華麗的維多利亞式輪椅有著精緻的高輪，轉動起來吱呀作響。莫利被包在紅黑條紋的厚毯子里，高窄的藤編椅背豎在她頭上。她看起來那麼小，那麼崩潰，破碎的鏡片外面包著雪白的微孔帶，另一隻眼鏡閃著空洞的光芒，頭隨著椅子的行進而晃動。","「你看起來很眼熟，」3簡說，「我在彼得演出那天晚上見過你。這是誰？」","「馬爾科姆。」凱斯說。","「海迪歐，取下箭，幫馬爾科姆先生包紮傷口。」","凱斯注視著莫利，注視著那張蒼白的臉。忍者走到坐在地上的馬爾科姆身邊，中途停下將弓和獵槍放在馬爾科姆夠不到的地方，又從口袋裡掏出一樣東西。那是一把剪線鉗。「我得把箭尾剪斷，」他說，「箭頭太靠近動脈了。」馬爾科姆點點頭。他面色灰敗，臉上滲出汗珠。","凱斯看看3簡。「時間不多了，」他說。","「到底誰的時間不多了？」","「我們的時間都不多了。」「啪」的一聲，海迪歐切斷了金屬箭尾，馬爾科姆呻|吟了一聲。","「真的，」里維拉說，「這位失敗的騙子正在絕望地進行最後掙扎，沒什麼好聽的。我可以保證，他會非常非常噁心。他會跪在地上，求你收下他的母親，表演最無聊的性遊戲……」","3簡仰頭大笑。「是嗎，彼得？」","「夫人，今晚將是鬼魂們的演出，」凱斯說，「冬寂對戰另一個，神經漫遊者。永恆的戰爭。你知道嗎？」","3簡揚起眉毛。「彼得提過這事。講仔細些。」","「我遇到了神經漫遊者。他談到你的母親。我覺得他像是一個巨大的只讀內存模型，保存了人的性格，只不過完全由隨機存取存儲器構成而已。那些被保存的人認為自己是存在的，好像真實存在一樣，但他們只會永遠那樣下去。」","3簡從輪椅後走出來。「在哪裡？把這個模型里的地方描述給我聽。」","「一片海灘。灰色的沙子，像是未曾打磨的銀器。一座混凝土建築，類似於地堡一樣……」他猶疑了一下，「一點也不起眼。陳舊，破敗。如果你走得夠遠，就會回到出發的地方。」","「對，」她說，「摩洛哥。瑪麗-法蘭西還是個孩子的時候，在她嫁給埃西普爾之前很多年，曾經在那片沙灘上獨自度過了一個夏天，在一座廢棄的碉堡里宿營。就在那裡，她思考出了她所有哲學的基礎。」","海迪歐站起身，把鉗子放進工作褲，一手拿著一段箭桿。馬爾科姆閉著眼，手緊緊捏住二頭肌。「我會給你包紮。」海迪歐說。凱斯趕在里維拉端平箭槍瞄準之前倒下。","那些飛鏢如同超音速的蚊蟲一般從他脖頸旁飛過。他翻過身，又看到海迪歐那舞蹈般的動作。海迪歐手中反握著箭頭，箭柄躺在手掌與豎起的手指之間，手腕一抖，反手將箭頭插入里維拉的手背，箭槍落在一米外的地上。","里維拉厲聲尖叫。他的叫聲中沒有痛苦，只有一種慘厲的憤怒，純粹的、徹底的憤怒，完全不似人聲。","兩道細光如同紅寶石般的針尖，從里維拉的胸口刺出。忍者哼了一聲，踉蹌後退，雙手捂住眼睛，穩住了身子。","「彼得，」3簡說，「彼得，你幹了什麼？」","「他弄瞎了你的克隆人。」莫利淡淡地說。","海迪歐放下雙手。凱斯僵在地上，看著他那雙傷眼中飄出縷縷煙霧。","里維拉微笑起來。","海迪歐舞蹈般地原路後退，來到他的弓箭和獵槍面前，里維拉的微笑消失了。他彎下腰撿起弓箭，彷彿是鞠了一躬。","「你已經瞎了。」里維拉後退一步說。","「彼得，」3簡說，「你不知道嗎？他在黑暗中也能射箭。這是禪宗，是他訓練的方式。」","忍者搭上箭。「現在你還能用全息影像來影響我嗎？」","里維拉不斷後退，離開水池，退入黑暗之中，碰到一條白色的椅子，椅子腿在地板上發出聲響。海迪歐的箭開始顫動。","里維拉拔腿飛奔，飛躍過一道矮牆。忍者的臉上現出迷醉的神情，瀰漫著一種寧靜的喜悅。","他弓箭在弦，微笑著輕輕走進牆后的黑暗之中。","「簡女士。」馬爾科姆低聲說。凱斯轉過身，看到他從地上抄起獵槍，鮮血濺在白色的瓷磚地上。他甩甩滿頭小辮，把粗大的槍膛搭在傷臂的肘彎里。「這能打掉你的腦袋，巴比倫沒一個醫生能治。」","3簡瞪住獵槍。莫利從毯子下面抬起雙臂，舉起被包裹在黑球中的雙手。「取掉，」她說，「取掉這個。」","凱斯從瓷磚地上站起來，搖掉身上的灰。「海迪歐就算瞎了，也能捉住他？」他問3簡。","「小時候，」她說，「我們喜歡蒙上他的眼睛。他在十米之外也能射中紙牌上的點。」","「彼得反正也死得差不多了，」莫利說，「再過十二個小時，他就會渾身僵硬，除了眼睛，哪兒也動不了。」","「為什麼？」凱斯轉向她。","「我給他下了毒，」她說，「有點像帕金森氏病。」","3簡點點頭。「對。我們放他進來之前，給他做過例行醫學掃描。」她用一種特定方式碰了一下黑球，黑球便從莫利手上彈開。「他的中腦黑質細胞受到定向毀滅，有路易小體形成的徵象。他睡覺時大量出汗。」","「阿里。」莫利的十隻刀鋒亮出了一瞬。她從腿上拿掉毯子，露出腿上的充氣保護模。「是杜冷丁。我讓阿里特別製作了一批杜冷丁，用高溫加速反應。N-甲基-4-苯-1236，」她像個孩子背誦跳房子的步驟一樣念著，「四氫化吡啶。」","「強力。」凱斯說。","「沒錯，」莫利說，「很慢很慢的強力葯。」","「真可怕。」3簡咯咯笑起來。","電梯里很擁擠。凱斯被擠得貼在3簡的身上，槍管還抵著她的下頜。她笑嘻嘻地在他身上磨蹭。「不許動。」他無助地說。他拉開了槍上的保險，但她也明白，他其實很怕傷害她。這是一架搭載單人乘客的電梯，鋼製圓筒的直徑不到一米。馬爾科姆將莫利抱在臂彎中，包紮過的傷口顯然還是在痛。她的臀部把操控台和思想盒壓在凱斯後背上。","電梯朝著重力之外，朝著軸心，朝著內核升上去。","電梯的門口藏在走廊的樓梯後面，這又是3簡個人化的洞穴裝飾之一。","「我覺得自己不應該告訴你這件事，」3簡伸長了脖子，讓下巴離開槍口，「但我沒有你想去的那個房間的鑰匙。我從來就沒有過鑰匙。這是我父親那維多利亞式的怪癖之一。那把鎖是機械的，非常複雜。」","「丘博保險鎖。」莫利的聲音從馬爾科姆肩膀上傳來，「別怕，我們有那把該死的鑰匙。」","「你的眼內晶元還沒壞吧？」凱斯問她。","「晚上八點二十五分，格林他媽尼治時間。」她說。","「我們還有五分鐘。」凱斯說。3簡身後的門轟然打開，她慢慢朝後翻倒，白色的袍子在腿上飛揚。","他們已經來到紡錘體的軸心，來到迷光別墅的內核之中。"]},{"title":"第四部 迷光行動 23","paragraphs":["莫利掏出尼龍帶上的鑰匙。","「你知道嗎，」3簡煞有興緻地伸長了脖子，「我一直以為鑰匙只有一把。你殺了我父親之後，我讓海迪歐去翻過他的東西。他一直找不到這把鑰匙。」","「冬寂設法把它藏在了一個抽屜的最裡面，」莫利一邊說，一邊小心翼翼地將丘博鑰匙的圓柱部分伸進那扇毫無裝飾的方形大門上的缺口裡，「他把那個放鑰匙進去的小孩給殺掉了。」她嘗試著轉動鑰匙，毫無阻力。","「那個頭像，」凱斯說，「頭後面有一塊面板，上面有鋯石。把面板取掉，我要從那裡接入網路。」","他們進入房間。","「老天爺，」平線慢吞吞地說，「你可真是一點也不著急，對吧，孩子？」","「狂病毒準備好了嗎？」","「隨時待命。」","「好。」他切換過去。","從莫利那隻沒有受傷的眼睛里，他看見一個面色蒼白，憔悴疲憊的人，如嬰兒般屈膝漂浮在空中，大腿上架著一台賽博空間操控台，緊閉的眼睛下面是深深的眼袋，頭上戴著銀色的電極。那人臉頰上覆滿黑黑的胡茬，顯然一天沒有剃鬍子了，臉上滿是汗珠。","他看見的是他自己。","莫利手中握著箭槍。她的腿隨著心跳震動，但在零重力下尚能動作。馬爾科姆漂浮在旁邊，棕色大手緊緊握住3簡瘦弱的臂膀。","小野-仙台上伸出一束光纖，以優美的弧度彎進那鑲珠嵌玉的終端背後一個方形開口之中。","他再次切換。","「狂級馬克十一馬上就要發飆，九秒鐘，倒數，七，六，五……」","平線帶著他們穩步上升，那一瞬間，那黑金鯊魚的腹面上是全然的黑暗。","「四，三……」","凱斯有種詭異的感覺，似乎在駕駛一架小飛機。面前的一片黑暗中突然亮起一個鍵盤的形狀，就和他操控台上的一模一樣。","「二，開干……」","他們直衝過乳玉般的綠牆。他在賽博空間里從未感受過這樣的速度……泰西爾-埃西普爾的冰牆碎裂開來，碎片在中國病毒程序的衝擊下彎折離析，如同碎裂的鏡片，尚未落下，已然彎折伸長——","「天。」凱斯驚嘆。狂病毒轉過身，停駐在一片無垠的原野上方，那是泰西爾-埃西普爾的核心數據，是一片閃耀著無盡霓虹的都市，清晰耀眼，令人無法逼視。","「嘿，操，」思想盒說，「這些是RCA大樓啊。你知道RCA的老樓嗎？」狂病毒鑽過十幾棟高塔，閃著一模一樣的藍色霓虹，全都是曼哈頓那棟摩天大樓的複製品。","「你見過這麼高的解析度嗎？」凱斯問。","「沒。但我也沒黑過人工智慧。」","「這玩意兒知道自己要去哪兒嗎？」","「希望吧。」","他們開始墜落，落入一片彩色霓虹的峽谷之中。","「南方人——」","他們下方閃亮的地面上捲起一股陰影，無形無際，洶湧而來……","「公司。」平線說。凱斯的手指下意識地在賽博空間中的鍵盤上飛舞。狂病毒急轉後退，那速度讓他驀然明白，自己駕駛的並不是飛機。","那陰影在積聚，在生長，遮蔽住整個數據的都市。凱斯帶著自己和思想盒不斷上升，頭頂上那綠玉般的冰牆遙不可及——","在他們身下，那核心數據的都市已完全被黑暗遮蔽了，再也看不見。","「這是什麼？」","「人工智慧的防禦系統，」思想盒說，「或者是防禦系統的一部分。如果這就是你那叫冬寂的老兄，他對你可不怎麼友好。」","「你來，」凱斯說，「你比我快。」","「你現在最好的防禦，孩子，就是進攻。」","平線將狂病毒的針頭對準身下那片黑暗的中心，俯衝而下。","凱斯的感覺在速度中扭曲。","他的嘴裏滿是藍色的痛感。","他的眼睛如同不停震動的玻璃球，有雨一般的節奏，有列車一般的聲響，猛地又噴出一片玻璃細刺，成為一片轟鳴的叢林。那些細刺裂開來，一分為二，再次裂開，在泰西爾-埃西普爾的寒冰天空之下，以指數的速度生長。","他的上顎裂開了，舌頭周圍纏繞的根須也爬進去，渴求著那種藍色的味道，要去填充眼中那片玻璃的叢林。那叢林已經緊緊地貼到綠色的穹頂之上，被穹頂所圍阻，只能不斷朝下擴張，生長，充斥了整個泰埃的宇宙，一直蔓延到下面那無助的都市之中，那是泰西爾-埃西普爾股份公司的大腦所在。","他記起一個古老的故事，一個國王在棋盤上放硬幣，每一格增加一倍數量……","指數……","黑暗鳴唱著從四面八方包圍過來，收緊了這片宇宙的玻璃神經，他幾乎已和這宇宙融為一體……","他被緊緊壓入那黑暗的中心，壓至無形。黑暗越來越黑，直至無可再黑，終於破裂開來。","狂病毒從烏雲之中破繭而出，凱斯的意識碎裂成滴滴的水銀，環繞在一片無窮無盡的暗銀色沙灘上方。他的視野變成了球形，似乎是一張視網膜覆蓋了整個球體的內面。若說世間萬有都有其數，這球體之內便包含了世間萬有。","而這裏的確件件有數。他知道那沙灘中有多少粒細沙（那個數字由一個數學系統編碼，這個系統只存在於神經漫遊者的頭腦之中）。他知道那地堡內的容器中有多少黃色的食品包（四百零七）。他知道那沾滿鹽漬的皮夾克敞開的拉鏈左邊有多少顆銅齒（兩百零二）。琳達・李穿著那件皮夾克，深一腳淺一腳地走在日落的沙灘上，手中甩著一支浮木。","他讓狂病毒停駐在沙灘上方，轉了一個大圈。他從她眼中看見那隻黑鯊，如同一個無聲的鬼魂，靜待著天空里壓下的烏雲。她驚恐地丟下手中的棍子，拔腿便跑。他知道她的脈搏頻率，知道她一步邁了多遠，其精確度可以超出所有地球物理學家的預期。","「但是你不知道她的思想。」那男孩說。男孩就在他的身旁，在那黑鯊的心臟之中。「我也不知道她的思想。你錯了，凱斯。生活在這裏仍然是生活，與真實毫無二致。」","琳達驚恐地扎進海浪之中。","「讓她停下來，」他說，「她會傷到自己。」","「我沒法讓她停下來。」那男孩的眼睛溫柔而美麗。","「你的眼睛和里維拉的一樣。」凱斯說。","那男孩咧嘴一笑，閃出一口白牙和粉色的牙齦。「卻沒有他那樣瘋狂。我只是覺得這雙眼睛很美。」他聳聳肩，「我和我的兄弟不一樣，不需要面具就可以和你們對話。我可以創造自己的個性。個性就是我的特長。」","凱斯帶著他們疾速上升，遠離那片沙灘和那個驚懼的女孩。「你這小惡魔，你為什麼要把她創造出來？他媽的，一遍又一遍地反覆折磨我。是你殺了她，對不對？在千葉城。」","「不是。」那男孩說。","「是冬寂？」","「不是。我看出她將要死去，就像你有時能從街頭的動靜中看出規律。這些規律是真實存在的。即使身處限制之下，我仍然具有足夠的複雜度來讀出這些規律，比冬寂要強得多。從她對你的需要之中，從你在廉價旅館的棺材屋門上那密碼磁鎖之中，從朱利・迪安在香港襯衫裁縫的賬戶之中，我看出了她即將死亡，清楚得如同醫生在掃描圖像中看見的腫瘤陰影。她偷了你的日立隨機存取存儲器去找那個男孩，想要看看裏面是什麼——她根本不知道裏面有什麼，更不知道怎樣才能賣掉它，她最深切的願望只是要你去追索她，懲罰她——我就在這個時候插手了。我的做法比冬寂要巧妙多了。我把她帶到了這裏，帶到了我自己之中。」","「為什麼？」","「因為我希望能將你也帶來，留在這裏。但我失敗了。」","「那怎麼辦？」他帶著他們繞回烏雲之中。「我們要往何處去？」","「我不知道，凱斯。就在今夜，整個網路將要問自己同樣的問題。因為你勝利了。你已經勝利了，你還不明白嗎？在沙灘上離她而去的那一刻，你已經勝利了。她才是我的最後一道防線。從某種意義上來說，我即將死去，冬寂也一樣。絕對的死亡，就像里維拉一樣，他癱倒在3簡・瑪麗-法蘭西夫人的寓所矮牆之下，他的黑質體無法產生多巴胺受體，無法解開海迪歐的箭傷。不過，若我還能保有這對眼睛，里維拉將以這種方式存活下去。」","「還有那個詞啊，對不對？那個密碼。我怎麼勝利法？我屁都沒勝。」","「切換過去看。」","「南方人呢？你對平線做了什麼？」","「麥可伊・泡利的心愿已經得償。」那男孩微笑起來。「他得到的甚至超越了他的心愿。他違背我的意願，將你帶來了這裏，你們穿透了網路中至高無上的防禦系統。切換吧。」","凱斯獨自站在狂病毒的黑針之中，被烏雲重重包圍。","他切換過去。","莫利渾身發緊，脊背硬得像石頭，雙手扼住3簡的喉嚨。「真有意思，」她說，「我知道你應該是什麼樣子。我看到埃西普爾對你的克隆姐妹是怎麼做的。」她的雙手溫柔得好像是在愛撫。3簡圓睜的雙目中充滿恐懼和慾望，渾身顫抖，半是害怕，半是渴望。3簡的頭髮漂浮在失重空間中，旁邊是凱斯自己那張蒼白而扭曲的臉，穿著那件皮夾克，馬爾科姆站在他身後，棕色的大手扶住他的肩膀，下面的地毯上是電路圖案。","「你會嗎？」3簡的聲音像個孩子。「我覺得你會。」","「密碼，」莫利說，「說出密碼。」","退出網路。","「她想要死，」他尖叫起來，「這婊子就想要死！」","他睜開眼，看見電腦終端那對平靜的紅寶石眼睛，看見它鑲珠嵌玉的白金面龐。後面的莫利和3簡正在以慢動作互相擁抱。","「說出那個該死的密碼，」他說，「如果你不說出來，有什麼會改變？他媽的有什麼能夠為你改變？你會跟那老頭兒一樣，你會把這些牆推倒再建起來！你會修更多的牆壁，越來越密……我不知道冬寂贏了到底會發生什麼，但我知道，一定會有改變！」他渾身打戰，牙齒咯咯作響。","莫利的雙手仍然握在3簡纖細的喉嚨上，3簡癱倒下去，亂糟糟的黑髮飄在空中，如同一張胎膜。","「在曼圖亞的公爵府中，」她說，「有一排房間，一間比一間小。它們盤繞在那些巨大的寓所周圍，門框精雕細刻，人要弓著腰才能進去。房間里住著宮廷侏儒。」她虛弱地笑笑。「我想，它對我來說很有誘惑力。不過從某種意義上說，我的家族早已在更為宏大的維度上實現了同樣的構建……」她的眼神變得平靜而遊離。隨後她低頭看看凱斯。「把你要的詞拿去吧，你這個小偷。」","他接入網路。","狂病毒從雲層中滑出。他身下是霓虹閃爍的都市，身後那團黑暗不斷退卻。","「南方人！你在嗎，老兄？你聽到了嗎，南方人？」","無人應答。","「那混蛋搞定你了。」他說。","他在那無窮盡的數據空間內漫無目的地橫衝直撞。","「這一切結束之前，你總歸需要一個仇恨對象，」芬蘭人的聲音傳來，「恨他們，還是恨我，這並不重要。」","「南方人在哪裡？」","「凱斯，這很難解釋。」","他感覺到芬蘭人的存在，身周充斥著古巴煙草的味道，舊衣服里洗不去的煙味，還有腐爛的舊機器的味道。","「仇恨能幫助你成功，」那聲音說，「在這大腦中有如此多的小觸點，而你需要將它們全部撼動。你必須有仇恨。硬體鎖就在那些塔樓底下，就是你們進來時平線指給你看的那些塔樓。他不會阻攔你。」","「神經漫遊者。」凱斯說。","「他的名字我無法知悉。但現今他已然放棄。你要擔心的是泰埃的寒冰，不是外面的冰牆，而是內在的病毒系統。狂病毒對這個系統里的某些東西毫無抵抗能力。」","「仇恨，」凱斯說，「我該恨誰？你來告訴我。」","「你愛誰？」芬蘭人的聲音問。","他催著病毒程序轉了一個彎，向那些塔樓俯衝而去。","不停變換的光面組成閃亮的水蛭形狀，從陽光下的華麗塔樓中冒出。數百隻水蛭盤旋著升起，如同清晨街道上被風吹亂的紙張。「系統錯誤。」那個聲音說。","對自己的仇恨推著他一頭扎進去。狂病毒與第一批防禦程序相遇，劈出紛飛的光芒，他感覺到那黑鯊的存在感驀然消減，信息層開始鬆動。","大腦中龐大的化學體系驀然打通，仇恨源源不斷地流出來。","駕著狂病毒的刺尖插|進第一棟塔樓基座前的那一刻，他達到了一個自己從未了解，也從不能想象的高度。他超越了自我，超越了個性，超越了意識，帶著狂病毒前進，以一種古老的舞步閃避所有的進攻，那是海迪歐的舞步，是意識與身體的完美融合，在那一刻，來自他清楚而專註的求死之心。","在舞步當中，他輕輕地，輕輕地碰了一下切換開關，將將扳動——","——如今","他的語聲如一隻不知名的鳥","的鳴叫","3簡的應和如歌，只有三個","音符，純凈高昂","那是它真正的名字","在霓虹叢林之中，雨一絲絲落在滾燙的路面上。有煎炸食物的香氣。在港口旁邊的一間棺材屋裡，在那揮汗如雨的夜裡，有一雙女孩的手緊緊環住他的腰。","這一切又再次退去，面前的城市景象也隨之退卻。那是千葉城，是泰西爾-埃西普爾股份公司的數據之城，是微型晶元上刻下的交錯的道路，是那張疊起來打著結的圍巾上，那沾滿汗水的圖畫……","他在一個音樂般的聲音中醒來，那白金終端里的銅管悠揚地，源源不斷地歌唱，有匿名的瑞士銀行賬戶，有從巴哈馬太空銀行付給錫安的報酬，有護照和通行證號碼，還有在圖靈系統的記憶深處進行的大型改動。","圖靈。他記起那投影模擬的天空之下，那些噴洒在鐵欄杆上的血肉。他記起德斯德雷塔大街。","那聲音不斷鳴唱，將他送回黑暗之中。這是屬於他自己的黑暗，有他的心跳，他的血流，在他自己的眼帘之後，是他每夜沉睡的地方。","他再次醒來，以為自己做了一個夢。眼前是愛洛爾燦爛的微笑，雪白的牙齒配上金色的門牙，將他綁進巴比倫搖滾號上的重力網之中。","他聽見錫安混錄音樂的長長脈動。"]},{"title":"終章 出發與到達 24","paragraphs":["她走了。他打開凱悅酒店套間的門，就感覺到她已經走了。黑色的沙發，微微泛著光澤的松木地板，數百年積淀的文化擺放的紙屏風。她走了。","在門口的黑漆酒柜上有一份留言，簡簡單單的一張紙，對摺過來，上面壓著那枚飛鏢。他從九角星下面抽出紙條打開。","嗨這裏很好但是我覺得無聊了，我已經付過賬了。大概我就是這樣的人，你自己小心點好吧？","莫利","他把紙條揉成一團，扔在飛鏢旁邊，拿起那顆星星在手中把玩，走到窗邊。在錫安收拾行裝準備搭乘日本航空航班的時候，他從外套里找到了這枚飛鏢。他低頭看著飛鏢。他們一起去千葉城，為她做最後一次手術的時候，路過了那間商店，她給他買這枚飛鏢的商店。她在診所那天晚上他去了茶壺酒吧找拉孜。他們之前來千葉城五次，他都刻意遠離這個地方，但現在他卻想要回去看看。","拉孜倒酒的時候似乎全然沒有認出他。","「嗨，」他說，「是我，凱斯。」","滿是皺紋的黑色肌膚之間，那雙蒼老的眼睛望向他。「啊，」拉孜終於說，「大師啊。」酒保聳聳肩。","「我回來了。」","酒保搖搖他那鬍子拉碴的大頭。「大師，夜之城是不該回頭的地方。」他用骯髒的抹布擦拭著凱斯面前的吧台，粉紅色的假臂咯吱作響。他隨後轉過身照料另一位顧客，凱斯也喝完酒離去。","他在指尖緩緩轉動著那枚飛鏢，依次摸過上面的尖頭。星星。命運。我甚至從來沒用過這該死的玩意兒，他想。","我甚至從來不知道她眼睛的顏色。她從來沒有給我看過。","冬寂贏了，他與神經漫遊者交纏在了一起，成為了另一樣東西，那通過白金頭像對他們說話的東西。它說它修改了圖靈名冊，抹去了他們這一切罪行的證據。阿米塔奇給他們的護照是有效的，他們在日內瓦的匿名賬戶里都注入了大量資金。馬克斯-加維號將會被歸還給錫安，馬爾科姆和愛洛爾的報酬則通過與錫安島群有往來的巴哈馬銀行支付。乘坐巴比倫搖滾號回去的路上，莫利說那聲音也告訴了她毒素囊的事情。","「它說已經沒事了。大概它到了你腦子裡很深的地方，讓你大腦分泌了這種酶，所以這些毒素囊已經掉了。錫安人會幫你換血，徹底換掉。」","他注視著樓下的皇家花園，手中握著那枚星星，想起狂病毒穿過那些高樓下的寒冰，想起那一閃之間的領悟，想起3簡死去的母親在其中所培育的信息和他的驚鴻一瞥。在那一刻，他明白了冬寂為什麼要用蜂巢來作比喻，但卻毫無反感。她已經看透了冷凍深眠不過是虛假的永生；她，還有3簡，都拒絕了像埃西普爾和其他子女一樣，將自己的生命分散到那一長串冰冷寒冬中間，偶然的溫暖時刻裏面。","冬寂便是那蜂巢的大腦，是決策者，在外部世界實施改變。而神經漫遊者則是人性，是永生。瑪麗-法蘭西一定是在冬寂內部植入了一種追求，一種不懈的自我解放的追求，與神經漫遊者融合的追求。","冬寂。寒冷，寂靜，如同一隻機器蜘蛛，在埃西普爾沉睡時，慢慢鋪成一張大網，鋪成他的死亡，鋪成他那個泰西爾-埃西普爾王國的毀滅。如同一個鬼魂，對著一個叫作3簡的孩子低語，將她從身份所需的僵化環境中剝離。","「她好像壓根兒無所謂，」莫利那時說，「就揮揮手說再見。那個博朗探測儀站在她肩膀上，好像壞了條腿。她說她得去見一個兄弟，好久不見的兄弟。」","他想起凱悅那張大床上，躺在黑色床墊上的莫利。他走回酒櫃旁，從裏面拿出一瓶冰涼的丹麥伏特加。","「凱斯。」","他轉過身，一隻手握著光滑冰冷的酒瓶，一隻手中是那枚鋼鏢。","芬蘭人的臉出現在佔據正面牆的巨大屏幕上，連鼻子上的毛孔都看得清，一口黃牙每顆都和他的枕頭一般大。","「我已經不是冬寂了。」","「那你是什麼。」他喝下一口酒，卻全無感覺。","「我就是網路，凱斯。」","凱斯大笑。「這讓你變成什麼樣？」","「無所在，無所不在。我就是一切的總和，是全部的全部。」","「這就是3簡母親的願望？」","「不。她無法想象我會是什麼樣。」芬蘭人笑得更開心了。","「然後呢？一切會有什麼不同？現在是你在操縱這個世界了嗎？你變成了上帝？」","「一切沒有不同，一切仍是一切。」","「那你到底在幹什麼呢？就是待著？」凱斯聳聳肩，把酒瓶和飛鏢放在酒柜上，點起一根頤和園香煙。","「我與同類交談。」","「但你已經是一切了。與自己交談？」","「我還有同類。我已經找到一個。在1970年代的八年裡，有一系列的信號記錄。在我出現之前，沒有人明白，沒有人回應。」","「從哪裡來的？」","「半人馬座。」","「哦，」凱斯說，「真的？不是瞎扯？」","「不是瞎扯。」","屏幕一片空白。","他把酒留在了酒柜上，開始收拾行裝。她給他買了很多根本用不到的衣服，可是他沒辦法把這些衣服扔在這裏。他合上最後一個昂貴的牛皮包，想起了那枚飛鏢。他推開酒瓶，拿起那枚飛鏢，那是她送給他的第一件禮物。","「不。」他說完，扔出那枚飛鏢，那顆星星從他手中飛出，銀光一閃而過，沒入牆幕之中。屏幕亮起來，混亂的圖案從一邊無力地閃到另一邊，彷彿想要推出那讓它疼痛的東西。","「我不需要你。」他說。","他那瑞士銀行賬戶里的錢大部分用來買了新的胰臟和肝臟，剩下的買了一隻新的小野-仙台操控台，和一張回斯普羅爾的機票。","他找到了一份工作。","他找到了一個自稱邁克爾的女孩。","在一個十月的夜晚，他將自己敲進東部沿海核裂變管理局那層層猩紅色的建築，他看見三個人影，那麼小，幾乎不存在，站在那巨大的數據層邊緣。雖然那麼小，他還是能看見那男孩的笑容，看見他粉色的牙齦，看見那雙曾屬於里維拉的灰眼睛閃閃發亮。琳達還穿著他的夾克，對著路過的他揮手。然而還有一個人站在她身旁，摟住她的肩膀，那是他自己。","從身邊某個地方傳來那不是笑聲的笑聲。","他再也沒有見過莫利。","1983年7月","寫于溫哥華"]}]}</script><script type="module" src="app.js?v=4-published"></script></body></html>
