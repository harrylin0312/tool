<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2ea"><title>靜讀・英文｜Neuromancer</title>
<style>
:root{--bg:#f5f2ea;--fg:#303b36;--muted:#737c71;--line:#dadcd1;--accent:#647b61;--size:22px;--leading:1.95;--gray:#deded9;--paper:#fcfaf5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{min-height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 42px;gap:20px}.brand{font:23px 'Songti TC',serif;letter-spacing:.12em}.brand small{font:9px system-ui;letter-spacing:.17em;display:block;color:var(--muted);margin-top:7px}.tools{display:flex;gap:9px}.control{border:1px solid var(--line);border-radius:8px;background:transparent;min-height:42px;padding:8px 12px;font:12px system-ui}.control:hover{background:#647b6112}main{max-width:758px;margin:auto;padding:63px 32px 100px}.kicker{font:10px system-ui;letter-spacing:.2em;color:var(--accent);margin-bottom:18px}h1{font:42px Georgia,serif;margin:0 0 12px;font-weight:400}.meta{font:12px system-ui;color:var(--muted);line-height:1.8}.intro{margin:30px 0 38px;padding:15px 18px;border-left:2px solid var(--accent);font:12px/1.9 system-ui;background:#647b6107}.sample{display:inline-block;background:var(--gray);padding:0 4px;border-radius:3px}.ornament{width:32px;border-top:1px solid var(--accent);margin:32px 0}h2{font:14px Georgia,serif;font-weight:400;letter-spacing:.1em;margin:0 0 30px}article{font:var(--size)/var(--leading) Georgia,'Times New Roman',serif;overflow-wrap:break-word}article p{margin:0 0 1.2em}.word{font:inherit;letter-spacing:inherit;display:inline;border:0;border-radius:3px;padding:0;background:transparent;min-height:0;color:inherit;box-decoration-break:clone;-webkit-box-decoration-break:clone}.word.outside{background:var(--gray)}body.hide-gray .word.outside{background:transparent}.word:hover{background:#647b6124}.word.selected{background:#647b6130;box-shadow:0 2px var(--accent)}.end{border-top:1px solid var(--line);padding-top:24px;margin-top:42px;font:12px/1.9 system-ui;color:var(--muted)}footer{padding:18px 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font:11px system-ui;color:var(--muted)}dialog{position:fixed;margin:0;inset:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--fg);width:350px;max-width:calc(100vw - 24px);padding:24px;box-shadow:0 16px 60px #24352a26;z-index:20;font:14px/1.8 system-ui;max-height:70dvh;overflow:auto}dialog::backdrop{background:transparent}.pophead{display:flex;justify-content:space-between;gap:15px;align-items:center}#lookupWord{font:28px Georgia,serif;margin:0;overflow-wrap:anywhere}.close{font:23px system-ui;border:0;background:transparent;width:36px;height:36px}.tag{display:inline-block;font:10px system-ui;border:1px solid var(--line);padding:5px 8px;border-radius:20px;color:var(--muted);margin:14px 0 7px}#meaning{font-size:16px;line-height:1.9;margin:10px 0 16px}#lemma{font:12px system-ui;color:var(--muted)}.settings label{display:block;margin:20px 0}.settings input{width:100%;accent-color:var(--accent)}.settings h3{margin:0}.settings::backdrop{background:#20302533}.night{--bg:#202925;--fg:#d7dfd2;--muted:#a2ac9f;--line:#445047;--gray:#424943;--paper:#2b352e}#progress{height:2px;background:var(--accent);width:0;position:fixed;bottom:0;left:0} @media(max-width:600px){header{padding:14px 19px;min-height:74px}.brand{font-size:19px}.tools{gap:5px}.control{padding:8px 9px}main{padding:38px 23px 65px}h1{font-size:35px}article{font-size:min(var(--size),30px)}.intro{margin:25px 0 30px}dialog.lookup{left:12px!important;right:12px;bottom:max(12px,env(safe-area-inset-bottom))!important;top:auto!important;width:auto;max-width:none}footer{padding:18px 23px;line-height:1.8}.desktop-label{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="brand">靜讀・英文<small>QUIET READER / ENGLISH</small></div><nav class="tools" aria-label="閱讀工具"><button class="control" id="gray" aria-pressed="true">灰色提示</button><button class="control" id="theme" aria-label="切換夜間模式" aria-pressed="false">夜間</button><button class="control" id="type" aria-label="排版設定">Aa</button></nav></header>
<main><div class="kicker">NEUROMANCER · READING SAMPLE</div><h1 lang="en">Neuromancer</h1><div class="meta">William Gibson <span aria-hidden="true">／</span> 第一部・第 1 章<br>單頁試讀 · 原 PDF 第 3 頁</div><div class="intro">點一下任何英文單字，查看繁體中文解釋。<br><span class="sample">淺灰色</span> 是大考 Level 1–6 詞表外的字，可略過；詞性衍生與時態變化一併比對。</div><div class="ornament"></div><h2 lang="en" id="chapter"></h2><article lang="en" id="reading" aria-label="小說正文"></article><div class="end">本次樣本到這裡。<br>先確認點字查義與標記效果，後續完整版將放在同一個閱讀器中。</div></main>
<footer><span>點字查義 · 詞義已預載</span><span>試讀頁 1 / 1</span></footer><div id="progress"></div>
<dialog class="lookup" id="lookup" aria-labelledby="lookupWord"><div class="pophead"><h3 id="lookupWord" lang="en"></h3><button class="close" id="closeLookup" aria-label="關閉解釋">×</button></div><div class="tag" id="scope"></div><div id="meaning"></div><div id="lemma"></div></dialog>
<dialog class="settings" id="settings" aria-labelledby="settingsTitle"><div class="pophead"><h3 id="settingsTitle">閱讀排版</h3><button class="close" id="closeSettings" aria-label="關閉設定">×</button></div><label>字級 <output id="sizeValue">22</output> px<input id="size" type="range" min="17" max="30" value="22"></label><label>行距 <output id="leadingValue">1.95</output><input id="leading" type="range" min="1.4" max="2.5" step="0.05" value="1.95"></label></dialog>
<script>
const BOOK=/*__BOOK__*/;
const reading=document.querySelector('#reading'),lookup=document.querySelector('#lookup'),settings=document.querySelector('#settings');let active=null;
function appendWords(parent,text){const re=/[A-Za-z]+(?:['-][A-Za-z]+)*/g;let pos=0;for(const m of text.matchAll(re)){parent.append(document.createTextNode(text.slice(pos,m.index)));const entry=BOOK.lexicon[m[0].toLowerCase()];if(!entry)throw Error('缺少詞義：'+m[0]);const b=document.createElement('button');b.type='button';b.className='word '+entry.scope;b.textContent=m[0];b.dataset.key=m[0].toLowerCase();b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-label',m[0]+'：查看中文解釋');b.addEventListener('click',()=>openWord(b));parent.append(b);pos=m.index+m[0].length}parent.append(document.createTextNode(text.slice(pos)))}
appendWords(document.querySelector('#chapter'),'PART ONE — CHIBA CITY BLUES · 1');for(const text of BOOK.paragraphs){const p=document.createElement('p');appendWords(p,text);reading.append(p)}
function dismiss(){lookup.close();if(active){active.classList.remove('selected');active.setAttribute('aria-expanded','false')}}
function openWord(b){if(active===b&&lookup.open){dismiss();return}if(active)active.classList.remove('selected');active=b;b.classList.add('selected');b.setAttribute('aria-expanded','true');const e=BOOK.lexicon[b.dataset.key];document.querySelector('#lookupWord').textContent=b.textContent;document.querySelector('#scope').textContent=e.pos+' · '+({outside:'詞表外，可略過',covered:'詞表內／詞族涵蓋',name:'專有名詞'})[e.scope];document.querySelector('#meaning').textContent=e.meaning;document.querySelector('#lemma').textContent='原形／詞族：'+e.lemma;if(!lookup.open)lookup.show();const r=b.getBoundingClientRect();const width=Math.min(350,innerWidth-24);lookup.style.left=Math.max(12,Math.min(r.left,innerWidth-width-12))+'px';const height=lookup.offsetHeight;lookup.style.top=Math.max(12,Math.min(r.bottom+12,innerHeight-height-12))+'px'}
document.querySelector('#closeLookup').onclick=dismiss;document.addEventListener('click',e=>{if(lookup.open&&!lookup.contains(e.target)&&!e.target.closest('.word'))dismiss()});document.addEventListener('keydown',e=>{if(e.key==='Escape')dismiss()});lookup.addEventListener('close',()=>{if(active)active.classList.remove('selected')});window.addEventListener('resize',dismiss);window.addEventListener('scroll',()=>{dismiss();const max=document.documentElement.scrollHeight-innerHeight;document.querySelector('#progress').style.width=(max>0?scrollY/max*100:100)+'%'},{passive:true});
let prefs={size:22,leading:1.95,night:false,gray:true};try{Object.assign(prefs,JSON.parse(localStorage.getItem('quiet-english-settings-v1')||'{}'))}catch{}function apply(){document.documentElement.style.setProperty('--size',prefs.size+'px');document.documentElement.style.setProperty('--leading',prefs.leading);document.body.classList.toggle('night',!!prefs.night);document.body.classList.toggle('hide-gray',!prefs.gray);document.querySelector('#theme').setAttribute('aria-pressed',String(!!prefs.night));document.querySelector('#gray').setAttribute('aria-pressed',String(!!prefs.gray));document.querySelector('#theme').textContent=prefs.night?'日間':'夜間';for(const k of ['size','leading']){document.querySelector('#'+k).value=prefs[k];document.querySelector('#'+k+'Value').value=prefs[k]}try{localStorage.setItem('quiet-english-settings-v1',JSON.stringify(prefs))}catch{}}apply();document.querySelector('#theme').onclick=()=>{prefs.night=!prefs.night;apply()};document.querySelector('#gray').onclick=()=>{prefs.gray=!prefs.gray;apply()};document.querySelector('#type').onclick=()=>{dismiss();settings.style.left=Math.max(12,(innerWidth-350)/2)+'px';settings.style.top='20vh';settings.showModal()};document.querySelector('#closeSettings').onclick=()=>settings.close();for(const k of ['size','leading'])document.querySelector('#'+k).oninput=e=>{prefs[k]=Number(e.target.value);apply()};
</script></body></html>
