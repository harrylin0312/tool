<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BESTie｜訪談字幕播放器</title><style>body{margin:0;background:#11141c;color:#f3f4fa;font:17px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:28px}h1{font-size:2rem}p{color:#bac1d3}iframe,video{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}button,select,input{font:inherit;color:inherit;background:#252b3e;border:1px solid #68718b;border-radius:8px;padding:8px;margin:5px}#caption{min-height:100px;background:#202638;border-radius:12px;padding:24px;font-size:1.5rem;white-space:pre-line;text-align:center}.notice{border-left:3px solid #bf9dff;padding:12px}label{display:inline-block}a{color:#cab3ff}</style><main><p>SBS RADIO · BESTie</p><h1>訪談字幕播放器</h1><p class="notice">字幕尚未製作完成。此頁可播放 YouTube，或載入你持有的本機影音與韓文／繁中 SRT、VTT。節目日期與內容尚未核實。</p><div id="youtube"></div><video id="local" controls hidden></video><p id="status" role="status">等待播放器載入；若無法嵌入，請使用下方原片連結。</p><p><a href="https://www.youtube.com/watch?v=lZVbK5Iz-_A" target="_blank" rel="noopener">在 YouTube 開啟原片</a></p><label>本機影音 <input type="file" id="media" accept="video/*,audio/*"></label><br><label>韓文字幕 <input type="file" id="ko" accept=".srt,.vtt"></label><label>繁中字幕 <input type="file" id="zh" accept=".srt,.vtt"></label><p><label>字幕語言 <select id="lang"><option value="zh">繁體中文</option><option value="ko">韓文</option><option value="both">雙語</option><option value="off">關閉</option></select></label><label>字幕偏移（秒）<input id="offset" type="number" step="0.1" value="0" style="width:75px"></label></p><div id="caption" aria-live="off">尚未載入字幕</div><p>檔案僅在你的瀏覽器中讀取，不會上傳。正偏移會讓字幕延後顯示。</p></main><script>
let player,usingLocal=false;const tracks={ko:[],zh:[]},$=id=>document.getElementById(id);function stamp(s){return s.replace(',','.').split(':').reduce((a,b)=>a*60+Number(b),0)}function parse(s){return s.replace(/\r/g,'').split(/\n\s*\n/).flatMap(b=>{let lines=b.trim().split('\n'),i=lines.findIndex(l=>l.includes('-->'));if(i<0)return[];let t=lines[i].split('-->').map(x=>x.trim().split(/\s/)[0]),start=stamp(t[0]),end=stamp(t[1]);return Number.isFinite(start)&&end>start?[{start,end,text:lines.slice(i+1).join('\n').replace(/<[^>]*>/g,'')}]:[]}).sort((a,b)=>a.start-b.start)}
for(const key of ['ko','zh'])$(key).onchange=async e=>{let f=e.target.files[0];if(!f)return;tracks[key]=parse(await f.text());$('status').textContent=`已載入 ${tracks[key].length} 則${key==='ko'?'韓文':'繁中'}字幕。`};let mediaURL;$('media').onchange=e=>{if(!e.target.files[0])return;usingLocal=true;if(player?.pauseVideo)player.pauseVideo();if(mediaURL)URL.revokeObjectURL(mediaURL);mediaURL=URL.createObjectURL(e.target.files[0]);$('local').src=mediaURL;$('local').hidden=false;$('youtube').hidden=true};window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('youtube',{videoId:'lZVbK5Iz-_A',width:'100%',playerVars:{playsinline:1},events:{onReady:()=>{$('status').textContent='播放器已就緒；字幕尚未載入。'},onError:e=>{$('status').textContent='YouTube 播放失敗（'+e.data+'），請開啟原片或載入本機影音。'}}})};setInterval(()=>{let t=(usingLocal?$('local').currentTime:player?.getCurrentTime?.()||0)-Number($('offset').value),lang=$('lang').value,keys=lang==='both'?['ko','zh']:lang==='off'?[]:[lang];$('caption').textContent=keys.flatMap(k=>tracks[k].filter(s=>s.start<=t&&t<s.end).map(s=>s.text)).join('\n')||(lang==='off'?'字幕已關閉':keys.every(k=>!tracks[k].length)?'尚未載入字幕':'');},100);let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{$('status').textContent='無法連線 YouTube；可載入本機影音。'};document.head.append(script);
</script></html>
