<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="依日期、節目與場次整理 BESTie 2026 年重組後的打歌舞台、訪談、直拍與幕後。">
  <title>BESTie 影片索引</title>
  <link rel="stylesheet" href="style.css?v=5a7eee3257bf">
  <script src="videos.js?v=ae47857d44b8" defer></script>
  <script src="index.js?v=a4f5b490ee70" defer></script>
</head>
<body>
  <header class="hero">
    <div class="wrap hero-content">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M8 4v16m8-16v16M3 9h5m8 0h5M3 15h5m8 0h5"/>
        </svg>
        BESTie 影片索引
      </h1>
    </div>
  </header>
  <main class="wrap">
    <div class="controls">
      <nav id="filters" aria-label="影片分類"></nav>
      <div class="fields">
        <label>搜尋
          <input id="search" type="search" placeholder="日期、節目、歌名或成員">
        </label>
        <label>日期排序
          <select id="order">
            <option value="new">新到舊</option>
            <option value="old">舊到新</option>
          </select>
        </label>
      </div>
    </div>
    <p id="count" role="status"></p>
    <div id="results"></div>
    <noscript>請啟用 JavaScript 以瀏覽影片索引。</noscript>
    <footer>打歌與電台以播出日為準。網路節目與幕後影片依上架日標示。</footer>
  </main>
  <template id="event">
    <article class="event">
      <div class="event-date"><time></time><span></span></div>
      <div class="event-body">
        <div class="show"><span class="show-name"></span> ／ <span class="channel">頻道 <span class="channel-name"></span></span></div>
        <h3></h3>
        <ul class="videos"></ul>
      </div>
    </article>
  </template>
</body>
</html>
