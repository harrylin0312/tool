const status = document.querySelector('#status');
const reader = document.querySelector('#reader');
reader.addEventListener('click', event => {
  const link = event.target.closest('a[href^="#"]');
  if (!link) return;
  event.preventDefault();
  const target = document.getElementById(link.hash.slice(1));
  if (target) {
    target.scrollIntoView({block:'center'});
    if (target.animate) target.animate([{outline:'2px solid #83b6fa'}, {outline:'2px solid transparent'}], 1800);
  }
});
function setupNavigation(main) {
  const top = main.querySelector('.top');
  const rows = [...main.querySelectorAll('.stream > [id^="m"]')];
  const dates = [...new Set(rows.map(row => row.dataset.day).filter(Boolean))];
  const tools = document.createElement('div');
  tools.className = 'reading-tools';
  tools.innerHTML = `<button type="button" class="mark">標記進度</button><details><summary>跳轉</summary>
    <div class="jump-panel"><button type="button" class="restore"></button>
    <label>日期<select></select></label><label>時間（選填）<input type="time"></label>
    <button type="button" class="go">前往</button><button type="button" class="latest">跳到最新訊息 ↓</button>
    <small role="status"></small></div></details><output aria-live="polite"></output>`;
  top.querySelector('a[href="#latest"]')?.remove();
  top.append(tools);
  const get = s => tools.querySelector(s);
  const date = get('select'), time = get('input'), panel = get('details');
  for (const day of dates) date.add(new Option(day, day));
  const storage = 'kakaotalk-reader:progress:' + location.pathname.replace(/index\.html$/, '');
  let bookmark;
  try { bookmark = document.getElementById(localStorage.getItem(storage)); } catch {}
  if (!rows.includes(bookmark)) bookmark = null;
  function refresh() {
    get('.restore').disabled = !bookmark;
    get('.restore').textContent = bookmark ? '回到書籤 · ' + bookmark.dataset.day + ' ' + (bookmark.dataset.clock || '') : '尚未標記進度';
  }
  function jump(row) {
    panel.open = false;
    if (!row) { window.scrollTo(0, document.documentElement.scrollHeight); return; }
    window.scrollBy(0, row.getBoundingClientRect().top - top.getBoundingClientRect().bottom - 8);
  }
  function reading() {
    const edge = top.getBoundingClientRect().bottom;
    const visible = rows.find(row => {const r=row.getBoundingClientRect();return r.top >= edge && r.bottom <= innerHeight;});
    return visible || rows.find(row => row.getBoundingClientRect().bottom > edge) || rows.at(-1);
  }
  let timer;
  get('.mark').onclick = () => {
    const row = reading();
    try {
      localStorage.setItem(storage,row.id); bookmark = row; refresh();
      get('output').textContent = '已標記進度 · ' + row.dataset.day + ' ' + (row.dataset.clock || '');
    } catch {get('output').textContent = '瀏覽器無法儲存書籤';}
    clearTimeout(timer);timer=setTimeout(()=>get('output').textContent='',2200);
  };
  panel.ontoggle = () => {if(panel.open){date.value=reading().dataset.day;get('small').textContent='';}};
  tools.onkeydown = e => {if(e.key==='Escape'){panel.open=false;get('summary').focus();}};
  get('.restore').onclick = () => jump(bookmark);
  get('.latest').onclick = () => jump(null);
  get('.go').onclick = () => {
    const row = rows.find(r => r.dataset.day===date.value && (!time.value || r.dataset.clock && r.dataset.clock>=time.value));
    if(row) jump(row); else get('small').textContent='當天這個時間之後沒有訊息。';
  };
  refresh();
  if ('scrollRestoration' in history) history.scrollRestoration='manual';
  requestAnimationFrame(()=>{if(main.isConnected)jump(bookmark);});
}

let request = 0;
function decode(base64) {
  return Uint8Array.from(atob(base64.replace(/-/g, '+').replace(/_/g, '/')), char => char.charCodeAt(0));
}
async function openSnapshot() {
  const current = ++request;
  status.hidden = false;
  status.textContent = '正在開啟聊天室…';
  reader.hidden = true;
  reader.replaceChildren();
  const secret = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(secret)) {
    status.textContent = '請使用原本附有金鑰的專用連結開啟。';
    return;
  }
  try {
    const key = await crypto.subtle.importKey('raw', decode(secret), 'AES-GCM', false, ['decrypt']);
    const html = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(snapshot.nonce)}, key, decode(snapshot.ciphertext));
    if (current !== request) return;
    const doc = new DOMParser().parseFromString(new TextDecoder().decode(html), 'text/html');
    const main = doc.querySelector('main');
    const style = doc.querySelector('style');
    if (!main || !style) throw new Error('Invalid snapshot');
    reader.replaceChildren(style, main);
    reader.hidden = false;
    status.hidden = true;
    setupNavigation(main);
  } catch {
    if (current === request) status.textContent = '無法開啟聊天室，請檢查專用連結是否完整。';
  }
}
window.addEventListener('hashchange', openSnapshot);
openSnapshot();
