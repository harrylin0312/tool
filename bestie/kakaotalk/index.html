const status = document.querySelector('#status');
const reader = document.querySelector('#reader');
reader.addEventListener('click', event => {
  const link = event.target.closest('a[href^="#"]');
  if (!link) return;
  event.preventDefault();
  const target = document.getElementById(link.hash.slice(1));
  if (target) {
    target.scrollIntoView({block:'center'});
    if (target.animate) target.animate([{outline:'2px solid #83b6fa'}, {outline:'2px solid transparent'}], 1800);
  }
});
let request = 0;
function decode(base64) {
  return Uint8Array.from(atob(base64.replace(/-/g, '+').replace(/_/g, '/')), char => char.charCodeAt(0));
}
async function openSnapshot() {
  const current = ++request;
  status.hidden = false;
  status.textContent = '正在開啟聊天室…';
  reader.hidden = true;
  reader.replaceChildren();
  const secret = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(secret)) {
    status.textContent = '請使用原本附有金鑰的專用連結開啟。';
    return;
  }
  try {
    const key = await crypto.subtle.importKey('raw', decode(secret), 'AES-GCM', false, ['decrypt']);
    const html = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(snapshot.nonce)}, key, decode(snapshot.ciphertext));
    if (current !== request) return;
    const doc = new DOMParser().parseFromString(new TextDecoder().decode(html), 'text/html');
    const main = doc.querySelector('main');
    const style = doc.querySelector('style');
    if (!main || !style) throw new Error('Invalid snapshot');
    reader.replaceChildren(style, main);
    reader.hidden = false;
    status.hidden = true;
  } catch {
    if (current === request) status.textContent = '無法開啟聊天室，請檢查專用連結是否完整。';
  }
}
window.addEventListener('hashchange', openSnapshot);
openSnapshot();
