'use strict';
const lessons=[{"id":"1103","date":"2026-11-03","title":"【關鍵破解】p.67~71，p.75~86","src":"https://victorvod.jrbooks.com.tw:89/vplus/116%20%E5%86%8D%E6%88%B0%E5%AD%B8%E6%B8%AC%20%E8%B6%85%E9%86%AB%E7%8F%AD/%E7%94%9F%E7%89%A9%20%E6%B8%B8%E5%A4%8F/2026_1103_0825_%E6%B8%B8%E5%A4%8F%E3%80%90%E9%97%9C%E9%8D%B5%E7%A0%B4%E8%A7%A3%E3%80%91p.67~71%EF%BC%8Cp.75~86.mp4","cues":[[1122.0,1125.66,"同學早安"],[1125.66,1131.78,"我們趕快再繼續，今天我們補上個禮拜的，上次那個颱風課。"],[1131.78,1132.62,"颱風假課"],[1132.62,1138.24,"我們上次教完了有絲分裂的全部。"],[1138.24,1141.04,"包括動物的有絲分裂、植物的有絲分裂。"],[1141.04,1142.8,"都介紹完了"],[1142.8,1145.68,"我們要介紹到減數分裂，67頁。"],[1145.68,1146.3,"67頁。"],[1146.3,1150.6,"六、七、減數分裂當中"],[1150.6,1152.48,"跟有絲分裂最大不同的點是，"],[1152.48,1154.68,"我們先用手勢來比試看看。"],[1154.68,1156.68,"我們手勢講有絲分裂是不是，"],[1156.68,1158.5,"染色體複製，"],[1158.5,1160.28,"在中間分離"],[1160.28,1161.22,"離開離開"],[1161.22,1162.08,"有絲分裂。"],[1162.08,1163.82,"那減數不同在哪邊？"],[1163.82,1167.36,"減數分裂是染色體複製完畢之後，"],[1167.36,1170.0,"成對的姊妹染色體會配對。"],[1170.0,1170.46,"可以嗎？"],[1170.46,1171.34,"配對"],[1171.34,1173.44,"那配對起來，再經過什麼時候，"],[1173.44,1174.78,"成對染色體分離，"],[1174.78,1176.78,"再姊妹染色體分離。"],[1176.78,1178.78,"所以從這樣看起來，"],[1178.78,1180.78,"表示要分裂幾次？"],[1180.78,1182.78,"分裂兩次"],[1182.78,1184.78,"我會說我的比的時候，"],[1184.78,1186.78,"為什麼第一次我這樣比、第二次這樣比？"],[1186.78,1190.78,"因為兩次分裂方向是互相垂直的。"],[1190.78,1192.78,"可以嗎？"],[1192.78,1194.78,"那兩次分裂方向互相垂直，"],[1194.78,1196.78,"表示什麼？第一次紡錘絲這樣形成，"],[1196.78,1198.78,"第二次紡錘絲是前後形成。"],[1198.78,1200.78,"那紡錘絲為什麼要兩次方向互相垂直形成？"],[1201.1,1202.8,"主要目的做什麼事？"],[1202.8,1206.86,"因為你要知道紡錘絲的形成方向，大概就告訴我們什麼概念？"],[1206.86,1209.8,"細胞質的分裂方向，對不對？"],[1209.8,1212.6,"這代表什麼？兩次細胞質的分裂方向，"],[1212.6,1214.6,"剛好是不相同的，是垂直的。"],[1214.6,1217.5,"這樣的好處在哪邊？可以均等分配。"],[1217.5,1221.4,"就好像我們切蛋糕，第一刀會切一半，對不對？"],[1221.4,1223.3,"第二刀怎麼切？是不是垂直切？"],[1223.3,1224.84,"有什麼樣的垂直線？"],[1224.84,1227.14,"因為你想要均等分配，對不對？"],[1227.14,1227.9,"可以嗎？"],[1227.9,1230.58,"所以我們說兩次分裂方向互相垂直。"],[1230.58,1231.74,"這是小細節"],[1231.74,1232.78,"第二個來"],[1232.78,1236.18,"第一次減數分裂的時候，染色質複製、配對，"],[1236.18,1238.48,"在分離之後基本上從頭到尾"],[1238.48,1240.78,
