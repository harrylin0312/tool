'use strict';
const lessons=[{"id":"1103","date":"2026-11-03","title":"【關鍵破解】p.67~71，p.75~86","src":"https://victorvod.jrbooks.com.tw:89/vplus/116%20%E5%86%8D%E6%88%B0%E5%AD%B8%E6%B8%AC%20%E8%B6%85%E9%86%AB%E7%8F%AD/%E7%94%9F%E7%89%A9%20%E6%B8%B8%E5%A4%8F/2026_1103_0825_%E6%B8%B8%E5%A4%8F%E3%80%90%E9%97%9C%E9%8D%B5%E7%A0%B4%E8%A7%A3%E3%80%91p.67~71%EF%BC%8Cp.75~86.mp4","cues":[[1122.0,1125.66,"同學早安"],[1125.66,1131.78,"我們趕快再繼續，今天我們補上個禮拜的，上次那個颱風課。"],[1131.78,1132.62,"颱風假課"],[1132.62,1138.24,"我們上次教完了有絲分裂的全部。"],[1138.24,1141.04,"包括動物的有絲分裂、植物的有絲分裂。"],[1141.04,1142.8,"都介紹完了"],[1142.8,1145.68,"我們要介紹到減數分裂，67頁。"],[1145.68,1146.3,"67頁。"],[1146.3,1150.6,"六、七、減數分裂當中"],[1150.6,1152.48,"跟有絲分裂最大不同的點是，"],[1152.48,1154.68,"我們先用手勢來比試看看。"],[1154.68,1156.68,"我們手勢講有絲分裂是不是，"],[1156.68,1158.5,"染色體複製，"],[1158.5,1160.28,"在中間分離"],[1160.28,1161.22,"離開離開"],[1161.22,1162.08,"有絲分裂。"],[1162.08,1163.82,"那減數不同在哪邊？"],[1163.82,1167.36,"減數分裂是染色體複製完畢之後，"],[1167.36,1170.0,"成對的姊妹染色體會配對。"],[1170.0,1170.46,"可以嗎？"],[1170.46,1171.34,"配對"],[1171.34,1173.44,"那配對起來，再經過什麼時候，"],[1173.44,1174.78,"成對染色體分離，"],[1174.78,1176.78,"再姊妹染色體分離。"],[1176.78,1178.78,"所以從這樣看起來，"],[1178.78,1180.78,"表示要分裂幾次？"],[1180.78,1182.78,"分裂兩次"],[1182.78,1184.78,"我會說我的比的時候，"],[1184.78,1186.78,"為什麼第一次我這樣比、第二次這樣比？"],[1186.78,1190.78,"因為兩次分裂方向是互相垂直的。"],[1190.78,1192.78,"可以嗎？"],[1192.78,1194.78,"那兩次分裂方向互相垂直，"],[1194.78,1196.78,"表示什麼？第一次紡錘絲這樣形成，"],[1196.78,1198.78,"第二次紡錘絲是前後形成。"],[1198.78,1200.78,"那紡錘絲為什麼要兩次方向互相垂直形成？"],[1201.1,1202.8,"主要目的做什麼事？"],[1202.8,1206.86,"因為你要知道紡錘絲的形成方向，大概就告訴我們什麼概念？"],[1206.86,1209.8,"細胞質的分裂方向，對不對？"],[1209.8,1212.6,"這代表什麼？兩次細胞質的分裂方向，"],[1212.6,1214.6,"剛好是不相同的，是垂直的。"],[1214.6,1217.5,"這樣的好處在哪邊？可以均等分配。"],[1217.5,1221.4,"就好像我們切蛋糕，第一刀會切一半，對不對？"],[1221.4,1223.3,"第二刀怎麼切？是不是垂直切？"],[1223.3,1224.84,"有什麼樣的垂直線？"],[1224.84,1227.14,"因為你想要均等分配，對不對？"],[1227.14,1227.9,"可以嗎？"],[1227.9,1230.58,"所以我們說兩次分裂方向互相垂直。"],[1230.58,1231.74,"這是小細節"],[1231.74,1232.78,"第二個來"],[1232.78,1236.18,"第一次減數分裂的時候，染色質複製、配對，"],[1236.18,1238.48,"在分離之後基本上從頭到尾"],[1238.48,1240.78, function setStatus(s){$('status').textContent=s}
function seek(t){if(!Number.isFinite(t)||t<0)return;video.currentTime=Math.min(t,Number.isFinite(video.duration)?video.duration:t);updateCaption()}
function updateCaption(){const t=video.currentTime,cues=current().cues;let lo=0,hi=cues.length-1,found=-1;while(lo<=hi){const m=(lo+hi)>>1;if(cues[m][0]<=t){found=m;lo=m+1}else hi=m-1}while(found>=0&&cues[found][1]<=t)found--;if(found>=0&&cues[found][0]<=t&&t<cues[found][1]){if(active!==found){active=found;$('captionTime').textContent=fmt(cues[found][0]);$('captionText').textContent=cues[found][2]}}else if(active!==-1){active=-1;$('captionTime').textContent=fmt(t);$('captionText').textContent='這段時間沒有字幕。'}}
let resultsGeneration=0;
function renderResults(){
 const generation=++resultsGeneration,lessonId=current().id,q=$('search').value.trim().toLocaleLowerCase(),cues=current().cues;
 const selected=[];for(let i=0;i<cues.length;i++)if(!q||cues[i][2].toLocaleLowerCase().includes(q))selected.push(i);
 const results=$('results'),count=$('count');let cursor=0;
 results.replaceChildren();results.scrollTop=0;results.setAttribute('aria-busy','true');
 function progress(){count.textContent=q?`找到 ${selected.length} 條${cursor<selected.length?`，已載入 ${cursor} 條`:'，已全部載入'}`:`共 ${cues.length} 條字幕${cursor<selected.length?`，背景載入中（${cursor}／${selected.length}）`:'，所有時間連結已載入。可搜尋或點時間播放。'}`;}
 function schedule(){if('requestIdleCallback' in window)requestIdleCallback(batch,{timeout:1000});else setTimeout(()=>batch(null),24);}
 function batch(deadline){
  if(generation!==resultsGeneration||current().id!==lessonId)return;
  const frag=document.createDocumentFragment();let added=0;
  while(cursor<selected.length&&added<100){
   if(added>0&&deadline&&!deadline.didTimeout&&deadline.timeRemaining()<3)break;
   const cue=cues[selected[cursor++]],button=document.createElement('button'),time=document.createElement('time'),text=document.createElement('span');
   time.textContent=fmt(cue[0]);text.textContent=cue[2];button.append(time,text);
   button.onclick=()=>{if(current().id!==lessonId)return;seek(cue[0]);video.play().catch(()=>setStatus('已跳到指定字幕，請按播放。'));};
   frag.append(button);added++;
  }
  results.append(frag);progress();
  if(cursor<selected.length)schedule();else results.setAttribute('aria-busy','false');
 }
 progress();schedule();
}
function save(){if(video.currentTime>0)storage.set('bio-player-'+current().id,String(video.currentTime))}
function loadLesson(n){save();index=n;loadToken++;video.pause();$('error').hidden=true;active=-1;$('captionTime').textContent='目前字幕';$('captionText').textContent='按播放開始觀看。';$('search').value='';document.querySelectorAll('[data-lesson]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)));if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}if(!track)track=video.addTextTrack('subtitles','繁體中文 · 文字校正版','zh-Hant');track.mode='hidden';if(track.cues)for(let i=track.cues.length-1;i>=0;i--)track.removeCue(track.cues[i]);for(const [s,e,text] of current().cues)if(e>s)track.addCue(new VTTCue(s,e,text));track.mode=cc?'showing':'disabled';video.src=current().src;video.load();video.playbackRate=Number($('speed').value);resumeTime=Number(storage.get('bio-player-'+current().id))||0;$('resume').hidden=resumeTime<5;$('resume').textContent='接續 '+fmt(resumeTime);setStatus(`${current().date} · 正在載入影片…`);storage.set('bio-player-lesson',String(n));renderResults();window.dispatchEvent(new CustomEvent("biology:lesson-change"))}
video.addEventListener('loadedmetadata',()=>{setStatus(`${current().date} · ${fmt(video.duration)} · 可開關繁中字幕`)});video.addEventListener('error',()=>{$('error').hidden=false;setStatus('影片來源載入失敗。字幕仍可搜尋。')});video.addEventListener('timeupdate',()=>{updateCaption();if(Date.now()-lastSaved>5000){save();lastSaved=Date.now()}});video.addEventListener('pause',save);window.addEventListener('pagehide',save);
$('back').onclick=()=>seek(Math.max(0,video.currentTime-10));$('forward').onclick=()=>seek(video.currentTime+10);$('cc').onclick=()=>{cc=!cc;track.mode=cc?'showing':'disabled';$('cc').textContent='字幕 '+(cc?'開':'關');$('cc').setAttribute('aria-pressed',String(cc));$('caption').hidden=!cc};$('speed').onchange=()=>{video.playbackRate=Number($('speed').value)};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if($('screen').requestFullscreen)await $('screen').requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();else setStatus('請使用播放器右下角的全螢幕按鈕。')}catch{setStatus('請使用播放器右下角的全螢幕按鈕。')}};
function jump(){const s=$('jump').value.trim(),p=s.split(':');if(!/^\d+(?::[0-5]?\d){0,2}$/.test(s)){setStatus('請輸入秒數、分:秒或時:分:秒，例如 1:27:46。');return}seek(p.reduce((v,x)=>v*60+Number(x),0));setStatus('已跳到 '+fmt(video.currentTime))}$('seek').onclick=jump;$('jump').onkeydown=e=>{if(e.key==='Enter')jump()};$('resume').onclick=()=>{seek(resumeTime);video.play().catch(()=>{});$('resume').hidden=true};$('search').oninput=renderResults;$('retry').onclick=()=>{video.load();$('error').hidden=true;setStatus('重新載入中…')};$('local').onchange=e=>{const f=e.target.files[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);video.src=objectURL;video.load();$('error').hidden=true;setStatus('已選取本機影片：'+f.name)};document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>loadLesson(Number(b.dataset.lesson)));
// Restore the selected lesson, but require a tap before resuming playback.
const initial=Number(storage.get('bio-player-lesson'));index=Number.isInteger(initial)&&initial>=0&&initial<lessons.length?initial:0;loadLesson(index);
